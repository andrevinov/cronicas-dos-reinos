schema_aceitacao_vivacidade: 1
natureza: aceitacao_integrada_read_only

episodios:
  dia_carregado_circo:
    janelas:
      - gatilho: inicio_dia
        periodo: amanhecer
        inicio: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        fim: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
      - gatilho: mudanca_periodo
        periodo: dia
        inicio: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        fim: {data: "21 Eleasis, 1372 DR", hora: "10:00"}
      - gatilho: mudanca_periodo
        periodo: anoitecer
        inicio: {data: "21 Eleasis, 1372 DR", hora: "10:00"}
        fim: {data: "21 Eleasis, 1372 DR", hora: "18:00"}
    consultas:
      - {dominio: entregas_contatos, estado: consultado, fontes: ["fixture/entregas.yaml"]}
      - {dominio: planos_compromissos, estado: consultado, fontes: ["fixture/compromissos.yaml"]}
      - {dominio: operacoes_reacoes, estado: consultado, fontes: ["fixture/operacoes.yaml"]}
      - {dominio: sidequests_vivas, estado: consultado, fontes: ["fixture/sidequests.yaml"]}
      - {dominio: iniciativas_elenco, estado: consultado, fontes: ["fixture/iniciativas.yaml"]}
      - {dominio: ecologia_local, estado: consultado, fontes: ["fixture/ecologia.yaml"]}
      - {dominio: ambiente_publico, estado: consultado, fontes: ["fixture/ambiente.yaml"]}
    candidatas:
      - candidata:
          id: "mensagem:nera-aviso"
          dominio: entregas_contatos
          tipo: acao_social_solicitada
          prioridade: 0
          elegivel: true
          fundamento: "A mensagem comunicável venceu e possui canal causal válido para alcançar Ren."
          origem: "fixture:mensagem-comunicavel-vencida"
        ativar_em: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        expirar_em: null
      - candidata:
          id: "compromisso:audiencia-circo"
          dominio: planos_compromissos
          tipo: fronteira_temporal
          prioridade: 1
          elegivel: true
          fundamento: "O compromisso temporal permaneceu aberto ao atingir sua janela obrigatória."
          origem: "fixture:compromisso-temporal-vencido"
        ativar_em: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        expirar_em: null
      - candidata:
          id: "causa-nv11:ajuda-silva"
          dominio: sidequests_vivas
          tipo: nova_oportunidade
          prioridade: 2
          elegivel: true
          fundamento: "A causa NV-11 já declarada tornou-se devida e precisa receber destino causal."
          origem: "fixture:causa-sidequest-vencida"
        ativar_em: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        expirar_em: null
      - candidata:
          id: "mensagem:segredo-sem-canal"
          dominio: entregas_contatos
          tipo: acao_social_solicitada
          prioridade: 3
          elegivel: false
          fundamento: "O conteúdo permanece bloqueado porque nenhum canal autorizado pode revelá-lo a Ren."
          origem: "fixture:segredo-bloqueado"
        ativar_em: {data: "21 Eleasis, 1372 DR", hora: "06:00"}
        expirar_em: null
    papeis:
      mensagem_comunicavel_vencida: "mensagem:nera-aviso"
      compromisso_temporal_vencido: "compromisso:audiencia-circo"
      causa_sidequest_vencida: "causa-nv11:ajuda-silva"
    iniciativa:
      chamadas_ia_por_npc: 0
      scans_globais_npc: 0
      itens:
        - npc_id: nera_vell
          resultado: apresentada
          motivo: "Nera está no elenco presente, possui iniciativa plausível e ocupa a única abertura da janela."
        - npc_id: silva_elkwood
          resultado: silencio_justificado
          motivo: "Silva recebeu decisão explícita e não abriu nova fala porque a janela já estava ocupada."
    permanencia:
      local_id: jack_mooney_sons_circus
      slot_id: "jack_mooney_sons_circus|21 Eleasis, 1372 DR|dia"
    cadeia_semantica:
      - id: clima-dia
        sistema: clima_diario
        causas: []
        evidencia: "A condição de chuva do dia foi congelada na alvorada antes de qualquer descrição de cena."
      - id: transito-chuva
        sistema: transito
        causas: [clima-dia]
        evidencia: "O deslocamento recebeu o modificador da chuva já congelada, sem rerrolar o clima durante a cena."
      - id: edital-circo
        sistema: politica_civica
        causas: []
        evidencia: "Um edital já produzido pelo governo está disponível no quadro público do circo."
      - id: leitura-edital
        sistema: entrega_publica
        causas: [edital-circo]
        evidencia: "Ren conhece o edital somente quando a permanência fornece o canal e o writer pareia a entrega NV-13."
      - id: candidato-incidental
        sistema: presenca_incidental
        causas: []
        evidencia: "Uma presença incidental filtrada aparece apenas como candidata contextual, não como encontro automático."
      - id: cena-circo
        sistema: cena
        causas: [candidato-incidental]
        evidencia: "A cena incorpora a candidata incidental sem fabricar ação, diálogo, conhecimento ou side quest."
      - id: causa-silva
        sistema: causa_sidequest
        causas: []
        evidencia: "A necessidade previamente declarada de Silva alcança sua janela e permanece uma causa, não uma missão aceita."
      - id: oferta-silva
        sistema: sidequest
        causas: [causa-silva]
        evidencia: "A oportunidade só pode ser apresentada porque a causa real já existia e alcançou Ren por vínculo plausível."
      - id: gate-mecanico
        sistema: mecanica_gate
        causas: []
        evidencia: "A dificuldade usada no episódio passa pelo gate mecânico vigente antes da resolução do teste."
      - id: resultado-mecanico
        sistema: resultado_mecanico
        causas: [gate-mecanico]
        evidencia: "A consequência mecânica é registrada depois do gate e da rolagem, nunca inventada pela narração."
      - id: relacao-persistida
        sistema: consequencia_relacional
        causas: [oferta-silva]
        evidencia: "A resposta de Ren à necessidade de Silva produz uma alteração relacional persistida pelo writer."
      - id: reputacao-persistida
        sistema: consequencia_reputacao
        causas: [resultado-mecanico]
        evidencia: "O resultado publicamente observável produz um marco de reputação separado e append-only."
      - id: permanencia-circo
        sistema: permanencia_espacial
        causas: [cena-circo]
        evidencia: "O slot espacial do circo permanece ancorado ao local canônico e sobrevive à troca de scene_id."
      - id: efeito-futuro
        sistema: consequencia_futura
        causas: [relacao-persistida, reputacao-persistida, permanencia-circo]
        evidencia: "Relação, reputação e permanência deixam estado consultável para uma cena futura sem depender da memória do narrador."
      - id: cronica-unica
        sistema: cronica
        causas: [efeito-futuro]
        evidencia: "A crônica registra a cadeia uma única vez; retries reutilizam identidades em vez de duplicar o acontecimento."

  dia_legitimamente_calmo:
    janelas:
      - gatilho: inicio_dia
        periodo: amanhecer
        inicio: {data: "22 Eleasis, 1372 DR", hora: "06:00"}
