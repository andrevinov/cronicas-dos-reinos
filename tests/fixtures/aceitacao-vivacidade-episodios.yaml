      - gatilho: mudanca_periodo
        periodo: anoitecer
        inicio: {data: "22 Eleasis, 1372 DR", hora: "10:00"}
        fim: {data: "22 Eleasis, 1372 DR", hora: "18:00"}
    consultas:
      - {dominio: entregas_contatos, estado: consultado, fontes: ["fixture/entregas.yaml"]}
      - {dominio: planos_compromissos, estado: consultado, fontes: ["fixture/compromissos.yaml"]}
      - {dominio: operacoes_reacoes, estado: consultado, fontes: ["fixture/operacoes.yaml"]}
      - {dominio: sidequests_vivas, estado: consultado, fontes: ["fixture/sidequests.yaml"]}
      - {dominio: iniciativas_elenco, estado: consultado, fontes: ["fixture/iniciativas.yaml"]}
      - {dominio: ecologia_local, estado: consultado, fontes: ["fixture/ecologia.yaml"]}
      - {dominio: ambiente_publico, estado: consultado, fontes: ["fixture/ambiente.yaml"]}
    candidatas: []
    papeis: {}
    iniciativa:
      chamadas_ia_por_npc: 0
      scans_globais_npc: 0
      itens: []
    permanencia:
      local_id: jack_mooney_sons_circus
      slot_id: "jack_mooney_sons_circus|22 Eleasis, 1372 DR|dia"
    cadeia_semantica: []

