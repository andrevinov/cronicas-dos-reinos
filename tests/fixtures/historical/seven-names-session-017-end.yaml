fontes_canonicas:
  sessoes/015/resumo.md:
  - A ordem foi examinada sem perda da evidência.
  - Ren o liberou sem revelar sua identidade.
  sessoes/016/resumo.md:
  - O homem e a mulher estão inconscientes e estáveis; Ren mantém a matriz e os documentos.
  sessoes/017/resumo.md:
  - Ela admitiu que M. Harrow é uma identidade documental fabricada, afirmou trabalhar para Masao Hirasawa coordenando a célula documental local.
  - Luath examinou as provas, recebeu o relato completo e ouviu a cativa confirmar seus vínculos e a operação contra as crianças.
  - Luath aceitou a escolta de Ren; Maerra aceitou um guarda discreto dentro da Casa até o amanhecer, e o grupo começou a preparar a transferência segura da cativa e das provas.
