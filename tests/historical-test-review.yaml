schema_revisao_testes_historicos: 1
origem: Task 1 — inventário e telemetria da suíte
quantidade_original: 39
regra: >-
  Cada arquivo histórico identificado pela Task 1 precisa declarar a propriedade
  que protegia, sua classificação e onde essa propriedade permanece coberta.
  permanente e historico continuam no repositório; redundante e substituivel só
  podem desaparecer quando a cobertura indicada já existe.
arquivos:
  tests/sidequests_canonicas_task32_cases.py:
    classificacao: historico
    requisito: Preservar os casos do motor legado de sidequests canônicas e seu orçamento frio.
    cobertura_atual: [tests/sidequests_canonicas_task32_cases.py, tests/test_sidequests_canonicas.py]
  tests/test_adversarial_integrity.py:
    classificacao: permanente
    requisito: Garantir autoridade adversarial, capacidades reais e proteção contra consequências inválidas.
    cobertura_atual: [tests/test_adversarial_integrity.py]
  tests/test_analisar_rollout_task38.py:
    classificacao: substituivel
    requisito: Medir sistemas narrativos e a dupla de orquestração sem adicionar chamadas ao rollout.
    cobertura_atual: [tests/test_analisar_rollout_sistemas.py]
  tests/test_analisar_rollout_task46.py:
    classificacao: substituivel
    requisito: Medir integração de sidequests no rollout sem uma terceira chamada de orquestração.
    cobertura_atual: [tests/test_analisar_rollout_sistemas.py]
  tests/test_analisar_rollout_task47.py:
    classificacao: substituivel
    requisito: Medir cobertura e violações da decisão explícita de oportunidade em rollouts.
    cobertura_atual: [tests/test_analisar_rollout_sistemas.py]
  tests/test_canon_bridge_rewriter.py:
    classificacao: permanente
    requisito: Preservar agência, reservas canônicas, satisfação por evidência e fallback do canon bridge.
    cobertura_atual: [tests/test_canon_bridge_rewriter.py]
  tests/test_canon_bridge_schedule_guard.py:
    classificacao: permanente
    requisito: Impedir que o canon bridge reescreva agendamentos já materializados no passado.
    cobertura_atual: [tests/test_canon_bridge_schedule_guard.py]
  tests/test_canonical_intent_rewrite_contract.py:
    classificacao: permanente
    requisito: Manter o contrato de intenção canônica separado da realização e com limites temporais explícitos.
    cobertura_atual: [tests/test_canonical_intent_rewrite_contract.py]
  tests/test_condicoes_mundo.py:
    classificacao: permanente
    requisito: Validar ciclo, escopo, projeção e orçamento das condições persistentes de mundo.
    cobertura_atual: [tests/test_condicoes_mundo.py]
  tests/test_cronica_cli.py:
    classificacao: permanente
    requisito: Preservar o lifecycle transacional e o contrato público da CLI cronica.
    cobertura_atual: [tests/test_cronica_cli.py]
  tests/test_cronica_pending_gate_budget.py:
    classificacao: permanente
    requisito: Garantir que o pending gate bloqueie o hot path com custo e leituras limitados.
    cobertura_atual: [tests/test_cronica_pending_gate_budget.py]
  tests/test_cronica_transito_urbano.py:
    classificacao: permanente
    requisito: Preservar o fluxo transacional e o orçamento de trânsito urbano no cronica.
    cobertura_atual: [tests/test_cronica_transito_urbano.py]
  tests/test_dialogo_relacional.py:
    classificacao: permanente
    requisito: Validar calibração de diálogo por estado relacional sem criar autoridade ou infraestrutura paralela.
    cobertura_atual: [tests/test_dialogo_relacional.py]
  tests/test_emergent_sidequest_authoring_registry_v2.py:
    classificacao: permanente
    requisito: Garantir autoria e materialização de sidequest emergente somente após oferta real e contrato válido.
    cobertura_atual: [tests/test_emergent_sidequest_authoring_registry_v2.py]
  tests/test_emergent_sidequest_opportunity_boundary.py:
    classificacao: permanente
    requisito: Garantir que oportunidade causal seja read-only, limitada e não nasça de conversa incidental.
    cobertura_atual: [tests/test_emergent_sidequest_opportunity_boundary.py]
  tests/test_incidentes_mundo.py:
    classificacao: permanente
    requisito: Validar sorteio determinístico, consumo idempotente e integração de incidentes locais do mundo.
    cobertura_atual: [tests/test_incidentes_mundo.py]
  tests/test_live_campaign_state.py:
    classificacao: permanente
    requisito: Proteger regressões essenciais do estado vivo sem congelar valores mutáveis da campanha.
    cobertura_atual: [tests/test_live_campaign_state.py]
  tests/test_migracao_ren_5_5e.py:
    classificacao: historico
    requisito: Preservar a transformação histórica de Ren para D&D 5.5e sem exigir que a ficha viva permaneça congelada.
    cobertura_atual: [tests/test_migracao_ren_5_5e.py, tests/fixtures/ren-5-5e-activation-snapshot.yaml]
  tests/test_quest_rewards_discoveries_losses.py:
    classificacao: permanente
    requisito: Garantir recompensas, descobertas e perdas de sidequest com contrato, causalidade e idempotência.
    cobertura_atual: [tests/test_quest_rewards_discoveries_losses.py]
  tests/test_rules_catalog.py:
    classificacao: permanente
    requisito: Validar identidade, autoridade, aliases e fallback do catálogo de regras ativo.
    cobertura_atual: [tests/test_rules_catalog.py]
  tests/test_secret_canon_v2.py:
    classificacao: permanente
    requisito: Preservar fronteira entre passado congelado e futuro editável do cânone secreto.
    cobertura_atual: [tests/test_secret_canon_v2.py]
  tests/test_secret_npc_quest_catalog.py:
    classificacao: historico
    requisito: Preservar o catálogo legado de quests secretas como evidência fria sem reativá-lo no hot path.
    cobertura_atual: [tests/test_secret_npc_quest_catalog.py]
  tests/test_sidequest_gate_v2.py:
    classificacao: historico
    requisito: Garantir que o gate legado aposentado permaneça frio e não volte a originar sidequests operacionais.
    cobertura_atual: [tests/test_sidequest_gate_v2.py]
  tests/test_sidequest_progression_deadlines_consequences.py:
    classificacao: permanente
    requisito: Validar progressão factual, prazos, consequências e recompensas terminais de sidequests.
    cobertura_atual: [tests/test_sidequest_progression_deadlines_consequences.py]
  tests/test_task38_narrative_systems_integration.py:
    classificacao: substituivel
    requisito: Garantir integração dos sistemas narrativos sem ampliar hot path, scans, scheduler ou RNG.
    cobertura_atual: [tests/test_narrative_systems_integration.py]
  tests/test_task40_router_contract.py:
    classificacao: redundante
    requisito: Garantir que conversa incidental não desperte criação de sidequest e que oportunidade exija âncora causal.
    cobertura_atual: [tests/test_emergent_sidequest_opportunity_boundary.py, tests/test_preflight.py]
  tests/test_task41_router_contract.py:
    classificacao: redundante
    requisito: Garantir que sidequest emergente só seja materializada após oferta real e use o motor autoral vigente.
    cobertura_atual: [tests/test_emergent_sidequest_authoring_registry_v2.py, tests/test_preflight.py]
  tests/test_task42_router_contract.py:
    classificacao: redundante
    requisito: Garantir agência e evidência no canon bridge e manter seu check no preflight.
    cobertura_atual: [tests/test_canon_bridge_rewriter.py, tests/test_preflight.py]
  tests/test_task43_router_contract.py:
    classificacao: redundante
    requisito: Garantir contrato de recompensa antes do lifecycle e check permanente no preflight.
    cobertura_atual: [tests/test_quest_rewards_discoveries_losses.py, tests/test_preflight.py]
  tests/test_task44_router_contract.py:
    classificacao: redundante
    requisito: Garantir integridade adversarial antes do lifecycle e check permanente no preflight.
    cobertura_atual: [tests/test_adversarial_integrity.py, tests/test_preflight.py]
  tests/test_task45_boundary_guard.py:
    classificacao: substituivel
    requisito: Impedir que consequência de sidequest seja descartada como no-op ou acorde motores não relacionados.
    cobertura_atual: [tests/test_sidequest_boundary_guard.py]
  tests/test_task45_router_contract.py:
    classificacao: redundante
    requisito: Garantir que progressão de sidequest reutilize contratos existentes e permaneça no preflight.
    cobertura_atual: [tests/test_sidequest_progression_deadlines_consequences.py, tests/test_sidequest_boundary_guard.py, tests/test_preflight.py]
  tests/test_task46_budget_regression.py:
    classificacao: substituivel
    requisito: Preservar custo zero do turno neutro e limites do pacote de integração de sidequest.
    cobertura_atual: [tests/test_sidequest_integration_budget.py]
  tests/test_task46_integration_transaction.py:
    classificacao: substituivel
    requisito: Preservar commit único, rollback, retry e materialização atômica da integração de sidequest.
    cobertura_atual: [tests/test_sidequest_integration_transaction.py]
  tests/test_task46_rollout_matrix.py:
    classificacao: substituivel
    requisito: Preservar a matriz de lifecycle entre sidequest, canon bridge, aceite, recusa, sucesso, falha e expiração.
    cobertura_atual: [tests/test_sidequest_lifecycle_matrix.py]
  tests/test_task46_router_contract.py:
    classificacao: redundante
    requisito: Garantir integração na dupla preparar/concluir, legado frio e check permanente no preflight.
    cobertura_atual: [tests/test_sidequest_integration_budget.py, tests/test_sidequest_integration_transaction.py, tests/test_sidequest_gate_v2.py, tests/test_preflight.py]
  tests/test_task47_explicit_opportunity_decision_gate.py:
    classificacao: substituivel
    requisito: Exigir decisão positiva ou negativa explícita antes de preparar e manter o caminho negativo sem custo de sidequest.
    cobertura_atual: [tests/test_sidequest_opportunity_decision.py, tests/test_analisar_rollout_sistemas.py]
  tests/test_torneio_clandestino.py:
    classificacao: permanente
    requisito: Validar convite, rodadas, retirada, recompensa e orçamento do mini-arco de torneio clandestino.
    cobertura_atual: [tests/test_torneio_clandestino.py]
  tests/test_unified_session_lifecycle.py:
    classificacao: permanente
    requisito: Garantir equivalência, recuperação e progressão do lifecycle unificado de sessões.
    cobertura_atual: [tests/test_unified_session_lifecycle.py]
