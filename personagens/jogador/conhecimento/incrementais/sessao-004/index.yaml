sessao: 4
fragmentos:
- transacao: s004-f3f10782e6b036a0
  titulo: A sessão 4 começa nos fundos de Narwhal Manor. Ren ativa o Broche do Semblante Humilde até cerca de 11:45
    e aborda Kethra sem marcar o contato, obtendo 18 contra CD 15 em Furtividade. Ao saber que Colm está vivo, Kethra
    demonstra alívio e maior confiança, mas alerta Ren contra ligar Bram a Narwhal ou voltar com cauda. Ela relata
    que o corredor treze está sendo esvaziado, que a mulher de manto cinza-azulado retirou dois cofres e um livro,
    e que um homem com cordão vermelho está perguntando por carroças e rotas da estrada do Fire River. Kethra pede
    um novo protocolo de contato.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-f3f10782e6b036a0.md
  bytes: 1113
- transacao: s004-bd787b732995b8f2
  titulo: 'Kethra aceita o protocolo de um novo ponto morto com cinzeiro rachado, sem horário fixo, mas ainda não
    o instalou. Sob o Broche, Ren obtém 14 contra CD 14 em Enganação e passa por trabalhador no pátio de entregas.
    Ele reconhece um sobrevivente da estrada entregando informação ao homem do cordão vermelho, mas falha em Percepção
    (9 contra CD 14): confirma que a Red Sail conhece a secagem velha e a direção leste, porém não descobre se já
    possui a localização exata de Colm. Às 11:30, o contato guarda um papel e o sobrevivente começa a sair; o Broche
    ainda dura cerca de quinze minutos.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-bd787b732995b8f2.md
  bytes: 1072
- transacao: s004-d1e89610cd4d9313
  titulo: Ren segue o sobrevivente sem ser percebido, obtendo 25 contra CD 15 enquanto o Broche ainda está ativo.
    Às 11:45, o Broche expira e Ren gasta 2 Ki para ativar Passos sem Pegadas; obtém 25 contra CD 16 na cauda prolongada.
    O sobrevivente faz perguntas em pátios de carroças, prepara-se para viagem e deixa Ravens Bluff pela estrada
    do Fire River. Às 12:40, ele está sozinho cerca de cinquenta pés à frente de Ren, rumo à secagem velha, sem
    ter notado a perseguição; restam cerca de cinco minutos da magia.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-d1e89610cd4d9313.md
  bytes: 887
- transacao: s004-91d5270b07c5ac30
  titulo: 'Ren deixa temporariamente o corpo junto à curva e segue a drenagem em busca de água profunda. Obtém 4
    contra CD 15 em Sobrevivência: encontra apenas baixios rasos, lama e juncos incapazes de transportar ou ocultar
    o morto. Passos sem Pegadas expira por volta de 12:45; suas marcas começam abruptamente no interior do terreno,
    mas ficam nítidas no barro. Às 12:50, Ren está algumas centenas de passos afastado da estrada e o corpo continua
    sem revista.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-91d5270b07c5ac30.md
  bytes: 825
- transacao: s004-6a70662f45da5d09
  titulo: 'Silva aceita procurar uma rota para Colm. Ren dorme duas horas e medita meia hora, completando descanso
    curto e recuperando 6/6 Ki; evita procurar Nera. Silva deixa recado de que uma cama e duas transferências foram
    aceitas, faltando definir o primeiro ponto de entrega. À noite, Ren veste as camadas escuras de O Vento da Noite
    e alcança novo ponto alto sobre a Red Sail com 21 contra CD 16 em Furtividade. Vigia por cerca de três horas:
    a segurança está reforçada, Brass não aparece e Ren obtém 12 contra CD 15 em Investigação, não conseguindo traçar
    uma rota que permita capturá-lo vivo e removê-lo por dez minutos sem intervenção.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-6a70662f45da5d09.md
  bytes: 1092
- transacao: s004-eb577844c071f688
  titulo: Ren conclui que uma rota preparada é plausível em duas etapas. Ao tentar alcançar o ponto oposto, obtém
    12 contra CD 16 em Furtividade. Vigias percebem uma silhueta sem identificar Ren e cobrem as bocas do beco.
    Brass continua ausente.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-eb577844c071f688.md
  bytes: 675
- transacao: s004-f043b23efef4256e
  titulo: A Ilusão Menor é discernida, mas Ren gasta 2 Ki em Passos sem Pegadas e obtém 37 contra CD 18 em Furtividade,
    rompendo o cerco. Conclui que um cúmplice melhoraria a extração, mas obtém 10 contra CD 15 em Investigação e
    não valida a ligação entre carrinho e canoa. O Broche segue gasto até o amanhecer.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-f043b23efef4256e.md
  bytes: 688
- transacao: s004-24af46ec61eded9c
  titulo: Ren volta ao circo sem cauda. Silva revela Hessa Morn e o protocolo da primeira transferência. Ren dorme
    pouco mais de três horas, medita meia hora, recupera 6/6 Ki e parte às 4:45 para buscar Colm.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-24af46ec61eded9c.md
  bytes: 573
- transacao: s004-b690cc97d44c1933
  titulo: Ren deixa um recado para Nera com Silva. Passa pelos observadores da saída com 20 contra CD 14 em Enganação
    e chega a Iria por rota longa com 20 contra CD 14 em Sobrevivência. O Broche recupera um uso ao amanhecer. Iria
    confirma Colm estável; Ren o acomoda na carroça e parte rumo ao lagar.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-b690cc97d44c1933.md
  bytes: 551
- transacao: s004-28eeef61d124d50e
  titulo: Ren chega ao lagar sem detectar cauda. Responde com franqueza limitada às perguntas de Colm. Obtém 13
    contra CD 13 em Percepção e confirma os sinais de Hessa, o menino permitido e ausência de vigias. Hessa pede
    para examinar Colm.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-28eeef61d124d50e.md
  bytes: 494
- transacao: s004-2a66435c0944f382
  titulo: Hessa aceita Colm e o oculta sob a carga; a carroça de Mera fica no lagar. Ren falha por pouco em Sobrevivência,
    perde tempo e é visto apenas como trabalhador desconhecido por um velho. Volta sem bloqueio e encontra o ponto
    morto de Narwhal ainda sem cinzeiro ou mensagem.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-2a66435c0944f382.md
  bytes: 691
- transacao: s004-808105c277858bb4
  titulo: 'Ren ativa o Broche e tenta abordar Kethra. Obtém 13 contra CD 16 em Furtividade com vantagem: um jovem
    escriturário percebe o trabalhador desconhecido procurando-a, embora não identifique Ren. Kethra cria cobertura
    de contratação e conversa brevemente. Ela aprende que Colm foi entregue vivo e estável a uma cadeia compartimentada.
    Relata que o corredor treze foi apagado, a mulher cinza-azulada não voltou e Brass visitou o homem do cordão
    vermelho antes do amanhecer; depois disso, a busca se expandiu para curandeiros, carroças e lagares a leste.
    Kethra estima que um complexo murado adaptável custaria cerca de 800–1.500 PO em ruínas, 2.500–5.000 PO habitável
    e 10.000+ PO como solar urbano. O Broche fica gasto até o amanhecer de 9 Eleasis.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-808105c277858bb4.md
  bytes: 1866
- transacao: s004-e6324f023152781b
  titulo: 'Ren deixa Narwhal e passa a manhã procurando propriedades adaptáveis a casa segura e dojo. Recorda o
    bukeyashiki Kagehira, o treinamento do Kagehira Getsuei-ryu e a destruição do complexo por centenas de invasores,
    depois retoma a busca. Obtém 15 contra CD 15 em Investigação com vantagem e encontra três candidatos: Estalagem
    da Lança Torta (1.200–1.700 PO, ampla mas perto de rotas observadas), Pátio dos Três Martelos (900–1.400 PO,
    flexível mas com escrituras fragmentadas) e Casa do Salgueiro Seco (cerca de 3.600 PO, habitável e murada, mas
    socialmente conspícua). Às 13:15, está diante da Casa do Salgueiro Seco; o Broche expirou e segue gasto até
    o amanhecer seguinte.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-e6324f023152781b.md
  bytes: 1364
- transacao: s004-f568de46dc948fdf
  titulo: Ren procura Pell, mas obtém 9 contra CD 13 em Investigação; um copeiro da Silver Lily nota um homem oriental
    procurando um mensageiro jovem e Pell, avisado, aborda Ren numa viela. Ren paga 4 PO adiantadas, ficando com
    35 PO. Encomenda investigação dos proprietários, dívidas e riscos das três propriedades, priorizando a Casa
    do Salgueiro Seco, e oferece bônus de 1 PO por informação imobiliária relevante e 2 PO por paradeiro ou rotas
    de Brass. Pell aceita deixar o resultado à noite numa garrafa profundamente escondida sob a escada dos fundos
    da Silver Lily; Ren verificará pela manhã e pagará os bônus ali.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-f568de46dc948fdf.md
  bytes: 1215
- transacao: s004-e3ff1e80256cc261
  titulo: Ren fala em particular com Irmã Halessa Vorn na Casa de Tyr. Ela confirma que Nera e Tavin seguem protegidos,
    o material permanece selado e Velis compareceu à oitiva, apresentando contradições e nomeando M. Harrow antes
    da pergunta. Três registros corrigidos convergem na Casa de Pesos da Ponte Baixa; Velis deve permanecer disponível,
    mas não está preso. Ren apela à consciência de Halessa e obtém 15 contra CD 15 em Persuasão com vantagem. Ela
    revela que o porteiro noturno Edran Kells desapareceu antes de depor e que a porta de serviço sob o arco oeste
    foi usada, nas noites suspeitas, entre o segundo sino após o pôr do sol e meia hora depois. Autoriza apenas
    observação e proteção imediata de inocentes, não invasão ou confronto.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-e3ff1e80256cc261.md
  bytes: 1875
- transacao: s004-277f800e52271ff7
  titulo: Ren retorna ao circo, toma banho, come e informa Silva sobre a pista de Halessa e sua intenção de vigiar
    a Casa de Pesos. Silva relata que Nera e Tavin estão fisicamente bem; Nera dorme mal, está assustada e zangada
    com a separação, mas segue o protocolo, enquanto Tavin está mais estável, ajuda sob o nome Timo e continua esperando
    Ren voltar. Silva considera uma casa própria mais adequada que o circo, mas adverte que alunos devem ser pessoas
    com escolha, não muralhas. Ela transmite aos Vell que Ren está vivo, bem e com saudades. Às 20:10, Ren veste
    seu traje oriental original de infiltração, distinto do figurino de Kage, cobre-o com a capa e parte para a
    Ponte Baixa. Pell falha nas duas buscas realizadas durante a tarde, resultado ainda desconhecido de Ren.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-004/tx-s004-277f800e52271ff7.md
  bytes: 1226
quantidade: 16
