- transacao: s006-bb8843b70523b7f1
  titulo: 'Ren assume a aparência de um bêbado junto à escada da Silver Lily, retira discretamente a garrafa e lê
    a nota de Pell. Pell não conseguiu identificar proprietários confiáveis, dívida urgente ou risco explorável
    nos três imóveis: a Lança Torta passa por cobradores contraditórios, os Três Martelos têm escrituras fragmentadas
    e o Salgueiro Seco é administrado por intermediário sem vulnerabilidade aparente. Os três rumores sobre Brass
    são incompatíveis e não confirmados. Pell declara honestamente que não obteve informação que mereça os bônus
    e pede que Ren não deixe moedas extras. Às 08:52, Ren permanece junto à escada com o bilhete; propriedades e
    rota de Brass seguem sem solução.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-bb8843b70523b7f1.md
  bytes: 1419
- transacao: s006-4b4c90070cae69ba
  titulo: 'Ren deixa 1 PO como novo adiantamento para Pell, ficando com 34 PO, e mantém os mesmos objetivos e bônus.
    Depois vigia a Casa do Salgueiro Seco da manhã ao começo da tarde. Com 13 contra CD 14 em Investigação, não
    obtém o ponto alto ideal e usa um sótão com o pátio traseiro parcialmente oculto. Com 25 contra CD 14 em Furtividade,
    permanece indetectado. Percepção 7 contra CD 14 e Investigação 14 contra CD 15 produzem quadro incompleto: a
    casa principal parece vazia ou raramente usada; o jardineiro provavelmente mora numa dependência junto ao muro;
    um escriturário com fólio preto visita por vinte minutos e deixa um envelope, mas Ren não identifica seu nome
    nem o proprietário. Às 13:36, Ren segue oculto diante da propriedade.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-4b4c90070cae69ba.md
  bytes: 1410
- transacao: s006-ae9c9c798f3fd161
  titulo: 'Ren deixa o posto de observação e bate à porta da Casa do Salgueiro Seco, oferecendo-se como trabalhador
    estrangeiro pobre e discreto. O jardineiro aparece pela passagem lateral. Enganação 2 contra CD 12 falha: ele
    não identifica Ren, mas considera a história suspeita, recusa acesso, afirma que não há dono presente e pergunta
    quem indicou a casa. A conversa permanece aberta diante do portão por volta de 13:40.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-ae9c9c798f3fd161.md
  bytes: 936
- transacao: s006-8edd2c5c0424c556
