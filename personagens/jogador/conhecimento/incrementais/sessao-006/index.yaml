- transacao: s006-0a853ae691375c38
  titulo: 'Ren rejeita atacar Brass em público para não se expor nem comprometer Nera e Tavin. Ativa o Broche do
    Semblante Humilde, cujo uso fica gasto até o próximo amanhecer, e passa perto da porta carregando corda. Furtividade
    com vantagem 20 contra CD 15 e Percepção 25 contra CD 15 permitem que se aproxime sem ser marcado e ouça Brass:
    o barril seco e o menino foram abandonados para papéis; depois do segundo sino após o poente, Brass pretende
    cruzar a ponte baixa com dois homens para encontrar Rook. U…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-0a853ae691375c38.md
