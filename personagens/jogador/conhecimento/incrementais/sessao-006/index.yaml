    nela: registros decidem quem existe, túneis para onde pessoas e cargas vão, e Ravens Bluff seria uma fechadura
    sobre portas antigas. No turno seguinte, Kurobane desengaja, acion…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-5b1dbaf869ce4a81.md
