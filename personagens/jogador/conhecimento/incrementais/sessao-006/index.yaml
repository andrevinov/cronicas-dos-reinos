- transacao: s006-734f6c9b0e064745
  titulo: Ren abandona a cauda de Brass e segue Rook com Passos sem Pegadas e Passo Sombrio. Obtém Furtividade 36
    contra CD 18 com vantagem, atravessa o contravigia e chega sem ser percebido ao anel de ferro seco. Rook prende
    ali o documento falsificado e continua andando. Uma linha negra recolhe o pacote até um telhado. Percepção 22
    com vantagem supera a coleta furtiva e permite a Ren identificar Kurobane Jinzaburō, o Corvo do Estreito, uma
    das Dez Espadas, por sua aparência kozakurana, haori de retalho…
