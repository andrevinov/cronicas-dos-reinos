  titulo: Ren permite que Rook conclua a falsificação e continua ouvindo. Rook menciona Nera e Tavin; Brass afirma
    que sua rede seguiu Tyr, Maerra, a velha casa de Lathander e quartos já vazios, mas não possui o endereço atual
