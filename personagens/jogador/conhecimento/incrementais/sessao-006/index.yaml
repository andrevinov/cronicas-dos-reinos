- transacao: s006-bb8843b70523b7f1
  titulo: 'Ren assume a aparência de um bêbado junto à escada da Silver Lily, retira discretamente a garrafa e lê
    a nota de Pell. Pell não conseguiu identificar proprietários confiáveis, dívida urgente ou risco explorável
    nos três imóveis: a Lança Torta passa por cobradores contraditórios, os Três Martelos têm escrituras fragmentadas
    e o Salgueiro Seco é administrado por intermediário sem vulnerabilidade aparente. Os três rumores sobre Brass
    são incompatíveis e não confirmados. Pell declara honestamente que não obteve informação que mereça os bônus
    e pede que Ren não deixe moedas extras. Às 08:52, Ren permanece junto à escada com o bilhete; propriedades e
    rota de Brass seguem sem solução.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-bb8843b70523b7f1.md
  bytes: 1419
- transacao: s006-4b4c90070cae69ba
  titulo: 'Ren deixa 1 PO como novo adiantamento para Pell, ficando com 34 PO, e mantém os mesmos objetivos e bônus.
    Depois vigia a Casa do Salgueiro Seco da manhã ao começo da tarde. Com 13 contra CD 14 em Investigação, não
    obtém o ponto alto ideal e usa um sótão com o pátio traseiro parcialmente oculto. Com 25 contra CD 14 em Furtividade,
    permanece indetectado. Percepção 7 contra CD 14 e Investigação 14 contra CD 15 produzem quadro incompleto: a
    casa principal parece vazia ou raramente usada; o jardineiro provavelmente mora numa dependência junto ao muro;
    um escriturário com fólio preto visita por vinte minutos e deixa um envelope, mas Ren não identifica seu nome
    nem o proprietário. Às 13:36, Ren segue oculto diante da propriedade.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-4b4c90070cae69ba.md
  bytes: 1410
- transacao: s006-ae9c9c798f3fd161
  titulo: 'Ren deixa o posto de observação e bate à porta da Casa do Salgueiro Seco, oferecendo-se como trabalhador
    estrangeiro pobre e discreto. O jardineiro aparece pela passagem lateral. Enganação 2 contra CD 12 falha: ele
    não identifica Ren, mas considera a história suspeita, recusa acesso, afirma que não há dono presente e pergunta
    quem indicou a casa. A conversa permanece aberta diante do portão por volta de 13:40.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-ae9c9c798f3fd161.md
  bytes: 936
- transacao: s006-8edd2c5c0424c556
  titulo: 'Ren recupera sua história com uma explicação coerente, postura humilde e sotaque reforçado. Enganação
    com vantagem 15 contra CD 14 tem sucesso: o jardineiro passa a aceitá-lo como um estrangeiro pobre à procura
    de trabalho, embora mantenha cautela. Ele revela que a proprietária é uma mulher que não mora na casa e que
    recados e dinheiro chegam por um escriturário, já partido naquele dia. Oferece a Ren trabalho externo no amanhecer
    seguinte por 2 PP e uma refeição, sem acesso à casa, prometendo m…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-8edd2c5c0424c556.md
  bytes: 1088
- transacao: s006-09ed59d2c65e6089
  titulo: 'Ren fornece ao jardineiro o nome falso Shinta, ou Shin, aceita o trabalho para o amanhecer seguinte e
    parte mantendo a persona pobre. Com Furtividade 26 contra CD 14, mistura-se a grupos de trabalhadores e chega
    à Red Sail sem cauda identificável. Investiga outros ângulos, mas obtém 8 contra CD 15: confirma que pode alcançar
    Brass, porém não encontra rota segura para retirar um prisioneiro. Por volta de 15:28, Brass aparece nos fundos
    da Red Sail com dois acompanhantes e um homem à porta; está…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-09ed59d2c65e6089.md
  bytes: 1462
- transacao: s006-0a853ae691375c38
  titulo: 'Ren rejeita atacar Brass em público para não se expor nem comprometer Nera e Tavin. Ativa o Broche do
    Semblante Humilde, cujo uso fica gasto até o próximo amanhecer, e passa perto da porta carregando corda. Furtividade
    com vantagem 20 contra CD 15 e Percepção 25 contra CD 15 permitem que se aproxime sem ser marcado e ouça Brass:
    o barril seco e o menino foram abandonados para papéis; depois do segundo sino após o poente, Brass pretende
    cruzar a ponte baixa com dois homens para encontrar Rook. U…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-0a853ae691375c38.md
  bytes: 1144
- transacao: s006-9576cbb4e5a3441b
  titulo: Ren reconhece que o capanga de Brass pronunciou Masao com familiaridade, não como estrangeiro repetindo
    um nome recém-ouvido, e mantém o disfarce sem denunciar a reação. Vai ao posto e relata tudo a Luath por volta
    de 16:14. Luath considera a pronúncia sinal de circulação habitual do nome, aprova a decisão de não atacar na
    Red Sail e decide colocar dois observadores sem uniforme nas cabeceiras da ponte baixa, com um terceiro homem
    como mensageiro. Eles observarão a troca e seguirão o papel e Ro…
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-9576cbb4e5a3441b.md
  bytes: 1107
- transacao: s006-bc4cb0427970a035
  titulo: 'Ren propõe seguir Brass de perto, ocultar-se e fugir se descoberto, priorizando informação e a segurança
    de terceiros. Luath aceita: seus homens manterão vigilância distante e seguirão Brass, Rook ou o papel, enquanto
    Ren poderá aproximar-se para escutar. Luath exige retirada imediata se Ren for percebido e pede que ele escolha
    entre iniciar a perseguição perto da Red Sail ou esperar na Ponte Baixa.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-bc4cb0427970a035.md
  bytes: 862
- transacao: s006-e31458b424cd5aba
  titulo: 'Investigação com vantagem 23 contra CD 15: Ren identifica no mapa um corredor urbano contínuo especialmente
    favorável a seguir pessoas furtivamente.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-e31458b424cd5aba.md
  bytes: 532
- transacao: s006-68ded1450eea78c3
  titulo: Ren escolhe iniciar a perseguição na escada próxima à ferraria, usar o corredor de bancas e divisões da
    rua para ouvir Brass e continuar seguindo-o ao entrar na Ponte Baixa, fugindo se detectado ou atacado e lutando
    apenas em risco de morte. Luath aceita o trajeto, ajusta seus observadores para deixá-lo livre e avisa que nenhum
    guarda o seguirá para dentro da Ponte Baixa.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-68ded1450eea78c3.md
  bytes: 876
- transacao: s006-46564096af22be4b
