    de trabalho, embora mantenha cautela. Ele revela que a proprietária é uma mulher que não mora na casa e que
    recados e dinheiro chegam por um escriturário, já partido naquele dia. Oferece a Ren trabalho externo no amanhecer
    seguinte por 2 PP e uma refeição, sem acesso à casa, prometendo m…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-8edd2c5c0424c556.md
  bytes: 1088
- transacao: s006-09ed59d2c65e6089
  titulo: 'Ren fornece ao jardineiro o nome falso Shinta, ou Shin, aceita o trabalho para o amanhecer seguinte e
    parte mantendo a persona pobre. Com Furtividade 26 contra CD 14, mistura-se a grupos de trabalhadores e chega
    à Red Sail sem cauda identificável. Investiga outros ângulos, mas obtém 8 contra CD 15: confirma que pode alcançar
    Brass, porém não encontra rota segura para retirar um prisioneiro. Por volta de 15:28, Brass aparece nos fundos
    da Red Sail com dois acompanhantes e um homem à porta; está…'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-09ed59d2c65e6089.md
