- transacao: s006-68ded1450eea78c3
  titulo: Ren escolhe iniciar a perseguição na escada próxima à ferraria, usar o corredor de bancas e divisões da
    rua para ouvir Brass e continuar seguindo-o ao entrar na Ponte Baixa, fugindo se detectado ou atacado e lutando
    apenas em risco de morte. Luath aceita o trajeto, ajusta seus observadores para deixá-lo livre e avisa que nenhum
    guarda o seguirá para dentro da Ponte Baixa.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-006/tx-s006-68ded1450eea78c3.md
  bytes: 876
