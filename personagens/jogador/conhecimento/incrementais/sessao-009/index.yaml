- transacao: s009-92757084ceeaff8b
  titulo: Ren examinou os prédios vizinhos à loja de Bram em busca de um posto próximo, oculto e com alcance auditivo.
    Obteve 7 contra CD 15 em Investigação. Os acessos externos próximos que encontrou eram expostos ou atravessavam
    propriedade ocupada; as posições seguras ficavam longe demais para ouvir diálogos normais. Às 18:42, continua
    oculto fora do perímetro, sem ativar Passos sem Pegadas ou gastar Ki.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-92757084ceeaff8b.md
