- transacao: s009-6f7c4e5653d04ba1
  titulo: Shinta aceitou as 2 PP, comeu e deixou a Casa do Salgueiro Seco de maneira natural perto do meio-dia.
    Ren procurou durante a saída um ponto para vigiar e ouvir o encontro do jardineiro com o escriturário, mas obteve
    Investigação 11 contra CD 14. Identificou posições que oferecem visão ou audição, mas nenhuma combina ambas
    com ocultação; uma busca melhor exigiria contornar a propriedade ou acessar terreno vizinho.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-6f7c4e5653d04ba1.md
