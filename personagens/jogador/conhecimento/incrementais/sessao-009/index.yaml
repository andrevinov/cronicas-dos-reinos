- transacao: s009-e604533216536b25
  titulo: Ren decidiu usar a casa vizinha como possível aproximação à loja de Bram e examinou seus acessos. Obteve
    10 contra CD 13 em Investigação. Identificou porta frontal exposta, porta traseira próxima ao perímetro de Bram
    e janela superior alcançável por uma subida incerta, mas não determinou qual opção é menos vigiada ou ocupada.
    Às 18:54, permanece oculto do lado de fora; não tocou acessos nem gastou Ki.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-e604533216536b25.md
