    às 20:26 e conversou brevemente com o vigia antes de partir; mais tarde o vigia desapareceu durante uma obstrução
    visual. Com 12 contra CD 15 em Percepção com desvantag…
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-80faeaaa3b107d18.md
