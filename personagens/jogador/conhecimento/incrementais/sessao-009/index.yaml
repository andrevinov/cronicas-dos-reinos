- transacao: s009-5acf7b8ede8988c0
  titulo: Ren exigiu a identidade do prisioneiro e ordenou que Bram abrisse a porta. Bram afirmou que o homem é
    Noll, seu antigo braço, e alegou tê-lo trancado após Noll tentar tomar dinheiro e vender seu nome depois do
    resgate de Colm. Ren ainda não confirmou visualmente a identidade nem a veracidade do motivo. Bram aproximou
    a chave da fechadura, mas não abriu. A troca não consumiu a ação de Ren; ele continua a 30 pés, e Bram permanece
    com 10/22 PV.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-5acf7b8ede8988c0.md
  bytes: 852
- transacao: s009-ac0bd4ad929882fd
  titulo: 'Ren pressionou Bram a abrir a porta e obteve 17 contra CD 14 em Intimidação com vantagem. No próprio
    turno, Bram destrancou e abriu a cela improvisada, recuando cerca de 10 pés em direção ao outro aposento sem
    largar faca ou chave. O prisioneiro foi confirmado como Noll: está consciente, mais magro, com hematomas e um
    pulso algemado por corrente curta a uma argola no piso. Noll reconheceu Ren. Ren permanece na escada com 41/45
    PV e 2/6 Ki; Bram está a cerca de 40 pés, com 10/22 PV.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-ac0bd4ad929882fd.md
  bytes: 854
- transacao: s009-ef5b3f7fb1ff5010
  titulo: Ren declarou que não viera salvar Noll, mas impor a Bram o afastamento de Colm. Socou um armário do patamar,
    acertando CA 15 e causando 9 de dano, destruindo portas, prateleiras e uma lateral. Bram prometeu explicitamente
    que Colm Dunn não está mais em seus livros, que não enviará homens nem comprará perguntas sobre seu paradeiro.
    Ren advertiu que não daria terceira chance. Bram não impediu sua saída. Às 23:07, Ren deixou a loja pela fachada
    destruída com 41/45 PV e 2/6 Ki; Bram permanece vivo…
