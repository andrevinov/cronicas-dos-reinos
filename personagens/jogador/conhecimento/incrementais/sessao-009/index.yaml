- transacao: s009-80faeaaa3b107d18
  titulo: Ren saiu da casa vizinha sem ser percebido, obtendo 33 contra CD 15 em Furtividade com vantagem e retornando
    pela cadeia de Passo Sombrio. Falhou em encontrar um posto alto seguro, com 5 contra CD 14 em Investigação,
