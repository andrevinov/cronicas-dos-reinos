- transacao: s009-6d0dc5d5ec2e417e
  titulo: 'Ren atravessou furtivamente o cômodo de serviço com 29 contra CD 15. Com 19 contra CD 14 em Investigação,
    encontrou um esconderijo estreito atrás do armário junto à parede compartilhada e uma falha de argamassa que
    transmite vibração. Obteve 8 contra CD 15 em Percepção: não distinguiu palavras, vozes ou batidas claras e não
    pode concluir se a loja está vazia ou se há refém. Às 19:03, permanece oculto no vão; Passos sem Pegadas continua
    ativo.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-009/tx-s009-6d0dc5d5ec2e417e.md
