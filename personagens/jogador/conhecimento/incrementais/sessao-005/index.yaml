fragmentos:
- transacao: s005-fd0a301ab3a68fe0
  titulo: 'Ren chega discretamente à Casa de Pesos da Ponte Baixa e obtém 22 contra CD 15 em Furtividade com vantagem,
    assumindo uma plataforma oculta. Com 19 contra CD 14 em Investigação, mapeia uma linha de Passo Sombrio até
    o contraforte oeste e uma aproximação comum até a porta. Às 21:12, dois homens chegam com uma caixa pesada;
    usam duas batidas curtas e uma longa, e a porta é aberta por dentro após inspeção pelo vão e retirada de corrente
    e barra. Um carregador sai com a carreta vazia; o outro permanece dentro. Ren obtém 11 contra CD 15 em Percepção:
    não vê refém ou coerção, mas não consegue excluir pessoas ocultas no interior. Às 21:31, continua não detectado.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-fd0a301ab3a68fe0.md
  bytes: 1633
- transacao: s005-9171ba709e77a890
  titulo: Ren gasta 2 Ki para ativar Passos sem Pegadas e usa Passo Sombrio em duas etapas até a janela superior.
    Obtém 28 contra CD 17 em Furtividade com vantagem e permanece indetectado. Com 23 contra CD 14 em Percepção,
    confirma que a sala superior de registros está vazia e ouve pelo menos duas vozes masculinas abaixo, sem indício
    sonoro de reféns. A janela possui quatro barras de ferro fixadas na alvenaria; ferramentas de ladrão não permitem
    entrada silenciosa, então Ren não abre os postigos. De perto, vê uma escotilha de telhado quinze pés acima e
    à direita, sem grade visível, ainda não examinada. Às 21:36, continua na faixa de pedra junto à janela, com
    4/6 Ki e Passos sem Pegadas ativo.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-9171ba709e77a890.md
  bytes: 1578
- transacao: s005-a951185188c3a9da
  titulo: Ren usa Passo Sombrio para alcançar a escotilha e obtém 32 contra CD 17 em Furtividade, permanecendo indetectado.
    A escotilha está destrancada, mas emperrada; com 23 contra CD 14 em ferramentas de ladrão, ele a abre silenciosamente
    e entra num desvão de manutenção vazio sob o telhado. Com 12 contra CD 14 em Investigação, identifica vigas
    seguras, o forro frágil, uma sequência de tábuas rumo a uma chaminé e mantém a escotilha como saída, mas não
    localiza ainda uma passagem segura para o andar inferior nem interpreta as marcas na poeira. Às 21:40, está
    dentro da Casa de Pesos sem ter sido detectado.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-a951185188c3a9da.md
  bytes: 1144
- transacao: s005-98fd399c284559e3
  titulo: 'Ren avança pelas vigas na direção da porta oeste com 37 contra CD 16 em Furtividade, sem ser detectado.
    Com 13 contra CD 14 em Percepção, não localiza corrente recorrente além do ruído compatível com a corrente e
    a barra da porta oeste. Abre silenciosamente um pequeno orifício no reboco com 17 contra CD 15 e obtém 17 contra
    CD 13 para observar com o espelho. Confirma o salão de recebimento: corrente e barra pertencem à porta, a caixa
    permanece fechada sobre uma balança, dois homens estão presentes e um livro grande semelhante ao removido da
    sala superior é usado para registrar um peso diferente daquele anotado numa segunda folha. Às 21:47, Ren segue
    oculto sobre o salão.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-98fd399c284559e3.md
  bytes: 1421
- transacao: s005-ad0f715858eab5a1
  titulo: Ren usa Ilusão Menor, sem componente verbal, para simular caixas e objetos caindo junto à passagem interna.
    O carregador deixa o salão, percorre pelo menos quinze pés pelo corredor e sai do campo de visão, deixando a
    porta interior aberta. O escrivão permanece entre a caixa e a escrivaninha, com a mão sobre o livro. A distração
    separa os homens apenas por uma janela curta; Ren permanece oculto e Passos sem Pegadas continua ativo.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-ad0f715858eab5a1.md
  bytes: 912
- transacao: s005-2f0187e7cc470be7
  titulo: Ren conjura Silêncio por 2 Ki, ficando com 2/6 e encerrando Passos sem Pegadas. O escrivão percebe o silêncio
    mágico e saca uma faca. Ren causa 10 de dano à ripa, abrindo sem ruído um buraco pouco maior que um punho. Usa
    Passo Sombrio para surgir numa sombra junto ao escrivão e vence a iniciativa por 20 a 14. Seus dois ataques
    não letais acertam CA 12, causando 8 e 7 de dano, e deixam o escrivão inconsciente e estável. Às 21:48, Ren
    está no salão silenciado; o carregador pode retornar em segundos, e o buraco mantém linha de visão para uma
    possível fuga ao desvão.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-2f0187e7cc470be7.md
  bytes: 1082
- transacao: s005-bf99880c4f1da09e
  titulo: Ren oculta-se junto ao portal, mas obtém 12 contra CD 13 em Furtividade. O carregador retorna, percebe
    a zona de Silêncio e para antes de atravessar; ao notar Ren, começa a recuar. Ren mantém iniciativa 20 contra
    8, alcança-o no corredor e acerta dois golpes não letais contra CA 12, causando 9 e 6 de dano. O carregador
    fica inconsciente e estável. Às 21:48, Ren está cerca de dez pés pelo corredor interno; tanto o carregador quanto
    o escrivão estão desacordados, e Silêncio continua ativo.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-bf99880c4f1da09e.md
  bytes: 936
- transacao: s005-aa77f872a409a9e2
  titulo: Ren examina o livro e as folhas. Com 6 contra CD 14 em Investigação, confirma que a caixa foi registrada
    oficialmente como ferragens de prensa com oito pedras e três libras, enquanto uma folha clandestina registra
    onze pedras e seis libras e traz as iniciais M.H.; ele não consegue determinar rapidamente o papel exato das
    iniciais nem decifrar as demais linhas. A caixa é de madeira reforçada por ferro, e Ren escolhe romper o encaixe
    do ferrolho com dois golpes, causando 6 e 5 de dano. Dentro encontra componentes de aço para armas compactas,
    sobretudo bestas de mão e facas, em quantidade para armar várias pessoas. Às 21:50, a caixa está aberta e os
    documentos permanecem sobre a mesa; Silêncio segue ativo.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-aa77f872a409a9e2.md
  bytes: 1755
- transacao: s005-66aeb2b3c3204847
  titulo: Ren guarda no livro as duas folhas clandestinas e recolhe da caixa um mecanismo de gatilho, duas pontas
    farpadas de virote e uma lâmina sem cabo. Carrega o livro e procura reféns pela Casa de Pesos. Ao sair do raio
    fixo de Silêncio, os sons retornam. Com 26 contra CD 13 em Percepção e 17 contra CD 14 em Investigação, verifica
    todos os cômodos e conclui que não há refém vivo nem outra pessoa consciente no edifício. No porão encontra
    argola de contenção, fibras de corda, sangue parcialmente lavado, marcas de arrasto e uma placa de trabalho
    de Edran Kells. Não há corpo; as provas indicam que Edran foi mantido, ferido e removido. Às 21:56, Ren está
    no porão com as evidências recolhidas; Silêncio ainda cobre o salão por cerca de dois minutos.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-66aeb2b3c3204847.md
  bytes: 1659
- transacao: s005-b616f668f83af3ee
  titulo: 'Ren observa a ala administrativa da Casa de Tyr sem se aproximar. Obtém 7 contra CD 14 em Percepção e
    não consegue identificar Halessa entre as janelas iluminadas. Com 10 contra CD 16 em Investigação, encontra
    sombras parciais, mas não confirma uma rota completa e reversível: não há sacadas, os peitoris são estreitos,
    a iluminação corta os destinos e fechaduras ou alarmes internos permanecem desconhecidos. Com 25 contra CD 13
    em Furtividade, não é percebido. Como sua condição de segurança absoluta não foi satisfeita, não gasta Ki nem
    tenta entrar. Às 22:43, permanece oculto diante da Casa de Tyr com as provas.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-b616f668f83af3ee.md
  bytes: 1140
- transacao: s005-cc42d3bf1c2f50ee
  titulo: 'Ren entra formalmente pela Casa de Tyr sem ser observado por inimigos externos e pede Halessa em caráter
    urgente e reservado. Entrega o livro, as duas folhas e quatro amostras das armas, relata a infiltração, a caixa,
    os dois homens inconscientes e os vestígios de Edran. Halessa corrige que tortura ou violência são fortemente
    indicadas, mas assassinato ainda não é fato, e alerta que os suspeitos podem descrever Ren. Ela sela o material
    com a procedência real, envia mensageiro a Luath e ordena preservação urgente da Casa de Pesos com duas testemunhas
    de Tyr. Ren obtém 14 contra CD 15 em Persuasão com vantagem: Halessa reconhece sua capacidade e age sobre a
    prova, mas ainda se recusa a tratá-lo como agente clandestino coordenado sem plano e limites prévios. Às 23:06,
    Ren permanece numa câmara reservada; as provas estão sob custódia provisória de Tyr e a operação foi iniciada.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-cc42d3bf1c2f50ee.md
  bytes: 1576
- transacao: s005-e1d863a303af2d27
  titulo: 'Ren pede desculpas por ultrapassar as instruções, mas responde a Halessa com ironia sobre a cautela institucional
    e reafirma que estará disponível contra Masao. Halessa reconhece que Ren está certo sobre a urgência, defende
    que a operação já iniciada não é mera nota de repúdio e recusa a falsa escolha entre impotência e ação sem limites.
    Repreende o uso retórico da mulher levada de barco e pede que fatos assim sejam entregues como evidência. Não
    fecha a possibilidade de cooperação: exige objetivo, rota e limites acordados antes da próxima infiltração.
    Para preservar a discrição de Ren, manda que saia pela porta dos peticionários sem registro público. Às 23:13,
    Ren está num beco lateral da Casa de Tyr com 2/6 Ki; a operação da Casa de Pesos continua.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-e1d863a303af2d27.md
  bytes: 1335
- transacao: s005-761d7fbe55c11631
  titulo: Ren retorna ao circo sem cauda e completa um descanso longo, recuperando 6/6 Ki e o uso do Broche no amanhecer
    de 9 Eleasis. Durante a madrugada, Luath demora a mobilizar a operação; uma equipe clandestina chega antes e
    inicia limpeza e incêndio na Casa de Pesos. Night Watch e Tyr intervêm, capturam os operadores e a equipe de
    limpeza, mas o fogo destrói parte do pavimento superior e registros remanescentes. A carga de armas é confirmada
    e os vestígios do porão, incluindo a placa de Edran Kells, são preservados; nenhum corpo é encontrado. Silva
    transmite a notícia e confirma Nera e Tavin seguros. Às 08:48, Ren chega ao ponto morto de Pell atrás da Silver
    Lily e vê uma mensagem dentro da garrafa, ainda fechada. A Sessão 5 termina.
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-005/tx-s005-761d7fbe55c11631.md
  bytes: 1351
