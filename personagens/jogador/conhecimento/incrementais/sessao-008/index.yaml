- transacao: s008-7d9be532456a4376
  titulo: 'Shinta comeu apressadamente, guardou as duas pratas com satisfação e confirmou que voltará no clarear
    seguinte. O jardineiro suavizou ligeiramente, reiterou que Shinta deve bater duas vezes e esperar sem procurar
    outra entrada. Ren deixou a propriedade e, após horas no terreno, conhece três serviços externos visíveis que
    poderia oferecer: telhas e ripa cedendo no estábulo, um galho morto alto sobre o telhado e uma tábua rachada
    no portão interno.'
