  titulo: 'Shinta pagou 2 PC por uma refeição simples durante a pausa. Com Intuição 13 contra CD 13, identificou
    Sella, conferente das tabuletas, como a melhor combinação entre receptividade e posição no fluxo cotidiano da
    Galeria. Sem pedir informação ou recrutá-la, obteve Persuasão 15 contra CD 11 e criou familiaridade inicial:
    Sella aprovou seu trabalho, apresentou-se pelo primeiro nome e deixou aberto que ele se sente ao lado dela no
    dia seguinte. Ela ainda não é informante nem espiã.'
