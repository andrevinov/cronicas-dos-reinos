- transacao: s011-3a0da49868f240e7
  titulo: 'Correção explícita: Ren não visitou Iria Doss. O primeiro abrigo de Colm foi o Lavadouro dos Três Tanques,
    sob os cuidados de Sella Rove, amiga de Kethra; Iria pertence ao resgate posterior no Fire River. Ren chegou
    discretamente ao lavadouro com Furtividade 22 contra CD 14. Sella o reconheceu e confirmou saber onde Kethra
    dorme, mas recusou revelar endereço ou companhia doméstica sem conhecer a urgência, oferecendo-se para avaliar
    e transmitir a mensagem. A cena para nessa interrupção.'
  arquivo: personagens/jogador/conhecimento/incrementais/sessao-011/tx-s011-3a0da49868f240e7.md
