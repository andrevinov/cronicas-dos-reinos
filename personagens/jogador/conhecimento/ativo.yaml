- titulo: 'Ren chegou discretamente à casa de Iria Doss com Furtividade 22 contra CD 14 e foi reconhecido como o
    homem que trouxe Colm com Mera. Iria esclareceu que nunca conheceu Kethra: recebeu Colm de Mera e Ren, sabe
    apenas que havia uma irmã em Narwhal e não conhece o endereço nem com quem Kethra mora. Sem destino, o deslocamento
    posterior foi interrompido. Iria também lembrou Ren da dívida pendente de 3 PO pelo tratamento, comida e abrigo
    de Colm.'
