- titulo: Shinta aceitou a avaliação sem se defender, pediu desculpas pelo atraso e chamou Sella de senpai, explicando
    de modo simples a relação senpai-kouhai de Kozakura. Sella aceitou o termo com humor. Durante o almoço, Shinta
    obteve Persuasão 18 contra CD 13 para fazê-la falar sobre Tomas. Sella disse que ele chega e trabalha sozinho,
    costuma comer com a prancheta, não socializa com os carregadores após o expediente e nunca lhe apresentou ou
    mencionou família; ressaltou que isso prova apenas que ela…
