incrementais_recentes:
- titulo: 'Sella confirmou que Tomas designou Shinta para a mesa de devoluções naquele dia e explicou os limites
    do setor: conferir quantidade, destino e motivo de recusa sem corrigir documentos para fazê-los concordar; manter
    documentos fechados e lacres intactos; levar dúvidas, lacres estranhos ou divergentes a ela ou Tomas; não atravessar
    a porta interna. Às 06:55, Shinta está diante do primeiro lote de treinamento, ainda sem mover nada.'
  arquivos:
