- titulo: Ren escalou violentamente o interrogatório, destruindo uma tábua e fazendo um corte superficial no rosto
    da mulher Cinza-Azul. Com vantagem, obteve 16 contra CD 14 em Intimidação. Ela admitiu que M. Harrow é uma identidade
    documental fabricada, afirmou trabalhar para Masao Hirasawa coordenando a célula documental local e revelou
    que a ordem pretendia remover e separar as sete crianças antes da verificação institucional, apagando sua rastreabilidade;
    disse não conhecer o destino final nem a loca…
