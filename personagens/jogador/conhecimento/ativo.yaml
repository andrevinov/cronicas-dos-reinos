- titulo: 'Ren entrou no circo sem cauda, abandonou a postura de Shinta e procurou Silva. Ela relatou um dia cheio,
    porém rotineiro, sem perguntas ou vigilância visível sobre Ren, Shinta ou os Vell. Nera passou o dia protegida
    no depósito de figurino velho; Tavin circulou como Timo em tarefas supervisionadas, sem fixar a carroça verde
    como lugar de dormir. Ambos estão fisicamente bem. Silva decidirá onde dormirão somente após a saída do público.
    A apresentação de Kage está no horário: mesma versão segura,…'
