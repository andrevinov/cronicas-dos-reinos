- titulo: 'Ren obtém 19 contra CD 15 na Intimidação com vantagem. O homem confessa ser o segundo intermediário da
    falsa lua: nega ter levado o desenho, atribui a encomenda inicial a Dain Brass Mord e admite ter levado tecido,
    lâmina falsa e papéis para fabricar um rastro oriental. Afirma que instruções superiores vinham sem assinatura
    pelo circuito de Narwhal, sob a expressão ''segunda maré'', e diz não conhecer o patrono. A cerca é rachada
    e uma testemunha começa a se afastar rumo à estrada.'
