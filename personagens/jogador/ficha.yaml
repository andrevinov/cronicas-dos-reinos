    dado: "1d4"
    resumo: "Pode usar Destreza para ataques e dano com golpes desarmados e armas de monge; após atacar, pode fazer um golpe desarmado como ação bônus."
  ki:
    pontos_maximos: 4
    pontos_atuais: 1
    cd: 13
    recarga: "descanso curto ou longo"
    usos:
      rajada_de_golpes:
        custo: 1
        resumo: "Depois da ação Atacar, faz dois golpes desarmados como ação bônus."
      defesa_paciente:
        custo: 1
        resumo: "Usa Esquivar como ação bônus."
      passo_do_vento:
        custo: 1
        resumo: "Usa Desengajar ou Disparada como ação bônus; distância de salto dobrada no turno."
  movimento_sem_armadura:
    bonus: "10 pés"
    resumo: "Move-se mais rápido enquanto não usa armadura nem escudo."
  aparar_projeteis:
    reacao: true
    reducao: "1d10 + 8"
    resumo: "Reduz dano de um ataque à distância com arma; se reduzir a zero, pode gastar 1 ki para arremessar o projétil de volta."
  queda_lenta:
    nivel: 4
    reacao: true
    reducao: 20
    resumo: "Ao cair, pode usar a reação para reduzir o dano de queda em 20."
  artes_sombrias:
    subclasse: "Caminho da Sombra"
    truque:
      nome: "ilusão menor"
      custo: 0
    magias_com_ki:
      - nome: "escuridão"
        custo: 2
      - nome: "visão no escuro"
        custo: 2
      - nome: "passos sem pegadas"
        custo: 2
      - nome: "silêncio"
        custo: 2
    resumo: "Usa ki para criar cobertura, silêncio, furtividade sobrenatural e truques de distração."

talentos:
  movel:
    resumo: "Deslocamento aumenta em 10 pés; ao realizar ataque corpo a corpo contra uma criatura, não provoca ataque de oportunidade dela pelo resto do turno, acertando ou errando."
    observacao: "Ajuda Ren a bater e reposicionar, essencial para campanha solo."

aumentos_de_atributo:
  nivel_4:
    escolha: "+1 Destreza, +1 Sabedoria"
    motivo: "Consolida Ren como infiltrador solo: melhora ataque, dano, CA, iniciativa e perícias de Destreza, enquanto prepara avanço futuro de Sabedoria."

