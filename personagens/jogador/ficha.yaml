    - Percepção
    ferramentas:
    - ferramentas de ladrão
    - kit de disfarce
  caracteristica_narrativa:
    nome: Sinais do Clã
    resumo: Ren reconhece marcas, códigos e hábitos de agentes treinados em tradições semelhantes às de seu clã.
      Isso pode abrir pistas, mas também denunciá-lo a inimigos atentos.
equipamento:
  armas:
  - wakizashi, mecanicamente espada curta
  - 9 shuriken, mecanicamente dardos
  armadura: nenhuma
  itens:
  - 'figurino de O Vento da Noite guardado com Dessa Wren: camadas negras presas para acrobacia, faixa larga escura
    com desenho de vento, tecido branco oculto para giros, mangas falsas, cabelo preso e máscara parcial de entrada'
  - 'roupa de cidadão menor limpo guardada no circo: casaco escuro simples, camisa limpa, calça comum, botas escovadas
    e faixa interna'
  - 'disfarce antigo de ajudante de carga: casaco pardo, gorro de lã escura e lenço grosso'
  - 'traje oriental original de infiltração de Ren: roupas ninja Kagehira, preservadas como conjunto próprio e distintas
    do figurino de palco de O Vento da Noite criado por Dessa Wren'
  - roupas roubadas e roupas comuns de doação entregues a Dessa Wren para virar retalho
  - disfarces de Nera e Tavin de Dessa Wren em uso
  - manto simples com capuz
  - ferramentas de caligrafia
  - ferramentas de ladrão
  - kit de disfarce
  - pacote de explorador
  - selo quebrado do Clã Kagehira
  - mapa incompleto de rotas comerciais entre Kara-Tur e Faerûn
  - pedaço de tecido com o símbolo usado pelo traidor
  - prancheta de Velis Rook
  - carimbo falso da lua velada
  - bilhete de B. sobre isca para o oriental
  - ficha de cobre com vela vermelha
  - cordão azul
  - ordem em papel encerado sobre gravadora, oriental e Brass
  - fita vermelha identificável do homem da Red Sail
  - botão de osso infantil tomado como garantia
  - tira de couro da amarra sabotada da corda alta
  - caderno de contas de Bram Vask
  - pedaço rasgado de pano vermelho encerado, tomado da porta de ferro da Casa Velha
  - Broche do Semblante Humilde, empréstimo provisório de Maerra/Lathander; 1 vez por amanhecer permite efeito semelhante
    a Disfarçar-se em si por 1 hora, com aparência humilde/comum e sem imitar pessoa específica com perfeição; uso
    renovado no amanhecer de 7 Eleasis e disponível
  - 'provas recuperadas da antiga calaria: matriz de madeira dura entalhada em reverso, uma folha enrolada no formato
    da ordem da Casa da Aurora Menor, três folhas de ensaio com impressões incompletas de selo e um maço de instruções
    chamuscado nas bordas'
  dinheiro:
    po: 39.379999999999995
vinculos:
  regiao_inicial: Ravens Bluff
  entrada_na_cidade: chegada pelo porto
  contato_inicial_previsto: Luath, sargento da City Guard
  faccao_inicial_prevista: Night Watch
  motivacao_principal: encontrar o traidor Masao Hirasawa
  objetivo_imediato: descobrir quem ajudou Masao a entrar ou se esconder em Ravens Bluff
progressao:
  xp_atual: null
  metodo: marcos narrativos
  arquivo_regras: regras/progressao.md
  marco_atual: Rede da Ponte Baixa rompida e posição operacional ampliada em Ravens Bluff
  observacao: Ren alcançou nível 7 ao fim da sessão 011, em 13 Eleasis de 1372 DR, após sobreviver a uma sequência
    de riscos reais, resgatar e proteger Colm, expor o circuito de armas e documentos da Casa de Pesos, frustrar
    Kurobane e recuperar a prova adulterada, impor a Bram o afastamento de Colm, aprofundar a cooperação cautelosa
    com Tyr e estabelecer Shinta como cobertura operacional com trabalho regular na Galeria dos Escribas.
