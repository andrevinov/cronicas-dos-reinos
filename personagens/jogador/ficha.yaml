recursos_de_classe:
  defesa_sem_armadura:
    resumo: CA = 10 + Destreza + Sabedoria enquanto não usa armadura nem escudo.
  artes_marciais:
    dado: 1d8
    resumo: Pode usar Destreza para ataques/dano com Golpes Desarmados e armas de Monge; o Golpe Desarmado de ação
      bônus não exige usar a ação Atacar antes. Destreza também pode substituir Força para Agarrar/Empurrar.
  ataque_extra:
    resumo: Quando usa a ação Atacar no próprio turno, Ren pode fazer dois ataques em vez de um.
  movimento_sem_armadura:
    bonus: 15 pés
    resumo: Move-se mais rápido enquanto não usa armadura nem escudo.
  queda_lenta:
    nivel: 4
    reacao: true
    reducao: 35
    resumo: Ao cair, usa a reação para reduzir o dano de queda em 35.
  evasao:
    nivel: 7
    resumo: Em efeito com salvaguarda de Destreza que normalmente causa metade no sucesso, sofre zero no sucesso
      e metade na falha; não funciona enquanto Incapacitado.
  artes_sombrias:
    subclasse: Guerreiro das Sombras
    nivel: 3
    visao_no_escuro: 60 pés
    ilusao_menor:
      conhece: true
      habilidade_conjuracao: Sabedoria
    escuridao:
      custo_focus: 1
      acao: Magia
      componentes: nenhum
      concentracao: true
      ve_dentro_da_propria_escuridao: true
      mover_area_no_inicio_do_turno: até 60 pés
    removidas_na_5_5e:
    - Passos sem Pegadas
    - Silêncio
    - Visão no Escuro como magia paga com recurso
  passo_sombrio:
    subclasse: Guerreiro das Sombras
    nivel: 6
    custo_focus: 0
    acao: ação bônus
    alcance: 60 pés
    origem_e_destino: luz baixa ou escuridão; destino desocupado e visível
    resumo: Teleporta-se e recebe vantagem no próximo ataque corpo a corpo antes do fim do turno.
  focus:
    pontos_maximos: 7
    pontos_atuais: 7
    cd: 14
    recarga: descanso curto ou longo
    calculo_cd: 8 + bônus de proficiência + modificador de Sabedoria
    usos:
      rajada_de_golpes:
        custo: 1
        resumo: Como ação bônus, faz dois Golpes Desarmados; não exige usar a ação Atacar antes.
      defesa_paciente:
        gratuito: Desengajar como ação bônus
        custo_focus: 1
        resumo: Com 1 Focus, Desengajar e Esquivar como a mesma ação bônus.
      passo_do_vento:
        gratuito: Disparada como ação bônus
        custo_focus: 1
        resumo: Com 1 Focus, Desengajar e Disparada na mesma ação bônus e dobrar a distância de salto no turno.
      ataque_atordoante:
        custo: 1
        limite: uma vez por turno
        resumo: Depois de acertar com arma de Monge ou Golpe Desarmado, Constituição CD 14; na falha fica Atordoado
          até o início do próximo turno de Ren; no sucesso tem deslocamento pela metade e o próximo ataque contra
          ele antes disso tem vantagem.
  metabolismo_sobrenatural:
    nivel: 2
    gatilho: ao rolar iniciativa
    recupera_focus: todos os Focus gastos
    cura: 7 + 1d8 PV no nível 7
    recarga: 1 uso por descanso longo
  desviar_ataques:
    nivel: 3
    reacao: true
    reducao: 1d10 + 11
    tipos:
    - contundente
    - perfurante
    - cortante
    redirecionar:
      condicao: se a redução levar o dano a zero
      custo_focus: 1
      alcance_corpo_a_corpo: 5 pés
      alcance_distancia: 60 pés
      salvaguarda: Destreza CD 14
      dano_falha: 2d8 + 4 do mesmo tipo do ataque original
  golpes_potencializados:
    nivel: 6
    resumo: Golpes Desarmados podem causar dano de Força ou o tipo normal.
talentos:
  movel:
    resumo: Deslocamento aumenta em 10 pés; ao realizar ataque corpo a corpo contra uma criatura, não provoca ataque
      de oportunidade dela pelo resto do turno, acertando ou errando.
    observacao: Ajuda Ren a bater e reposicionar, essencial para campanha solo.
  actor:
    origem: talento bônus retroativo de criação
    ajuste_atributo: +1 Carisma
    vantagem_outra_identidade: Ren tem vantagem em testes de Carisma (Enganação) e Carisma (Atuação) ao tentar passar-se
      por uma pessoa diferente de Ren Kagehira.
    identidades_validas: A outra identidade pode ser inventada, como Shinta Ryoushi, uma persona genérica ou uma
      pessoa real específica.
    mimetismo: Pode imitar a fala de outra pessoa ou sons feitos por outra criatura depois de ouvi-los por pelo
      menos 1 minuto.
    deteccao_mimetismo: Um ouvinte desconfiado pode testar Sabedoria (Intuição) contra Carisma (Enganação) de Ren
      para perceber que a imitação é falsa.
    observacao: Mimetismo é um benefício separado e não é pré-requisito para a vantagem. Actor não concede vantagem
      a uma mentira feita assumidamente como Ren nem a uma performance que não estabeleça ou sustente outra identidade.
  observant:
    origem: talento bônus retroativo de criação
    escolha_atributo: Inteligência
    ajuste_atributo: +1 Inteligência
    leitura_labial: Se Ren puder ver a boca de uma criatura enquanto ela fala um idioma que ele entende, pode interpretar
      o que ela está dizendo pelos lábios.
    bonus_percepcao_passiva: 5
    bonus_investigacao_passiva: 5
    observacao: O +5 afeta apenas os valores passivos; testes ativos usam os bônus normais da ficha.
aumentos_de_atributo:
  nivel_4:
    escolha: +1 Destreza, +1 Sabedoria
    motivo: 'Consolida Ren como infiltrador solo: melhora ataque, dano, CA, iniciativa e perícias de Destreza, enquanto
      prepara avanço futuro de Sabedoria.'
