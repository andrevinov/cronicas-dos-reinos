adaptacoes_explicitas:
  secao_9:
    antes: "lista ampla tratada como leitura minima antes de narrar"
    agora: >-
      As mesmas fontes continuam autorizadas, mas a leitura passou a ser
      progressiva e orientada por lacuna concreta. Essa mudanca e intencional
      e constitui o objetivo central da refatoracao de economia de contexto.
  secao_47:
    antes: "atualizar dependentes no mesmo trabalho sempre que possivel"
    agora: >-
      A consistencia entre dependentes continua obrigatoria, mas nao implica
      duplicar o mesmo fato em varios arquivos a cada turno. A consolidacao
      transacional sera implementada em etapa posterior.
  secao_57:
    antes: "prioridades hardcoded para a sessao 001"
    agora: >-
      A prioridade concreta vem de campanha.yaml e do estado corrente. Foi
      preservido o principio de nao criar documentos vazios ou sem utilidade.
