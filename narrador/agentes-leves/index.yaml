schema_agentes_leves: 2
natureza: reservado
descricao: >-
  NPCs recorrentes cuja rotina é o padrão. A camada existe para permitir ações
  ocasionais fora de cena sem abrir dezenas de fragmentos a cada checkpoint.
  Schema 2 declara fontes causais compactas para reutilizar no-op explícito sem
  reabrir perfil enquanto sua base canônica permanecer byte a byte igual.
orcamento:
  max_novas_por_checkpoint: 1
  max_pendencias_abertas: 2
  ordenacao: mais_atrasado_prioridade_id
  max_checks_cache_negativo_por_checkpoint: 1
