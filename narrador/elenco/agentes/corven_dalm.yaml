schema_agente: 2
natureza: reservado
id: corven_dalm
nome: Corven Dalm
tipo: npc
estado: ativo
objetivo_atual: >-
  Preservar o patrono real e a leitura obtida sobre Ren/Kage, aguardando nova
  oportunidade concreta de usar informação ou contrato como alavanca.
recursos:
  - posição de procurador da Casa Veyr e capacidade de operar por contrato e etiqueta
  - informação acionável sobre a Ponte Baixa e a janela antes da segunda maré
  - leitura social e informacional suficiente para reconhecer a máscara performática de Kage
restricoes:
  - preservar a identidade e os interesses do patrono real enquanto mede Ren
  - ação física local exige presença efetiva em Ravens Bluff
  - não resolver como fato a ambiguidade canônica sobre falar por Masao, contra Masao ou por outro interesse local
presenca:
  referencia: Ravens Bluff
  estado: presente
  detalhe: Corven permanece em Ravens Bluff, fora da cena de Ren e com paradeiro imediato não rastreado.
  fonte: estado/relacoes/corven_dalm.yaml
  evidencia: Ravens Bluff; paradeiro imediato não rastreado por Ren
mobilidade:
  estado: sem_deslocamento_registrado
  origem: null
  destino: null
  prazo: null
atuacao_local:
  regra: exige_presenca_fisica
  escopo: Ravens Bluff
  observacao: Corven pode agir diretamente enquanto sua presença local estiver canonicamente estabelecida; ausência ou viagem bloqueiam ação física local.
conhecimento:
  - id: veio_medir_ren
    fato: Corven declarou que veio medir a sombra de Kage, a gravadora e a relação de Ren com Masao.
    fonte: estado/relacoes/corven_dalm.yaml
    evidencia: Dalm declarou que veio medir se a sombra era truque, se a gravadora era corrente e se Masao era lâmina na mão de Ren ou anzol em sua garganta.
  - id: janela_segunda_mare
    fato: Corven considera relevante uma janela que se encerra antes da segunda maré.
    fonte: estado/relacoes/corven_dalm.yaml
    evidencia: Dalm disse que a janela relevante é antes da segunda maré.
  - id: rede_conhece_alavancas_sem_localizacao
    fato: A rede de Corven sabe da existência de uma gravadora e de um menino como alavancas, mas ainda não sabe onde dormem.
    fonte: estado/relacoes/corven_dalm.yaml
    evidencia: Dalm disse que a rede sabe que existe uma gravadora e um menino como alavanca, mas ainda não sabe onde eles dormem.
plano_atual:
  estado: aguardando_oportunidade
  acao: >-
    Preservar o patrono real e não agir novamente sem uma nova alavanca, contato ou
    mudança de risco que justifique retomar a medição de Ren/Kage.
  prazo_ou_oportunidade: Nova oportunidade causal; a antiga janela antes da segunda maré pertence ao histórico concluído.
fontes_canonicas:
  - estado/relacoes/corven_dalm.yaml
