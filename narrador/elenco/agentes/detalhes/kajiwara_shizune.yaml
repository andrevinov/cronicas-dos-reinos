schema_detalhes_agente: 1
natureza: reservado
agente_id: kajiwara_shizune
secoes:
  metodos_operacionais:
    impedir_consolidacao_de_provas:
    - id: invalidar_valor_probatorio
      abordagem: Criar contradição administrativa, vício de cadeia de custódia ou autoridade concorrente que reduza
        o valor institucional de uma prova sem precisar removê-la fisicamente.
      modalidade: indireta
      tags: [documentos, registros, cadeia_custodia, autoridade, prova]
    - id: fabricar_registro_contraditorio
      abordagem: Introduzir ordem, recibo, autorização ou registro plausível que ofereça uma explicação concorrente
        e force aliados de Ren a gastar tempo provando qual versão é legítima.
      modalidade: indireta
      tags: [falsificacao, registros, autorizacao, documentos, burocracia]
    mapear_rede_de_apoio_de_ren:
    - id: correlacionar_registros_e_identidades
      abordagem: Cruzar nomes, contratos, autorizações, endereços e cadeias de custódia para inferir quais pessoas
        e instituições sustentam Ren sem abordá-las diretamente.
      modalidade: indireta
      tags: [registros, identidade, contratos, aliados, burocracia]
    - id: pressionar_elo_lateral
      abordagem: Criar risco administrativo para um aliado secundário e observar quem intervém, quem assina por ele
        e quais instituições se expõem para protegê-lo.
      modalidade: indireta
      tags: [aliados, autoridade, registros, identidade, pressao]
    mascarar_origem_kozakuriana:
    - id: fabricar_explicacao_administrativa
      abordagem: Produzir documentação e narrativa burocrática que reenquadrem anomalias orientais como contrabando,
        erro de manifesto, carga reexportada ou fraude comercial comum.
      modalidade: indireta
      tags: [manifesto, alfandega, registros, contrabando, origem]
    - id: fragmentar_cadeia_de_proveniencia
      abordagem: Distribuir versões documentais compatíveis o bastante para impedir que origem, rota e responsável
        sejam demonstrados por uma única cadeia de registros.
      modalidade: indireta
      tags: [proveniencia, documentos, registros, rota, falsificacao]
    expandir_presenca_de_masao:
    - id: fabricar_identidades_para_celulas
      abordagem: Criar identidades, autorizações, vínculos laborais ou registros plausíveis que permitam a homens
        de Masao existir administrativamente na cidade sem revelar sua origem real.
      modalidade: indireta
      tags: [identidade, registros, estrangeiros, autorizacao, infiltracao]
    - id: legalizar_cobertura_de_carga
      abordagem: Produzir documentação suficiente para que armas, drogas ou material de apoio pareçam carga, estoque
        ou propriedade de intermediários legítimos até investigação mais profunda.
      modalidade: indireta
      tags: [documentos, carga, contrabando, alfandega, cobertura]
    ocupar_espaco_urbano:
    - id: forjar_titulo_ou_despejo
      abordagem: Criar ou explorar título, dívida, aluguel, ordem de despejo ou cadeia registral que pressione moradores
        a sair sem precisar de invasão aberta.
      modalidade: indireta
      tags: [imoveis, escritura, despejo, registros, propriedade]
    - id: tornar_morador_administrativamente_vulneravel
      abordagem: Acumular multas, exigências, acusações ou contradições documentais em torno de um imóvel até que
        vender ou abandonar o local pareça a opção menos perigosa.
      modalidade: indireta
      tags: [imoveis, burocracia, pressao, moradores, registros]
    desgastar_autoridade_de_ravens_bluff:
    - id: produzir_ordens_contraditorias
      abordagem: Fazer duas autoridades legítimas receberem documentos incompatíveis e obrigá-las a gastar confiança
        e tempo decidindo qual cadeia administrativa foi comprometida.
      modalidade: indireta
      tags: [autoridade, night_watch, tyr, ordens, documentos]
    - id: comprometer_procedimento_sem_expor_autora
      abordagem: Alterar, restaurar ou substituir um elo documental depois que alguém o viu, de modo que a instituição
        precise escolher entre suspeitar da testemunha e admitir falha de segurança interna.
      modalidade: indireta
      tags: [prova, registros, seguranca, credibilidade, infiltracao]
    pressionar_ren_por_vinculos:
    - id: transformar_aliado_em_risco_administrativo
      abordagem: Se conhecer canonicamente um vínculo de Ren, fabricar ou explorar problema legal, contratual ou identitário
        ao redor dessa pessoa para obrigar Ren a escolher onde gastar credibilidade.
      modalidade: indireta
      tags: [vinculo_conhecido, aliados, documentos, chantagem, autoridade]
    - id: usar_vinculo_como_isca_documental
      abordagem: Criar registro ou convocação plausível em torno de pessoa conhecida por Ren e observar quem aparece,
        quem assina e qual rede de proteção se revela.
      modalidade: indireta
      tags: [vinculo_conhecido, isca, registros, aliados, vigilancia]
    sustentar_cobertura_maritima:
    - id: fechar_manifesto_plausivel
      abordagem: Fazer porto, alfândega, recibos e intermediários contarem uma história marítima coerente o bastante
        para explicar parte do fluxo oriental sem explicar tudo.
      modalidade: indireta
      tags: [manifesto, porto, alfandega, navio_oriental, cobertura]
    - id: distribuir_origem_entre_intermediarios
      abordagem: Fragmentar a proveniência de carga e pessoas por procuradores, depósitos e revendas para que nenhuma
        tabela simples mostre volume incompatível com o porto.
      modalidade: indireta
      tags: [proveniencia, porto, registros, carga, intermediarios]
    neutralizar_ren_sem_expor_a_rede:
    - id: isolar_identidade_operacional_conhecida
      abordagem: Sobre identidades de Ren que conheça canonicamente, acumular contradições, restrições e suspeitas que
        reduzam acesso institucional ou mobilidade sem criar uma trilha documental única que revele coordenação superior.
      modalidade: indireta
      tags: [ren, neutralizacao, identidade, burocracia, sigilo_rede, impedimento]
    - id: transformar_interferencia_em_problema_institucional
      abordagem: Reenquadrar uma interferência comprovada de Ren como questão legal, contratual ou procedimental para
        que terceiros legítimos consumam sua credibilidade e tempo enquanto a autoria real permanece compartimentada.
      modalidade: indireta
      tags: [ren, neutralizacao, autoridade, credibilidade, sigilo_rede, interferencia]
  autonomia_estrategica:
    papel_no_arco: guerra_administrativa_que_faz_instituicoes_duvidarem_da_realidade
    iniciativa: alta
    regra_masao: nao_sabotar_plano_mestre
    regra_conhecimento_vinculos: exige_conhecimento_canonico
    impulsos:
    - corrigir_a_realidade_administrativa_depois_que_ren_a_observa
    - atacar_credibilidade_antes_do_corpo
    - transformar_aliado_secundario_em_ponto_de_pressao
    feito_lendario:
      principio: Quando demonstrar excelência, mudar a posição narrativa do conflito sem precisar de espetáculo gratuito.
      exemplos_nao_obrigatorios:
      - documento visto adulterado por Ren aparece restaurado ou substituído dentro de instituição segura, deixando
        a própria instituição sem resposta simples
      - ordens legítimas e falsas se cruzam de forma que cumprir uma delas parece violar a outra
    escaladas_condicionais:
    - id: instituicao_confia_em_ren
      quando: Tyr, Night Watch, guilda ou autoridade passa a dar peso às informações de Ren.
      abordagem: Pode atacar a cadeia de custódia, identidade ou procedimento em vez de confrontar Ren.
    - id: vinculo_conhecido
      quando: Shizune conhece canonicamente relação ou dependência importante de Ren.
      abordagem: Pode criar risco administrativo ao redor do vínculo sem presumir conhecimento que ainda não possui.
