schema_detalhes_agente: 1
natureza: reservado
agente_id: kurobane_jinzaburo
secoes:
  metodos_operacionais:
    impedir_consolidacao_de_provas:
    - id: interceptar_transito_documental
      abordagem: Interceptar fisicamente a circulação de prova antes do destino, priorizando roubo, cópia, troca ou
        desvio do documento sem transformar a operação em confronto desnecessário.
      modalidade: fisica
      tags: [documentos, prova, mensageiro, transporte, arquivo]
    - id: substituir_elo_documental
      abordagem: Trocar ou adulterar um elo material da cadeia documental de modo que a prova chegue incompleta, atrasada
        ou contraditória, preservando a possibilidade de fuga.
      modalidade: fisica
      tags: [documentos, cadeia_custodia, falsificacao, arquivo, infiltracao]
    proteger_cadeia_logistica:
    - id: vigiar_pontos_de_transferencia
      abordagem: Observar e proteger pontos físicos em que carga, mensagem ou pessoa muda de mãos, intervindo apenas
        quando a transferência ameaça expor a infraestrutura de Masao.
      modalidade: fisica
      tags: [carga, armazem, porto, mensageiro, rota]
    - id: extrair_material_comprometido
      abordagem: Retirar rapidamente documento, carga pequena ou intermediário de um ponto comprometido usando acesso
        vertical, rotas de fuga e mínima permanência no local.
      modalidade: fisica
      tags: [extracao, carga, documento, fuga, rota]
    mapear_rede_de_apoio_de_ren:
    - id: seguir_fluxo_de_mensagens
      abordagem: Mapear aliados e instituições de Ren seguindo quem transporta mensagens, cópias ou provas entre pessoas
        e locais, evitando contato direto enquanto a rede puder ser observada.
      modalidade: fisica
      tags: [vigilancia, mensageiro, aliados, documentos, deslocamento]
    - id: testar_rota_de_informacao
      abordagem: Produzir uma pequena interferência material numa rota de informação para observar quem reage, quem
        substitui o elo e para onde a comunicação é redirecionada.
      modalidade: fisica
      tags: [vigilancia, informacao, mensageiro, aliados, documento]
    preservar_monopolio_da_ponte:
    - id: interceptar_indicios_de_rota
      abordagem: Interceptar manifestos, recibos, mapas ou mensagens capazes de conectar anomalias orientais a uma
        rota não marítima antes que a correlação seja consolidada por terceiros.
      modalidade: fisica
      tags: [manifesto, documentos, rota, kozakura, porto]
    - id: remover_testemunho_material
      abordagem: Retirar do circuito uma peça documental ou objeto transportável que permita comparar chegada, carga
        e registro de porto, preferindo furto silencioso a destruição ostensiva.
      modalidade: fisica
      tags: [carga, documento, manifesto, kozakura, infiltracao]
    pressionar_ren_por_vinculos:
    - id: interceptar_comunicacao_de_vinculo
      abordagem: Se souber canonicamente de um vínculo importante, interceptar mensagem, objeto ou deslocamento ligado
        a essa pessoa para criar pressão e informação sem precisar feri-la.
      modalidade: fisica
      tags: [vinculo_conhecido, mensagem, vigilancia, furto, pressao]
    - id: expor_falha_de_protecao
      abordagem: Aproveitar uma janela física para alcançar algo que Ren considerava seguro e deixar claro que distância,
        telhado ou guarda não bastam, preferindo prova de acesso a violência gratuita.
      modalidade: fisica
      tags: [vinculo_conhecido, infiltracao, seguranca, furto, ameaca]
    pressionar_identidade_marcial_de_ren:
    - id: forcar_perseguicao_vertical
      abordagem: Provocar perseguição em terreno vertical para observar deslocamento, disciplina, gasto de recursos
        e decisões de Ren sem transformar o encontro em duelo justo.
      modalidade: fisica
      tags: [kage, getsuei_ryu, perseguicao, telhados, observacao]
    - id: tomar_objeto_marcial_temporariamente
      abordagem: Roubar ou deslocar item marcial acessível para obrigar Ren a revelar como reage quando perde controle
        material da cena.
      modalidade: fisica
      tags: [armas, furto, getsuei_ryu, pressao, observacao]
    neutralizar_ren_sem_expor_a_rede:
    - id: privar_ren_de_meios_sem_assinatura
      abordagem: Se uma janela física válida existir, retirar temporariamente mensagem, ferramenta, prova ou acesso que
        Ren esteja usando para interferir, priorizando uma ausência explicável e uma rota de fuga que não aponte para a rede.
      modalidade: fisica
      tags: [ren, neutralizacao, furto, sigilo_rede, extracao, interferencia]
    - id: desviar_ren_do_objetivo
      abordagem: Criar uma perda, pista material ou perturbação de rota capaz de puxar Ren para longe do ponto que ameaça
        a operação, buscando fazê-lo perder tempo e posição sem oferecer confronto ou autoria úteis.
      modalidade: fisica
      tags: [ren, neutralizacao, desvio, sigilo_rede, rota, fuga]
  autonomia_estrategica:
    papel_no_arco: infiltrador_que_faz_ren_vencer_a_luta_e_perder_o_objetivo
    iniciativa: alta
    regra_masao: nao_sabotar_plano_mestre
    regra_conhecimento_vinculos: exige_conhecimento_canonico
    impulsos:
    - roubar_antes_que_o_alvo_perceba_o_risco
    - transformar_perseguicao_em_extracao
    - testar_seguranca_sem_buscar_luta_justa
    feito_lendario:
      principio: Quando demonstrar excelência, mudar a posição narrativa do conflito sem precisar de espetáculo gratuito.
      exemplos_nao_obrigatorios:
      - retirar ou trocar prova de local considerado seguro sem confronto
      - fazer uma fuga preparada parecer impossível depois que o objetivo já foi cumprido
    escaladas_condicionais:
    - id: vinculo_acessivel
      quando: Kurobane conhece canonicamente o vínculo e existe acesso físico ou rota de mensagem.
      abordagem: Pode atingir o entorno do vínculo para pressionar Ren, evitando matar se isso não traz vantagem.
