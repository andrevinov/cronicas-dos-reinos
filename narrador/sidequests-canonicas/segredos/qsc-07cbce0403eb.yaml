oferta:
  recusa_permitida: true
  premissa: Uma duplicidade nos papéis da loja ameaça transformar um golpe pequeno em motivo para terceiros revistarem
    os negócios de Bram.
  pedido: Bram pede que Ren identifique a origem da duplicação antes de ele decidir quem cobrar ou denunciar.
  guardrails:
  - Bram é fonte interessada; sua versão não vira fato por ser quest-giver.
  - Ren escolhe se compartilha o que descobrir.
  - A investigação pode concluir que Bram está errado.
