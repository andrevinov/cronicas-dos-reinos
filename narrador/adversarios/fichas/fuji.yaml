  custo: null
  limite: {tipo: ilimitado, valor: null}
  contrajogo: [Consumir a reação ou forçar salvaguardas.]
acoes_lendarias:
- id: varredura_ashura
  nome: Varredura Ashura
  ativacao: acao_lendaria
  gatilho: fim do turno de outra criatura
