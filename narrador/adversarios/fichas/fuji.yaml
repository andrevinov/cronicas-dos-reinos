taticas:
  abertura: [Interpõe o corpo entre perigo e protegido.]
  prioridades: [Bloqueia passagem e extrai antes de perseguir.]
  adaptacoes: [Quebra o terreno contra mobilidade inimiga.]
  uso_terreno: [Transforma corredor, ponte e portão em extensão do corpo.]
  evita: [Não causa destruição sem relação com proteção ou objetivo.]
retirada:
  postura: recua
  gatilhos: [O protegido alcança rota segura., Masao ordena retirada por meio verificável.]
