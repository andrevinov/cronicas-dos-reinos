schema_entrada: 1
natureza: reservado
id: tsukishiro_joen
nome: Tsukishiro Jōen
ordem: 2
nivel_minimo_normal: 7
janela_preferencial: Ren nível 7-9, depois de Shen cruzar seu caminho e quando uma derrota, quase-morte ou limite
  técnico mostrar que o Getsuei-ryū incompleto não basta.
gatilhos_fortes:
- Ren sobreviver por pouco a Chō, Pan Chu ou outro Juppongatana e a diferença técnica ficar clara
- Ren estar realmente perdendo um confronto em que salvamento é causalmente plausível e Jōen já tiver como rastreá-lo
- Ren insistir em enfrentar a Juppongatana sem completar formação
- Shen encontrar rastro de um velho mestre procurando Ren
forma_preferencial: Jōen pode chegar depois de uma luta brutal para recolher o sobrevivente ou, se presença prévia
  e causalidade permitirem, intervir num instante de quase-morte; jamais aparece do nada apenas porque o combate
  ficou difícil.
funcao_imediata: Transformar sobrevivência em progresso marcial e terminar a formação de Ren sem se tornar botão
  de resgate recorrente.
ancoras:
- fonte: narrador/aliados/README.md
  evidencia: 2. **Tsukishiro Jōen**, a Lua Vazia;
- fonte: narrador/aliados/marcos-de-aparicao.md
