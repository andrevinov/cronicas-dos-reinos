schema_entrada: 1
natureza: reservado
id: shen_meihua
nome: Shen Meihua
ordem: 1
nivel_minimo_normal: 6
janela_preferencial: Ren nível 6-7, ainda em Ravens Bluff; especialmente após primeira
  derrota ou ferimento que prove que sobreviver sozinho deixou de ser estratégia suficiente.
gatilhos_fortes:
- primeira surra realmente grave, quase-morte ou ferimento persistente causado por
  Chō, Pan Chu ou outro agente preparado
- primeira pressão direta de Shizune contra documentos, Tyr, Luath, Narwhal ou o nome
  Kage/Kagehira
- uma anomalia da Ponte aparecer como mercadoria, pessoa, remédio ou recém-chegado
  sem rota marítima coerente
- Shen já estar seguindo Shizune, a família Kagehira ou o fluxo oriental e encontrar
  Ren no fim da investigação
forma_preferencial: Pode surgir primeiro como médica/investigadora independente e,
  numa derrota grave, salvar Ren do dano que ele já sofreu; sua intervenção não apaga
  a derrota nem exige que ela revele tudo que sabe.
funcao_imediata: Evitar que uma grande derrota vire morte gratuita, reconhecer assinatura
  técnica de Shizune e abrir rede própria de medicina/inteligência oriental em Faerûn.
sinal_antes: Uma sutura impossível, guarda adormecido sem ferimento, frasco oriental
  usado corretamente, ordem falsa marcada por detalhe de Shou Lung ou alguém fazendo
  perguntas discretas sobre Kagehira.
ancoras:
- fonte: narrador/aliados/README.md
  evidencia: 1. **Shen Meihua**, a Agulha de Jade;
- fonte: narrador/aliados/marcos-de-aparicao.md
  evidencia: '**Janela preferencial:** Ren nível 6-7, ainda em Ravens Bluff.'
fontes_canonicas:
- narrador/aliados/README.md
- narrador/aliados/marcos-de-aparicao.md
rotas_possiveis:
- já estar em Ravens Bluff seguindo rastros de Shizune ou dos Kagehira
- chegar por rota marítima legítima ou clandestina
- ter atravessado a Ponte de Kozakura por motivo próprio, sem que isso a torne agente
  de Masao nem revele automaticamente a Ponte a Ren
