    evidencia: Dalm declarou que veio medir se a sombra era truque, se a gravadora era corrente e se Masao era lâmina na mão de Ren ou anzol em sua garganta.
  - id: janela_segunda_mare
    fato: Corven considera relevante uma janela que se encerra antes da segunda maré.
    fonte: estado/relacoes/corven_dalm.yaml
