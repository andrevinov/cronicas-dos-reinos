  estado: sem_deslocamento_registrado
  origem: null
  destino: null
  prazo: null
atuacao_local:
  regra: exige_presenca_fisica
  escopo: Ravens Bluff
  observacao: Corven pode agir diretamente enquanto sua presença local estiver canonicamente estabelecida; ausência ou viagem bloqueiam ação física local.
conhecimento:
