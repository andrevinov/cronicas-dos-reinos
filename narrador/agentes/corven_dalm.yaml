schema_agente: 2
natureza: reservado
id: corven_dalm
nome: Corven Dalm
tipo: npc
estado: ativo
objetivo_atual: >-
  Medir Ren/Kage, a gravadora e sua reação a Masao sem expor o patrono real,
  usando informação controlada e a janela da Ponte Baixa como alavanca de teste.
recursos:
  - posição de procurador da Casa Veyr e capacidade de operar por contrato e etiqueta
  - informação acionável sobre a Ponte Baixa e a janela antes da segunda maré
  - leitura social e informacional suficiente para reconhecer a máscara performática de Kage
restricoes:
  - preservar a identidade e os interesses do patrono real enquanto mede Ren
  - ação física local exige presença efetiva em Ravens Bluff
  - não resolver como fato a ambiguidade canônica sobre falar por Masao, contra Masao ou por outro interesse local
presenca:
  referencia: Ravens Bluff
  estado: presente
  detalhe: Corven está canonicamente em cena, a sós com Ren/Kage, no camarim funcional do circo.
  fonte: estado/relacoes/corven_dalm.yaml
  evidencia: em cena; a sós com Ren/Kage, com Tobb do lado de fora
