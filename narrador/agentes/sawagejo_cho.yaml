objetivo_atual: Não executar ação local enquanto sua chegada não estiver estabelecida; quando ativo, caçar armas
  raras, medir o Getsuei-ryū e transformar Ren em desafio pessoal sem abandonar as necessidades estratégicas de
  Masao.
recursos:
- arsenal de armas raras e exóticas
- técnica de Mestre de Batalha, leitura de ritmo e quebra de armas
- acesso a homens de Masao quando a rede local puder fornecê-los
- disposição para violência pública e risco pessoal
restricoes:
- não presumir presença antes do marco de aparição
- não sequestrar ou ameaçar Nera, Tavin ou outro vínculo sem conhecimento canônico de sua importância para Ren
- pode matar por capricho apenas quando isso não sabota objetivo maior de Masao
- prefere adversário capaz e pode abandonar alvo sem interesse marcial se outro objetivo estratégico não exigir
  o contrário
