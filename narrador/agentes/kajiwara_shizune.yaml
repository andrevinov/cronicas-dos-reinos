  escopo: Ravens Bluff
  observacao: Enquanto a presença permanecer indeterminada, Shizune não é elegível para novas ações físicas locais;
    sinais existentes não bastam para canonizar sua chegada.
conhecimento:
- id: valor_do_selo
  fato: Shizune entende especialmente bem o valor do Selo da Lua Velada.
