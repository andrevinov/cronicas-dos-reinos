  condicao: A verificação é concluída e o profissional envolvido decide manter um
    canal legítimo com os protetores do abrigo.
  valor_aproximado: especial
  autoridade_concedente: Maerra pode fazer a apresentação, e o próprio verificador
    decide se mantém o contato.
