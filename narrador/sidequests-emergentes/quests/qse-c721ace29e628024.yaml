    dessa proteção.
quest_giver:
  tipo: npc_existente
  id: maerra_thandrel
  nome: Irmã Maerra Thandrel
  legitimidade: Maerra dirige o abrigo provisório, recebeu pessoalmente a ordem e
    possui autoridade para proteger as sete crianças enquanto verifica sua legitimidade.
oferta:
  premissa: Uma ordem administrativa sem a contramarca habitual determina a transferência
    das sete crianças ao amanhecer.
  pedido: Maerra pede que a origem e a autoridade da ordem sejam verificadas e que
    a cadeia do documento e do mensageiro seja preservada.
  recusa_permitida: true
premissa: Uma ordem plausível, mas irregular, tenta mover sete crianças de um abrigo
  provisório antes que sua autoridade possa ser confirmada; a ordem e seu risco existem
  independentemente da resposta de Ren.
