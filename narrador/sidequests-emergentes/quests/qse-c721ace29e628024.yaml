fases:
- id: examinar_ordem
  titulo: A contramarca ausente
  situacao: A ordem está preservada com Maerra; seu formato e seus nomes parecem plausíveis,
    mas falta uma contramarca habitual.
  condicao_avanco: Os sinais materiais relevantes da ordem ficam registrados sem destruir
    ou contaminar a evidência.
  locais:
  - casa_aurora_sete_nomes
- id: rastrear_mensageiro
  titulo: O portador da folha
  situacao: O mensageiro partiu antes que Maerra percebesse a irregularidade e pode
    conhecer apenas o ponto onde recebeu o envelope.
  condicao_avanco: A identidade ou a rota do mensageiro é estabelecida por evidência
    canônica, ou sua cadeia se torna comprovadamente inalcançável.
  locais:
  - casa_aurora_sete_nomes
  - rota_mensageiro_sete_nomes
- id: verificar_autoridade
  titulo: Quem podia ordenar
  situacao: A transferência só pode ser aceita ou recusada com segurança depois de
    uma confirmação institucional independente.
  condicao_avanco: Uma fonte institucional competente confirma, nega ou delimita a
    autoridade documental da ordem antes do prazo.
  locais:
  - arquivo_transferencias_caridade
antagonistas:
- id: masao_hirasawa
  tipo: ator_task40
  funcao: pressão estratégica indireta por intermédio de documentação plausível e
    agentes compartimentados
  objetivo: Explorar os canais administrativos de Ravens Bluff para deslocar pessoas
    vulneráveis sem expor a estrutura de comando.
juppongatana: []
condicoes_sucesso:
- A autoridade ou a falsidade da ordem é estabelecida antes do prazo por evidência
  institucional utilizável.
- As sete crianças permanecem fora de uma transferência não verificada enquanto a
  cadeia documental é preservada.
condicoes_falha:
- As crianças são transferidas por força da ordem antes que sua autoridade seja verificada.
- A ordem e a cadeia de entrega tornam-se inutilizáveis antes de produzir uma conclusão
  institucional.
stakes:
  em_risco:
  - a segurança das sete crianças
  - a integridade do documento
  - a liberdade e o testemunho do mensageiro
  consequencia_expiracao: Ao amanhecer, a ordem passa a produzir pressão administrativa
    imediata sobre o abrigo e sua cadeia humana pode já ter sido removida.
  perdas_possiveis: []
