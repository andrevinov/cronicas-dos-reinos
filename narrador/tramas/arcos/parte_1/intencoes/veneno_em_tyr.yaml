intencao_canonica:
  id: icp1-veneno_em_tyr
  funcao: Demonstrar que a guerra documental pode produzir dano humano grave e que a rede também tenta
    apagar a cadeia material que a denuncia.
  criterios_satisfacao:
  - Um ataque grave ligado a objeto ou cadeia documental produz investigação material legítima dentro
    de Tyr ou estrutura equivalente.
  - A rede tenta remover, substituir ou inutilizar a evidência capaz de reconstruir o vetor, preservando
    identidade e resultado como questões abertas.
