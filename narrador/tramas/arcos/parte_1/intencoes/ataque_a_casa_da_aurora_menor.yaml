schema_intencao_canonica_parte_1: 1
natureza: reservado
arco: parte_1_uma_ponte_para_kozakura
evento_id: ataque_a_casa_da_aurora_menor
intencao_canonica:
  id: icp1-ataque_a_casa_da_aurora_menor
  funcao: Materializar o custo social da degradação de segurança em uma crise civil séria que existe mesmo
    sem Ren.
  criterios_satisfacao:
  - A insegurança acumulada atinge a Casa da Aurora Menor, seu serviço ou pessoas diretamente ligadas
    a ela de maneira causal.
  - A crise produz prioridades concorrentes de proteção, resgate ou perseguição e pode gerar dano real
    sem garantir chegada ou sucesso de Ren.
realizacao_padrao:
  fonte: evento_canonico_task36
  nucleo: nucleo_obrigatorio
  forma: forma_preferencial
contrato_rewrite:
  preserva_intencao: true
  sem_rewrite: realizacao_padrao
  modos_permitidos:
  - satisfazer
  - transformar
  - adiar
  - reancorar
  atraso_maximo_horas: 48
  integracao_sidequest: true
  satisfacao_antecipada: true
  reancoragem_local: true
  troca_de_atores: true
