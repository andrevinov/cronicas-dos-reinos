intencao_canonica:
  id: icp1-feira_oriental_do_porto
  funcao: Mostrar a cidade sendo alterada pela escala da nova presença oriental e converter essa escala
    em oportunidades e custos urbanos concretos.
  criterios_satisfacao:
  - A atividade comercial associada à nova presença muda visivelmente rotina, densidade e interesses do
    porto.
  - Pelo menos uma consequência séria ou oportunidade de ajuda nasce dessa escala, enquanto opiniões públicas
    conflitantes permanecem plausíveis.
