intencao_canonica:
  id: icp1-duelo_publico_de_cho
  funcao: Transformar identidades, rumores e reputação em campo de batalha público, dando a Chō espaço
    para provocar sem decidir a resposta de Ren.
  criterios_satisfacao:
  - Chō ou legado causal de suas ações coloca publicamente em tensão nomes ou personas de Ren usando apenas
    evidências e rumores disponíveis.
  - Há oportunidade real de resposta e de confronto com consequências públicas observáveis, sem reputação
    ou neutralização automática.
