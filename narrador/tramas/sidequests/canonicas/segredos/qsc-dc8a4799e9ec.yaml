    ouvir.
  pedido: Ele pede que Ren observe o lugar e descubra se a fonte mudou de hábito, foi pressionada ou simplesmente
    o cortou.
  guardrails:
  - Ausência não prova sequestro nem morte.
  - A fonte pode ter escolhido desaparecer de Pell.
  - Ren decide o grau de envolvimento.
