condicoes:
- id: busca_deliberada
  texto: investigar deliberadamente recipientes, nichos ou mobiliário compatíveis com a área
  posses:
  - ambiente
- id: ocultacao_fisica
  texto: perceber e superar uma ocultação física, compartimento falso ou acesso disfarçado
  posses:
  - ambiente
- id: guardiao_local
  texto: derrotar, enganar ou negociar com o guardião local que controla a recompensa
  posses:
  - guardiao_local
- id: acesso_restrito
  texto: obter acesso legítimo ou clandestino à parte restrita onde a recompensa está guardada
  posses:
  - ambiente
  - ocupante_local
- id: seguir_pista_local
  texto: seguir uma pista concreta dentro da própria área até o ponto onde a recompensa foi deixada
  posses:
  - ambiente
catalogo:
  dinheiro:
  - id: bolsa_moedas
    nome: Bolsa de moedas misturadas
    descricao: Uma pequena soma em moedas correntes, reunida para despesas imediatas.
    valor_aproximado: baixo
    tier_min: 1
    tier_max: 4
    importancia: comum
    tags:
    - dinheiro
    - tesouro
  - id: reserva_comercial
    nome: Reserva de caixa
    descricao: Dinheiro separado para pagamentos, compras ou acertos locais.
