regras:
  ordem: global_depois_local_se_global_nao_materializa
  max_incidentes_por_cena: 1
  incidente_e_candidato_ate_narracao: true
  condicao_persistente_muda_pool_nao_frequencia: true
  sem_npc_nomeado_automatico: true
  sem_sidequest_automatica: true
  sem_recompensa_automatica: true
  sem_segredo_automatico: true
  sem_conhecimento_automatico: true
  scheduler: proibido
  reroll_por_incompatibilidade: proibido
  ren_pode_nao_intervir: true
  combate_nao_e_obrigatorio: true
  ameaca_desproporcional_exige_saida_observavel: true
guardrails_globais:
- O incidente apresenta uma situação; nunca escreve decisão, emoção ou resposta de Ren.
- Intervenção imediata pode resolver toda a situação sem criar side quest, recompensa ou compromisso posterior.
- NPCs nomeados só entram por outra camada canônica; aqui os participantes são papéis anônimos plausíveis da ecologia.
- Se violência surgir, calibrar oposição ao contexto; ameaça esmagadora precisa deixar fuga, negociação, cobertura ou outra saída observável.
