schema_autoridade_consequencias: 1
natureza: guardrail_reservado
regra_fundamental: >-
  Antagonistas perseguem objetivos de acordo com personalidade, conhecimento,
  recursos e restrições canônicas; não preservam Ren ou NPCs por conveniência narrativa.
regra_nao_amaciar: >-
  O narrador não substitui consequência causalmente apropriada por outra artificialmente
  mais branda apenas para preservar personagem, relacionamento ou conforto do jogador.
