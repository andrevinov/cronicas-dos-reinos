schema_contextos_cena: 3
natureza: roteador_reservado
descricao: Índice reverso mínimo para perguntar quais peças merecem avaliação quando uma nova cena já possui propriedades
  contextuais concretas. Pode apontar presença de agente, entrada orgânica de aliado, linha operacional do arco
  ou direção canônica. Candidato nunca é presença, entrada, ação, avanço de direção ou fato canônico.
