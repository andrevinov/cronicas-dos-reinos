schema_contextos_cena: 4
natureza: roteador_reservado
descricao: >-
  Índice reverso mínimo para perguntar quais peças merecem avaliação quando uma
  nova cena já possui propriedades contextuais concretas. Tags usam namespace
  obrigatório tipo:valor. local responde onde a interseção física ocorre;
  assunto, acao, pessoa e risco descrevem outras dimensões da cena. Candidato
  nunca é presença, entrada, ação, avanço de direção ou fato canônico.
orcamento:
  max_tags_por_cena: 8
  max_presencas: 2
  max_operacoes: 2
  max_direcoes: 1
  max_candidatos_total: 4
  ordenacao: coincidencias_prioridade_tipo_id
  max_entradas: 1
regras:
  scan_semantico: proibido
  abrir_fragmento_antes_da_selecao: proibido
  candidato_nao_e_fato: true
  tags_tipadas_obrigatorias: true
  tipos_tags:
  - local
  - assunto
  - acao
  - pessoa
  - risco
  valor_pertence_a_um_unico_namespace: true
  presenca_exige_tag_local: true
  presenca_exige_coincidencia_local: true
  assunto_sem_local_nao_cria_presenca: true
  operacao_pode_reagir_sem_local: true
  direcao_pode_reagir_sem_local: true
  entrada_pode_reagir_sem_local: true
  presenca_antagonista_exige_marco_aparicao: true
  marco_elegivel_nao_e_aparicao: true
  operacao_nao_escolhe_executor: true
  direcao_nao_avanca_automaticamente: true
  entrada_aliado_exige_arco_ordem_janela_nivel: true
  entrada_elegivel_nao_e_aparicao: true
