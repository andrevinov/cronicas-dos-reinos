schema_agenda_mundo: 1
natureza: reservado
hora_amanhecer: 06:00
descricao: 'Agenda operacional determinística. Reavaliação não significa ação. Agendamentos com evento_canonico
  pertencem à espinha datada: a hora 06:00, quando usada, só torna o evento devido. A semântica vem do catálogo
  fragmentado da Parte 1; evento canônico nunca é no-op.'
reavaliacoes:
  red_sail:
    cadencia: amanhecer
    intervalo_dias: 1
    inicio: 11 Eleasis, 1372 DR
    motivo: A busca ativa da Red Sail produz decisões operacionais diárias mesmo sem nova iniciativa de Ren.
  night_watch:
    cadencia: amanhecer
    intervalo_dias: 1
    inicio: 11 Eleasis, 1372 DR
    motivo: A Night Watch mantém investigação e vigilância próprias e deve reconsiderar prioridades a cada novo
      dia.
  casa_de_tyr:
    cadencia: amanhecer
    intervalo_dias: 2
    inicio: 11 Eleasis, 1372 DR
    motivo: A investigação reservada de Tyr continua fora da presença de Ren, mas não exige releitura diária completa.
  kurobane_jinzaburo:
    cadencia: amanhecer
    intervalo_dias: 2
    inicio: 12 Eleasis, 1372 DR
    motivo: Kurobane está canonicamente presente em Ravens Bluff e pode procurar novas janelas para documentos,
      mensagens ou extração.
  masao_hirasawa:
    cadencia: amanhecer
    intervalo_dias: 3
    inicio: 12 Eleasis, 1372 DR
    motivo: O plano estratégico de Masao continua em movimento, mas sua escala não exige reavaliação a cada amanhecer.
  kajiwara_shizune:
    cadencia: amanhecer
    intervalo_dias: 2
    inicio: 13 Eleasis, 1372 DR
    motivo: Shizune reconsidera guerra administrativa e pressão institucional quando estiver ativa; reavaliar não
      implica ação física ou descoberta.
  sawagejo_cho:
    cadencia: amanhecer
    intervalo_dias: 2
    inicio: 13 Eleasis, 1372 DR
    motivo: Após sua primeira aparição tornar Chō ativo, sua curiosidade marcial e pressão pessoal continuam autônomas;
      antes disso o guardrail de arco o filtra.
  pan_chu:
    cadencia: amanhecer
    intervalo_dias: 1
    inicio: 2 Eleint, 1372 DR
    motivo: Depois da chegada do Golden Lily e ativação de Pan Chu, presença marítima, logística e contestação de
      autoridade merecem reavaliação diária; antes disso o guardrail o filtra.
agendamentos:
- id: canon_parte1_16_eleasis_emboscada
  tipo: expiracao
  evento_canonico: emboscada_do_restaurante
  em:
    data: 16 Eleasis, 1372 DR
    hora: 06:00
  motivo: A abordagem direta já materializada permanece como primeiro marco datado e congelado.
- id: canon_parte1_18_eleasis_shinta
  tipo: expiracao
  evento_canonico: shinta_incriminado
  em:
    data: 18 Eleasis, 1372 DR
    hora: 06:00
  motivo: A identidade profissional vira vetor institucional de pressão sem predeterminar resposta de Ren.
- id: canon_parte1_21_eleasis_halessa
  tipo: expiracao
  evento_canonico: halessa_admite_a_teia
  em:
    data: 21 Eleasis, 1372 DR
    hora: 06:00
  motivo: Tyr acumula sinais suficientes para tratar a manipulação coordenada como hipótese séria e investigável.
- id: canon_parte1_23_eleasis_arsenal
  tipo: expiracao
  evento_canonico: arsenal_da_night_watch
  em:
    data: 23 Eleasis, 1372 DR
    hora: 06:00
  motivo: Uma perda institucional cria crise, incursão e oportunidade heroica sem exigir participação de Ren.
- id: canon_parte1_25_eleasis_veneno
  tipo: expiracao
  evento_canonico: veneno_em_tyr
  em:
    data: 25 Eleasis, 1372 DR
    hora: 06:00
  motivo: Uma operação documental hostil cria investigação material e oportunidade contra Shizune.
- id: canon_parte1_27_eleasis_pessoas_ken
  tipo: expiracao
  evento_canonico: pessoas_sem_porto_e_ken
  em:
    data: 27 Eleasis, 1372 DR
    hora: 06:00
  motivo: Anomalias de chegada e um artista marcial independente tornam a presença de Kara-Tur mais complexa.
- id: canon_parte1_29_eleasis_shen
  tipo: expiracao
  evento_canonico: chegada_de_shen_meihua
  em:
    data: 29 Eleasis, 1372 DR
    hora: 06:00
  motivo: Shen cruza diretamente a guerra por motivos próprios e abre cooperação sem resolver o arco.
- id: chegada_golden_lily_01_eleint
  tipo: movimento
  evento_canonico: chegada_golden_lily
  em:
    data: 1 Eleint, 1372 DR
    hora: '10:00'
  agente: pan_chu
  agentes_afetados:
  - pan_chu
  motivo: O Golden Lily entra fisicamente em Ravens Bluff e altera o tabuleiro portuário.
- id: canon_parte1_03_eleint_feira
  tipo: expiracao
  evento_canonico: feira_oriental_do_porto
  em:
    data: 3 Eleint, 1372 DR
    hora: 06:00
  motivo: A presença comercial amplia pressão urbana, economia e oportunidades de intervenção.
- id: canon_parte1_05_eleint_cormyr
  tipo: expiracao
  evento_canonico: cerco_naval_de_cormyr
  em:
    data: 5 Eleint, 1372 DR
    hora: 06:00
  motivo: Resposta naval externa transforma o Golden Lily em crise diplomática e civil persistente.
- id: canon_parte1_07_eleint_drogas
  tipo: expiracao
  evento_canonico: casa_de_cha_e_drogas
  em:
    data: 7 Eleint, 1372 DR
    hora: 06:00
  motivo: Contrabando e Sarbreen aproximam logística adversária da hipótese de uma rota subterrânea maior.
- id: canon_parte1_10_eleint_kethra
  tipo: expiracao
  evento_canonico: sequestro_de_kethra
  em:
    data: 10 Eleint, 1372 DR
    hora: 06:00
  motivo: A rede tenta converter vínculo pessoal em alavanca; o sucesso do sequestro permanece aberto ao jogo.
- id: canon_parte1_12_eleint_pan
  tipo: expiracao
  evento_canonico: tabuleiro_de_pan_chu
  em:
    data: 12 Eleint, 1372 DR
    hora: 06:00
  motivo: Pan Chu cria dilema operacional que pode abrir acesso ao núcleo de comando sem impor duelo.
- id: canon_parte1_14_eleint_cho
  tipo: expiracao
  evento_canonico: cho_na_cela
  em:
    data: 14 Eleint, 1372 DR
    hora: 06:00
  motivo: Chō entra em contato direto com Ren sem confirmar personas nem exigir luta.
- id: canon_parte1_16_eleint_fuga_cho
  tipo: expiracao
  evento_canonico: extracao_de_cho
  em:
    data: 16 Eleint, 1372 DR
    hora: 06:00
  motivo: A rede tenta retirar valor institucional de Chō e agrava a capacidade da Night Watch.
- id: canon_parte1_18_eleint_duelo_cho
  tipo: expiracao
  evento_canonico: duelo_publico_de_cho
  em:
    data: 18 Eleint, 1372 DR
    hora: 06:00
  motivo: Chō usa identidades e espetáculo como armas públicas sem predeterminar reputação ou duelo.
- id: canon_parte1_20_eleint_joen
  tipo: expiracao
  evento_canonico: chegada_de_joen
  em:
    data: 20 Eleint, 1372 DR
    hora: 06:00
  motivo: Jōen entra antes da convergência final para que qualquer ajuda futura tenha causalidade estabelecida.
- id: canon_parte1_22_eleint_aurora
  tipo: expiracao
  evento_canonico: ataque_a_casa_da_aurora_menor
  em:
    data: 22 Eleint, 1372 DR
    hora: 06:00
  motivo: A degradação urbana alcança civis vulneráveis e cria oportunidade heroica independente de Masao.
- id: canon_parte1_24_eleint_contabilidade
  tipo: expiracao
  evento_canonico: contabilidade_da_ponte
  em:
    data: 24 Eleint, 1372 DR
    hora: 06:00
  motivo: Canais independentes convergem numa anomalia logística que aponta para Sarbreen sem entregar a resposta
    pronta.
- id: canon_parte1_26_eleint_golpe_masao
  tipo: expiracao
  evento_canonico: golpe_de_masao_antes_da_ponte
  em:
    data: 26 Eleint, 1372 DR
    hora: 06:00
  motivo: Masao sacrifica ativos locais para preservar escala maior e cria crise de prioridades.
- id: canon_parte1_28_eleint_final
  tipo: expiracao
  evento_canonico: descida_a_ponte_e_masao
  em:
    data: 28 Eleint, 1372 DR
    hora: 06:00
  motivo: A Parte 1 converge fisicamente na passagem e muda de escala sem exigir vitória limpa.
