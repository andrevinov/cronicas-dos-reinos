titulo: Parte 1 — Uma Ponte para Kozakura
principio: >-
  Este contrato limita o espaço estratégico permitido nesta parte da crônica e
  orquestra fontes especializadas. Masao tenta converter Ravens Bluff em infraestrutura
  própria; Ren pode impedir, atrasar ou redirecionar esse processo. Habilitado significa
  somente que a peça pode ser considerada. A espinha canônica datada define núcleos que
  entram no mundo; descoberta, escolha de Ren e desfecho continuam separados.
