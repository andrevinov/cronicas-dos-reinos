schema_intencao_canonica_parte_1: 1
natureza: reservado
arco: parte_1_uma_ponte_para_kozakura
evento_id: contabilidade_da_ponte
intencao_canonica:
  id: icp1-contabilidade_da_ponte
  funcao: Elevar a Ponte de hipótese narrativa a explicação operacional forte por discrepâncias independentes
    que o contrabando marítimo comum não resolve.
  criterios_satisfacao:
  - Pelo menos dois canais independentes de evidência sustentam uma discrepância material de pessoas,
    carga ou trânsito incompatível com explicações portuárias comuns.
  - A discrepância aponta para rota subterrânea de grande capacidade em Sarbreen sem conceder localização,
    origem ou conclusão intelectual automática a Ren.
realizacao_padrao:
  fonte: evento_canonico_task36
  nucleo: nucleo_obrigatorio
  forma: forma_preferencial
contrato_rewrite:
  preserva_intencao: true
  sem_rewrite: realizacao_padrao
  modos_permitidos:
  - satisfazer
  - transformar
  - adiar
  - reancorar
  atraso_maximo_horas: 96
  integracao_sidequest: true
  satisfacao_antecipada: true
  reancoragem_local: true
  troca_de_atores: true
