intencao_canonica:
  id: icp1-descida_a_ponte_e_masao
  funcao: Concluir a Parte 1 tornando a Ponte operacionalmente estabelecida e quebrando o monopólio prático
    de Masao por consequências produzidas pelo jogo.
  criterios_satisfacao:
  - Uma operação física contra a infraestrutura principal da passagem torna sua existência e função operacional
    canonicamente estabelecidas.
  - O monopólio prático de Masao é quebrado por derrota, retirada, ruptura logística ou outra causa coerente,
    sem exigir vitória limpa nem decisão específica de Ren.
