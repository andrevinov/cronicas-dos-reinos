natureza: inventario_reservado
origem: estado/relacoes/index.yaml
descricao: >-
  Classificação fria dos relacionamentos canônicos atuais para decidir quem ganha
  scheduler no Mundo Vivo. Importância narrativa não implica agenda periódica.
