name: Temporary Task 8 audit

on:
  push:
    branches:
      - task/activate-5-5e

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Activation surface
        run: |
          echo '=== KI / FOCUS ACTIVE CODE + TESTS ==='
          grep -RInE '\bki\b|\bKi\b|recursos_de_classe\.ki|recursos\.ki|Caminho da Sombra|Passos sem Pegadas|Silêncio|dnd_5e_2014|5e 2014' \
            ferramentas tests regras docs/agente campanha.yaml personagens/jogador runtime estado \
            --exclude-dir=__pycache__ \
            --exclude='*.pyc' \
            --exclude='migracao-5-5e.yaml' \
            --exclude='resumo-de-poderes-5-5e.md' \
            | head -n 1200 || true
          echo '=== FILES REFERENCING KI IN PYTHON ==='
          grep -RIlE '\bki\b|\bKi\b' ferramentas tests --include='*.py' | sort || true
          echo '=== ACTIVE RUNTIME ==='
          sed -n '1,180p' runtime/contexto.yaml
          echo '---'
          sed -n '1,120p' runtime/cena.yaml
      - name: Baseline checks
        run: |
          python -m unittest discover -s tests -p 'test_ruleset_migration_contract.py'
          python -m unittest discover -s tests -p 'test_ren_5_5e_migration.py' || true
          python ferramentas/verificar-integridade.py
