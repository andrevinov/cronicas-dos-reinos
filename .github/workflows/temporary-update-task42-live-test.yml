name: Temporary update Task42 live-state test

on:
  push:
    branches:
      - fix/checkpoint-ci-baseline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkpoint-ci-baseline
          fetch-depth: 0

      - name: Update stale live-state assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_canon_bridge_rewriter.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_estado_real_comeca_vazio_e_valido(self):
        result = canon_bridge.check(ROOT)
        self.assertTrue(result["ok"], result["erros"])
        self.assertEqual(result["reservas"], 0)
        self.assertEqual(result["resolucoes"], 0)
'''
          new = '''    def test_estado_real_permanece_valido_com_reservas_canonicas(self):
        result = canon_bridge.check(ROOT)
        self.assertTrue(result["ok"], result["erros"])
        state = canon_bridge.load_state(ROOT)
        self.assertEqual(result["reservas"], len(state["reservas"]))
        self.assertEqual(result["resolucoes"], len(state["resolucoes"]))
'''
          if old not in text:
              raise SystemExit("stale Task42 live-state assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/temporary-update-task42-live-test.yml").unlink()
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: make Task42 live-state assertion dynamic"
          git push origin HEAD:fix/checkpoint-ci-baseline
