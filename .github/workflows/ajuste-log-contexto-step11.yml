name: Ajuste único do log de contexto — Etapa 11

on:
  push:
    branches:
      - refactor/context-economy-step-11

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/context-economy-step-11
      - name: Tornar log local opt-in
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ferramentas/contexto.py')
          s = p.read_text(encoding='utf-8')
          old = '    parser.add_argument("--sem-log", action="store_true", help="não registra telemetria local")\n'
          new = '''    parser.add_argument(\n        "--log-local",\n        action="store_true",\n        help="opcional: registra metadados locais da consulta; desligado por padrão",\n    )\n    parser.add_argument(\n        "--sem-log",\n        action="store_true",\n        help=argparse.SUPPRESS,\n    )\n'''
          if old not in s:
              raise SystemExit('argumento --sem-log esperado não encontrado')
          s = s.replace(old, new, 1)
          old2 = '    if not args.sem_log:\n        try:\n            log_query(repo, data, output_bytes, truncated)\n        except OSError:\n            pass\n'
          new2 = '    if args.log_local and not args.sem_log:\n        try:\n            log_query(repo, data, output_bytes, truncated)\n        except OSError:\n            pass\n'
          if old2 not in s:
              raise SystemExit('bloco de log esperado não encontrado')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar e remover workflow temporário
        run: |
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git rm .github/workflows/ajuste-log-contexto-step11.yml
          git add ferramentas/contexto.py
          git commit -m "Torna telemetria local opt-in"
          git push origin HEAD:refactor/context-economy-step-11
