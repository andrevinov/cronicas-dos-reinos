name: Temporary Task 18 patch runner

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'task/reward-budget-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/reward-budget-v2
          fetch-depth: 0
      - name: Extract and run patch from branch workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/task18-apply.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = lines[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          code = '\n'.join(line[indent:] if line.strip() else '' for line in body) + '\n'
          compile(code, 'task18_patch.py', 'exec')
          exec(compile(code, 'task18_patch.py', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Commit Task 18 implementation
        run: |
          git rm .github/workflows/task18-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ferramentas/recompensas.py ferramentas/interacoes_mundo.py ferramentas/cena_mundo_v4.py narrador/recompensas/tabelas.yaml
          git commit -m 'Task 18: implementar Reward Budget v2'
          git push origin HEAD:task/reward-budget-v2
