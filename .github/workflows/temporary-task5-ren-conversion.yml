name: Temporary Task 5 Ren conversion

on:
  push:
    branches:
      - task/ren-5-5e-conversion

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/ren-5-5e-conversion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Apply Task 5
        run: |
          if grep -q 'task_5_conversao_ren: true' campanha.yaml && [ -f ferramentas/ficha_ren_5_5e.py ]; then
            echo 'Task 5 already applied'
          else
            python .github/task5_apply.py
          fi
      - name: Targeted tests
        run: |
          python -m unittest discover -s tests -p 'test_migracao_ren_5_5e.py'
          python -m unittest discover -s tests -p 'test_ficha_ren.py'
          python -m unittest discover -s tests -p 'test_talentos_ren.py'
          python -m unittest discover -s tests -p 'test_mecanica_dnd_5_5e.py'
      - name: No retroactive state/history writes
        run: git diff --exit-code -- sessoes historico runtime estado
      - name: Full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanha.yaml docs/agente/regras-e-rolagens.md regras/decisoes.md \
            personagens/jogador/migracao-5-5e.yaml personagens/jogador/resumo-de-poderes-5-5e.md \
            ferramentas/ficha_ren_5_5e.py tests/test_migracao_ren_5_5e.py
          if git diff --cached --quiet; then
            echo 'No functional changes to commit'
          else
            git commit -m 'feat: stage Ren D&D 5.5e conversion'
            git push origin HEAD:task/ren-5-5e-conversion
          fi
