              '''    tables = load_tables(repo)\n    planned = load_planned(repo)\n    item_index = load_item_index(repo)\n    data, fragments = generate_map(index, tables, planned, place, tier, danger)\n''',
              '''    ecology_sources: list[str] = []\n    if ecology is None and (repo / ecologia_local.INDEX).is_file():\n        try:\n            ecology_lookup = ecologia_local.lookup_canonical(repo, place)\n        except ecologia_local.LocalEcologyError as exc:\n            raise RewardMapError(str(exc)) from exc\n        ecology = ecology_lookup["perfil"]\n        ecology_sources.extend(ecology_lookup["fontes_lidas"])\n\n    tables = load_tables(repo)\n    planned = load_planned(repo)\n    item_index = load_item_index(repo)\n    data, fragments = generate_map(\n        index, tables, planned, place, tier, danger, ecology=ecology\n    )\n''',
          )
          replace(
              'ferramentas/recompensas.py',
              '''            ITEM_INDEX.as_posix(),\n        ],\n''',
              '''            ITEM_INDEX.as_posix(),\n            *ecology_sources,\n        ],\n''',
              count=1,
          )

          # Reactive integration passes ecology already loaded by Task 11; no reread.
          replace(
              'ferramentas/interacoes_mundo.py',
              '''def local_event(\n    repo: Path,\n    place: str,\n    *,\n    action: str,\n    tier: int,\n    danger: str,\n) -> dict[str, Any]:\n''',
              '''def local_event(\n    repo: Path,\n    place: str,\n    *,\n    action: str,\n    tier: int,\n    danger: str,\n    ecology: dict[str, Any] | None = None,\n) -> dict[str, Any]:\n''',
          )
          replace(
              'ferramentas/interacoes_mundo.py',
              '        result = recompensas.ensure(repo, place, tier, danger)\n',
              '        result = recompensas.ensure(repo, place, tier, danger, ecology=ecology)\n',
          )
          replace(
              'ferramentas/cena_mundo_v4.py',
              '''                tier=local_spec["tier"],\n                danger=local_spec["periculosidade"],\n            )\n''',
              '''                tier=local_spec["tier"],\n                danger=local_spec["periculosidade"],\n                ecology=(\n                    local_spec.get("ecologia")\n                    if isinstance(local_spec.get("ecologia"), dict)\n                    else None\n                ),\n            )\n''',
              count=1,
          )

          # Syntax/static checks.
          for path in [
              'ferramentas/recompensas.py',
              'ferramentas/interacoes_mundo.py',
              'ferramentas/cena_mundo_v4.py',
          ]:
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')
