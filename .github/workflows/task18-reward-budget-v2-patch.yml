   categorias: [dinheiro, consumivel, ferramenta, curiosidade]\n    entreposto_documental:\n      modificador_pontos: 1\n      teto_valor_base: moderado\n      categorias: [dinheiro, gema, ferramenta, pergaminho, curiosidade]\ncondicoes:\n''',
