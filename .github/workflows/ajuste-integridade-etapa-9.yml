name: Ajuste único do guard — Etapa 9

on:
  push:
    branches:
      - "refactor/context-economy-step-09"

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ !contains(github.event.head_commit.message, '[guard-runtime-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Atualizar versão estrutural
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ferramentas/verificar-integridade.py')
          s = p.read_text(encoding='utf-8')
          old = 'RUNTIME_VERSION = 1'
          if old not in s:
              raise SystemExit('guard antigo não encontrado')
          p.write_text(s.replace(old, 'RUNTIME_VERSION = 2', 1), encoding='utf-8')
          PY
      - name: Publicar e remover workflow temporário
        run: |
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git rm .github/workflows/ajuste-integridade-etapa-9.yml
          git add ferramentas/verificar-integridade.py
          git commit -m "Atualiza guard do runtime para a Etapa 9 [guard-runtime-v2]"
          git push
