name: Temporary finalize Task 3 Ren sheet

on:
  push:
    branches:
      - task/ren-sheet-single-source

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/ren-sheet-single-source
          fetch-depth: 0

      - name: Apply Task 3
        run: |
          if [ -f ferramentas/ficha_ren.py ] && grep -q 'task_3_ficha_fonte_unica: true' campanha.yaml; then
            echo "Task 3 already applied"
          else
            python .github/task3_apply.py
          fi

      - name: Validate Task 3
        run: |
          python -m unittest tests.test_ficha_ren tests.test_talentos_ren tests.test_qualidade_abordagem tests.test_rolar_lote tests.test_ruleset_migration_contract -v
          ! grep -E '^REN_(ABILITIES|SKILLS|PASSIVES|SAVES|ATTACKS)' ferramentas/_rolar_dados_core.py
          ! grep -R -E '(core|roller)\.REN_(ABILITIES|SKILLS|PASSIVES|SAVES|ATTACKS)' tests --exclude-dir=__pycache__
          git diff --check

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campanha.yaml docs/agente/regras-e-rolagens.md ferramentas/_rolar_dados_core.py ferramentas/ficha_ren.py tests/test_ficha_ren.py tests/test_talentos_ren.py tests/test_qualidade_abordagem.py
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
            exit 0
          fi
          git commit -m "feat: make Ren sheet the mechanical source of truth"
          git push origin HEAD:task/ren-sheet-single-source
