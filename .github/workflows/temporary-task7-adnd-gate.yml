name: Temporary Task 7 AD&D gate
# verification pass: run against already committed functional bytes

on:
  push:
    branches:
      - task/adnd-5-5e-formal-gate

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/adnd-5-5e-formal-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Apply Task 7
        run: |
          if grep -q 'task_7_gate_adnd: true' campanha.yaml && grep -q '^import gate_adnd$' ferramentas/mecanica_cronica.py; then
            echo 'Task 7 already applied'
          else
            python .github/task7_apply.py
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('ferramentas/verificar-integridade.py')
          text = path.read_text(encoding='utf-8')
          old = '''import gate_adnd\n\n\nclass DuplicateKeyLoader'''
          new = '''try:\n    import gate_adnd\nexcept ModuleNotFoundError:\n    import importlib.util\n\n    _gate_path = Path(__file__).with_name("gate_adnd.py")\n    _gate_spec = importlib.util.spec_from_file_location("gate_adnd", _gate_path)\n    if _gate_spec is None or _gate_spec.loader is None:\n        raise\n    gate_adnd = importlib.util.module_from_spec(_gate_spec)\n    _gate_spec.loader.exec_module(gate_adnd)\n\n\nclass DuplicateKeyLoader'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Gate check
        run: python ferramentas/gate_adnd.py check
      - name: Targeted tests
        run: |
          python -m unittest discover -s tests -p 'test_gate_adnd.py'
          python -m unittest discover -s tests -p 'test_cronica_mecanica.py'
          python -m unittest discover -s tests -p 'test_ruleset_migration_contract.py'
          python -m unittest discover -s tests -p 'test_preflight.py'
          python -m unittest discover -s tests -p 'test_integridade.py'
      - name: Integrity
        run: python ferramentas/verificar-integridade.py
      - name: Full unit suite
        run: python -m unittest discover -s tests
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanha.yaml docs/agente/regras-e-rolagens.md ferramentas/README.md ferramentas/mecanica_cronica.py ferramentas/preflight.py ferramentas/verificar-integridade.py regras/fontes.md regras/regras-da-casa.md tests/test_gate_adnd.py tests/test_ruleset_migration_contract.py
          if git diff --cached --quiet; then
            echo 'No functional changes to commit'
          else
            git commit -m 'feat: enforce AD&D mechanics provenance gate'
            git push origin HEAD:task/adnd-5-5e-formal-gate
          fi
