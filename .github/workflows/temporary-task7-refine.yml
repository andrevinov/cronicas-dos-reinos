name: Temporary Task 7 refinement

on:
  push:
    branches:
      - task/adnd-5-5e-formal-gate

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/adnd-5-5e-formal-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Refine boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text or text.count(old) != 1:
                  raise SystemExit(f'marker problem in {path}: {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          gate = Path('ferramentas/gate_adnd.py')
          replace_once(
              gate,
              '''            provenance = node.get("proveniencia_mecanica")\n            active = node.get("mecanica_ativa") is True\n            origin_hint = None\n            if isinstance(provenance, dict):\n                origin_hint = provenance.get("edicao_origem")\n            if not active and origin_hint not in ADND_EDITIONS:\n                continue\n            if active and provenance is None:\n                # Só reservamos a marca ``mecanica_ativa`` para artefatos que\n                # precisam declarar versão; isso faz a falha ser estrutural, não heurística.\n                errors.append(\n                    f"{rel}:{node_path}: material mecânico ativo sem proveniencia_mecanica/versão"\n                )\n                continue\n            try:\n''',
              '''            provenance = node.get("proveniencia_mecanica")\n            origin_hint = None\n            if isinstance(provenance, dict):\n                origin_hint = provenance.get("edicao_origem")\n            # Fora do registro dedicado, não sequestrar a chave genérica\n            # mecanica_ativa de material nativo. Só inspecionar documentos que\n            # já se identificam como derivados de AD&D.\n            if origin_hint not in ADND_EDITIONS:\n                continue\n            try:\n''',
          )

          agent = Path('docs/agente/regras-e-rolagens.md')
          replace_once(
              agent,
              'Materiais de AD&D continuam seguindo a mesma regra conceitual: cenário e aventura podem ser preservados, mas qualquer mecânica que entre em jogo é adaptada para o `ruleset.atual`. Assim, o alvo da conversão muda de 2014 para 5.5e somente quando a ativação final ocorrer.\n',
              'Materiais de AD&D continuam seguindo a mesma regra conceitual: cenário e aventura podem ser preservados, mas qualquer mecânica que **entre em jogo** é adaptada para o `ruleset.atual`. Durante a migração, novas adaptações persistentes podem ser preparadas diretamente para 5.5e; elas só se tornam elegíveis ao runtime quando `adaptado_para` coincidir com o ruleset ativo.\n',
          )

          house = Path('regras/regras-da-casa.md')
          replace_once(
              house,
              'Material de AD&D e outras edições pode ser usado como cenário, aventura, NPC, local, item ou inspiração, mas suas mecânicas devem ser adaptadas para o **ruleset atual**. Antes da ativação final isso significa 5e 2014; depois da ativação, significa 5.5e.\n',
              'Material de AD&D e outras edições pode ser usado como cenário, aventura, NPC, local, item ou inspiração. A mecânica que **entrar em sessão** deve estar adaptada para o ruleset atual. Durante a migração, uma adaptação persistente pode ser preparada para 5.5e antecipadamente, mas permanece inelegível ao runtime até a ativação; uso 2014 derivado de AD&D é fallback explícito.\n',
          )

          test = Path('tests/test_gate_adnd.py')
          replace_once(
              test,
              '''    def test_verificador_principal_chama_subgate_adnd(self) -> None:\n        source = (ROOT / "ferramentas/verificar-integridade.py").read_text(encoding="utf-8")\n        self.assertIn("gate_adnd.validate_repository", source)\n''',
              '''    def test_integridade_nao_confunde_mecanica_nativa_com_adnd(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            repo = Path(tmp)\n            GateRepo(repo)\n            registry = yaml.safe_load(\n                (repo / gate_adnd.REGISTRY_PATH).read_text(encoding="utf-8")\n            )\n            errors = gate_adnd.validate_repository(\n                repo,\n                {\n                    gate_adnd.REGISTRY_PATH.as_posix(): registry,\n                    "regras/material-nativo.yaml": {\n                        "mecanica_ativa": True,\n                        "mecanica": {"armor_class": 17},\n                    },\n                },\n            )\n            self.assertEqual(errors, [])\n\n    def test_verificador_principal_chama_subgate_adnd(self) -> None:\n        source = (ROOT / "ferramentas/verificar-integridade.py").read_text(encoding="utf-8")\n        self.assertIn("gate_adnd.validate_repository", source)\n''',
          )
          PY
      - name: Tests
        run: |
          python ferramentas/gate_adnd.py check
          python -m unittest discover -s tests -p 'test_gate_adnd.py'
          python -m unittest discover -s tests -p 'test_cronica_mecanica.py'
          python ferramentas/verificar-integridade.py
          python -m unittest discover -s tests
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ferramentas/gate_adnd.py docs/agente/regras-e-rolagens.md regras/regras-da-casa.md tests/test_gate_adnd.py
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: narrow AD&D gate to provenance boundary'
            git push origin HEAD:task/adnd-5-5e-formal-gate
          fi
