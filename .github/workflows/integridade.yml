name: Integridade da campanha

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste
        run: python -m pip install -r requirements-dev.txt

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Integridade estrutural e semântica
        run: python ferramentas/verificar-integridade.py

      - name: Preservação da baseline durante a refatoração
        if: startsWith(github.ref_name, 'refactor/')
        run: >-
          python ferramentas/verificar-integridade.py
          --baseline baseline/estado-logico-2026-08-15.yaml
