name: Integridade da campanha

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste
        run: python -m pip install -r requirements-dev.txt

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Runtime derivado e atualizado
        run: python ferramentas/gerar-runtime.py --check

      - name: Consultas dirigidas de contexto
        run: |
          python ferramentas/contexto.py --sem-log status > /tmp/contexto-status.yaml
          python ferramentas/contexto.py --sem-log cena > /tmp/contexto-cena.yaml
          python ferramentas/contexto.py --sem-log npc nera > /tmp/contexto-npc.yaml
          python ferramentas/contexto.py --sem-log relacao kethra > /tmp/contexto-relacao.yaml
          python ferramentas/contexto.py --sem-log conhecimento masao > /tmp/contexto-conhecimento.yaml
          python ferramentas/contexto.py --sem-log regra furtividade > /tmp/contexto-regra.yaml
          python ferramentas/contexto.py --sem-log buscar "ponte baixa" > /tmp/contexto-busca.yaml
          test "$(wc -c < /tmp/contexto-status.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-cena.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-npc.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-relacao.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-conhecimento.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-regra.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-busca.yaml)" -le 8192

      - name: Integridade estrutural e semântica
        run: python ferramentas/verificar-integridade.py

      - name: Preservação da baseline durante a refatoração
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'refactor/')
        run: >-
          python ferramentas/verificar-integridade.py
          --baseline baseline/estado-logico-2026-08-15.yaml
