name: Integridade da campanha

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências de teste
        run: python -m pip install -r requirements-dev.txt

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Estado atual separado do histórico
        run: python ferramentas/migrar-estado-atual.py --check

      - name: Memórias fragmentadas e preservadas
        run: |
          python ferramentas/migrar-memorias-fragmentadas.py --check
          python ferramentas/reindexar-conhecimento.py --check

      - name: Protocolo transacional de narração
        run: |
          test -f ferramentas/contexto_core.py
          test -f ferramentas/transacoes.py
          test -f ferramentas/turno.py
          python ferramentas/turno.py check
          printf '%s\n' '[["rolar","1d4","--label","Lote A"],["d20","--bonus","2","--label","Lote B"]]' | python ferramentas/rolar-lote.py > /tmp/rolagens-lote.txt
          grep -q "Lote A" /tmp/rolagens-lote.txt
          grep -q "Lote B" /tmp/rolagens-lote.txt

      - name: Consolidação transacional
        run: |
          test -f ferramentas/consolidar.py
          test -f docs/agente/consolidacao-transacional.md
          test -f baseline/consolidacao-step-08.md
          grep -q 'docs/agente/consolidacao-transacional.md' AGENTS.md
          python ferramentas/consolidar.py check
          python ferramentas/consolidar.py status > /tmp/consolidacao-status.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/consolidacao-status.json', encoding='utf-8'))
          assert isinstance(report['eventos_pendentes'], int)
          assert report['eventos_pendentes'] >= 0
          assert report['consolidacao_em_andamento'] is None
          PY

      - name: Runtime derivado e atualizado
        run: python ferramentas/gerar-runtime.py --check

      - name: Memória fria de sessões
        run: |
          test -f ferramentas/sessoes.py
          test -f ferramentas/checkpoint.py
          test -f docs/agente/memoria-de-sessoes.md
          test -f baseline/memoria-sessoes-step-09.md
          test -f sessoes/index.yaml
          test -f sessoes/003/handoff.yaml
          python ferramentas/sessoes.py check
          python ferramentas/checkpoint.py check
          python ferramentas/contexto.py --sem-log retomada > /tmp/contexto-retomada.yaml
          python ferramentas/contexto.py --sem-log sessao 2 --apos L2 --motivo "A pergunta aponta diretamente para a sessão histórica 002." > /tmp/contexto-sessao-2.yaml
          test "$(wc -c < /tmp/contexto-retomada.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-sessao-2.yaml)" -le 8192
          ! grep -q 'transcricao_lida: true' /tmp/contexto-sessao-2.yaml
          ! grep -q 'sessoes/002/transcricao.md' /tmp/contexto-sessao-2.yaml
          python ferramentas/contexto.py --sem-log buscar 'carroça-escritório cheira' --historico --apos L3 --motivo "A busca corrente não contém a origem histórica necessária." > /tmp/contexto-historico.yaml
          ! grep -q 'sessoes/003/transcricao.md' /tmp/contexto-historico.yaml
          python ferramentas/contexto.py --sem-log buscar 'carroça-escritório cheira' --historico --transcricoes --apos L4 --motivo "O histórico estruturado não contém a formulação exata necessária." > /tmp/contexto-transcricoes.yaml
          grep -q 'sessoes/003/transcricao.md' /tmp/contexto-transcricoes.yaml
          if python ferramentas/contexto.py --sem-log buscar teste --transcricoes > /tmp/contexto-invalido.yaml 2>&1; then
            echo '--transcricoes sem --historico deveria falhar'
            exit 1
          fi

      - name: Escada formal de acesso
        run: |
          test -f ferramentas/politica_acesso.py
          test -f docs/agente/escada-de-acesso.md
          test -f baseline/escada-acesso-step-10.md
          grep -q 'docs/agente/escada-de-acesso.md' AGENTS.md
          grep -q 'L4T' AGENTS.md
          grep -q -- '--apos L2' AGENTS.md
          python ferramentas/contexto.py --sem-log --max-bytes 16000 status > /tmp/acesso-l1.yaml
          test "$(wc -c < /tmp/acesso-l1.yaml)" -le 4096
          grep -q 'nivel: L1' /tmp/acesso-l1.yaml
          grep -q 'teto_bytes: 4096' /tmp/acesso-l1.yaml
          grep -q 'pare_se_suficiente: true' /tmp/acesso-l1.yaml
          python ferramentas/contexto.py --sem-log cena > /tmp/acesso-l2.yaml
          grep -q 'nivel: L2' /tmp/acesso-l2.yaml
          test "$(wc -c < /tmp/acesso-l2.yaml)" -le 8192
          python ferramentas/contexto.py --sem-log local "casa de Iria Doss" > /tmp/acesso-local.yaml
          grep -q 'nivel: L2' /tmp/acesso-local.yaml
          grep -q 'textura_narrativa' /tmp/acesso-local.yaml
          test "$(wc -c < /tmp/acesso-local.yaml)" -le 8192
          if python ferramentas/contexto.py --sem-log buscar "ponte baixa" > /tmp/acesso-sem-motivo.txt 2>&1; then
            echo 'L3 sem --apos/--motivo deveria falhar'
            exit 1
          fi
          python ferramentas/contexto.py --sem-log buscar "ponte baixa" --apos L2 --motivo "As consultas dirigidas não localizaram o domínio da pista." > /tmp/acesso-l3.yaml
          grep -q 'nivel: L3' /tmp/acesso-l3.yaml
          grep -q 'depois_de: L2' /tmp/acesso-l3.yaml
          if python ferramentas/contexto.py --sem-log buscar "ponte baixa" --historico --apos L2 --motivo "A busca corrente não resolveu a origem histórica necessária." > /tmp/acesso-l4-errado.txt 2>&1; then
            echo 'L4 amplo deveria exigir --apos L3'
            exit 1
          fi
          python ferramentas/contexto.py --sem-log buscar "ponte baixa" --historico --apos L3 --motivo "A busca corrente não resolveu a origem histórica necessária." > /tmp/acesso-l4.yaml
          grep -q 'nivel: L4' /tmp/acesso-l4.yaml
          test "$(wc -c < /tmp/acesso-l4.yaml)" -le 12288
          if python ferramentas/contexto.py --sem-log buscar "ponte baixa" --historico --transcricoes --apos L3 --motivo "O histórico estruturado não contém o trecho bruto necessário." > /tmp/acesso-l4t-errado.txt 2>&1; then
            echo 'L4T deveria exigir --apos L4'
            exit 1
          fi
          python ferramentas/contexto.py --sem-log sessao 2 --apos L2 --motivo "A pergunta aponta diretamente para a sessão 002 e seu resumo." > /tmp/acesso-salto.yaml
          grep -q 'nivel: L4' /tmp/acesso-salto.yaml
          grep -q 'salto_dirigido: true' /tmp/acesso-salto.yaml

      - name: Telemetria externa de rollouts
        run: |
          test -f ferramentas/analisar-rollout.py
          test -f ferramentas/comparar-rollouts.py
          test -f docs/agente/telemetria-rollouts.md
          test -f baseline/telemetria-step-11.md
          test -f baseline/rollout-2026-08-15.json
          test -f baseline/metas-rollout-pos-refatoracao.json
          test -f tests/fixtures/rollout-step11-mini.jsonl
          python ferramentas/analisar-rollout.py tests/fixtures/rollout-step11-mini.jsonl --json > /tmp/rollout-step11.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/rollout-step11.json', encoding='utf-8'))
          assert report['schema_version'] == 3
          n = report['narration_turns']
          assert n['turns'] == 1
          assert n['inference_events'] == 3
          assert n['tool_calls'] == 3
          assert n['routed_context_calls'] == 1
          assert n['raw_read_calls'] == 0
          assert n['schema_discovery_calls'] == 0
          assert n['attempted_write_calls'] == 1
          assert n['successful_write_calls'] == 1
          assert n['failed_write_calls'] == 0
          assert n['write_target_touches'] == 2
          assert n['attempted_write_target_touches'] == 2
          assert n['canonical_write_target_touches'] == 0
          assert n['max_access_level_by_turn'] == {'L1': 1}
          assert n['fraction_turns_with_raw_read'] == 0.0
          assert n['fraction_turns_l0_l2'] == 1.0
          PY
          python ferramentas/comparar-rollouts.py tests/fixtures/rollout-step11-mini.jsonl --json > /tmp/comparacao-step11.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/comparacao-step11.json', encoding='utf-8'))
          after = report['after']['narration']
          assert report['interpretation']['raw_input_reduction'] > 0.70
          assert after['routed_context_calls_per_turn'] == 1.0
          assert after['raw_read_calls_per_turn'] == 0.0
          assert after['successful_write_calls_per_turn'] == 1.0
          assert after['write_target_touches_per_turn'] == 2.0
          assert after['fraction_turns_l0_l2'] == 1.0
          assert all(item['passed'] is True for item in report['targets'])
          PY
          rm -f runtime/consultas-contexto.jsonl
          python ferramentas/contexto.py status > /tmp/contexto-sem-telemetria.yaml
          test ! -e runtime/consultas-contexto.jsonl
          python ferramentas/contexto.py --log-local status > /tmp/contexto-com-telemetria.yaml
          test -s runtime/consultas-contexto.jsonl
          rm -f runtime/consultas-contexto.jsonl

      - name: Consultas dirigidas de contexto
        run: |
          python ferramentas/contexto.py --sem-log status > /tmp/contexto-status.yaml
          python ferramentas/contexto.py --sem-log cena > /tmp/contexto-cena.yaml
          python ferramentas/contexto.py --sem-log npc nera > /tmp/contexto-npc.yaml
          python ferramentas/contexto.py --sem-log npc "Iria Doss" > /tmp/contexto-iria.yaml
          python ferramentas/contexto.py --sem-log local "casa de Iria Doss" > /tmp/contexto-local.yaml
          python ferramentas/contexto.py --sem-log relacao kethra > /tmp/contexto-relacao.yaml
          python ferramentas/contexto.py --sem-log conhecimento masao > /tmp/contexto-conhecimento.yaml
          python ferramentas/contexto.py --sem-log conhecimento "ponte baixa" > /tmp/contexto-conhecimento-recente.yaml
          python ferramentas/contexto.py --sem-log regra furtividade > /tmp/contexto-regra.yaml
          python ferramentas/contexto.py --sem-log buscar "ponte baixa" --apos L2 --motivo "As consultas dirigidas não localizaram o domínio completo da pista." > /tmp/contexto-busca.yaml
          test "$(wc -c < /tmp/contexto-status.yaml)" -le 4096
          test "$(wc -c < /tmp/contexto-cena.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-npc.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-iria.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-local.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-relacao.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-conhecimento.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-conhecimento-recente.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-regra.yaml)" -le 8192
          test "$(wc -c < /tmp/contexto-busca.yaml)" -le 8192
          grep -q "textura_narrativa" /tmp/contexto-iria.yaml
          grep -q "cenario/texturas/npcs/iria_doss.yaml" /tmp/contexto-iria.yaml
          grep -q "cenario/texturas/locais/casa_iria_doss.yaml" /tmp/contexto-local.yaml
          grep -q "estado/relacoes/kethra_dunn.yaml" /tmp/contexto-relacao.yaml
          python - <<'PY'
          import yaml
          report = yaml.safe_load(open('/tmp/contexto-conhecimento-recente.yaml', encoding='utf-8'))
          assert report['resultado']['encontrado'] is True, report
          sources = report.get('fontes') or []
          assert 'personagens/jogador/conhecimento.md' not in sources, sources
          assert any(
              source.startswith('personagens/jogador/conhecimento/') and source.endswith('.md')
              for source in sources
          ), sources
          PY

      - name: Integridade estrutural e semântica
        run: python ferramentas/verificar-integridade.py

      - name: Preservação do artefato histórico de baseline
        run: python ferramentas/verificar-integridade.py --verificar-baseline-historica

      - name: Auditoria final e teste de retomada
        run: |
          test -f ferramentas/auditoria-final.py
          test -f docs/agente/auditoria-final.md
          test -f baseline/auditoria-final-step-12.md
          python ferramentas/auditoria-final.py --json --sem-testes > /tmp/auditoria-final.json
          python - <<'PY'
          import json
          import yaml
          report = json.load(open('/tmp/auditoria-final.json', encoding='utf-8'))
          state = yaml.safe_load(open('estado/estado-atual.yaml', encoding='utf-8'))
          assert report['pronto_para_retomar'] is True, report
          assert report['veredito'] == 'PRONTO PARA RETOMAR'
          assert all(gate['ok'] is True for gate in report['gates'])
          by_name = {gate['nome']: gate for gate in report['gates']}
          baseline = by_name['regressoes_e_baseline']['detalhe']
          assert baseline['suite_completa_executada'] is False
          assert 'baseline histórica' in baseline['baseline_historica'].lower()
          hot = by_name['retomada_somente_camada_quente']['detalhe']
          assert hot['transcricao_lida'] is False
          assert hot['bytes_saida'] <= 8192
          assert hot['eventos_pendentes'] >= 0
          assert hot['snapshot']['sessao'] == state['campanha']['sessao_atual']
          assert hot['snapshot']['personagem'] == state['personagem']['nome']
          pending = by_name['retomada_com_delta_pendente']['detalhe']
          assert pending['somente_sandbox'] is True
          assert pending['ki_efetivo'] == pending['ki_base'] - 1
          immutable = by_name['auditoria_sem_mutacao']['detalhe']
          assert immutable['hash_antes'] == immutable['hash_depois']
          PY
          cat /tmp/auditoria-final.json
