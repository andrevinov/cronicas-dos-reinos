name: Temporary apply Task 2 rules catalog

on:
  push:
    branches:
      - task/rules-catalog

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/rules-catalog
          fetch-depth: 0

      - name: Apply Task 2
        run: |
          if [ -f regras/catalogo.yaml ]; then
            echo "Task 2 already applied"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import textwrap

          catalog = '''
          schema_catalogo_regras: 1
          natureza: indice_executavel
          contrato:
            fonte_ruleset: campanha.yaml#sistema.ruleset
            fallback_textual: true
            nivel_consulta_catalogada: L2
            max_resultado_l2_bytes: 8192
          regras:
            - id: furtividade_oposta
              aliases:
                - furtividade
                - stealth
                - teste de furtividade
                - furtividade contra percepcao
              dominio: exploracao
              ruleset: dnd_5e_2014
              autoridade: ruleset_atual
              fonte:
                arquivo: regras/resolucao-de-acoes.md
                secao: Testes resistidos
              resumo_interno: >-
                Quando Ren tenta passar despercebido sob oposição direta, resolver a oposição
                entre Furtividade e Percepção conforme a situação da cena, usando rolagem oculta
                quando expor o teste entregaria informação secreta.
              executor: dados
              persistencia: nenhuma
              house_rule: null

            - id: teste_d20_basico
              aliases:
                - teste d20
                - teste de habilidade
                - ability check
              dominio: resolucao
              ruleset: dnd_5e_2014
              autoridade: ruleset_atual
              fonte:
                arquivo: regras/resolucao-de-acoes.md
                secao: Fórmula básica
              resumo_interno: >-
                Testes usam d20 mais o modificador apropriado contra uma CD definida antes da
                rolagem; ataques e salvaguardas usam seus bônus próprios contra a defesa aplicável.
              executor: dados
              persistencia: nenhuma
              house_rule: null

            - id: vantagem_desvantagem
              aliases:
                - vantagem
                - desvantagem
                - advantage disadvantage
              dominio: resolucao
              ruleset: dnd_5e_2014
              autoridade: ruleset_atual
              fonte:
                arquivo: regras/resolucao-de-acoes.md
                secao: Vantagem e desvantagem
              resumo_interno: >-
                Aplicar vantagem ou desvantagem somente quando a situação a justificar antes do
                dado; quando ambas coexistirem, cancelar uma à outra.
              executor: dados
              persistencia: nenhuma
              house_rule: null

            - id: cd_rapidas_campanha
              aliases:
                - cds rapidas
                - classe de dificuldade
                - difficulty class
              dominio: adjudicacao
              ruleset: dnd_5e_2014
              autoridade: regras_da_casa
              fonte:
                arquivo: regras/resolucao-de-acoes.md
                secao: CDs rápidas
              resumo_interno: >-
                A campanha usa uma escala operacional curta de CDs como referência inicial e
                exige que a CD seja fixada antes da rolagem.
              executor: narrador
              persistencia: nenhuma
              house_rule: cds_rapidas_operacionais

            - id: sucesso_com_custo
              aliases:
                - sucesso a um custo
                - success at a cost
                - falha com progresso
              dominio: adjudicacao
              ruleset: dnd_5e_2014
              autoridade: regras_da_casa
              fonte:
                arquivo: regras/resolucao-de-acoes.md
                secao: Sucesso com custo
              resumo_interno: >-
                Quando uma falha simples apenas travaria a cena, o narrador pode converter o
                resultado em progresso com custo coerente, sem apagar risco importante, combate
                ou consequência de decisão ruim.
              executor: narrador
              persistencia: turno_transacional
              house_rule: sucesso_com_custo_da_campanha
          '''
          Path("regras/catalogo.yaml").write_text(textwrap.dedent(catalog).lstrip(), encoding="utf-8")

          module = r'''
          #!/usr/bin/env python3
          """Catálogo executável e dirigido das regras mecânicas da campanha.

          O catálogo identifica regra, versão, autoridade, executor e persistência, mas não
          substitui a documentação humana. Cada entrada precisa apontar para uma seção real em
          ``regras/*.md``. A consulta catalogada é L2; regras ainda não catalogadas preservam o
          fallback textual legado enquanto a migração estiver incompleta.
          """
          from __future__ import annotations

          import re
          from pathlib import Path
          from typing import Any, Callable

          import yaml

          import contexto_core as core

          CATALOG_PATH = Path("regras/catalogo.yaml")
          CAMPAIGN_PATH = Path("campanha.yaml")
          SCHEMA = 1
          REQUIRED_FIELDS = {
              "id", "aliases", "dominio", "ruleset", "autoridade", "fonte",
              "resumo_interno", "executor", "persistencia", "house_rule",
          }
          EXECUTORS = {"narrador", "dados", "cronica", "progressao"}
          PERSISTENCE = {"nenhuma", "turno_transacional", "checkpoint", "estado_canonico"}
          ID_RE = re.compile(r"^[a-z0-9_]+$")


          class RuleCatalogError(ValueError):
              pass


          def read_document(repo: Path) -> dict[str, Any]:
              path = repo / CATALOG_PATH
              if not path.is_file():
                  raise RuleCatalogError(f"catálogo de regras ausente: {CATALOG_PATH.as_posix()}")
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              if not isinstance(data, dict):
                  raise RuleCatalogError("catálogo de regras precisa ser um mapa YAML")
              return data


          def _ruleset_contract(repo: Path) -> tuple[str, str, list[str]]:
              path = repo / CAMPAIGN_PATH
              if not path.is_file():
                  raise RuleCatalogError("campanha.yaml ausente para validar ruleset do catálogo")
              campaign = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              try:
                  ruleset = campaign["sistema"]["ruleset"]
                  current = str(ruleset["atual"])
                  target = str(ruleset["alvo"])
                  hierarchy = list(ruleset["hierarquia_mecanica"])
              except (KeyError, TypeError) as exc:
                  raise RuleCatalogError("contrato sistema.ruleset inválido em campanha.yaml") from exc
              return current, target, [str(item) for item in hierarchy]


          def _source_path(repo: Path, rel: Any) -> Path:
              if not isinstance(rel, str) or not rel.strip():
                  raise RuleCatalogError("fonte.arquivo precisa ser caminho textual")
              path = Path(rel)
              if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0] != "regras":
                  raise RuleCatalogError(f"fonte fora de regras/: {rel}")
              target = repo / path
              if not target.is_file():
                  raise RuleCatalogError(f"fonte inexistente: {rel}")
              if target.suffix.lower() != ".md":
                  raise RuleCatalogError(f"fonte humana precisa ser Markdown: {rel}")
              return target


          def _find_section(repo: Path, source: dict[str, Any]) -> dict[str, Any]:
              path = _source_path(repo, source.get("arquivo"))
              section_name = source.get("secao")
              if not isinstance(section_name, str) or not section_name.strip():
                  raise RuleCatalogError("fonte.secao precisa identificar uma seção humana")
              wanted = core.normalize(section_name)
              text = path.read_text(encoding="utf-8")
              for section in core.split_markdown_sections(text):
                  if core.normalize(section.get("titulo", "")) == wanted:
                      return {
                          "arquivo": path.relative_to(repo).as_posix(),
                          "linha": section["linha"],
                          "titulo": section["titulo"],
                          "conteudo": core.truncate_text(section["conteudo"], 2200),
                      }
              raise RuleCatalogError(
                  f"seção humana inexistente em {source.get('arquivo')}: {section_name}"
              )


          def validate_document(repo: Path, document: dict[str, Any]) -> dict[str, Any]:
              if document.get("schema_catalogo_regras") != SCHEMA:
                  raise RuleCatalogError("schema_catalogo_regras precisa ser 1")
              if document.get("natureza") != "indice_executavel":
                  raise RuleCatalogError("natureza do catálogo precisa ser indice_executavel")
              rules = document.get("regras")
              if not isinstance(rules, list) or not rules:
                  raise RuleCatalogError("regras precisa ser lista não vazia")

              current, target, hierarchy = _ruleset_contract(repo)
              known_rulesets = {current, target}
              seen_ids: set[str] = set()
              names: dict[str, str] = {}

              for position, rule in enumerate(rules, 1):
                  if not isinstance(rule, dict):
                      raise RuleCatalogError(f"regra #{position} precisa ser mapa")
                  missing = REQUIRED_FIELDS - set(rule)
                  if missing:
                      raise RuleCatalogError(
                          f"regra #{position} sem campos obrigatórios: {', '.join(sorted(missing))}"
                      )
                  rule_id = rule.get("id")
                  if not isinstance(rule_id, str) or not ID_RE.fullmatch(rule_id):
                      raise RuleCatalogError(f"id de regra inválido: {rule_id!r}")
                  if rule_id in seen_ids:
                      raise RuleCatalogError(f"id duplicado no catálogo: {rule_id}")
                  seen_ids.add(rule_id)

                  aliases = rule.get("aliases")
                  if not isinstance(aliases, list) or not all(
                      isinstance(alias, str) and alias.strip() for alias in aliases
                  ):
                      raise RuleCatalogError(f"{rule_id}: aliases precisa ser lista textual")
                  for label in [rule_id, *aliases]:
                      normalized = core.normalize(label)
                      if not normalized:
                          raise RuleCatalogError(f"{rule_id}: alias vazio após normalização")
                      owner = names.get(normalized)
                      if owner is not None:
                          raise RuleCatalogError(
                              f"alias duplicado ou ambíguo: {label!r} pertence a {owner} e {rule_id}"
                          )
                      names[normalized] = rule_id

                  domain = rule.get("dominio")
                  if not isinstance(domain, str) or not ID_RE.fullmatch(domain):
                      raise RuleCatalogError(f"{rule_id}: dominio inválido")

                  rule_ruleset = rule.get("ruleset")
                  if rule_ruleset not in known_rulesets:
                      raise RuleCatalogError(f"{rule_id}: ruleset desconhecido: {rule_ruleset}")
                  if rule_ruleset != current:
                      raise RuleCatalogError(
                          f"{rule_id}: conflito de versão; catálogo operacional usa {current}, não {rule_ruleset}"
                      )

                  authority = rule.get("autoridade")
                  if authority not in hierarchy:
                      raise RuleCatalogError(f"{rule_id}: autoridade desconhecida: {authority}")
                  if rule.get("executor") not in EXECUTORS:
                      raise RuleCatalogError(f"{rule_id}: executor desconhecido: {rule.get('executor')}")
                  if rule.get("persistencia") not in PERSISTENCE:
                      raise RuleCatalogError(
                          f"{rule_id}: persistência desconhecida: {rule.get('persistencia')}"
                      )

                  summary = rule.get("resumo_interno")
                  if not isinstance(summary, str) or not summary.strip() or len(summary) > 900:
                      raise RuleCatalogError(f"{rule_id}: resumo_interno ausente ou grande demais")
                  house_rule = rule.get("house_rule")
                  if house_rule is not None and (
                      not isinstance(house_rule, str) or not ID_RE.fullmatch(house_rule)
                  ):
                      raise RuleCatalogError(f"{rule_id}: house_rule precisa ser id ou null")
                  source = rule.get("fonte")
                  if not isinstance(source, dict):
                      raise RuleCatalogError(f"{rule_id}: fonte precisa ser mapa")
                  _find_section(repo, source)

              contract = document.get("contrato") or {}
              if not isinstance(contract, dict):
                  raise RuleCatalogError("contrato do catálogo precisa ser mapa")
              if contract.get("nivel_consulta_catalogada") != "L2":
                  raise RuleCatalogError("consulta catalogada precisa permanecer L2")
              if int(contract.get("max_resultado_l2_bytes", 0)) > core.DEFAULT_MAX_BYTES:
                  raise RuleCatalogError("orçamento do catálogo excede o teto L2")
              return document


          def load_catalog(repo: Path) -> dict[str, Any]:
              return validate_document(repo, read_document(repo))


          def resolve_rule(document: dict[str, Any], term: str) -> tuple[dict[str, Any] | None, list[str]]:
              query = core.normalize(term)
              index: dict[str, dict[str, Any]] = {}
              for rule in document["regras"]:
                  for label in [rule["id"], *rule["aliases"]]:
                      index[core.normalize(label)] = rule
              if query in index:
                  return index[query], []
              tokens = set(query.split())
              ranked: list[tuple[int, str]] = []
              for rule in document["regras"]:
                  labels = [rule["id"], *rule["aliases"]]
                  normalized = [core.normalize(label) for label in labels]
                  score = 20 if query and any(query in label for label in normalized) else 0
                  score += max([len(tokens & set(label.split())) for label in normalized] or [0])
                  if score:
                      ranked.append((score, rule["id"]))
              ranked.sort(key=lambda item: (-item[0], item[1]))
              return None, [rule_id for _, rule_id in ranked[:6]]


          def command_rule(
              repo: Path,
              term: str,
              *,
              fallback: Callable[[Path, str], dict[str, Any]] | None = None,
          ) -> dict[str, Any]:
              document = load_catalog(repo)
              rule, candidates = resolve_rule(document, term)
              if rule is None:
                  if fallback is None:
                      return core.envelope(
                          "regra", term, "L2",
                          [CATALOG_PATH.as_posix(), CAMPAIGN_PATH.as_posix()],
                          {"encontrado": False, "catalogada": False, "candidatos_catalogo": candidates},
                      )
                  data = fallback(repo, term)
                  result = data.get("resultado")
                  if isinstance(result, dict):
                      result["catalogada"] = False
                      result["candidatos_catalogo"] = candidates
                  sources = [CATALOG_PATH.as_posix(), *list(data.get("fontes") or [])]
                  data["fontes"] = list(dict.fromkeys(sources))
                  return data

              documentation = _find_section(repo, rule["fonte"])
              result = {
                  "encontrado": True,
                  "catalogada": True,
                  "id": rule["id"],
                  "aliases": list(rule["aliases"]),
                  "dominio": rule["dominio"],
                  "ruleset": rule["ruleset"],
                  "autoridade": rule["autoridade"],
                  "executor": rule["executor"],
                  "persistencia": rule["persistencia"],
                  "house_rule": rule["house_rule"],
                  "resumo_interno": rule["resumo_interno"],
                  "fonte": dict(rule["fonte"]),
                  "documentacao": documentation,
              }
              return core.envelope(
                  "regra", term, "L2",
                  [CATALOG_PATH.as_posix(), CAMPAIGN_PATH.as_posix(), documentation["arquivo"]],
                  result,
              )


          def check(repo: Path) -> dict[str, Any]:
              try:
                  document = load_catalog(repo)
                  current, _, _ = _ruleset_contract(repo)
              except (RuleCatalogError, OSError, yaml.YAMLError) as exc:
                  return {"ok": False, "erros": [str(exc)], "regras": 0}
              return {
                  "ok": True,
                  "erros": [],
                  "regras": len(document["regras"]),
                  "ruleset": current,
                  "nivel_consulta": "L2",
              }
          '''
          Path("ferramentas/catalogo_regras.py").write_text(textwrap.dedent(module).lstrip(), encoding="utf-8")

          tests = r'''
          from __future__ import annotations

          import copy
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).parents[1]
          TOOLS = ROOT / "ferramentas"
          if str(TOOLS) not in sys.path:
              sys.path.insert(0, str(TOOLS))

          import catalogo_regras
          import contexto


          class RulesCatalogContractTest(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.document = catalogo_regras.read_document(ROOT)

              def test_catalogo_real_e_valido_e_marca_task2(self) -> None:
                  result = catalogo_regras.check(ROOT)
                  self.assertTrue(result["ok"], result["erros"])
                  self.assertGreaterEqual(result["regras"], 5)
                  campaign = contexto.load_yaml(ROOT / "campanha.yaml")
                  requirements = campaign["sistema"]["ruleset"]["migracao"]["ativacao"]["requisitos"]
                  self.assertTrue(requirements["task_2_catalogo"])

              def test_ids_duplicados_falham(self) -> None:
                  document = copy.deepcopy(self.document)
                  document["regras"].append(copy.deepcopy(document["regras"][0]))
                  with self.assertRaisesRegex(catalogo_regras.RuleCatalogError, "id duplicado"):
                      catalogo_regras.validate_document(ROOT, document)

              def test_alias_duplicado_ou_ambiguo_falha(self) -> None:
                  document = copy.deepcopy(self.document)
                  document["regras"][1]["aliases"].append("furtividade")
                  with self.assertRaisesRegex(catalogo_regras.RuleCatalogError, "alias duplicado"):
                      catalogo_regras.validate_document(ROOT, document)

              def test_fonte_inexistente_falha_fechado(self) -> None:
                  document = copy.deepcopy(self.document)
                  document["regras"][0]["fonte"]["arquivo"] = "regras/nao-existe.md"
                  with self.assertRaisesRegex(catalogo_regras.RuleCatalogError, "fonte inexistente"):
                      catalogo_regras.validate_document(ROOT, document)

              def test_conflito_de_versao_nao_promove_5_5e_antes_do_gate(self) -> None:
                  document = copy.deepcopy(self.document)
                  document["regras"][0]["ruleset"] = "dnd_5_5e"
                  with self.assertRaisesRegex(catalogo_regras.RuleCatalogError, "conflito de versão"):
                      catalogo_regras.validate_document(ROOT, document)

              def test_regra_inexistente_preserva_fallback_textual(self) -> None:
                  data = contexto.command_rule(ROOT, "zzqvwx_rule_catalog_missing_314159")
                  self.assertFalse(data["resultado"]["encontrado"])
                  self.assertFalse(data["resultado"]["catalogada"])
                  self.assertIn("regras/catalogo.yaml", data["fontes"])

              def test_alias_furtividade_retorna_identidade_executor_e_autoridade(self) -> None:
                  data = contexto.command_rule(ROOT, "stealth")
                  result = data["resultado"]
                  self.assertTrue(result["encontrado"])
                  self.assertTrue(result["catalogada"])
                  self.assertEqual(data["nivel"], "L2")
                  self.assertEqual(result["id"], "furtividade_oposta")
                  self.assertEqual(result["ruleset"], "dnd_5e_2014")
                  self.assertEqual(result["autoridade"], "ruleset_atual")
                  self.assertEqual(result["executor"], "dados")
                  self.assertEqual(result["persistencia"], "nenhuma")
                  self.assertEqual(result["documentacao"]["titulo"], "Testes resistidos")
                  self.assertIn("Furtividade", result["documentacao"]["conteudo"])

              def test_retorno_catalogado_cabe_no_orcamento_l2(self) -> None:
                  data = contexto.command_rule(ROOT, "furtividade")
                  rendered, truncated = contexto.fit_budget(data, contexto.DEFAULT_MAX_BYTES, False)
                  self.assertFalse(truncated)
                  self.assertLessEqual(len(rendered.encode("utf-8")), contexto.DEFAULT_MAX_BYTES)
                  self.assertEqual(
                      data["fontes"],
                      ["regras/catalogo.yaml", "campanha.yaml", "regras/resolucao-de-acoes.md"],
                  )

              def test_documentacao_humana_e_ancora_obrigatoria(self) -> None:
                  document = copy.deepcopy(self.document)
                  document["regras"][0]["fonte"]["secao"] = "Seção que não existe"
                  with self.assertRaisesRegex(catalogo_regras.RuleCatalogError, "seção humana inexistente"):
                      catalogo_regras.validate_document(ROOT, document)


          if __name__ == "__main__":
              unittest.main()
          '''
          Path("tests/test_rules_catalog.py").write_text(textwrap.dedent(tests).lstrip(), encoding="utf-8")

          campaign_path = Path("campanha.yaml")
          campaign = campaign_path.read_text(encoding="utf-8")
          campaign = campaign.replace('          task_2_catalogo: false\n', '          task_2_catalogo: true\n', 1)
          campaign = campaign.replace(
              '    regras_e_fontes: "regras/fontes.md"\n',
              '    regras_e_fontes: "regras/fontes.md"\n    catalogo_regras: "regras/catalogo.yaml"\n',
              1,
          )
          campaign_path.write_text(campaign, encoding="utf-8")

          context_path = Path("ferramentas/contexto.py")
          context = context_path.read_text(encoding="utf-8")
          context = context.replace('import contexto_core as core\n', 'import contexto_core as core\nimport catalogo_regras\n', 1)
          context = context.replace('command_rule = core.command_rule\n', '', 1)
          marker = 'def command_reputation(repo: Path, term: str, public: str | None = None) -> dict[str, Any]:\n'
          wrapper = 'def command_rule(repo: Path, term: str) -> dict[str, Any]:\n    return catalogo_regras.command_rule(repo, term, fallback=core.command_rule)\n\n\n'
          if marker not in context:
              raise SystemExit("command_reputation marker not found")
          context = context.replace(marker, wrapper + marker, 1)
          context = context.replace(
              '("regra", "L2: trechos das regras internas sobre um assunto"),',
              '("regra", "L2 catalogada: identidade, versão, autoridade, executor e documentação da regra"),',
              1,
          )
          context_path.write_text(context, encoding="utf-8")

          agent_path = Path("docs/agente/regras-e-rolagens.md")
          agent = agent_path.read_text(encoding="utf-8")
          marker = '## Filosofia de fidelidade: aproximadamente 70%\n'
          section = '''## Catálogo executável de regras\n\n`regras/catalogo.yaml` é o índice mecânico dirigido introduzido pela Task 2. Ele não substitui os manuais humanos nem muda a hierarquia da Task 1: cada entrada identifica `id`, aliases, domínio, ruleset, autoridade, fonte humana, resumo interno, executor, persistência e eventual regra da casa.\n\nPara dúvida mecânica conhecida, `contexto regra <termo>` consulta primeiro esse catálogo. Um acerto por `id` ou alias retorna em L2 a identidade da regra, o `ruleset` aplicável, sua autoridade, quem a executa e a seção humana que documenta a decisão. A fonte declarada precisa existir e a seção precisa continuar presente; divergência faz o catálogo falhar fechado.\n\nEnquanto a cobertura do catálogo não for completa, termo não catalogado preserva o fallback textual anterior em `regras/*.md`, explicitamente marcado como `catalogada: false`. Esse fallback não ganha versão, executor ou autoridade por inferência. D&D 5.5e continua proibido como regra operacional enquanto `ruleset.atual` for `dnd_5e_2014`.\n\n'''
          if marker not in agent:
              raise SystemExit("agent rules marker not found")
          agent_path.write_text(agent.replace(marker, section + marker, 1), encoding="utf-8")

          sources_path = Path("regras/fontes.md")
          sources = sources_path.read_text(encoding="utf-8")
          marker = '## Regra geral\n'
          section = '''## Catálogo estruturado de regras\n\n`regras/catalogo.yaml` é um **índice executável**, não uma nova fonte de autoridade. Ele resolve IDs e aliases e declara, para cada regra catalogada, o ruleset, a autoridade, o executor, a persistência e a seção humana que documenta o resumo interno.\n\nToda entrada precisa apontar para arquivo Markdown existente em `regras/` e para uma seção real desse arquivo. O catálogo não pode promover uma regra de `dnd_5_5e` enquanto `campanha.yaml` mantiver `dnd_5e_2014` como ruleset atual. Se houver conflito, vale a hierarquia mecânica abaixo; o catálogo deve falhar em vez de escolher uma versão silenciosamente.\n\nTermos ainda não catalogados podem usar temporariamente a busca textual legada. Esse fallback existe apenas para compatibilidade durante a migração e não deve inventar versão, executor ou autoridade que o catálogo ainda não declarou.\n\n---\n\n'''
          if marker not in sources:
              raise SystemExit("sources rule marker not found")
          sources_path.write_text(sources.replace(marker, section + marker, 1), encoding="utf-8")
          PY

      - name: Validate Task 2
        run: |
          python -m unittest tests.test_rules_catalog -v
          python -m unittest tests.test_contexto tests.test_ruleset_migration_contract -v
          git diff --check

      - name: Commit functional changes
