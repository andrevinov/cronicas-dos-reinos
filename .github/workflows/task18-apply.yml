    fragments = {}
    weighted = []
    for weight, category in enumerate(plan["categorias_ponderadas"]):
        for template in _eligible_templates(tables, category, tier):
            value = text(template.get("valor_aproximado"), f"{template['id']}.valor_aproximado")
