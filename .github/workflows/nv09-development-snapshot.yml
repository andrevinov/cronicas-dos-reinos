name: NV09 development snapshot
on:
  push:
    branches: [feat/nv-09-contatos-efetivos]
    paths: [.github/workflows/nv09-development-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c3dd7c5e84b06b1304223281f92087b4dff2ae8
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/nv09-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nv09-source
          path: /tmp/nv09-source.tar.gz
          retention-days: 1
