name: Task 21 telemetry patch

on:
  push:
    branches:
      - task/unified-cronica-turn-cli

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/unified-cronica-turn-cli
          fetch-depth: 0
      - name: Teach rollout telemetry about cronica
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'ferramentas/analisar-rollout.py',
              '''WRITE_MARKERS = (\n    "turno.py registrar",\n''',
              '''WRITE_MARKERS = (\n    "turno.py registrar",\n    "cronica.py concluir",\n    "cronica.py registrar",\n    "cronica.py confirmar",\n    "cronica concluir",\n    "cronica registrar",\n    "cronica confirmar",\n''',
          )
          replace(
              'ferramentas/analisar-rollout.py',
              '''    if "turno.py registrar" in lower:\n        paths.extend(["sessoes/NNN/transcricao.md", "runtime/eventos-pendentes.jsonl"])\n''',
              '''    if (\n        "turno.py registrar" in lower\n        or "cronica.py concluir" in lower\n        or "cronica.py registrar" in lower\n        or "cronica concluir" in lower\n        or "cronica registrar" in lower\n    ):\n        paths.extend(["sessoes/NNN/transcricao.md", "runtime/eventos-pendentes.jsonl"])\n''',
          )

          marker = '''    def test_batch_context_search_is_detected_as_l3(self):\n'''
          addition = '''    def test_cronica_mutacoes_sao_writers_e_preparar_nao_e(self):\n        writers = [\n            "python3 ferramentas/cronica.py concluir --ticket abc",\n            "python3 ferramentas/cronica.py registrar --ticket abc",\n            "python3 ferramentas/cronica.py confirmar --ticket abc",\n            "poetry run cronica concluir --ticket abc",\n            "cronica registrar --ticket abc",\n        ]\n        for command in writers:\n            with self.subTest(command=command):\n                raw = json.dumps({"cmd": command})\n                self.assertEqual(mod._classify_tool("exec_command", raw), "write")\n        prepare = json.dumps({"cmd": "cronica preparar --cena-id x"})\n        self.assertNotEqual(mod._classify_tool("exec_command", prepare), "write")\n\n    def test_cronica_concluir_e_registrar_inferem_alvos_do_turno(self):\n        for command in (\n            "cronica concluir --ticket abc",\n            "python3 ferramentas/cronica.py registrar --ticket abc",\n        ):\n            with self.subTest(command=command):\n                raw = json.dumps({"cmd": command})\n                self.assertEqual(\n                    mod._infer_write_paths("exec_command", raw),\n                    ["sessoes/NNN/transcricao.md", "runtime/eventos-pendentes.jsonl"],\n                )\n\n'''
          p = Path('tests/test_analisar_rollout.py')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('test_analisar_rollout.py: insertion marker mismatch')
          p.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          for file in ('ferramentas/analisar-rollout.py', 'tests/test_analisar_rollout.py'):
              compile(Path(file).read_text(encoding='utf-8'), file, 'exec')
          PY
          git diff --check
      - name: Commit telemetry integration and remove workflow
        run: |
          git rm .github/workflows/task21-telemetry-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ferramentas/analisar-rollout.py tests/test_analisar_rollout.py
          git commit -m 'Task 21: reconhecer cronica na telemetria de rollouts'
          git push origin HEAD:task/unified-cronica-turn-cli
