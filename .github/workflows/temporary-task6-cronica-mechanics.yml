name: Temporary Task 6 cronica mechanics

on:
  push:
    branches:
      - task/cronica-mechanics-integration

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/cronica-mechanics-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Apply Task 6
        run: |
          if grep -q 'task_6_integracao_cronica: true' campanha.yaml && grep -q 'import mecanica_cronica as _mechanics' ferramentas/cronica.py; then
            echo 'Task 6 already applied'
          else
            python .github/task6_apply.py
          fi
          python - <<'PY'
          from pathlib import Path

          # O contrato público neutro precisa permanecer exatamente como antes.
          cronica = Path('ferramentas/cronica.py')
          text = cronica.read_text(encoding='utf-8')
          injected = '''    fields = contract.get("campos")
    if isinstance(fields, dict):
        fields["mecanica"] = {
            "resolucoes": (
                "somente quando a preparação devolver mecanica.obrigacoes; uma resolução "
                "estruturada por obrigação, antes dos deltas mecânicos"
            )
        }
    contract["causalidade_mecanica_task6"] = (
        "Deltas de Ki/Focus e efeitos declarados no ticket exigem resolução compatível; "
        "cronica valida pelo núcleo mecânico antes do writer."
    )
'''
          text = text.replace(injected, '')
          cronica.write_text(text, encoding='utf-8')

          # Corrige a leitura do baseline no teste novo (layout real do artefato).
          path = Path('tests/test_cronica_mecanica.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'budget["orcamento"]["chamadas_operacionais_por_turno"]',
              'budget["fluxo_preferencial"]["chamadas_operacionais_por_turno"]',
          )
          text = text.replace(
              'budget["orcamento"]["novos_endpoints_deterministicos_max"]',
              'budget["limites"]["max_endpoints_novos"]',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Targeted tests
        run: |
          python -m unittest discover -s tests -p 'test_cronica_mecanica.py'
          python -m unittest discover -s tests -p 'test_cronica_cli.py'
          python -m unittest discover -s tests -p 'test_cronica_hotpath_rollout.py'
          python -m unittest discover -s tests -p 'test_cronica_transito_urbano.py'
          python -m unittest discover -s tests -p 'test_task46_integration_transaction.py'
          python -m unittest discover -s tests -p 'test_task46_budget_regression.py'
          python -m unittest discover -s tests -p 'test_task47_explicit_opportunity_decision_gate.py'
          python -m unittest discover -s tests -p 'test_rules_catalog.py'
          python -m unittest discover -s tests -p 'test_mecanica_dnd_5_5e.py'
      - name: Full unit suite
        run: python -m unittest discover -s tests
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanha.yaml docs/agente/regras-e-rolagens.md ferramentas/README.md ferramentas/cronica.py regras/catalogo.yaml regras/resolucao-de-acoes.md ferramentas/mecanica_cronica.py tests/test_cronica_mecanica.py
          if git diff --cached --quiet; then
            echo 'No functional changes to commit'
          else
            git commit -m 'feat: bind mechanics to cronica tickets'
            git push origin HEAD:task/cronica-mechanics-integration
          fi
