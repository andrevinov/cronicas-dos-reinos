name: Temporary Task 8 activation v2

on:
  push:
    branches:
      - task/activate-5-5e

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/activate-5-5e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Apply Task 8 cutover if needed
        run: |
          if grep -q 'task_8_auditoria_final: true' campanha.yaml && test -f ferramentas/ruleset_5_5e.py; then
            echo 'Task 8 functional cutover already committed.'
          else
            python .github/task8_prepatch.py
            python .github/task8_apply.py
            python .github/task8_postpatch.py
          fi
      - name: Regenerate derived runtime
        run: |
          python ferramentas/gerar-runtime.py
          python ferramentas/sessoes.py bootstrap-atual
      - name: Guard historical surfaces
        run: |
          git fetch origin main
          git diff --name-only origin/main > /tmp/base-files
          git diff --name-only >> /tmp/base-files
          sort -u /tmp/base-files > /tmp/changed-files
          cat /tmp/changed-files
          if grep -E '^(historico/|sessoes/[0-9]{3}/(transcricao\.md|consolidacoes\.jsonl)$|personagens/jogador/conhecimento/(descobertas|incrementais|topicos)/)' /tmp/changed-files; then
            echo 'Historical/canonical cold files changed unexpectedly.'
            exit 1
          fi
      - name: Task 8 consistency gate
        run: python ferramentas/ruleset_5_5e.py check
      - name: Targeted activation tests
        run: |
          python -m unittest discover -s tests -p 'test_ruleset_migration_contract.py' -v
          python -m unittest discover -s tests -p 'test_migracao_ren_5_5e.py' -v
          python -m unittest discover -s tests -p 'test_ruleset_5_5e_activation.py' -v
          python -m unittest discover -s tests -p 'test_cronica_mecanica.py' -v
          python -m unittest discover -s tests -p 'test_gate_adnd.py' -v
          python -m unittest discover -s tests -p 'test_consolidacao.py' -v
          python -m unittest discover -s tests -p 'test_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_unified_session_lifecycle.py' -v
      - name: Full unit suite
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-tests.log 2>&1
          code=$?
          tail -n 180 /tmp/full-tests.log
          exit $code
      - name: Full preflight
        run: python ferramentas/preflight.py
      - name: Commit functional cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/task8_apply.py .github/task8_prepatch.py .github/task8_postpatch.py .github/workflows/temporary-task8-audit.yml .github/workflows/temporary-task8-activate-v2.yml || true
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
          else
            git commit -m 'feat: activate D&D 5.5e ruleset'
            git push origin HEAD:task/activate-5-5e
          fi
