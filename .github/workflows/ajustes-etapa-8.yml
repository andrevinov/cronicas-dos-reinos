name: Limpeza do workflow descartável — Etapa 8

on:
  push:
    branches:
      - "refactor/context-economy-step-08"

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover este workflow temporário
        run: |
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git rm .github/workflows/ajustes-etapa-8.yml
          git commit -m "Remove workflow descartável da Etapa 8"
          git push
