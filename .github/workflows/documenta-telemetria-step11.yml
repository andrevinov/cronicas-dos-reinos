name: Documentação única de telemetria — Etapa 11

on:
  push:
    branches:
      - refactor/context-economy-step-11

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/context-economy-step-11
      - name: Alinhar documentação
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'padrão não encontrado em {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'AGENTS.md',
              '- pesquisa, região, retcon, edição, YAML, ferramentas, Git → `docs/agente/pesquisa-e-manutencao.md`.\n',
              '- pesquisa, região, retcon, edição, YAML, ferramentas, Git → `docs/agente/pesquisa-e-manutencao.md`;\n- telemetria, rollout, benchmark e economia medida → `docs/agente/telemetria-rollouts.md`.\n',
          )
          replace_once(
              'AGENTS.md',
              '- não executar `git status`, `git diff`, commit, auditoria ampla ou suíte global por rotina;\n',
              '- não executar `git status`, `git diff`, commit, auditoria ampla ou suíte global por rotina;\n- não executar `analisar-rollout.py`, `comparar-rollouts.py` ou criar telemetria durante o avanço; medição é pós-hoc;\n',
          )

          replace_once(
              'docs/agente/acesso-e-operacoes.md',
              'Política formal de níveis e orçamentos: `docs/agente/escada-de-acesso.md`. Consolidação profunda: `docs/agente/consolidacao-transacional.md`. Memória de sessões: `docs/agente/memoria-de-sessoes.md`.',
              'Política formal de níveis e orçamentos: `docs/agente/escada-de-acesso.md`. Consolidação profunda: `docs/agente/consolidacao-transacional.md`. Memória de sessões: `docs/agente/memoria-de-sessoes.md`. Telemetria pós-hoc: `docs/agente/telemetria-rollouts.md`.',
          )
          replace_once(
              'docs/agente/acesso-e-operacoes.md',
              'Durante narração comum, o alvo é permanecer em L0–L2. Toda saída de `contexto.py` traz `controle_acesso.pare_se_suficiente: true` e a condição de parada do nível.\n',
              'Durante narração comum, o alvo é permanecer em L0–L2. Toda saída de `contexto.py` traz `controle_acesso.pare_se_suficiente: true` e a condição de parada do nível.\n\nObservabilidade não cria trabalho no turno: `contexto.py` não grava telemetria local por padrão e os rollouts são analisados somente depois da sessão. Para diagnóstico explícito, `--log-local` habilita o pequeno log local.\n',
          )

          replace_once(
              'ferramentas/README.md',
              'Telemetria opcional grava somente metadados em `runtime/consultas-contexto.jsonl`; desabilitar com `--sem-log`.\n',
              'Telemetria local fica **desligada por padrão**. Para um diagnóstico pontual, use `--log-local`; o arquivo `runtime/consultas-contexto.jsonl` continua local/ignorado. A medição normal é pós-hoc pelo rollout nativo.\n',
          )
          replace_once(
              'ferramentas/README.md',
              '- **Etapa 10:** escada executável, `--apos`/`--motivo`, saltos dirigidos e tetos por nível.\n',
              '- **Etapa 10:** escada executável, `--apos`/`--motivo`, saltos dirigidos e tetos por nível;\n- **Etapa 11:** telemetria pós-hoc, comparação antes/depois, metas mensuráveis e zero logging local por padrão.\n',
          )
          old = '''## Análise de rollouts do Codex\n\n```bash\npython3 ferramentas/analisar-rollout.py ~/.codex/sessions/.../rollout-....jsonl\npython3 ferramentas/analisar-rollout.py ~/.codex/sessions/.../rollout-....jsonl --json\n```\n\nA baseline pré-refatoração está em `baseline/rollout-2026-08-15.json`; baselines específicas ficam em `baseline/memoria-sessoes-step-09.md` e `baseline/escada-acesso-step-10.md`.'''
          new = '''## Telemetria pós-hoc de rollouts\n\nNão medir dentro do loop narrativo. Depois da sessão:\n\n```bash\npython3 ferramentas/analisar-rollout.py ~/.codex/sessions/.../rollout-....jsonl\npython3 ferramentas/analisar-rollout.py ~/.codex/sessions/.../rollout-....jsonl --json\n```\n\nComparação automática com a baseline de 15/08:\n\n```bash\npython3 ferramentas/comparar-rollouts.py ~/.codex/sessions/.../rollout-novo.jsonl\n```\n\nVárias sessões podem ser agregadas passando vários arquivos. O comparador normaliza por avanço narrativo e mostra input bruto, não-cache aproximado, inferências, tools, leituras/escritas, transcript e distribuição L0–L4T.\n\nArquivos de referência:\n\n- `baseline/rollout-2026-08-15.json`;\n- `baseline/metas-rollout-pos-refatoracao.json`;\n- `baseline/telemetria-step-11.md`;\n- `docs/agente/telemetria-rollouts.md`.\n\nRedução de tokens é tratada como tráfego operacional, não como fórmula de cobrança/quota.'''
          replace_once('ferramentas/README.md', old, new)
          PY
      - name: Publicar e remover workflow temporário
        run: |
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git rm .github/workflows/documenta-telemetria-step11.yml
          git add AGENTS.md docs/agente/acesso-e-operacoes.md ferramentas/README.md
          git commit -m "Alinha documentação à telemetria pós-hoc"
          git push origin HEAD:refactor/context-economy-step-11
