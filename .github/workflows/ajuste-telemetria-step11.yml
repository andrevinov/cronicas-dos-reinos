name: Ajuste único de telemetria — Etapa 11

on:
  push:
    branches:
      - refactor/context-economy-step-11

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/context-economy-step-11
      - name: Corrigir alvos observados
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ferramentas/analisar-rollout.py')
          s = p.read_text(encoding='utf-8')
          old = '''    paths = _paths(raw_input)\n    if name == "apply_patch" or "*** begin patch" in raw_input.lower():\n        patch_paths = PATCH_FILE_RE.findall(raw_input)\n        if patch_paths:\n            paths = list(dict.fromkeys(paths + patch_paths))\n'''
          new = '''    paths = [\n        path for path in _paths(raw_input)\n        if not (path.startswith("ferramentas/") and path.endswith(".py"))\n    ]\n    if name == "apply_patch" or "*** begin patch" in raw_input.lower():\n        patch_paths = PATCH_FILE_RE.findall(raw_input)\n        if patch_paths:\n            paths = list(dict.fromkeys(patch_paths))\n'''
          if old not in s:
              raise SystemExit('bloco _infer_write_paths não encontrado')
          s = s.replace(old, new, 1)
          old2 = '''                    mentioned = _paths(raw_input)\n                    if category == "read_search":\n'''
          new2 = '''                    mentioned = [\n                        path for path in _paths(raw_input)\n                        if not (path.startswith("ferramentas/") and path.endswith(".py"))\n                    ]\n                    if category == "read_search":\n'''
          if old2 not in s:
              raise SystemExit('bloco de caminhos observados não encontrado')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar correção e remover workflow temporário
        run: |
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git rm .github/workflows/ajuste-telemetria-step11.yml
          git add ferramentas/analisar-rollout.py
          git commit -m "Corrige contagem de alvos da telemetria"
          git push origin HEAD:refactor/context-economy-step-11
