name: Temporary fix Task 2 missing-rule fixture

on:
  push:
    branches:
      - task/rules-catalog

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/rules-catalog
          fetch-depth: 0
      - name: Patch fixture and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-task2-rules-catalog.yml')
          text = path.read_text(encoding='utf-8')
          old = 'regra-que-nao-existe-task2'
          new = 'zzqvwx_rule_catalog_missing_314159'
          if old not in text:
              raise SystemExit('missing-rule fixture marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-fix-task2-test.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: isolate missing rule lookup"
          git push origin HEAD:task/rules-catalog
