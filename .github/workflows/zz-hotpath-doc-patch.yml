name: Patch hotpath session protocol

on:
  push:
    branches: [fix/rollout-cronica-hot-path]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rollout-cronica-hot-path
      - name: Alinhar protocolo e remover este workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('narracao/protocolo-de-sessao.md')
          text = path.read_text(encoding='utf-8')

          old = '''Para reconstruir continuidade e produzir o recap, usar primeiro:

```bash
python3 ferramentas/contexto.py retomada
```

Se precisar de uma sessão específica:

```bash
python3 ferramentas/contexto.py sessao 2
```
'''
          new = '''`cronica sessao status` e `cronica sessao iniciar` já devolvem um bloco `retomada`; `iniciar` também devolve `recap_sessao_anterior`. Use esses blocos primeiro. Eles projetam data/hora/localização atuais e resumos explícitos de pending/ledger/handoff sem abrir transcrição e sem carregar prosa temporal envelhecida.

Se esses blocos responderem à lacuna, **pare**: não chamar `contexto.py retomada`, não abrir handoff cru e não ler implementação para reconstruir o mesmo presente. `contexto.py sessao <N>` continua disponível somente quando faltar um fato histórico específico.
'''
          if old not in text:
              raise SystemExit('bloco de abertura esperado não encontrado')
          text = text.replace(old, new, 1)

          old = '''O hot path usa **duas chamadas operacionais**. Antes de resolver/publicar o turno:

```bash
poetry run cronica preparar --cena-id <id-estavel> ...
```

Guardar o `ticket` retornado. Depois que a narração estiver aceita, concluir por stdin:
'''
          new = '''O hot path usa **duas chamadas de orquestração**. Um turno comum sem gatilho reativo pode usar somente:

```bash
poetry run cronica preparar --cena-id <id-estavel>
```

Isso emite ticket neutro: não inventar tag/local/NPC. Quando houver entrada/exploração real, novo encontro ou tag contextual já pertinente, acrescente apenas esses gatilhos. A saída de `preparar` traz `contrato_conclusao` com o JSON exato; não chamar `--help` nem abrir código-fonte para redescobri-lo. Depois que a narração estiver aceita, concluir por stdin:
'''
          if old not in text:
              raise SystemExit('bloco de hot path esperado não encontrado')
          text = text.replace(old, new, 1)

          old = '''`cronica concluir` recusa `jogador` contendo OFF ou RECALL não resolvido antes da escrita, revalida/confirma a preparação e usa o registrador transacional existente. A suboperação de registro mantém a prosa completa apenas em `sessoes/NNN/transcricao.md` e o resumo/deltas em `runtime/eventos-pendentes.jsonl`; a confirmação reativa pode materializar somente os efeitos já previstos pela preparação.
'''
          new = '''`cronica concluir` recusa `jogador` contendo OFF ou RECALL não resolvido antes da escrita. Ticket reativo revalida/confirma e registra; ticket neutro pré-valida e registra sem fabricar confirmação. Mecânica explícita na narração usa linha própria iniciada por `MECÂNICA — `. A prosa completa fica em `sessoes/NNN/transcricao.md` e resumo/deltas em `runtime/eventos-pendentes.jsonl`.
'''
          if old not in text:
              raise SystemExit('bloco de conclusão esperado não encontrado')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/zz-hotpath-doc-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add narracao/protocolo-de-sessao.md .github/workflows/zz-hotpath-doc-patch.yml
          git commit -m 'Docs: alinhar protocolo de sessão ao hot path observado'
          git push origin HEAD:fix/rollout-cronica-hot-path
