name: Preparação única do contexto core — Etapa 7

on:
  push:
    branches:
      - "refactor/context-economy-step-07"

permissions:
  contents: write

jobs:
  preparar:
    if: ${{ !contains(github.event.head_commit.message, '[contexto-core-v1]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Separar núcleo de consulta
        run: |
          if [ ! -f ferramentas/contexto_core.py ]; then
            cp ferramentas/contexto.py ferramentas/contexto_core.py
          fi

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain -- ferramentas/contexto_core.py)" ]; then
            echo "Núcleo já existe."
            exit 0
          fi
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git add -f ferramentas/contexto_core.py
          git commit -m "Separa núcleo de contexto [contexto-core-v1]"
          git push
