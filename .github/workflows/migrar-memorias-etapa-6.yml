name: Migração única das memórias — Etapa 6

on:
  push:
    branches:
      - "refactor/context-economy-step-06"

permissions:
  contents: write

jobs:
  migrar:
    if: ${{ !contains(github.event.head_commit.message, '[memorias-v1-migradas]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Fragmentar relações, NPCs e conhecimento
        run: python ferramentas/migrar-memorias-fragmentadas.py

      - name: Verificar reconstrução e preservação
        run: python ferramentas/migrar-memorias-fragmentadas.py --check

      - name: Commit da migração
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nenhuma mudança pendente."
            exit 0
          fi
          git config user.name "André Carvalho"
          git config user.email "me@andrev.me"
          git add estado/ personagens/jogador/conhecimento.md personagens/jogador/conhecimento/ historico/
          git commit -m "Fragmenta memórias acumulativas [memorias-v1-migradas]"
          git push
