name: Capture access ladder debug

on:
  push:
    branches: [fix/rollout-cronica-hot-path]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rollout-cronica-hot-path
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Capturar
        shell: bash
        run: |
          set +e
          out=docs/.debug-access.txt
          : > "$out"
          runprobe() {
            label="$1"; shift
            echo "==> $label" >> "$out"
            "$@" >> "$out" 2>&1
            echo "rc=$?" >> "$out"
          }
          runprobe politica test -f ferramentas/politica_acesso.py
          runprobe doc test -f docs/agente/escada-de-acesso.md
          runprobe baseline test -f baseline/escada-acesso-step-10.md
          runprobe marker_doc grep -q 'docs/agente/escada-de-acesso.md' AGENTS.md
          runprobe marker_l4t grep -q 'L4T' AGENTS.md
          runprobe marker_apos grep -q -- '--apos L2' AGENTS.md
          runprobe status python ferramentas/contexto.py --sem-log --max-bytes 16000 status
          echo "status_bytes=$(python ferramentas/contexto.py --sem-log --max-bytes 16000 status | wc -c)" >> "$out"
          runprobe cena python ferramentas/contexto.py --sem-log cena
          echo "cena_bytes=$(python ferramentas/contexto.py --sem-log cena | wc -c)" >> "$out"
          runprobe local python ferramentas/contexto.py --sem-log local 'casa de Iria Doss'
          echo "local_bytes=$(python ferramentas/contexto.py --sem-log local 'casa de Iria Doss' | wc -c)" >> "$out"
          runprobe l3_sem_motivo python ferramentas/contexto.py --sem-log buscar 'ponte baixa'
          runprobe l3 python ferramentas/contexto.py --sem-log buscar 'ponte baixa' --apos L2 --motivo 'As consultas dirigidas não localizaram o domínio da pista.'
          echo "l3_bytes=$(python ferramentas/contexto.py --sem-log buscar 'ponte baixa' --apos L2 --motivo 'As consultas dirigidas não localizaram o domínio da pista.' | wc -c)" >> "$out"
          runprobe l4_errado python ferramentas/contexto.py --sem-log buscar 'ponte baixa' --historico --apos L2 --motivo 'A busca corrente não resolveu a origem histórica necessária.'
          runprobe l4 python ferramentas/contexto.py --sem-log buscar 'ponte baixa' --historico --apos L3 --motivo 'A busca corrente não resolveu a origem histórica necessária.'
          echo "l4_bytes=$(python ferramentas/contexto.py --sem-log buscar 'ponte baixa' --historico --apos L3 --motivo 'A busca corrente não resolveu a origem histórica necessária.' | wc -c)" >> "$out"
          runprobe salto python ferramentas/contexto.py --sem-log sessao 2 --apos L2 --motivo 'A pergunta aponta diretamente para a sessão 002 e seu resumo.'
          cat "$out"
      - name: Persistir resultado e remover workflow
        if: always()
        run: |
          rm .github/workflows/zz-debug-access-ladder.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/.debug-access.txt .github/workflows/zz-debug-access-ladder.yml
          git commit -m 'ci: registrar diagnóstico temporário de acesso'
          git push origin HEAD:fix/rollout-cronica-hot-path
