    """Recorte L1: preserva semântica dos efeitos sem carregar prosa ilimitada."""
    if not isinstance(effects, dict) or not effects:
        return None
    result: dict[str, Any] = {}
    ordered = sorted(effects.items(), key=lambda item: str(item[0]))
    for effect_id, raw in ordered[:8]:
        if isinstance(raw, dict):
            compact: dict[str, Any] = {}
            for key, item in list(raw.items())[:8]:
                compact[str(key)] = compact_value(
                    item,
                    string_limit=120,
                    list_limit=3,
                    depth=2,
                )
            result[str(effect_id)] = compact
        else:
            result[str(effect_id)] = truncate_text(raw, 140)
    if len(ordered) > 8:
        result["_omitidos"] = len(ordered) - 8
    return result


def _status_context_view(context: dict[str, Any]) -> dict[str, Any]:
    """L1 estrutural pequeno mesmo quando há deltas pendentes reais."""
    result: dict[str, Any] = {}
    for key in ("sessao", "personagem", "recursos", "sobreposicao_transacional"):
        if key in context:
            result[key] = context[key]
    time = context.get("tempo")
    if isinstance(time, dict):
        result["tempo"] = {
            key: time.get(key)
            for key in ("data", "hora_aproximada")
            if key in time
        }
    location = context.get("localizacao")
    if isinstance(location, dict):
        result["localizacao"] = {
            key: location.get(key)
            for key in ("area", "ponto_exato")
            if key in location
        }
    effects = _status_effects_view(context.get("efeitos_temporarios"))
    if effects is not None:
        result["efeitos_temporarios"] = effects
    if "compromissos" in context:
        result["compromissos"] = compact_value(
            context["compromissos"],
            string_limit=140,
            list_limit=4,
            depth=4,
        )
    return result


