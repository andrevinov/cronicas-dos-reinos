name: Temporary apply Task 4 mechanics core v2

on:
  push:
    branches:
      - task/dnd-5-5e-mechanics-core

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/dnd-5-5e-mechanics-core
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Apply Task 4 with corrected structural splice
        run: |
          if grep -q 'task_4_nucleo_mecanico: true' campanha.yaml && [ -f ferramentas/mecanica_dnd_5_5e.py ]; then
            echo 'Task 4 already applied'
          else
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/task4_apply.py')
          text = path.read_text(encoding='utf-8')
          fixes = {
              'aliases + "REN_ABILITY_LABELS:"': 'aliases',
              'wrappers + "def format_dice_roll("': 'wrappers',
              'format_check + "def attack_result("': 'format_check',
              'attack_result + "def format_attack("': 'attack_result',
              'format_attack + "def current_mode("': 'format_attack',
          }
          for old, new in fixes.items():
              if old not in text:
                  raise SystemExit(f'patch marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            python .github/task4_apply.py
          fi

      - name: Targeted regression
        run: |
          python -m unittest discover -s tests -p 'test_mecanica_dnd_5_5e.py'
          python -m unittest discover -s tests -p 'test_ficha_ren.py'
          python -m unittest discover -s tests -p 'test_talentos_ren.py'
          python -m unittest discover -s tests -p 'test_qualidade_abordagem.py'
          python -m unittest discover -s tests -p 'test_rolar_lote.py'

      - name: Full unit suite
        run: python -m unittest discover -s tests

      - name: Commit functional changes
        run: |
          if git diff --quiet; then
            echo 'No functional changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campanha.yaml docs/agente/regras-e-rolagens.md ferramentas/README.md ferramentas/_rolar_dados_core.py ferramentas/rolar-dados.py ferramentas/mecanica_dnd_5_5e.py tests/test_mecanica_dnd_5_5e.py
          git commit -m 'feat: add D&D 5.5e mechanical core'
          git push origin HEAD:task/dnd-5-5e-mechanics-core
