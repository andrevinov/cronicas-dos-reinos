name: Task 15 minimal test fix

on:
  push:
    branches:
      - task/clandestine-neutralization-ren

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/clandestine-neutralization-ren
          fetch-depth: 0
      - name: Apply exactly one bundle expectation update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_arcos.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertEqual(len(by_id), 11)'
          new = '        self.assertEqual(len(by_id), 12)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy assertion, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- tests/test_arcos.py
      - name: Remove temporary workflow and commit minimal fix
        run: |
          git rm .github/workflows/task15-minimal-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_arcos.py
          git commit -m 'Task 15: ajustar bundle para 12 linhas sem remover regressões'
          git push origin HEAD:task/clandestine-neutralization-ren
