name: Temporary repair Task42 reservation

on:
  push:
    branches:
      - fix/checkpoint-ci-baseline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/checkpoint-ci-baseline
          fetch-depth: 0

      - name: Rebuild missing Task42 reservation through canonical engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()
          tools = root / "ferramentas"
          sys.path.insert(0, str(tools))

          import canon_bridge
          import mundo
          import oportunidades

          mission_id = "sqe-47ea56e74d59f1c0"
          index = oportunidades.load_index(root)
          state = oportunidades.load_state(root, index)
          mission = state["missoes"].get(mission_id)
          if not isinstance(mission, dict):
              raise SystemExit(f"missão inexistente: {mission_id}")
          if mission.get("estado") != "aceita":
              raise SystemExit(f"missão não está aceita: {mission.get('estado')}")

          accepted_at = mundo.parse_instant("19 Eleasis, 1372 DR", "20:00")
          plan = canon_bridge.prepare_lifecycle_transition(
              root, mission, "aceita", accepted_at
          )
          if not isinstance(plan, dict) or plan.get("acao") != "reservar":
              raise SystemExit(f"plano Task42 inesperado: {plan!r}")
          if plan.get("evento_id") != "halessa_admite_a_teia":
              raise SystemExit(f"evento Task42 inesperado: {plan.get('evento_id')}")
          if plan.get("modo") != "ponte":
              raise SystemExit(f"modo Task42 inesperado: {plan.get('modo')}")

          result = canon_bridge.apply_lifecycle_transition(root, plan)
          if not result.get("ok"):
              raise SystemExit(f"falha ao aplicar reserva: {result!r}")

          bridge = canon_bridge.load_state(root)
          reservation = bridge["reservas"].get("halessa_admite_a_teia")
          if not isinstance(reservation, dict):
              raise SystemExit("reserva Task42 não foi persistida")
          if reservation.get("mission_id") != mission_id:
              raise SystemExit("reserva Task42 aponta para missão divergente")
          print(result)

          Path(".github/workflows/temporary-repair-task42-reservation.yml").unlink()
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore Task42 reservation for accepted sidequest"
          git push origin HEAD:fix/checkpoint-ci-baseline
