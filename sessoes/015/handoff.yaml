eventos_recentes:
- batch: s015-cena-328b0f3973a10f60
  transacao: s015-7db7027ef8854e37
  resumo: Ren encontrou Silva no interior do circo e relatou toda a custódia, as conclusões sobre Masao e Kurobane,
    o acordo de contravigilância com Luath, a ausência de cauda detectada e o ferimento na briga. Silva confirmou
    que Nera e Tavin estão no circo e seguros até onde ela e o circo podem verificar, sem estranhos ou ameaça confirmada
    procurando por eles. Reconheceu a cautela de Ren e ofereceu examinar sua costela antes…
- batch: s015-cena-328b0f3973a10f60
  transacao: s015-7fbce3a1d7cbda64
  resumo: Ren aceitou o tratamento mundano de Silva. Ela diagnosticou uma contusão sem sinais de costela quebrada
    e aplicou compressa e faixa, sem recuperação imediata de PV. Silva autorizou Ren a visitar Nera e Tavin na carroça
    verde e informou que lhes dissera apenas que Ren estava vivo e sob custódia de Luath; o restante ficou para
    Ren contar.
- batch: s015-cena-328b0f3973a10f60
  transacao: s015-627e7732b8799369
  resumo: Ren foi à carroça verde e reencontrou Nera e Tavin após a noite inteira em que ambos permaneceram sem
    informação confirmada sobre seu paradeiro ou segurança. Nera o abraçou com alívio, expressou de forma direta
    o medo causado pelo desaparecimento e perguntou sobre a faixa nas costelas. Tavin abraçou Ren e perguntou se
    ele ficaria algum tempo. Ren ainda não contou a eles o que aconteceu.
- batch: s015-cena-96948cae75a7f1b8
  transacao: s015-dc248816f02604bc
  resumo: Ren contou a Nera e Tavin o básico sobre a prisão de Shinta, a falsificação documental, sua hipótese de
    envolvimento dos homens de Masao, a custódia de Luath e o ferimento na briga do circo. Nera distinguiu hipótese
    de prova e recusou a promessa absoluta de que Ren sempre voltaria, pedindo que ele mantenha o acordo de voltar
    quando puder, avisar quando não puder e contar a verdade ao retornar. Tavin perguntou se Ren…
- batch: s015-cena-96948cae75a7f1b8
  transacao: s015-f65fc2b7a7bbdf02
  resumo: Ren explicou a Nera que, se a falsificação tiver sido obra dos homens de Masao para retirar Shinta da
    Galeria, Tomas e seus colegas podem estar em perigo e precisam ser avisados. Nera aceitou a necessidade do aviso,
    mas perguntou como Ren pretende fazê-lo sem revelar a ligação entre Ren, Shinta, Tomas e o circo.
- batch: s015-cena-96948cae75a7f1b8
  transacao: s015-1a1bf3bcaf7923d2
  resumo: Ren decidiu procurar Tomas como Ren e explicar honestamente a necessidade da identidade de Shinta. Nera
    aceitou o plano, lembrando que honestidade com Tomas não exige revelar o abrigo dos Vell ou o circo. Ren permaneceu
    algum tempo entretendo Tavin com um jogo simples e depois chamou Nera, pelo olhar, para uma conversa privada
    do lado de fora da carroça. Nera aceitou e aguardou que Ren conduzisse a despedida.
- batch: s015-cena-96948cae75a7f1b8
  transacao: s015-468d35262c6b5157
  resumo: Ren e Nera tiveram uma despedida íntima e afetuosa atrás da carroça. Ren reafirmou seu amor e sua promessa
    absoluta de sempre voltar; Nera correspondeu ao amor, respondeu à provocação com humor e pediu apenas que ele
    voltasse, aceitando que descansasse antes de procurar Tomas. Ren abraçou Tavin e prometeu retornar à noite;
    Tavin perguntou se seria antes de dormir.
- batch: s015-cena-96948cae75a7f1b8
  transacao: s015-ad93ec5d17bfedb4
  resumo: Ren dormiu 1h30 e meditou por 30 minutos, completando descanso curto sem gastar Dado de Vida; manteve
    48/52 PV e recuperou o ki para 7/7. Vestiu-se como Ren, recuperou armas e o Broche do Semblante Humilde e deixou
    de estar desarmado. Seguiu por rota urbana nova, enfrentou apenas uma interrupção banal de passagem e chegou
    diante da Galeria dos Escribas às 17:35, sem ainda saber se Tomas está no interior.
