    Sombras, mas não determinou se há alguém nos pontos cegos.
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-8672e799ed760cf3
  resumo: Ren usou Passo das Sombras para entrar silenciosamente no sótão da antiga calaria. Detectou um fio de
    alarme na escada e sinais de pelo menos duas pessoas no andar inferior, sem ser percebido.
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-c3ed5029f3a33e37
  resumo: 'Ren se aproximou sem ser percebido e observou os dois ocupantes: um falsificador local e uma mulher de
    casaco cinza-azulado que também vigia os acessos. Não há guarda separado aparente. Ren ouviu confirmação de
    que a oficina produziu a ordem, pagou o mensageiro e espera que uma carroça use o documento ao amanhecer para
    levar os sete antes da resposta institucional.'
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-382f2d83f2bede52
  resumo: Ren surpreendeu os dois ocupantes, teleportou-se para trás do homem e acertou dois golpes não letais,
    causando 10 de dano, mas não o nocauteou. O homem gritou para a mulher queimar a matriz e, no início da segunda
    rodada, conseguiu agarrar Ren. É o turno de Ren; o homem está com 14/24 PV e a mulher ainda agirá depois dele.
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-9ba91955a29c616f
  resumo: Ren usou Passo das Sombras para escapar do agarrão e atacou a mulher duas vezes, causando 17 de dano não
    letal. Ela não é reconhecida como Kajiwara Shizune e permanece consciente com 3/20 PV. Ao tentar correr para
    a lamparina e a matriz, provoca um ataque de oportunidade; a reação de Ren está disponível.
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-82098718fd464d36
  resumo: Ren nocauteou a mulher com um ataque de oportunidade antes que ela alcançasse a mesa. Como não podia se
    deslocar durante a reação, o homem agiu primeiro na rodada seguinte e quebrou a lamparina sobre as provas. Os
    papéis começaram a queimar, mas a matriz ainda está visível e recuperável. É o turno de Ren.
- batch: s015-cena-8ff59a380b8dad15
  transacao: s015-cedae573fb3175e1
  resumo: Ren gastou 1 Ki em Passo do Vento, salvou a matriz e um conjunto documental útil e recuou sem provocar
    ataque. O homem acertou Ren com a besta por 7 de dano, mas Passos sem Pegadas foi mantido. No turno seguinte,
    Ren acertou um de dois golpes; o homem está com 6/24 PV. Ren tem 45/52 PV, 1/7 Ki e ainda pode usar a ação bônus
    para um golpe desarmado gratuito.
