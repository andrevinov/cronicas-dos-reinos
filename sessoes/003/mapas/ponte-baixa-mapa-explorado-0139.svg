<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Ponte Baixa - mapa explorado por Ren ate 01:39 de 7 Eleasis</title>
  <desc id="desc">Mapa tatico do trecho explorado por Ren na Ponte Baixa, indicando entrada, corredor baixo, camara seca de retencao, canal umido nao explorado, fenda de ar, corredor seco da direita, painel baixo e sala vista apenas pela fresta.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#2d2a23" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d8c36e"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#15140f"/>
  <rect width="1400" height="1000" fill="url(#grid)" opacity="0.65"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="72" fill="#f2e8c8" font-size="34" font-weight="700">Ponte Baixa - trecho explorado por Ren</text>
    <text x="72" y="108" fill="#b9ad8a" font-size="18">01:39 de 7 Eleasis, 1372 DR • Visão no Escuro ativa • Passos sem Pegadas ativo • Ki 2/6</text>

    <g transform="translate(70 145)" font-size="15">
      <rect x="0" y="0" width="1260" height="84" rx="8" fill="#201d16" stroke="#514936"/>
      <rect x="24" y="24" width="38" height="18" fill="#435f56" stroke="#8ed0ba"/>
      <text x="74" y="39" fill="#eee0bd">Explorado fisicamente por Ren</text>
      <rect x="302" y="24" width="38" height="18" fill="#3a2d1f" stroke="#d0a35f" stroke-dasharray="8 5"/>
      <text x="352" y="39" fill="#eee0bd">Visto parcialmente pela fresta</text>
      <rect x="606" y="24" width="38" height="18" fill="#1b252b" stroke="#6e9fb4" stroke-dasharray="5 6"/>
      <text x="656" y="39" fill="#eee0bd">Nao explorado / risco de mare</text>
      <circle cx="936" cy="33" r="12" fill="#d8c36e" stroke="#fff2aa" stroke-width="2"/>
      <text x="958" y="39" fill="#eee0bd">Posicao atual de Ren</text>
      <text x="24" y="68" fill="#a99d7b">Escala aproximada: distancias narrativas, nao planta arquitetonica precisa.</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <!-- Entrada externa e corredor baixo inicial -->
    <path d="M95 520 C135 492, 185 500, 230 505 L450 505 C476 505, 486 535, 458 548 L220 556 C170 558, 128 555, 92 575 Z"
          fill="#435f56" stroke="#8ed0ba" stroke-width="4"/>
    <path d="M100 548 L456 527" fill="none" stroke="#d8c36e" stroke-width="3" stroke-dasharray="12 12" marker-end="url(#arrow)" opacity="0.8"/>

    <!-- Camara seca de retencao -->
    <path d="M452 426 C500 390, 610 393, 660 445 C698 485, 683 570, 625 606 C563 644, 471 612, 435 557 C405 510, 414 455, 452 426 Z"
          fill="#435f56" stroke="#8ed0ba" stroke-width="4"/>

    <!-- Canal umido a esquerda / abaixo -->
    <path d="M535 600 C505 655, 470 704, 432 765 C404 810, 392 855, 386 920"
          fill="none" stroke="#6e9fb4" stroke-width="56" stroke-linecap="round" stroke-dasharray="18 18" opacity="0.48"/>
    <path d="M535 600 C505 655, 470 704, 432 765 C404 810, 392 855, 386 920"
          fill="none" stroke="#9cd4e8" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 13"/>

    <!-- Fenda de ar / pano encerado acima -->
    <path d="M585 423 C602 374, 623 327, 652 278" fill="none" stroke="#8d6a3d" stroke-width="34" stroke-linecap="round" stroke-dasharray="16 10"/>
    <path d="M606 358 C630 350, 648 363, 664 384" fill="none" stroke="#d0a35f" stroke-width="8" stroke-linecap="round"/>

    <!-- Corredor seco da direita -->
    <path d="M650 505 C720 493, 795 491, 868 498 C920 503, 967 493, 1031 489 L1058 489 L1058 539 L1018 540 C954 543, 908 552, 861 544 C785 532, 717 536, 650 550 Z"
          fill="#435f56" stroke="#8ed0ba" stroke-width="4"/>
    <path d="M665 526 L1034 513" fill="none" stroke="#d8c36e" stroke-width="3" stroke-dasharray="12 12" marker-end="url(#arrow)" opacity="0.8"/>

    <!-- Painel baixo -->
    <rect x="1053" y="462" width="22" height="112" rx="4" fill="#5a3a23" stroke="#d0a35f" stroke-width="3"/>
    <rect x="1057" y="548" width="18" height="12" fill="#15140f"/>

    <!-- Sala vista pela fresta -->
    <path d="M1083 400 L1302 380 C1333 437, 1334 570, 1296 631 L1083 610 Z"
          fill="#3a2d1f" stroke="#d0a35f" stroke-width="4" stroke-dasharray="10 7" opacity="0.92"/>
    <rect x="1120" y="428" width="120" height="26" rx="4" fill="#725235" stroke="#c99c55"/>
    <rect x="1120" y="470" width="132" height="24" rx="4" fill="#725235" stroke="#c99c55"/>
    <rect x="1120" y="520" width="90" height="22" rx="4" fill="#6a6348" stroke="#c7b977"/>
    <rect x="1228" y="528" width="54" height="42" rx="4" fill="#80735b" stroke="#c7b977"/>
    <circle cx="1270" cy="438" r="14" fill="#d8c36e" opacity="0.32"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2e8c8">
    <text x="78" y="627" font-size="19" font-weight="700">Entrada pela fresta seca</text>
    <text x="78" y="652" fill="#b9ad8a">pano encerado, cal/sal, rua atras</text>

    <text x="264" y="482" fill="#e9d699">Corredor baixo inicial</text>
    <text x="267" y="579" fill="#b9ad8a">~40-50 pes ate a camara</text>

    <text x="465" y="475" font-size="20" font-weight="700">Camara seca de retencao</text>
    <text x="465" y="500" fill="#b9ad8a">ponto de bifurcacao</text>
    <text x="467" y="526" fill="#b9ad8a">fenda de ar acima/adiante</text>

    <text x="238" y="817" fill="#9cd4e8" font-size="19" font-weight="700">Canal frio e umido</text>
    <text x="238" y="842" fill="#a9c7d1">nao explorado; som de agua crescente</text>

    <text x="648" y="264" fill="#d0a35f" font-size="19" font-weight="700">Fenda de ar</text>
    <text x="648" y="290" fill="#b9ad8a">pano encerado; nao investigada</text>

    <text x="735" y="468" font-size="19" font-weight="700">Corredor seco da direita</text>
    <text x="735" y="568" fill="#b9ad8a">rota de pasta, gaveta ou caixa rasa</text>

    <text x="1014" y="440" fill="#d0a35f" font-size="18" font-weight="700">Painel baixo</text>
    <text x="1014" y="595" fill="#b9ad8a">quase fechado; fresta inferior</text>

    <text x="1110" y="360" fill="#d0a35f" font-size="20" font-weight="700">Sala baixa seca</text>
    <text x="1110" y="663" fill="#b9ad8a">vista parcial: papel, bandejas, pano encerado</text>
    <text x="1110" y="688" fill="#b9ad8a">brilho fraco no fundo; sala inteira nao visivel</text>
  </g>

  <g>
    <circle cx="1039" cy="516" r="18" fill="#d8c36e" stroke="#fff2aa" stroke-width="4"/>
    <text x="1010" y="525" fill="#15140f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Ren</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="900" width="1260" height="58" rx="8" fill="#201d16" stroke="#514936"/>
    <text x="96" y="935" fill="#eee0bd" font-size="17">
      Nota: Ren ainda nao deixou marca explicita para Luath. A sala baixa esta apenas parcialmente vista pela fresta; ausencia de pessoas nao esta confirmada.
    </text>
  </g>
</svg>
