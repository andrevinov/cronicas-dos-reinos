  resumo_imediato: Ren alcançou o homem de mãos limpas após persegui-lo desde uma carroça de carvão. A perseguição entrou em iniciativa. Ren atravessou trabalhadores e um carrinho sem atingi-los, anulou com Aparar Projéteis uma faca arremessada e fechou a distância. O homem atacou com uma segunda faca e errou. É o turno de Ren; ambos estão adjacentes, Ren está ileso e três trabalhadores observam o confronto a cerca de cinquenta pés.
  prazos_e_alertas: Visão no Escuro permanece ativa aproximadamente até 09:32. O Broche do Semblante Humilde está disponível desde o amanhecer e ainda não foi usado nesta saída. Mera partiu com Colm/Dent rumo a Iria Doss, mas a chegada ainda não foi confirmada. O pacote reservado da Ponte Baixa passou de Luath para Tyr sem o nome de Ren no registro externo. O combate atual é público e testemunhado por trabalhadores.
