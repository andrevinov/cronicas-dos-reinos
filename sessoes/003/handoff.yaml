    baixio arborizado próximo. Ren obtém 18 contra CD 14 em Sobrevivência e camufla a carroça contra observação
    casual; termina junto dela por volta de 08:55.
- batch: s003-sessao-c0d37c26c9e55253
  transacao: s003-9acf84870a8af11e
  resumo: Ren assume um disfarce superficial de homem maltrapilho, aguarda um grupo apropriado de trabalhadores
