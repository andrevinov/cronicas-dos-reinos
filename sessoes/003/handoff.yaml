    lâmina falsa e papéis para fabricar um rastro oriental. Afirma que instruções superiores vinham sem assinatura
    pelo circuito de Narwhal, sob a expressão ''segunda maré'', e diz não conhecer o patrono. A cer…'
- batch: s003-cena-1b1d7789e98c2c9e
  transacao: s003-0bb70a436a5a867e
  resumo: Ren libera vivo o homem de mãos limpas após obrigá-lo a repetir uma ameaça destinada a Bram Vask. O homem
    parte desarmado; a entrega do recado não está confirmada. Ren obtém 14 contra CD 14 em Furtividade, oculta dos
    observadores o rumo real e chega por volta de 08:22 à cobertura próxima da casa de Iria Doss. A carroça de Mera
    está junto à casa, confirmando a chegada do grupo.
