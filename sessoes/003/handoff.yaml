    mais valiosa.
- batch: s003-cena-1b1d7789e98c2c9e
  transacao: s003-1817f1ac59c440f7
  resumo: 'Ren obtém 19 contra CD 15 na Intimidação com vantagem. O homem confessa ser o segundo intermediário da
