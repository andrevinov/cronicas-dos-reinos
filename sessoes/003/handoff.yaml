continuidade:
  resumo_imediato: Ren entrou abertamente na casa de Iria Doss com a palavra de Mera Fumaça. Colm Dunn está vivo
    e estável, recebendo tratamento, mas precisa de repouso e observação até a manhã seguinte. Iria pediu 3 PO pelo
    tratamento e abrigo; o pagamento ainda não foi realizado.
  prazos_e_alertas: Passos sem Pegadas expirou por volta de 02:32 de 7 Eleasis durante a volta de Ren ao circo.
    Visão no Escuro foi ativada por volta de 01:32 e pode durar até cerca de 09:32. Com o amanhecer de 7 Eleasis,
    o Broche do Semblante Humilde voltou a estar disponível e ainda não foi usado nesta saída. As evidências da
    Ponte Baixa foram seladas por Luath sob custódia provisória da Night Watch às 02:24 e o pacote reservado passou
    para Tyr sem nome no papel externo. Mera partiu com Colm/Dent rumo a Iria Doss, mas Ren ainda não confirmou
    a chegada. Os papéis do braseiro foram deixados para trás e se perderam para o calor. Ren alcançou o homem de
    mãos limpas; o combate é público e testemunhado por trabalhadores.
