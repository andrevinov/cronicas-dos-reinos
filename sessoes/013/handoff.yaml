  resumo: Depois de passar por Narwhal Manor, Ren caminhou até a Casa da Aurora Menor no Temple District, mantendo
    a postura de Shinta apesar das contusões. Chegou às 18:35 para procurar Maerra e receber tratamento antes de
    voltar ao circo, evitando preocupar Nera e Silva.
- batch: s013-cena-d872245b9bf5b835
  transacao: s013-cd41effcd6e192cc
  resumo: Ren chegou à Casa da Aurora Menor ainda como Shinta e recebeu tratamento reservado de Maerra. Ela confirmou
    contusões no ombro e costelas sem sinais imediatos de fratura ou lesão interna e conjurou Curar Ferimentos,
    restaurando 5 PV; Ren ficou com 44/52 PV. As dores restantes são leves e não denunciam luta à observação casual.
    Maerra percebeu que ele evitou Silva e Nera para não preocupá-las e pediu que Ren explicas…
- batch: s013-cena-d872245b9bf5b835
  transacao: s013-b0a216b3af925997
  resumo: 'Ren relatou a Maerra a emboscada por três homens kozakuranos, sua decisão de levar a luta para dentro
    e seu medo de que Masao esteja trazendo forças lentamente. Maerra separou fato de hipótese: três homens, reconhecimento
    de Shinta e uso da rota são fatos; a escala e a data de chegada exigem rastros. Ren priorizou verificar Nera
    e Tavin. Doou à Casa da Aurora Menor os 4 PP recebidos pelo dia, reduzindo seu dinheiro…'
- batch: s013-sessao-75d8e502c370bb37
  transacao: s013-293f371afd5ef259
  resumo: Ren caminhou da Casa da Aurora Menor até o Jack Mooney & Sons Circus, sem correr e mantendo a aparência
    de Shinta. Chegou pelo caminho de serviço às 20:00; o acampamento apresenta atividade noturna habitual, mas
    Ren ainda não confirmou pessoalmente Nera e Tavin.
- batch: s013-sessao-75d8e502c370bb37
  transacao: s013-ec4fce8693e4595b
  resumo: Ren entrou no circo pelo caminho de serviço e confirmou pessoalmente que Nera e Tavin estão fisicamente
    bem e seguindo a rotina normal junto à carroça verde de Silva. Não há sinal visível de que a emboscada tenha
    alcançado o acampamento. Nera reconheceu Ren sob Shinta e percebeu que há algo incomum, embora ainda não tenha
    formulado a pergunta.
- batch: s013-sessao-75d8e502c370bb37
  transacao: s013-8ed72ceafda55d67
  resumo: Ren brincou com Tavin, abraçou Nera e então relatou integralmente a ela e Silva a emboscada, o reconhecimento
    de Shinta como Ren, a luta, o tratamento de Maerra e sua suspeita de que Masao possa estar trazendo homens de
    Kozakura. Nera rejeitou ser tranquilizada antes de receber os fatos, mas reconheceu que Ren fez certo ao contar.
    Silva separou fatos de hipóteses e decidiu mudar Nera e Tavin de lugar dentro do acamp…
- batch: s013-sessao-75d8e502c370bb37
  transacao: s013-23b040cb421a0bf9
  resumo: Ren tranquilizou Nera, minimizou os golpes sofridos e reafirmou que atravessariam juntos a tempestade
    que se aproximava. Nera acolheu o afeto e o compromisso de permanecerem juntos, mas lembrou que Ren fora ferido
    o bastante para procurar Maerra, recusou a ordem de obedecer e explicou que seguirá a medida de Silva por escolha
    própria. Também rejeitou garantias absolutas e pediu que Ren lhe conte quando algo começar…
