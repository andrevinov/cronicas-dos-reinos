<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">Mapa tatico esquematico: Casa da Rede Morta, Deposito 13</title>
  <desc id="desc">Mapa superior esquematico do que Ren observa as 01:18 em Fishtown: deposito 13, canal, esquife, caixa comprida, pessoa amarrada sob lona e o ponto de observacao no sotao da casa de salga abandonada.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2b3540" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f26d5b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#78c7ff"/>
    </marker>
    <style>
      .bg { fill: #12171d; }
      .grid { fill: url(#grid); }
      .land { fill: #252323; stroke: #4a423a; stroke-width: 3; }
      .street { fill: #302c28; stroke: #53483c; stroke-width: 2; }
      .building { fill: #3b3630; stroke: #7c6956; stroke-width: 4; }
      .unknown { fill: #2c2d30; stroke: #6a6260; stroke-width: 3; stroke-dasharray: 9 7; }
      .water { fill: #173240; stroke: #4f8ca0; stroke-width: 4; }
      .pier { fill: #5a4735; stroke: #9a7b55; stroke-width: 3; }
      .cover { fill: #5b5146; stroke: #b69a75; stroke-width: 2; }
      .ren { fill: #ffd866; stroke: #fff3b0; stroke-width: 4; }
      .enemy { fill: #d95e52; stroke: #ffc5bb; stroke-width: 3; }
      .neutral { fill: #c88b4a; stroke: #ffe0a6; stroke-width: 3; }
      .object { fill: #d8d0bf; stroke: #f5eddc; stroke-width: 3; }
      .danger { fill: #a93d42; stroke: #ff9fa2; stroke-width: 3; }
      .sight { fill: #dbc76d; opacity: 0.13; stroke: #f6dc72; stroke-width: 2; stroke-dasharray: 10 8; }
      .los { stroke: #f6dc72; stroke-width: 3; stroke-dasharray: 10 8; fill: none; opacity: 0.9; }
      .route { stroke: #78c7ff; stroke-width: 4; fill: none; stroke-dasharray: 12 9; marker-end: url(#arrow-blue); }
      .move { stroke: #f26d5b; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #f2eadc; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #d8cdbb; font-weight: 600; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #c6bcae; font-weight: 600; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #aeb8bd; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; fill: #fff4d8; font-weight: 800; }
      .badge { fill: #1a2027; stroke: #5f6872; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="950"/>
  <rect class="grid" x="40" y="40" width="1320" height="820" opacity="0.9"/>

  <text class="title" x="60" y="55">Casa da Rede Morta - mapa tatico esquematico</text>
  <text class="note" x="60" y="84">01:18, madrugada. Norte operacional no topo. 1 quadrado ~= 5 pes. Interior nao revelado.</text>

  <!-- Ground bands -->
  <rect class="street" x="70" y="110" width="1260" height="95" rx="8"/>
  <text class="small" x="92" y="166">Rua baixa de Fishtown / fachadas fechadas</text>

  <path class="water" d="M65,505 C260,475 355,514 520,492 C710,466 850,500 1000,486 C1165,471 1250,495 1335,482 L1335,642 C1210,660 1085,628 930,650 C750,676 655,632 505,653 C330,678 205,645 65,666 Z"/>
  <text class="small" x="88" y="606">canal estreito - agua escura, nevoa baixa</text>

  <!-- Depot area -->
  <rect class="building" x="160" y="220" width="560" height="250" rx="5"/>
  <rect class="unknown" x="190" y="250" width="500" height="190" rx="4"/>
  <text class="label" x="205" y="287">Deposito 13</text>
  <text class="small" x="205" y="318">Casa da Rede Morta</text>
  <text class="tiny" x="205" y="346">interior desconhecido</text>
  <rect x="646" y="372" width="70" height="64" fill="#171717" stroke="#9d886d" stroke-width="3"/>
  <text class="tiny" x="624" y="462">porta lateral 13</text>

  <rect class="pier" x="395" y="455" width="390" height="78" rx="3"/>
  <line x1="430" y1="455" x2="430" y2="533" stroke="#9a7b55" stroke-width="2" opacity="0.55"/>
  <line x1="510" y1="455" x2="510" y2="533" stroke="#9a7b55" stroke-width="2" opacity="0.55"/>
  <line x1="590" y1="455" x2="590" y2="533" stroke="#9a7b55" stroke-width="2" opacity="0.55"/>
  <line x1="670" y1="455" x2="670" y2="533" stroke="#9a7b55" stroke-width="2" opacity="0.55"/>
  <text class="tiny" x="418" y="548">cais curto do deposito</text>

  <!-- Boat and objects -->
  <path d="M545,555 C580,520 810,505 925,538 C947,546 948,578 925,588 C780,650 590,614 545,578 C536,571 537,563 545,555 Z" fill="#2a2621" stroke="#b48a5f" stroke-width="4"/>
  <path d="M594,560 C664,538 798,536 880,556 C812,585 667,594 594,570 Z" fill="#3d342c" stroke="#7c6349" stroke-width="2"/>
  <text class="small" x="800" y="642">esquife sem lanterna</text>

  <rect class="object" x="548" y="503" width="250" height="43" rx="6" transform="rotate(4 548 503)"/>
  <rect x="621" y="509" width="44" height="35" rx="4" fill="#969696" stroke="#e8e1d5" stroke-width="2" transform="rotate(4 621 509)"/>
  <text class="tiny" x="555" y="494">caixa comprida / lacre cinza</text>

  <ellipse cx="695" cy="572" rx="84" ry="28" fill="#444044" stroke="#827b78" stroke-width="3"/>
  <circle class="danger" cx="610" cy="574" r="13"/>
  <line x1="596" y1="574" x2="580" y2="572" stroke="#ffb0a8" stroke-width="4"/>
  <text class="tiny" x="730" y="675">pessoa amarrada sob lona</text>

  <!-- People -->
  <circle class="enemy" cx="712" cy="470" r="18"/>
  <text class="tiny" x="738" y="444">portador encapuzado</text>
  <circle class="enemy" cx="500" cy="474" r="16"/>
  <circle class="enemy" cx="548" cy="472" r="16"/>
  <text class="tiny" x="462" y="430">homens do deposito</text>
  <circle class="enemy" cx="874" cy="552" r="16"/>
  <text class="tiny" x="890" y="548">remador</text>
  <path class="move" d="M670,414 C650,450 650,481 670,506"/>
  <text class="tiny" x="760" y="406">movimento da caixa</text>

  <!-- South side / Ren -->
  <rect class="land" x="80" y="692" width="1250" height="185" rx="8"/>
  <rect class="building" x="175" y="714" width="450" height="140" rx="5"/>
  <polygon points="175,714 625,714 580,675 225,676" fill="#4a4035" stroke="#9a7b55" stroke-width="3"/>
  <rect x="378" y="672" width="95" height="48" fill="#161616" stroke="#c3ad87" stroke-width="3" stroke-dasharray="8 5"/>
  <circle class="ren" cx="425" cy="695" r="20"/>
  <text class="label" x="155" y="895">Casa de salga abandonada</text>
  <text class="small" x="455" y="704">Ren no sotao quebrado</text>

  <rect class="cover" x="720" y="704" width="130" height="58" rx="4"/>
  <rect class="cover" x="872" y="724" width="105" height="44" rx="4"/>
  <rect class="cover" x="1005" y="705" width="150" height="66" rx="4"/>
  <text class="tiny" x="727" y="692">redes, caixas e sombra</text>
  <text class="small" x="736" y="833">viela baixa / rotas de fuga possiveis</text>

  <!-- Sight lines -->
  <path class="sight" d="M425,695 L650,405 L925,562 L425,695 Z"/>
  <path class="los" d="M425,695 C500,616 575,548 670,520"/>
  <path class="los" d="M425,695 C548,565 638,488 712,470"/>
  <path class="los" d="M425,695 C580,605 725,570 874,552"/>
  <text class="tiny" x="450" y="662">linhas de visao de Ren</text>

  <!-- Routes and boundaries -->
  <path class="route" d="M1020,510 C1130,505 1230,500 1300,492"/>
  <text class="tiny" x="1100" y="478">canal para cais secundarios</text>
  <path class="route" d="M130,510 C105,474 96,397 105,310"/>
  <text class="tiny" x="88" y="296">ruas baixas</text>
  <path class="route" d="M1030,785 C1150,784 1245,758 1310,710"/>
  <text class="tiny" x="1135" y="735">Fishtown</text>

  <!-- Legend -->
  <rect class="badge" x="930" y="115" width="400" height="230" rx="8"/>
  <text class="label" x="955" y="150">Legenda</text>
  <circle class="ren" cx="965" cy="185" r="12"/>
  <text class="small" x="990" y="192">Ren</text>
  <circle class="enemy" cx="965" cy="222" r="12"/>
  <text class="small" x="990" y="229">figuras hostis/desconhecidas</text>
  <rect class="object" x="953" y="251" width="25" height="16" rx="2"/>
  <text class="small" x="990" y="268">objeto observado</text>
  <line x1="952" y1="296" x2="982" y2="296" class="los"/>
  <text class="small" x="990" y="303">linha de visao</text>
  <line x1="952" y1="325" x2="982" y2="325" class="route"/>
  <text class="small" x="990" y="332">rota provavel/visivel</text>

  <rect class="badge" x="60" y="872" width="640" height="52" rx="8"/>
  <text class="note" x="82" y="904">Nota: esquema de jogo, nao planta exata. Nao revela salas, guardas ocultos ou conteudo interno.</text>
</svg>
