schema_orcamento_harden_operational_contracts: 1
natureza: contrato_de_regressao
objetivo: >-
  Eliminar retries e descoberta de sintaxe causados por representacoes operacionais
  equivalentes sem alterar regras, canone ou semantica transacional.
limites:
  max_chamadas_operacionais_extras_turno_livre: 0
  max_endpoints_novos: 0
  max_schedulers_novos: 0
  max_estados_novos: 0
  max_scans_repo: 0
  max_aliases_data_numericos: 2
  max_aliases_contexto_tag: 1
invariantes:
  ticket_completo_permanece_assinado_e_autocontido: true
  ticket_id_nao_e_reconstruido_nem_aceito_como_ticket: true
  erro_ticket_id_indica_campo_ticket_sem_help: true
  whitespace_no_corpo_base64_continua_tolerado: true
  corrupcao_real_de_ticket_continua_falhando: true
  data_canonica_permanece_formato_persistido: true
  aliases_de_data_so_normalizam_representacoes_inequivocas: true
  iso_numerico_mapeia_mes_08_para_eleasis: true
  data_ambigua_nao_e_adivinhada: true
  contexto_tag_permanece_flag_canonica: true
  tag_e_apenas_alias_de_compatibilidade: true
  dados_e_comando_poetry_autoritativo: true
  dados_lote_e_comando_poetry_autoritativo: true
  nenhum_reinstall_do_poetry_e_exigido_para_o_hot_path: true
  fronteira_operacional_reutiliza_endpoint_existente: true
  nenhuma_semantica_de_jogo_nova: true
