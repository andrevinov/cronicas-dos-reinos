fontes:
  status: "definidas_iniciais"
  arquivo_canonico: "regras/fontes.md"
  observacao: "O ruleset ativo é D&D 5e 2014 durante a migração; D&D 5.5e é o alvo e só se torna autoridade mecânica após o gate final. Materiais de AD&D e outras edições continuam sendo adaptados para o ruleset ativo."
  regras_base:
    - "Livro do Jogador, D&D 5e 2014"
    - "Manual dos Monstros, D&D 5e 2014"
    - "Guia do Mestre 2024/5.5e apenas como referência de migração enquanto o ruleset ativo for 2014"
  regras_alvo:
    - "Player's Handbook 2024 / D&D 5.5e"
    - "Dungeon Master's Guide 2024 / D&D 5.5e"
    - "Monster Manual 2025 / D&D 5.5e"
  candidatas_regionais:
    - "LC1 - Gateway to Ravens Bluff, The Living City"
    - "LC2 - Inside Ravens Bluff"
    - "LC3 - Nightwatch in the Living City"
    - "LC4 - Port of Ravens Bluff"
    - "The City of Ravens Bluff"
    - "Kara-Tur: The Eastern Realms"
  documentos_internos_aprovados:
    - nome: "Kara-Tur e Faerûn"
      arquivo: "books/Kara-Tur e Faerûn.pdf"
      uso: "encaixe canônico de Ren, Masao e Clã Kagehira na lacuna de Kozakura entre 1357 DR e 1372 DR; relação geral entre Kara-Tur e Faerûn"
    - nome: "Aliados para Ren"
      arquivo: "books/Aliados para Ren.pdf"
      uso: "aliados canônicos futuros de Ren; ordem preferencial de aparição; ponte entre Ren, Masao, Tyr, sobreviventes Kagehira e a divindade que condenou Masao"
    - nome: "Ponte de Kozakura"
      arquivo: "books/Ponte de Kozakura.pdf"
      uso: "eixo narrativo canônico de longo prazo: anomalias de Kara-Tur em Ravens Bluff, descoberta de portal permanente para Kozakura e formação futura de Shin-Kozakura após Masao perder o controle exclusivo da passagem"

