fontes:
  status: ruleset_5_5e_ativo
  arquivo_canonico: regras/fontes.md
  observacao: D&D 5.5e é a autoridade mecânica ativa. D&D 5e 2014 permanece somente como fonte histórica/compatibilidade
    quando não houver equivalente aplicável e houver aprovação explícita. Materiais de AD&D são adaptados para 5.5e.
  regras_base:
  - Player's Handbook 2024 / D&D 5.5e
  - Dungeon Master's Guide 2024 / D&D 5.5e
  - Monster Manual 2025 / D&D 5.5e
  regras_alvo:
  - Player's Handbook 2024 / D&D 5.5e
  - Dungeon Master's Guide 2024 / D&D 5.5e
  - Monster Manual 2025 / D&D 5.5e
  candidatas_regionais:
  - LC1 - Gateway to Ravens Bluff, The Living City
  - LC2 - Inside Ravens Bluff
  - LC3 - Nightwatch in the Living City
  - LC4 - Port of Ravens Bluff
  - The City of Ravens Bluff
  - 'Kara-Tur: The Eastern Realms'
  documentos_internos_aprovados:
  - nome: Kara-Tur e Faerûn
    arquivo: books/Kara-Tur e Faerûn.pdf
    uso: encaixe canônico de Ren, Masao e Clã Kagehira na lacuna de Kozakura entre 1357 DR e 1372 DR; relação geral
      entre Kara-Tur e Faerûn
  - nome: Aliados para Ren
    arquivo: books/Aliados para Ren.pdf
    uso: aliados canônicos futuros de Ren; ordem preferencial de aparição; ponte entre Ren, Masao, Tyr, sobreviventes
      Kagehira e a divindade que condenou Masao
  - nome: Ponte de Kozakura
    arquivo: books/Ponte de Kozakura.pdf
    uso: 'eixo narrativo canônico de longo prazo: anomalias de Kara-Tur em Ravens Bluff, descoberta de portal permanente
      para Kozakura e formação futura de Shin-Kozakura após Masao perder o controle exclusivo da passagem'
  regras_compatibilidade_2014:
  - Livro do Jogador, D&D 5e 2014 — somente compatibilidade explicitamente aprovada
  - Manual dos Monstros, D&D 5e 2014 — somente compatibilidade explicitamente aprovada
jogador:
  personagem_inicial:
    status: definido
    nome: Ren Kagehira
    conceito: humano de Kozakura, monge do Caminho da Sombra, caçando um traidor de clã em Ravens Bluff
    arquivo_ficha: personagens/jogador/ficha.yaml
    arquivo_conceito: personagens/jogador/conceito.md
    arquivo_historia: personagens/jogador/historia.md
    arquivo_conhecimento: personagens/jogador/conhecimento.md
    arquivo_resumo_poderes: personagens/jogador/resumo-de-poderes.md
  nivel_inicial:
    status: definido
    valor: 3
  metodo_de_criacao:
    status: definido
    valor: array solo melhorado
    atributos:
    - 16
    - 15
    - 14
    - 13
    - 12
    - 10
  suplementos_opcionais_personagem:
    status: definido
    valor: nenhum suplemento mecanico opcional no personagem inicial
tom:
  status: definido_inicial
  diretrizes_iniciais:
  - mundo aberto
  - consequencias persistentes
  - agencia real do jogador
  - preparacao local antes de expansao ampla
  - direcao canonica de longo prazo para a Ponte de Kozakura e Shin-Kozakura
  - campanha solo com aliados temporarios, recorrentes e canonicos sem roubar agencia de Ren
  - furtividade, investigacao urbana e sobrevivencia
  - jogo adulto com romance e intimidade consentida tratados por corte de cena
  - violencia sombria permitida sem crueldade grafica gratuita
  limites_de_conteudo:
    status: definido
    arquivo: narracao/limites.md
regras:
  fidelidade_aproximada: 70%
  dificuldade:
    status: definida
    valor: solo cautelosa, com risco real
    arquivo: regras/dificuldade.md
  regras_da_casa:
    status: definida_inicial
    arquivo: regras/regras-da-casa.md
  resolucao_de_acoes:
    status: definida_inicial
    arquivo: regras/resolucao-de-acoes.md
  progressao:
    status: definida
    metodo: marcos narrativos
    arquivo: regras/progressao.md
  protocolo_de_rolagens:
    status: definido_inicial
    arquivo: narracao/protocolo-de-sessao.md
    ferramenta_padrao: ferramentas/rolar-dados.py
preparacao:
  prioridades_atuais:
  - retomar após a sessão 016 no pátio da antiga calaria, às 23:12 de 19 Eleasis, 1372 DR
  - preservar a agência de Ren diante dos dois ocupantes inconscientes e das provas recuperadas
  - concluir Sete Nomes Antes do Amanhecer somente por verificação institucional ou consequência causal equivalente
  - manter separadas a identidade reservada da Cinza-Azul, as hipóteses de Ren sobre Shizune e o conhecimento compartimentado da célula
  - manter ativos, sem avanço retroativo, os fios de Kethra, Pell e da rota rural
