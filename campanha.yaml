    - "The City of Ravens Bluff"

jogador:
  personagem_inicial:
    status: "definido"
    nome: "Ren Kagehira"
    conceito: "humano de Kozakura, monge do Caminho da Sombra, caçando um traidor de clã em Ravens Bluff"
    arquivo_ficha: "personagens/jogador/ficha.yaml"
    arquivo_conceito: "personagens/jogador/conceito.md"
    arquivo_historia: "personagens/jogador/historia.md"
    arquivo_conhecimento: "personagens/jogador/conhecimento.md"
