    status: "confessou sua parte a Jack"
    atitude_para_ren: "envergonhada, defensiva e com respeito relutante"
    confianca: "baixa"
    respeito: "inicial e relutante"
    motivo: >
      Segundo Sorn, Harl foi quem conferiu o lado leste da corda alta ontem
      depois da nona badalada, embora Sorn tenha assinado a conferência. Ren o
      encontrou atrás da carroça de cordame. Harl respondeu sem vacilar que a
      corda estava boa quando ele conferiu, mas Ren percebeu que ele está
      escolhendo responder apenas ao que foi perguntado. Sob pergunta direta
      sobre Lysa, Harl afirmou que ela pegou apenas breu, mas admitiu que não
