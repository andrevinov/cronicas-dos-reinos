    tipo: "halfling contorcionista / sabotadora confessa da corda alta"
    local: "Jack Mooney & Sons Circus"
    status: "conhecida em jogo"
    atitude_para_ren: "assustada, pressionada e tentando reduzir a propria culpa"
    confianca: "nenhuma"
    respeito: "medo pratico"
    motivo: >
      Ren confrontou Merrit com a pista da passagem estreita e a ameaça de
      encontrar a arma do crime. Merrit confessou ter cortado a tira da amarra,
      mas insiste que queria apenas cancelar o número de Mira, não matá-la.
      Depois, Ren a aconselhou a assumir a culpa e pedir desculpas; isso a
      tocou mais do que a intimidação.
      No fim da tarde, Ren pediu que Merrit narrasse O Vento da Noite como
      papel limitado de chão. Jack e Silva aceitaram apenas sob restrições
      rígidas. Merrit ensaiou entradas cômicas curtas e percebeu que ainda pode
      ter um lugar visível no circo sem fingir que a sabotagem foi perdoada.
      No dia seguinte, Ren cobrou que Merrit cortasse o texto ao essencial.
      Ela chega à apresentação com voz poupada, três entradas curtas e a ordem
      de calar antes de estragar os saltos.
      Durante O Vento da Noite, Merrit sustentou a narração curta, usou humor
      sem roubar o número e permaneceu no papel de chão sob supervisão. O
      sucesso não apaga a sabotagem, mas devolve a ela um lugar visível e
      controlado na rotina do circo.
      Nos bastidores, Merrit buscou validação por ter calado antes de estragar;
      Sorn cortou seco, mas Dessa preservou a piada do céu rico como parte útil
      do número.
      Na preparação da reprise curta de 5 Eleasis, Merrit tentou ampliar demais
      a história outra vez. Dessa e Sorn cortaram o excesso; a versão final
      permaneceu curta e funcional, sem transformar o número em algo novo.
      Durante a reprise curta, Merrit disse a frase certa e calou antes de
      estragar o efeito. Isso manteve a narração funcional e ajudou Kage a sair
      sem interação direta com a plateia.
