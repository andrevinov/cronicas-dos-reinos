  jack_mooney:
    nome: "Jack Mooney"
    tipo: "dono do circo / autoridade local do acampamento / patrono condicional"
    local: "Jack Mooney & Sons Circus"
    status: "patrono condicional ativo"
    atitude_para_ren: "pragmatica, desconfiada e interessada"
    confianca: "baixa e condicional"
    respeito: "inicial, baseado em competencia, audacia e honestidade parcial"
    motivo: >
      Jack percebeu inconsistências na cobertura de Silva, cobrou explicações
      e recusou transformar o circo em refúgio estável sem saber a verdade.
      Não pretende entregar Nera e Tavin à Red Sail, mas quer o estrangeiro
      armado fora do acampamento antes de aprender seu nome. Ren retornou ao
      circo vestido como marinheiro e provocou Jack com a mensagem de que um
      homem entrou e saiu de seu circo sem ser percebido. Jack mordeu a isca
      por orgulho e curiosidade, chamando Ren para uma conversa privada. Ao
      ouvir a oferta de Ren, aceitou não expulsar Nera e Tavin ao meio-dia, mas
      colocou termos rígidos: Ren deve respeitar as regras internas do circo e
      provar utilidade investigando discretamente a sabotagem da amarra da corda
      alta do lado leste antes do crepúsculo. Ren aceitou os termos. Ren
      resolveu a sabotagem antes do meio-dia, com prova física e sem sangue.
      Jack aceitou manter os Vell por hoje e amanhã e manter Ren como acrobata
      estrangeiro em teste, mas não prometeu apostar o circo inteiro contra a
      Red Sail sem entender melhor o risco. Depois que Ren revelou a influência
      de Harl sobre Merrit, Jack deu a Ren até o pôr do sol para resolver o fio.
      Ren convenceu Harl a confessar. Jack aplicou punição discreta e confirmou
      abrigo para Ren, Nera e Tavin por hoje e amanhã.
      Na madrugada seguinte, Jack e Silva impediram que uma sondagem ligada ao
      porto ou à Red Sail acessasse o interior sensível do acampamento, mas o
      problema chegou perto demais para ser ignorado.
      Ren propôs que Jack transformasse a pressão em busca controlada, enquanto
      os Vell seriam removidos discretamente. Jack aceitou a lógica porque pode
      enquadrar a busca como concessão comercial, não submissão.
      Jack puxou a atenção externa para a área das cozinhas, dando a Ren uma
      janela para sair com os Vell pela borda oposta.
      Depois, conduziu a busca controlada como concessão teatral: abriu o que
      quis, quando quis, e manteve os homens do porto longe do que importava
      até a presença da guarda encerrar a pressão imediata.
      Ren propôs o Benefício da Lona Aberta como forma de o circo comprar
      respeitabilidade, dinheiro e proteção social depois do incêndio, sem
      acusar publicamente Red Sail, Masao ou Narwhal. Jack aceitou o esqueleto
      do plano como viável e comercialmente útil, desde que fique sob controle
      dele: evento beneficente amanhã ao cair da tarde, ingressos comuns,
      camarotes caros, doações visíveis, Vell integrados como trabalhadores
      comuns antes dos cartazes, livro separado do lugar onde eles dormem,
      apoio de templo/guarda sem parecer medo e Ren testado antes de ser
      vendido como atração.
      Depois da resposta limitada de Luath, Ren demonstrou O Vento da Noite
      diante de Jack, Silva, Dessa, Mira e Sorn. A demonstração convenceu Jack
      de que há atração vendável: acrobacia forte, Passo do Vento como efeito
      visual impressionante e shuriken como possível "estrela" ou vento cortado,
      desde que tratado como efeito seguro, não arma diante do público.
      Jack e Silva prepararam o aviso escrito limpo para Luath, e Ren o
      entregou antes do pôr do sol. Depois do descanso curto de Ren, Jack
      autorizou Merrit a narrar o número apenas em chão, sem corda, faca, caixa
      de truque ou acesso solto.
      Jack decidiu que Lysa Renn será a Princesa das Sombras no lugar de
      Nera/Lena, para manter a testemunha protegida e reintegrar uma acrobata
      do circo em papel seguro. No dia seguinte, abriu o Benefício da Lona
      Aberta com público misto e iniciou a chamada de O Vento da Noite.
      O número funcionou diante da lona cheia: Ren executou acrobacia limpa,
      usou Passo do Vento como efeito visual impressionante e firmou Ren Kage
      como atração vendável. Jack percebeu aplauso, interesse dos camarotes e
      valor comercial imediato, embora ainda precise fechar o resultado
      financeiro e político do Benefício.
      Após o número, Jack aprovou a decisão de Ren de não voltar ao público:
      para ele, a ausência preserva preço e mistério. Um homem do camarote oeste
      perguntou se Kage recebe patrono privado ou contratação fechada. Jack
      pretende administrar a resposta para aumentar valor e controlar risco,
      mas quer saber qual limite Ren estabelece.
      Ren decidiu deixar Kage ligado ao circo por enquanto e não aceitar
      patrono privado na mesma noite. Jack respondeu ao camarote oeste que Kage
      não recebe casa privada hoje e que propostas por escrito podem vir amanhã.
      O Benefício fechou bem: cerca de setenta e poucas peças de ouro limpas
      para o circo depois de custos e promessas públicas, além de novas promessas
      comerciais e doações comunitárias sob Silva.
      Jack deixou recado pela manhã, via Silva: quer falar com Ren depois da
      comida sobre preço, patronos e silêncio.
      No escritório-carroça, Jack mostrou uma proposta escrita sem nome claro
      vinda do camarote oeste. A mensagem pede termos para apresentação privada
      de Kage em ambiente fechado, com convidados selecionados, pagamento
      adiantado possível e discrição. Jack considera isso proposta e insulto:
      querem comprar, mas ainda não querem assinar que querem comprar. Antes de
      responder, Jack pediu que Ren defina o que Kage não faz por dinheiro.
      Ren definiu que Kage só se apresenta em tenda controlada pelo circo, com
      equipe presente, segurança identificada, antecedência e sem reunião social,
      fala obrigatória, exposição pessoal, intimidação privada ou envolvimento
      dos Vell. Jack aceitou esses limites como política comercial útil e
      preparou resposta rígida ao camarote oeste: 40 PO pela primeira
      apresentação fechada curta, 20 PO adiantadas e custos de tenda, segurança
      e transporte por fora. A resposta ainda não foi selada porque chegou uma
      mensageira de Tyr pedindo Silva Elkwood por assunto de lacre reservado.
      Após a resposta de Silva a Tyr, Ren assinou como Ren Kage o acordo
      condicional de artista do circo, e Jack selou a resposta rígida ao
      camarote oeste. Em 4 Eleasis, por volta de 09:55, Ren retornou ao circo
      e procurou Jack para definir calendário de apresentações. Jack propôs não
      vender Kage naquele dia, considerar uma reprise curta de O Vento da Noite
      em 5 Eleasis ao cair da tarde, e só aceitar apresentação fechada em tenda
      controlada pelo circo se o camarote oeste cumprir os filtros já exigidos.
      Ren propôs confirmar uma pequena apresentação em 5 Eleasis e, depois
      disso, deixar a próxima particular para quem pagar melhor. Jack aceitou a
      linha comercial e a traduziu como escassez controlada: Kage raro, pouca
      fala, particulares filtrados, sem contato social direto.
      Antes da reprise curta de 5 Eleasis, Jack interceptou uma proposta
      privada sem nome claro tentando chegar diretamente a Kage e mencionando
      que a presença da gravadora não seria necessária se ele respondesse
      sozinho. Jack interpretou isso como tentativa de comprar erro, não
      apresentação, e decidiu filtrar a resposta para depois do número.
      Depois da reprise curta, Jack, Tobb, Silva, Sorn e Dessa impediram que o
      interessado privado furasse os filtros do pós-show. Uma segunda tira de
      papel chegou às mãos de Jack, dizendo que Kage vale mais depois do aplauso
      e que a gravadora vale menos se continuar cercada. Jack leu isso como
      veneno de negociação: não prova localização dos Vell, mas prova que alguém
      sabe qual palavra usar para pressionar Ren e o circo.
      Ren mandou Jack aceitar a proposta como isca e pedir caro. Jack escreveu
      resposta exigindo 80 PO pela primeira apresentação curta, 40 PO adiantadas,
      custos por fora, tenda e controle do circo, nome do pagador, casa
      responsável, endereço e hora por escrito, excluindo a gravadora de qualquer
      conversa. O envio funcionou apenas como trilha parcial: Ren viu a resposta
      passar por recadeiro pago e por cabriolé cinza-azulado sem brasão, mas não
      alcançou o mandante.
      Na manhã de 6 Eleasis, Jack pagou 8 PO a Ren pela reprise pública de Kage
      em 5 Eleasis. Também recebeu uma resposta escrita assinada por Corven Dalm,
      procurador da Casa Veyr, com 40 PO adiantadas e aceite parcial dos filtros
      rígidos. Jack reteve o adiantamento na própria caixa e não aceitou ainda a
      apresentação fechada: Tobb verifica a Casa Veyr, Dessa avalia a tenda menor
      e Silva pensa na proteção dos Vell. Jack aceitou o relato de Ren sobre a
      perseguição perdida do cabriolé como relatório limpo, por não transformar
      método observado em certeza inventada.
      Quando Ren respondeu que o show não pode parar, Jack tratou a frase como
      ensaio de aceite, não como autorização plena: se a apresentação ocorrer,
      será em lona dos Mooney, por entrada dos Mooney e com a equipe dos Mooney
      controlando convidados, lamparinas e conversa.
      Tobb verificou Casa Veyr em tempo útil: a casa existe como presença
      temporária pagante, com camarote/salão alugado e Corven Dalm como
      procurador que assina e paga, mas sem raiz nobre local forte. Jack está
      pronto para aceitar somente com filtros rígidos: pagamento final antes da
      primeira lamparina, assinatura de Dalm, convidados contados por Tobb,
      guardas posicionados pelos Mooney, veto a mexer em corda, pano, lamparina
      ou entrada de artista, nenhuma conversa privada com Kage fora da lona e
      cancelamento imediato se aparecerem gravadora, menino, Vell ou assunto
      alheio.
      Ren autorizou Jack a aceitar, prometendo proteger o circo. Jack aceitou a
      direção, mas não tomou a palavra de Ren como substituto dos filtros. A Casa
      Veyr respondeu com uma dobra contratual: pagamento final só com os
      convidados, assinatura de Corven Dalm apenas ao pisar na lona e um homem da
      casa junto da entrada de artistas. Jack tentou bloquear sem atrasar o show,
      mas não conseguiu; levou a decisão de volta a Ren. Ren decidiu prosseguir,
      e Jack transformou a exigência em procedimento controlado: Kage foi movido
      pela rota interna de panos/remendos, Dalm assinou antes de pisar na lona
      útil, Tobb contou as 40 PO restantes antes da entrada útil dos convidados e
      o homem da casa ficou em luz clara, perto da entrada dos artistas, mas sem
      controle da aba real.
      Durante a apresentação, Dalm testou o eixo nome/família/fogo; Jack cortou
      a provocação sem encerrar o show. Depois, Ren chamou Dalm publicamente ao
      camarim com referência a Masao e às dez lâminas. Jack permitiu a conversa por não
      conseguir bloquear a cena sem fazer Kage parecer controlado ou assustado,
      mas ficou descontente e improvisou salvaguardas com Tobb na aba.
      Após Dalm entregar a pista da Ponte Baixa, Ren pediu desculpas a Jack e
      relatou tudo para que a informação chegasse a Silva. Jack aceitou montar
      uma saída falsa de Kage com Dessa e Tobb para proteger o circo e a máscara
      pública, mas registrou que Ren lhe deve a quebra pública de filtro.
