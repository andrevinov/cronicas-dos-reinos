relacoes:
  edran_vale:
    nome: "Edran Vale"
    tipo: "contato local"
    local: "The Silver Lily"
    status: "ativo"
    atitude_para_ren: "cautelosa, tensa"
    confianca: "baixa"
    respeito: "inicial"
    motivo: >
      Ren pagou bem, não ameaçou a hospedagem, explicou seu uso da palavra
      "gaijin" e tratou Edran como possível aliado respeitável.
    acordos:
      - "Edran recebeu 1 PO por silêncio discreto sobre as perguntas de Ren na The Silver Lily."
    informacoes_compartilhadas_por_edran:
      - "Velis Rook pode saber mais sobre registros e movimentações na alfândega."
      - "Mara Tharle pode ter visto movimentação irregular de carga no pátio."
    riscos:
      - "A confiança ainda é comercial e frágil."
      - "Edran protege a própria casa antes de proteger Ren."
      - "Edran percebeu que Ren tentou parecer ter ficado no quarto, mas não confrontou o assunto além de um aviso discreto."
      - "Edran não entregou a moradia de Pell e deixou claro que reagirá mal se Ren machucar o rapaz ou trouxer violência para a rua da Silver Lily."
      - "Edran viu Ren deixar a Silver Lily com seus pertences logo depois da notícia do incêndio na Red Sail chegar à hospedagem."
  mara_tharle:
    nome: "Mara Tharle"
    tipo: "testemunha local"
    local: "pátio de carga de Ravens Bluff"
    status: "ativo"
    atitude_para_ren: "assustada e desconfiada"
    confianca: "muito baixa"
    respeito: "nenhum"
    motivo: >
      Ren abordou Mara furtivamente e a conteve fisicamente para impedir
      que o contato fosse percebido. Depois explicou sua busca por Masao e
      ofereceu pagamento, mas a abordagem deixou Mara com medo e raiva.
    informacoes_compartilhadas_por_mara:
      - "Uma caixa pequena e comprida saiu da fila antes de chegar a Narwhal Manor."
      - "Velis Rook estava presente e chamou a irregularidade de erro de contagem."
      - "Um homem de casaco com botões de latão observava os carregadores."
      - "Gente da Red Sail Tavern conhece o homem de botões de latão."
      - "Um rapaz perguntou por estrangeiro do leste com lâmina curta e rosto marcado."
    limites:
      - "Mara pediu que Ren não fosse à casa dela."
      - "Mara aceitou 1 PO pelo inconveniente e pelo silêncio."
    riscos:
      - "Mara pode evitar Ren no futuro."
      - "Se pressionada ou ameaçada, pode procurar a guarda ou contar a alguém do porto."
  velis_rook:
    nome: "Velis Rook"
    tipo: "escrivão menor ligado à alfândega / registros de carga"
    local: "Narwhal Manor"
    status: "em cena; alertado; convocação de Tyr entregue"
    atitude_para_ren: "assustada e hostil"
    confianca: "nenhuma"
    respeito: "nenhum"
    motivo: >
      Ren já havia roubado a prancheta de Velis durante o incêndio da Red Sail
      Tavern. Em Narwhal Manor, Ren derrubou uma lâmpada com shuriken para
      criar distração e tentou tomar a pasta de documentos de Velis. Velis
      evitou o impacto direto, segurou a pasta e chamou guarda. Em seguida,
      Ren arrancou a pasta à força e fugiu rápido demais para os guardas
      cercarem a lateral.
    informacoes_observadas_por_ren:
      - "Velis chegou à porta lateral de funcionários de Narwhal Manor com pasta rígida de couro encerado."
      - "Velis estava com dedos marcados por tinta nova."
      - "Ren viu na pasta: carimbo de Narwhal Manor, número 13 e a expressão 'retenção anulada'."
      - "Ren tomou a pasta de Velis, ainda não examinada."
      - "A pasta continha documentos que apontam Velis como responsável por anulação retroativa ligada ao volume 13."
      - "Tyr convocará Velis Rook para responder por anulação retroativa e possível obstrução."
      - "A primeira convocação de Tyr a Velis Rook foi entregue; Tyr espera resposta antes do meio-dia."
      - "Halessa recebeu três perguntas de Ren para possível uso na oitiva de Velis."
      - "Ren ouviu, perto da lateral da Casa de Tyr, uma mulher ligada a interesses de casa rica preparar Velis para negar instrução de patrono, chamar a anulação de correção de escrita, tratar a marca da lua como recebida e dizer que o 'oriental' era M. Harrow."
      - "Velis entrou na Casa de Tyr pouco antes do meio-dia; a mulher que o instruiu não entrou."
    riscos:
      - "Velis sabe que alguém tentou tomar seus papéis na porta lateral."
      - "Velis ainda não identificou Ren com certeza como o oriental que procura Masao, mas viu um rosto e uma mão perto demais da pasta."
      - "Velis pode avisar Narwhal Manor, Brass ou superiores de que a pasta foi roubada por alguém rápido e treinado."
      - "A convocação de Tyr pode fazê-lo cooperar, mentir sob pressão ou avisar superiores antes de chegar, dependendo de como a ordem o alcança."
      - "Se Tyr associar o homem de capuz visto no perímetro a Ren, Sirrus pode ler isso como tentativa de contornar a negativa de acompanhar a oitiva."
  kethra_dunn:
    nome: "Kethra Dunn"
    tipo: "funcionária de serviço de Narwhal Manor / fonte potencial"
    local: "Lavadouro dos Três Tanques, Rua da Cal; fonte interna em Narwhal Manor"
    status: "fonte prática potencial; Colm/Dent colocado em carroça; ponto morto de Narwhal removido após mensagem sobre ponte baixa"
    atitude_para_ren: "assustada, desconfiada, pragmática e operacionalmente aberta, mas não convertida à escala da ameaça"
    confianca: "baixa, mas real em termos práticos"
    respeito: "prático e cauteloso"
    motivo: >
      Ren identificou Kethra como candidata a fonte interna por circular em
      corredores de lacres, velas e panos borrados de Narwhal Manor sem ser
      tratada como escriba. Ela demonstrou inteligência prática ao corrigir
      contagem de material diante de um escrivão jovem. Ren a seguiu sem ser
      visto até uma loja de penhores/cobrança, onde dois homens exigiram oito
      peças de ouro ou nomes ligados às chamadas de Tyr, ameaçando alguém
      chamado Colm.
      Ren tentou abordá-la como estrangeiro perdido, revelou saber que ela
      estava com problemas e ofereceu 8 PO. A aproximação falhou em tranquilizar
      Kethra: ela não aceitou o ouro nem a proteção, mas também não chamou
      guarda e deixou uma abertura para encontro discreto.
      Na fonte seca atrás dos azulejos verdes, Ren esperou sem parecer
      emboscada e confirmou que o ponto não estava sob observação clara. Kethra
      compareceu, mas não aceitou a explicação ampla sobre ameaça maior em
      Ravens Bluff como motivo para confiar. Ela exigiu prova concreta:
      Colm Dunn, seu irmão, deve sair vivo da loja de Bram Vask sem que ela
      pareça ter vendido ninguém.
      Ren entrou na loja de Bram Vask com disfarce apressado, derrubou Noll
      de forma não letal, intimidou Bram, tomou o caderno de contas sujas e
      saiu pelos fundos com Colm vivo e capaz de andar.
      Ao tentar interceptá-la antes da loja, Ren errou o melhor ponto e ela
      quase chegou à curva final, mas ele conseguiu mover Colm sem atrair
      atenção útil. Kethra viu Colm vivo, reconheceu o valor do caderno de
      Bram e orientou Ren a escondê-lo no Lavadouro dos Três Tanques. Depois
      voltou para Narwhal para não ligar seu sumiço ao resgate.
      Após o turno, Ren reencontrou Kethra discretamente. A aproximação deixou
      uma lembrança possível em um aprendiz na lateral de Narwhal, mas Ren
      confirmou que Kethra não tinha cauda clara. Kethra visitou Colm no
      Lavadouro dos Três Tanques, ouviu de Sella que um rapaz já farejou a
      frase ligada ao esconderijo e aceitou tratar Ren como alguém útil, ainda
      que não plenamente confiável.
      Ren contou a Kethra sobre Aiko, Masao Hirasawa, o selo e sua vingança,
      sem revelar outros protegidos. Kethra acreditou na dor dele e no perigo
      real ao redor de Narwhal, Brass, Velis e a lua, mas não aceitou a escala
      de uma ameaça à cidade inteira sem provas mais visíveis. Ela não possui
      parente viável no interior capaz de receber Colm agora, embora exista
      sangue distante para o lado do Fire River. A colaboração dela continua
      presa à segurança concreta de Colm.
      Ren tirou Colm do lavadouro sob o manto roto de mendigo, usando o nome
      de cobertura Dent, e pagou Dorra Hest para levá-lo numa carroça dos
      fornos de cal do Fire River antes da primeira luz de 4 Eleasis. Kethra
      não acompanhou a saída para não ligar seu rosto ao deslocamento.
      Ren voltou para avisá-la sobre Dorra, Dent, os fornos de cal e a primeira
      luz. Kethra recusou mensagens diárias por criarem padrão perigoso, mas
      aceitou usar um vaso rachado nos fundos de Narwhal Manor como ponto morto
      quando houver informação real ou perigo urgente ligado a Bram.
      Na manhã de 4 Eleasis, Ren foi aos pátios e pagou 1 PO por informação.
      Soube que Dorra saiu no cinza, provavelmente com Dent sob a lona, mas que
      alguém perguntou por um doente vindo do lavadouro antes da partida. Kethra
      ainda não sabe disso em cena. Depois Ren montou fisicamente o ponto morto
      combinado nos fundos de Narwhal Manor e deixou mensagem dizendo que Colm
      foi com a cal, que Bram recebeu guarda e recado para parar, e que o amigo
      está seguro por algum tempo. A entrega foi feita, mas o vaso ficou com
      sinais discretos de manipulação.
      No meio da tarde de 4 Eleasis, Kethra respondeu pelo vaso: não sabe se
      Dent chegou; depois do peixe, Narwhal tremeu; a mulher de manto
      cinza-azulado mandou o corredor treze não falar de tintureiro, cesto ou
      barril; e Kethra ouviu nos fundos a frase "se a boca abriu no mercado,
      olhem a ponte baixa". Ren desmontou o ponto morto com cuidado, removendo
      a cera e a migalha cinza.
      Na manhã de 6 Eleasis, Ren voltou à lateral de serviço de Narwhal Manor
      sob o Broche do Semblante Humilde e conseguiu falar brevemente com Kethra
      usando a frase "sabão preto para pano azul". Kethra não recebeu notícia de
      Colm/Dent e não conseguiu nova informação concreta desde a última mensagem.
      Ela percebe apenas silêncio excessivo no corredor treze, cestos contados
      com mais cuidado e gente evitando falar de tintureiro, cesto ou barril.
      Ren dispensou Kethra antes que a ausência dela chamasse atenção. Kethra
      avisou que, se Ren procurar Dorra, não deve usar o nome dela antes de saber
      quem está ouvindo nem procurar Dent alto demais.
    informacoes_observadas_por_ren:
      - "Kethra apara velas, recolhe cera, leva areia limpa e panos borrados, e cruza corredores onde portas de lacre e registro podem fechar mal."
      - "Ela sabe contar e ler o bastante para corrigir lista de material."
      - "Dois homens exigiram dela oito peças de ouro ou uma lista de nomes ligados às chamadas de Tyr."
      - "Os cobradores ameaçaram alguém chamado Colm."
      - "Kethra avisou que pagar diretamente os cobradores pode aumentar o preço."
      - "Kethra mencionou a fonte seca atrás dos azulejos verdes como possível ponto discreto quando o sino menor tocar antes do segundo sino."
      - "Kethra revelou que Colm Dunn é seu irmão e está preso por dívida/trabalho no alto da loja de Bram Vask."
      - "Kethra revelou que Noll é o homem do lábio cortado e funciona como mão de Bram."
      - "Kethra disse que a escada dos fundos da loja dá para um corredor com cheiro de couro molhado e que a janela alta abre para telhado baixo de telhas vermelhas."
      - "Kethra disse que Velis não voltou à mesa dele depois de Tyr, mas a mulher de manto cinza-azulado mandou retirar do prédio a gaveta de areia, cera e panos do corredor treze."
      - "Colm saiu vivo da loja de Bram Vask."
      - "Kethra viu Colm vivo antes de entrar na loja de Bram."
      - "Kethra avaliou que o caderno de contas de Bram não elimina o risco, mas põe uma coleira temporária nele."
      - "Kethra orientou Ren a levar Colm aos fundos do Lavadouro dos Três Tanques, na Rua da Cal."
      - "Frase de identificação para o lavadouro se houver gente por perto: 'sabão preto para pano azul'."
      - "Kethra não ouviu o nome Masao Hirasawa em Narwhal."
      - "Kethra ouviu referências a 'hóspede', 'homem da lua' e à versão preparada de M. Harrow."
      - "Kethra avalia que Velis Rook escreve, corrige, assina e treme, mas não parece mandante."
      - "Kethra disse que a gaveta de areia, cera e panos do corredor treze saiu de Narwhal em cesto de roupa suja com nó de tira amarela rumo à rua dos tintureiros."
      - "Kethra sabe que recados do homem dos botões de latão chegam a Narwhal sem que ele entre pela frente como convidado."
      - "Kethra ouviu de Ren a história de Aiko, Masao Hirasawa, o selo e a vingança de Ren, mas não ouviu sobre outros protegidos dele."
      - "Kethra não tem parente viável no interior capaz de receber Colm agora; há sangue distante para o lado do Fire River, mas nenhuma porta segura."
      - "Kethra acredita que Masao é perigo real para Ren e para a trama que toca Narwhal, mas não foi convencida de que a cidade inteira esteja diante de um reino de terror."
      - "Kethra aceita continuar ouvindo Narwhal se Colm receber uma solução prática antes que o lavadouro deixe de ser seguro."
      - "Kethra sabe que Ren entregou seu manto roto a Colm, deu a ele o nome Dent e pagou 7 PO a Dorra Hest para levá-lo aos fornos de cal do Fire River."
      - "Kethra pediu que Ren não use o nome dela ao procurar Dorra antes de saber quem está ouvindo."
      - "Kethra alertou que procurar Dent alto demais pode transformar esconderijo em rastro."
      - "Kethra memorizou Dorra Hest, Dent, fornos de cal do Fire River e saída antes da primeira luz de 4 Eleasis."
      - "Kethra recusou mensagens diárias; ela só deixará mensagem quando houver algo útil ou perigo."
      - "Ponto morto acordado: vaso rachado junto dos barris de areia e da calha quebrada nos fundos de Narwhal Manor."
      - "Protocolo do vaso: mensagem sob o fundo presa com cera cinza; rachadura para a rua significa perigo urgente ligado a Bram; rachadura para a parede significa nada; se o vaso sumir, o caminho morreu."
      - "Ren montou fisicamente o ponto morto na manhã de 4 Eleasis e deixou a rachadura voltada para a parede, com mensagem de que Colm/Dent foi com a cal e Bram recebeu pressão da guarda e recado."
      - "Kethra deixou mensagem pelo ponto morto dizendo que não sabe se Dent chegou."
      - "Kethra ouviu que, depois do peixe, Narwhal tremeu e a mulher de manto cinza-azulado mandou o corredor treze não falar de tintureiro, cesto ou barril."
      - "Kethra ouviu nos fundos de Narwhal a frase: 'se a boca abriu no mercado, olhem a ponte baixa'."
      - "Ren desmontou o ponto morto de Narwhal sem deixar novo padrão útil."
      - "Na manhã de 6 Eleasis, Kethra ainda não tem notícia de Colm/Dent."
      - "Kethra não ouviu nova informação concreta em Narwhal desde a pista da ponte baixa."
      - "Kethra percebe que o corredor treze está quieto demais e que termos ligados a tintureiro, cesto e barril viraram assunto evitado."
    riscos:
      - "Kethra interpretou parte da oferta inicial de Ren como possível nova cobrança ou ameaça."
      - "A loja de penhores/cobrança pode ser agiotagem comum, fachada de recados ou ligação com gente interessada nas chamadas de Tyr."
      - "Bram pode tentar punir Kethra se concluir que ela vendeu informação."
      - "Kethra deve colaborar com Ren com mais abertura se Colm permanecer seguro e se Bram não ligar o resgate a ela."
      - "Um aprendiz na lateral de Narwhal pode lembrar de um mendigo se movendo quando Kethra saiu do turno."
      - "A saída de Colm do lavadouro deixou uma pista fraca: uma menina viu dois vultos indo dos Três Tanques aos pátios de carroças."
      - "A volta de Ren até Kethra deixou outra pista fraca: um homem velho nos pátios viu Ren sair da área da carroça de cal e depois tomar direção da Rua da Cal."
      - "Ren soube depois, por um trabalhador dos pátios, que alguém perguntou por um doente vindo do lavadouro antes da carroça de Dorra sair."
      - "A montagem inicial do ponto morto de Kethra ficou imperfeita: o vaso tem sinais discretos de manipulação e cera cinza visível de perto."
      - "Se Colm for encontrado ou não chegar aos fornos de cal, a colaboração de Kethra pode quebrar por medo ou necessidade."
      - "O ponto morto de Narwhal morreu; novo contato com Kethra exigirá conversa discreta e novo protocolo."
      - "Se Ren tratar a dor e a vingança como prova suficiente para Kethra, ela tende a recuar para demandas concretas e imediatas."
      - "Contatos presenciais na lateral de Narwhal continuam arriscados: o Broche ajudou nesta manhã, mas repetição pode criar padrão."
  colm_dunn:
    nome: "Colm Dunn"
    tipo: "irmão de Kethra Dunn / devedor explorado"
    local: "última informação conhecida por Ren: provavelmente sob a lona da carroça de Dorra Hest, rumo aos fornos de cal do Fire River"
    status: "provavelmente saiu de Ravens Bluff com Dorra Hest, mas a saída foi comprometida e segurança não está confirmada"
    atitude_para_ren: "assustado, confuso, mas menos perdido após ver Kethra"
    confianca: "baixa por necessidade"
    respeito: "baixo, misturado com medo"
    motivo: >
      Colm foi mantido no alto da loja de Bram Vask como devedor por
      dívida/trabalho. Ren o encontrou atrás de porta com trinco externo após
      intimidar Bram e neutralizar Noll. Colm perguntou primeiro por Kethra,
      demonstrando que não sabe ainda se foi salvo, vendido ou transferido
      para outro cobrador.
      Depois de ver Kethra brevemente na rua, Colm obedeceu à orientação dela
      e deixou Ren conduzi-lo ao Lavadouro dos Três Tanques. Sella Rove o
      escondeu temporariamente no quarto da lenha.
      Kethra visitou Colm no lavadouro depois do turno. A presença dela ajudou
      Colm a entender que Ren não era apenas outro cobrador, mas o esconderijo
      começou a ficar inseguro depois que um rapaz farejou a frase ligada a
      Sella.
      Ren propôs tirar Colm da cidade amanhã, 4 Eleasis, por uma carroça comum.
      Kethra não tem parente viável para recebê-lo, e Sella só oferece uma
      janela ruim até antes da primeira luz, escondendo Colm atrás da caldeira
      velha em vez do quarto da lenha.
      Ren então moveu Colm imediatamente para os pátios de saída, entregou seu
      manto roto como disfarce, deu a ele o nome de cobertura Dent e pagou 7 PO
      a Dorra Hest para levá-lo aos fornos de cal do Fire River. Na manhã de
      4 Eleasis, Ren pagou 1 PO por informação nos pátios e ouviu que Dorra saiu
      no cinza, provavelmente com Dent sob a lona, mas que alguém havia
      perguntado por um doente vindo do lavadouro antes da partida.
    informacoes_observadas_por_ren:
      - "Colm tem dois dedos inchados e tortos."
      - "Colm tem tosse seca."
      - "Colm está fraco e assustado, mas consegue andar."
      - "Colm sabe que Kethra é relevante para sua situação, mas ainda não sabe o papel de Ren."
      - "Colm viu Kethra viva e ouviu dela que não deve ir para casa, Narwhal ou Tyr pela porta da frente."
      - "Colm está escondido no quarto da lenha do Lavadouro dos Três Tanques, mas o local deixou de ser seguro até o escurecer."
      - "Colm diz que consegue andar, mas Kethra avalia que ele só consegue andar devagar."
      - "Colm recebeu o nome de cobertura Dent."
      - "Colm está usando o manto roto de mendigo que era de Ren."
      - "Última informação conhecida por Ren: Colm/Dent provavelmente saiu sob a lona da carroça de Dorra Hest."
      - "Dorra Hest saiu dos pátios no cinza, rumo aos fornos de cal do Fire River."
      - "Um trabalhador dos pátios ouviu Dorra chamar o protegido de Dent e acredita que havia peso de homem sob a lona quando a carroça saiu."
    riscos:
      - "Colm pode entrar em pânico se achar que Ren é apenas outro agiota."
      - "Colm e Kethra continuam vulneráveis se Bram descobrir onde encontrá-los ou vender a informação a terceiros."
      - "Levar Colm diretamente até Kethra pode expor a fonte se houver observadores."
      - "A saída de Colm/Dent dependeu da discrição de Dorra Hest até a partida, e essa discrição falhou parcialmente."
      - "Um rapaz já perguntou pela frase ligada ao lavadouro; se a pista for comprada depressa, pode apontar para a área dos pátios de carroças."
      - "Mesmo fora da cidade, sem destino confiável, Colm só compra tempo; ele ainda pode ser encontrado por cobrança, fome ou doença."
      - "Alguém perguntou por um doente vindo do lavadouro antes de Dorra sair; Colm/Dent pode estar em risco mesmo se tiver deixado Ravens Bluff."
  sella_rove:
    nome: "Sella Rove"
    tipo: "lavadeira / contato de Kethra"
    local: "Lavadouro dos Três Tanques, Rua da Cal, Lower Trades"
    status: "ativa; ajudou a preparar a saída de Colm/Dent do lavadouro"
    atitude_para_ren: "desconfiada e prática"
    confianca: "nenhuma"
    respeito: "nenhum"
    motivo: >
      Kethra indicou Sella Rove como pessoa capaz de esconder Colm por algumas
      horas nos fundos do Lavadouro dos Três Tanques. Sella aceitou Colm no
      quarto da lenha após reconhecer a senha indireta e o peso do caderno de
      Bram Vask, mas não fez perguntas abertas.
      Depois do turno de Kethra, Sella informou que um rapaz passou perguntando
      se ali se lavava pano azul com sabão preto. Ela desviou o rapaz, mas
      deixou claro que Colm não pode ficar ali quando a noite trouxer gente
      procurando lugar quente para beber e cobrar.
      Após Ren propor uma saída de Ravens Bluff em 4 Eleasis, Sella ofereceu
      uma solução ruim e temporária: mudar Colm do quarto da lenha para trás da
      caldeira velha, sob lona de carvão e barril de cinza, somente até antes
      da primeira luz.
      Ren decidiu mover Colm imediatamente. Sella preparou embrulho simples de
      comida e abriu uma saída lateral de cinza, mas a movimentação ainda
      deixou uma lembrança fraca numa menina da rua.
      Quando Ren voltou para dar boa notícia a Kethra, Sella alertou que boa
      notícia também deixa pegada, reforçando que o lavadouro não deve virar
      ponto de retorno frequente.
    informacoes_observadas_por_ren:
      - "Sella Rove é uma mulher de braços fortes e cabelo grisalho preso."
      - "Ela controla ou trabalha nos fundos do Lavadouro dos Três Tanques."
      - "A frase 'sabão preto para pano azul' funciona como identificação ligada a Kethra."
      - "Sella aceitou esconder Colm temporariamente no quarto da lenha."
      - "Sella desviou um rapaz que perguntou pela frase 'pano azul com sabão preto'."
      - "Sella pode esconder Colm atrás da caldeira velha até antes da primeira luz de 4 Eleasis, mas não depois."
      - "Sella preparou pão, queijo seco, água e uma agulha torta com linha para Colm/Dent."
      - "Sella abriu uma saída lateral para reduzir a ligação direta entre Colm e a porta principal do lavadouro."
      - "Sella avisou Ren que voltar ao lavadouro para dar boa notícia também cria rastro."
    riscos:
