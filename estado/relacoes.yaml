  corven_dalm:
    nome: "Corven Dalm"
    tipo: "procurador da Casa Veyr / contratante da apresentação fechada de Kage"
    local: "guarda-roupa menor / camarim funcional de Kage, Jack Mooney & Sons Circus"
    status: "em cena; a sós com Ren/Kage, com Tobb do lado de fora"
    atitude_para_ren: "polida, provocadora e calculista"
    confianca: "nenhuma"
    respeito: "tático inicial pela competência e audácia de Kage"
    motivo: >
      Corven Dalm assinou como procurador da Casa Veyr e pagou a apresentação
      fechada de Kage por meio de filtros formais, mas sua proposta tentou
      retirar intermediários da conversa artística. Durante o número, provocou
      Kage com frases sobre nome curto, brasões, fogo e sobrevivência, medindo
      reação emocional sem romper imediatamente o contrato. Ren não entregou a
      primeira reação, mas depois chamou Dalm ao camarim com referência direta a
      Masao e às dez lâminas. Dalm não demonstrou reação visível diante dos convidados,
      aceitou o convite e, no camarim, comentou que Ren diz Masao como
      quem perdeu algo para ele.
      Quando Ren abandonou o sotaque de Kage e exigiu saber para quem Dalm veio
      avaliá-lo, Dalm não entregou o patrono real por trás da Casa Veyr. Ele
      percebeu que a voz de Kage é máscara performática e respondeu que veio
      medir sombra, gravadora e reação a Masao.
      Diante de nova pressão mais negociada de Ren, Dalm continuou protegendo o
      patrono real, mas entregou uma janela acionável: antes da segunda maré,
      Ponte Baixa como passagem baixa e seca atrás de armazéns velhos, método
      por papéis antes de lâminas e escopo provável do conhecimento inimigo
      sobre a gravadora e o menino.
    informacoes_observadas_por_ren:
      - "Dalm é o procurador que assinou pela Casa Veyr na apresentação fechada."
      - "Dalm conhece ou reconhece o suficiente da referência a Masao para comentar a pronúncia de Ren em privado."
      - "Dalm manteve compostura perfeita diante da referência pública a Masao."
      - "Dalm aceitou entrar sozinho no camarim funcional de Kage, enquanto seu homem foi impedido de acompanhar."
      - "De perto, Dalm não parece um nobre mole ou puramente ornamental; sua ameaça mais clara é social, contratual e informacional."
      - "Dalm percebeu que o sotaque de Kage é performático e que Ren tem outro registro de voz por baixo."
      - "Dalm declarou que veio medir se a sombra era truque, se a gravadora era corrente e se Masao era lâmina na mão de Ren ou anzol em sua garganta."
      - "Dalm disse que a janela relevante é antes da segunda maré."
      - "Dalm disse que Ponte Baixa é passagem/porta/garganta de pedra, não ponte vista de cima."
      - "Dalm apontou seco onde deveria haver água, atrás dos armazéns velhos."
      - "Dalm disse que a rede sabe que existe uma gravadora e um menino como alavanca, mas ainda não sabe onde eles dormem."
    riscos:
      - "Dalm pode estar tentando separar Kage dos filtros de Jack sem quebrar contrato em público."
      - "A conversa privada pode virar proposta, chantagem, teste de verdade ou tentativa de mapear a ligação entre Kage, Masao e a gravadora."
      - "A falta de reação visível de Dalm à referência a Masao não prova ignorância."
      - "Ren não conseguiu determinar se Dalm fala por Masao, contra Masao ou por alguém local usando o nome como ferramenta."
      - "A pista da Ponte Baixa pode ser informação real e também rota preparada para observar ou testar Ren."
  dessa_wren:
    nome: "Dessa Wren"
    tipo: "costureira prática / guarda-roupa menor do circo"
    local: "Jack Mooney & Sons Circus"
    status: "conhecida em jogo"
    atitude_para_ren: "pragmática, irônica e cooperativa por pagamento"
    confianca: "baixa"
    respeito: "profissional inicial"
    motivo: >
      Ren procurou Dessa ao amanhecer, apresentou-se como novo acrobata e
      colocou 1 PO na mesa pedindo roupas discretas para um homem, uma mulher
      e um garoto. Dessa entendeu que era roupa de fuga, aceitou a moeda como
      pagamento pelo susto e pelo silêncio, e montou disfarces comuns e
      esquecíveis para os três. Ren pagou mais 1 PO para que roupas roubadas e
      roupas de doação virassem retalho, e mais 1 PO para que suas roupas
      próprias fossem guardadas como figurino estrangeiro.
      Mais tarde, Ren voltou ao guarda-roupa menor carregando a pasta lacrada
      por Maerra. Dessa percebeu que ele pretende ir a um lugar formal e ofereceu
      duas apresentações: roupas próprias orientais, memoráveis e honestas
      quanto à identidade, ou conjunto limpo de cidadão menor com faixa interna
      para esconder a pasta. Ren escolheu o cidadão menor, pagou 1 PO pela roupa
      e pela limpeza de suas roupas próprias, e descreveu uma futura roupa de
      apresentação com obi espetacular inspirado em Kara-Tur.
      Ren explicou a Dessa a ideia de O Vento da Noite, uma lenda de Kara-Tur
      inspirada em Ame-no-Wakahiko. Dessa não possui guia confiável de
      vestimentas orientais nem shamisen disponível em Ravens Bluff nesse prazo,
      mas aceitou montar uma versão teatral viável com robe negro, máscara
      inteira, panos branco/preto para vento e noite, lanternas, música local
      adaptada e narração curta.
      Após ver a demonstração de Ren, Dessa definiu uma lógica de cena:
      pano branco primeiro, pano preto baixo, lanternas por trás, flauta no
      salto, tambor no pouso, e Merrit falando pouco.
      Dessa finalizou o figurino de O Vento da Noite para Ren: camadas negras,
      faixa escura com desenho de vento, tecido branco oculto para giros,
      mangas falsas e máscara parcial de entrada. Também preparou o pano preto
      de Lysa como Princesa das Sombras. O figurino funcionou em cena sem
      atrapalhar pousos, giros ou a leitura pública do personagem.
      Após o número, Dessa avaliou a roupa como bem-sucedida, mas advertiu Ren
      a não encostar, sentar ou deixar o figurino perto de público bagunçado
      enquanto ainda precisa sustentar a imagem de Kage.
      Depois do fechamento do Benefício, Dessa recolheu o figurino de O Vento
      da Noite antes do banho de Ren, tratando as costuras como ativo valioso.
      Antes da reprise curta de 5 Eleasis, Dessa vestiu Ren novamente como Kage,
      conferiu costuras e advertiu que qualquer heroísmo fora da marcação pode
      arruinar o figurino e a segurança do número.
      Durante a reprise curta, o figurino segurou a margem apertada do salto com
      Passo do Vento. Depois, Dessa puxou Ren para trás da lona antes que a
      máscara pudesse virar conversa com público ou interessado privado.
      Na tarde de 6 Eleasis, Dessa preparou Ren para a apresentação fechada da
      Casa Veyr como Kage particular: menos caro, mais difícil de comprar. Ela
      ajustou o figurino para preservar medo e silêncio em vez de ostentação. Na
      abertura da apresentação, o figurino acompanhou bem o Passo Sombrio: o
      pano atrasado fez a técnica parecer ainda mais impossível sem revelar o
      trabalho de bastidor.
      Depois da conversa de Ren com Dalm, Dessa ajudou a montar uma troca rápida:
      Tobb como silhueta falsa de Kage retornando ao controle dos Mooney e Ren
      saindo em roupas de carreiro/Tobb.
    informacoes_compartilhadas_por_dessa:
