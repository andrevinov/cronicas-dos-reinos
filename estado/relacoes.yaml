  maerra_thandrel:
    nome: "Irmã Maerra Thandrel"
    tipo: "sacerdotisa de Lathander / abrigo potencial"
    local: "Casa da Aurora Menor, Temple District"
    status: "ativa, em cena; abrigo provisório concedido às sete crianças resgatadas"
    atitude_para_ren: "cautelosa, disposta a agir, moralmente firme e mais aberta após o resgate de Peta"
    confianca: "moderada-alta em pauta de proteção de vulneráveis"
    respeito: "cauteloso, crescente"
    motivo: >
      Nera recomendou Maerra como alguém realmente compassiva. Ao receber
      Nera e Tavin de madrugada, Maerra percebeu Ren armado atrás deles, mas
      não tocou o sino nem chamou ajuda. Após ouvir Ren e o nome Brass,
      aceitou esconder Nera e Tavin por enquanto. Após a confissão de Ren
      sobre Masao, Aiko e vingança, Maerra acreditou na sinceridade essencial
      dele, mas deixou claro que a Casa da Aurora Menor protege vivos, não
      vendetas. Quando Ren apagou, Maerra o deitou num catre, manteve armas
      e provas à vista, e protegeu Nera e Tavin afastando-os da porta.
      Depois da emboscada contra Rusk em Fishtown, Ren voltou à Casa da Aurora
      Menor sem cauda e avisou que Nera e Tavin estão vivos sob proteção de
      Silva Elkwood e Jack Mooney. Maerra recebeu a notícia com alívio contido
      e emprestou roupas comuns de doação, água e pão, mas não vestes sagradas.
      Depois que Ren evacuou os Vell do circo durante a sondagem da Red Sail,
      voltou à Casa da Aurora Menor com Nera e Tavin sem cauda. Maerra avaliou
      Luath como contato honrado e útil da Night Watch, mas recomendou que Ren
      não entregue Nera e Tavin de imediato e não tente usar Luath como faca de
      vingança.
      Ren pediu que Maerra mantivesse Nera e Tavin enquanto ele falava com
      Luath. Maerra aceitou e entregou a Ren a cópia parcial selada do livro de
      provas como verdade verificável.
      Quando Ren voltou com a pasta roubada de Velis Rook, Maerra o conduziu à
      saleta de ervas, permitiu que respirasse, mas enquadrou a situação como
      problema arrancado de Narwhal Manor. Depois ofereceu um fio lateral
      futuro: investigar os Meninos do Primeiro Sino e a Casa Velha do Primeiro
      Raio, com possível empréstimo do Broche do Semblante Humilde se for
      recuperado e puder servir para proteger vivos.
      Ao ver a pasta aberta, Maerra identificou valor probatório e perigo legal:
      a prova é forte, mas foi roubada. Ela avalia que Luath ou uma autoridade
      de Tyr precisam legitimá-la antes que Narwhal transforme Ren e Nera nos
      acusados principais.
      A pedido de Ren, Maerra tentou reconhecer o material, mas manteve limites:
      escreveu declaração cautelosa sobre o que viu e ouviu na abertura da
      pasta, registrou que Nera reconheceu a impressão da lua velada e lacrou o
      conjunto com cera da Casa da Aurora Menor. Ela não atestou cadeia de
      custódia, autoria final ou inocência.
      Na madrugada de 4 Eleasis, Ren levou seis crianças resgatadas da Casa
      Velha do Primeiro Raio à Casa da Aurora Menor, entregou a caixa velha
      marcada por sol apagado e relatou Peta sendo provavelmente levada pela
      pessoa de vermelho. Maerra acolheu as crianças, reconheceu o Broche do
      Semblante Humilde dentro da caixa e cedeu o broche a Ren como empréstimo
      provisório para proteger vivos.
      Ren voltou pouco depois, por volta de 01:05 de 4 Eleasis, trazendo Peta
      viva, presa e amordaçada, disfarçada como carga de retalhos úmidos sob o
      Broche do Semblante Humilde. Maerra colocou Ren e a criança para dentro
      sem fazer pergunta na porta, iniciou atendimento imediato e perguntou
      quantos vieram atrás.
      Ren contou sobre a mulher de vermelho, sua cicatriz, a marca de sol
      apagado no pescoço, a manga cinza, a mão com dois anéis, a barra de ferro
      e a abertura baixa atrás da cortina. Maerra não reconheceu a mulher nem a
      marca com segurança, mas avaliou que o sol apagado parece deboche ou
      apropriação cruel de símbolo ligado a amanhecer. Peta, em choque, só
      conseguiu dizer fragmentos: frio, embaixo, e que a mulher de vermelho não
      falava com ela. Maerra permitiu que Ren dormisse pouco, deu água e pão, e
      indicou que poderá mandar palavra curta a Luath se necessário. Antes do
      amanhecer, recebeu ajuda discreta enviada por Silva/Chauntea, com pano,
      comida simples e mãos caladas, sem chamar atenção útil. Na manhã de 4
      Eleasis, Ren voltou para falar com as crianças. Maerra permitiu perguntas
      curtas, uma criança por vez, e encerrou a conversa quando Peta começou a
      tremer novamente. Peta lembrou que a pessoa de vermelho não mandava,
      apenas fazia; que havia um homem de manga cinza e dois anéis falando por
      trás; que ele mencionou papel para o peixe e máscara não ser para o sol; e
      que ela ficou em lugar frio, embaixo de onde passavam rodas, com água na
      parede.
      No começo da noite de 4 Eleasis, Ren voltou à Casa da Aurora Menor apenas
      para verificar as crianças, sem interrogá-las de novo e sem trazer cauda
      útil. Maerra permitiu a visita breve, confirmou que as sete continuam
      vivas, alimentadas e protegidas, e reconheceu que Ren parecia ter escolhido
      não fazer algo violento.
      Na noite de 6 Eleasis, Ren voltou antes de ir à Ponte Baixa, relatou a
      pista de Dalm sobre Masao, segunda maré, porões secos, papéis antes de
      lâminas, gravadora e menino, e pediu conselho. Maerra não tentou impedi-lo,
      mas enquadrou a janela como moldura: quem entrega uma janela escolhe o que
      Ren vê por ela. Aconselhou-o a desconfiar do seco onde deveria haver água,
      procurar sinais como cal, sal, carvão, pano encerado, ar quente, ralo
      tampado e preservação de papel, e deixar caminho de volta ou marca para
      Luath.
    riscos:
      - "Se Ren parecer ameaça para Nera e Tavin, Maerra pode tentar separá-los dele."
      - "Maerra tende a priorizar segurança das testemunhas antes da vingança privada de Ren."
      - "Maerra não quer a Casa da Aurora Menor usada como esconderijo passivo para crime sem avaliação moral."
      - "Se Ren insistir em agir sozinho com a pasta roubada, Maerra pode pressionar por encaminhamento a Luath ou Tyr."
    encaminhamentos_oferecidos:
      - "Silva Elkwood, clériga de Chauntea ligada ao circo dos Mooney, como abrigo discreto para Nera e Tavin."
      - "Sirrus Melandor/Tyr como proteção formal e institucional."
      - "Ways Unknown como opção de sumiço pago, menos pastoral e menos transparente."
    auxilios_prestados:
      - "Emprestou roupas comuns de doação, água e pão para Ren se disfarçar melhor antes de voltar ao circo."
      - "Avaliou Luath como contato prático e honrado dentro da City Guard/Night Watch."
      - "Orientou Ren a procurar Luath com verdade verificável, não com confissão completa de vingança."
      - "Aceitou manter Nera e Tavin temporariamente enquanto Ren procura Luath."
      - "Entregou a Ren a cópia parcial selada do livro de provas de Nera."
      - "Ofereceu o fio lateral dos Meninos do Primeiro Sino e da Casa Velha do Primeiro Raio."
      - "Indicou a possibilidade de pedir o empréstimo do Broche do Semblante Humilde se Ren recuperar o relicário antigo e usar a ferramenta para proteger pessoas."
      - "Escreveu declaração cautelosa sobre a abertura da pasta de Velis e lacrou o conjunto com cera da Casa da Aurora Menor."
      - "Corrigiu Ren: Silva é guardiã atual confirmada/registrada em trilha reservada, não guardiã legal plena."
      - "Colocou em curso ficha curta a Halessa alertando para risco de Velis ter sido instruído antes da oitiva, sem nomear Ren como ouvinte."
      - "Aconselhou Ren a deixar Tyr trabalhar Velis por ora, preparar a Casa Velha para a noite com foco em crianças vivas e rotas, e avisar Silva que o meio-dia passou sem transferência dos Vell."
      - "Acolheu seis crianças resgatadas da Casa Velha na madrugada de 4 Eleasis."
      - "Acolheu Peta depois que Ren a resgatou da oficina dos tintureiros."
      - "Permitiu que Ren falasse com as crianças na manhã de 4 Eleasis, sob limite rígido de cuidado."
      - "Reconheceu o Broche do Semblante Humilde dentro da caixa velha marcada por sol apagado."
      - "Cedeu o Broche do Semblante Humilde a Ren como empréstimo provisório para proteger vivos."
      - "Identificou o pano vermelho como pano de trabalho encerado ligado a tintureiro ou cerieiro."
      - "Permitiu visita breve de Ren às crianças no começo da noite de 4 Eleasis, sem novo interrogatório."
      - "Aconselhou Ren antes da Ponte Baixa: desconfiar do seco onde deveria haver água, procurar cal, sal, carvão, pano encerado, ar quente, ralo tampado e sinais de preservação de papel, além de deixar marca ou caminho de volta para Luath."
  luath:
    nome: "Luath"
    tipo: "sargento da City Guard / supervisor possível da Night Watch"
    local: "posto da City Guard / Night Watch"
    status: "contato operacional cauteloso"
    atitude_para_ren: "cautelosa, direta e avaliadora"
    confianca: "baixa operacional"
    respeito: "prático crescente, contido por cautela"
    motivo: >
      Maerra Thandrel descreveu Luath como honrado de modo prático: um homem
      que cumpre dever, não vende gente pobre por conveniência e entende que a
      cidade tem sujeira sob as aparências. Ele é útil como ponte para a Night
      Watch e para rua, não como instrumento direto da vingança de Ren.
      Ren chegou ao posto da City Guard/Night Watch ao amanhecer carregando a
      cópia parcial selada por Maerra. Luath estava disponível, observou mãos,
      cintura, trouxas e saídas antes de perguntar o nome de Ren e se ele veio
      trazer, fugir ou vender problema.
      Ren entregou o documento e disse que vinha deixar recado a pedido de
      amigo de fé. Luath reconheceu o peso prático de Maerra o bastante para
      criar privacidade, mas não confiou automaticamente em Ren. Levou Ren a um
      depósito lateral e pediu fatos sobre gente viva em risco nas próximas
      horas, sem poesia, juramento ou nomes grandes antes dos pequenos.
      Ren então revelou o próprio nome, origem, Masao Hirasawa, o assassinato
      de Aiko e a ameaça contra a seladora e o irmão dela. Luath aceitou que há
      risco civil imediato e acionou patrulheiros contra as buscas ostensivas
      da Red Sail como perturbação da paz, intimidação e usurpação de
      autoridade. Ao mesmo tempo, deixou claro que ajudará nos vivos, não na
      caça pessoal de Ren.
      Ren respondeu com informações práticas: a pressão atual acontece no
      circo de Jack Mooney; Dain Mord é conhecido como Brass; e o protocolo de
      contato envolve ficha de cobre, vela vermelha e cordão azul. Luath
      reconheceu Dain Mord como nome útil, aceitou não mandar guarda abrir baús
      e carroças no circo sem ordem ou flagrante e enviou patrulheiros para
      pressionar buscas ilegais da Red Sail nas ruas e acessos. Ele segue
      cauteloso com a vendeta de Ren e avisou que ajudará com provas e
      testemunhas, não com corpos.
      Ao sair, Ren afirmou que Masao Hirasawa não merece cela. Luath não
      retirou a ajuda contra a Red Sail, mas registrou Ren com mais força como
      risco de justiça privada.
      Mais tarde, Ren retornou ao posto em perfil discreto, usando a cobertura
      pública de artista, para pedir apoio ao Benefício da Lona Aberta como
      questão de ordem pública. Luath recusou compromisso formal da Night Watch
      e proibiu uso do nome da guarda em anúncio, mas ofereceu uma via limitada:
      com aviso escrito de Jack e assinatura comunitária/temporal de Silva ou
      outro nome de templo, pode fazer ronda normal passar pelo caminho,
      dispersar problemas e tratar intimidação da Red Sail como perturbação da
      paz.
      Quando Ren pressionou Luath a ir além disso, criticando burocracia e
      oferecendo serviços secretos para obter provas sem que ninguém soubesse,
      Luath rejeitou duramente a proposta. Manteve o acordo limitado anterior,
      mas passou a vigiar ainda mais a tendência de Ren a justificar meios
      ilegais por um bem maior.
      Depois, Ren entregou o aviso escrito do Benefício da Lona Aberta sem nova
      discussão e com postura humilde. Luath aceitou o documento como limpo e
      manteve a via limitada de ronda normal, sem restaurar confiança ampla.
      Na manhã de 4 Eleasis, Ren procurou Luath como cidadão pobre, relatou
      Bram Vask, Kethra Dunn, Colm/Dent e o risco de Bram pressionar a família,
      oferecendo o caderno de contas sujas de Bram como prova, mas sem explicar
      como tirou Colm da loja. Luath examinou o caderno, copiou marcas úteis e
      o devolveu, recusando tratá-lo como prova formal limpa sem cadeia de
      custódia ou testemunho. Ainda assim, a Night Watch pressionou Bram por
      cobrança violenta, possível cárcere/trabalho por dívida e risco a Kethra,
      nos termos da guarda, não nos termos de Ren. Mais tarde naquela manhã,
      Luath mandou chamar Ren ao mercado de peixe após a guarda encontrar quatro
      barris mal marcados, com suspeita de que a conta original era de seis.
      Luath envolveu Ren porque as pistas tocavam peixe, cera vermelha, barris
      e o padrão de fios que Ren vinha seguindo, mas deixou claro que não estava
      chamando Ren por causa da vingança dele. Ren identificou o pó como
      explosivo quando seco e exposto a chama, ligou a cera vermelha à oficina
      dos tintureiros e contou a Luath sobre a mulher de vermelho, a cicatriz, a
      marca de sol apagado e o homem de manga cinza com dois anéis. Luath
      aceitou a parte concreta e enviou guardas para cercar a oficina dos
      tintureiros com cautela. Quando Ren alertou que ataques contra mercado,
      água, ponte, templo ou guarda deixariam a cidade mais frágil e
      desesperançada, Luath tratou a linha como ameaça civil concreta e mandou
      avisos discretos, sem anunciar pólvora ao público. Depois deu a Ren as
      informações sobre a carroça dos dois barris faltantes. A trilha se perdeu
      no mercado, e uma explosão parcial atingiu a balança velha antes que Ren
      chegasse ao ponto certo.
      Ren desceu para Sarbreen, neutralizou de modo não letal o homem de manga
      cinza e o vulto leve, removeu o acionamento imediato do barril e entregou
      os dois vivos a Luath pela corda, junto do dispositivo. Luath recusou
      interrogar os prisioneiros na boca do mercado por risco de rumor,
      testemunha ruim e explosivo remanescente, mas deixou uma via clara para
      Ren buscar informação depois do segundo sino ou receber recado no circo.
      A utilidade prática de Ren aumentou aos olhos de Luath, especialmente por
      entregar vivos e prova material, mas a cautela institucional permanece.
      Depois do segundo sino, Ren procurou Luath no posto da Night Watch em
      roupa pobre. A chegada reforçou uma linha pública fina de que o
      forasteiro pobre admitido no mercado tem entrada com a guarda. Luath
      revelou apenas informação controlada, recusou acesso direto aos
      prisioneiros e aceitou levar uma pergunta curta de Ren ao interrogatório,
      sem torná-lo auxiliar oficial.
      Na noite de 5 Eleasis, Ren retornou ao posto após recuar da Escada das
      Sete Águas. Ele mostrou o mapa público da Escada, a cópia discreta dos
      porões secos de Brunna Torkel e relatou a galeria baixa, o vigia, o fio
      de acionamento, a marca de sol apagado e o depósito sem tabuleta com
      janela de observação. Luath cruzou os mapas com Ren, mas eles não deram
      rota segura de invasão. Luath avaliou a Escada como possível olho, boca,
      controle ou entrada-isca, mais do que coração confirmado da operação, e
      preferiu colocar vigilância discreta de superfície em vez de mandar uma
      batida formal pela escada.
      Na noite de 6 Eleasis, Ren chegou sem cauda útil após a apresentação
      fechada da Casa Veyr e relatou a pista de Dalm: Masao, Ponte Baixa, segunda
      maré, porões secos, papéis antes de lâminas, gravadora e menino. Luath
      aceitou não mandar homens para dentro da Ponte Baixa antes da madrugada
      para não queimar a entrada. Se Ren não voltar até o fim da manhã, Luath
      tratará a ausência como crime, prova e responsável, não como simples corpo
      de estrangeiro descartável. Na madrugada de 7 Eleasis, Ren voltou vivo ao
      posto e entregou três evidências retiradas da sala seca da Ponte Baixa,
      relatando a rota, o arquivo vivo, a brasa protegida, o pano com linha de
      cinza, a lingueta do trilho, a segunda portinhola e a maré entrando na
      câmara de retenção. Luath reconheceu utilidade, mas não conseguiu
      transformar o material em prova limpa, batida imediata ou lacre de Tyr
      durante a madrugada; ofereceu selar o pacote como material recebido de
      informante em risco sob custódia provisória da Night Watch, dependendo de
      como Ren quer aparecer no registro.
    informacoes_indiretas:
      - "Luath não é santo, mas isso o torna mais útil do que ingênuo."
      - "Luath pode ouvir sobre sequestro, falsificação, intimidação, Red Sail, Narwhal e testemunhas em risco."
      - "Luath trabalha dentro de uma corrente institucional; mesmo homens honestos podem ser puxados por superiores."
    riscos:
      - "Se Ren abrir a conversa como vendeta para matar Masao, Luath tenderá a reagir como guarda."
      - "Entregar Nera e Tavin a Luath de imediato pode colocá-los dentro de uma cadeia institucional que Ren ainda não controla."
      - "Luath pode estar sob pressão para resolver problemas do porto sem atingir nomes influentes."
      - "Luath agora possui dois prisioneiros ligados aos barris e ao acesso de Sarbreen; se eles sumirem, morrerem ou forem tomados por autoridade superior, a confiança prática de Ren na guarda pode ser testada."
      - "A ligação pública entre Ren e a entrada no perímetro do mercado ainda é fraca, mas uma peixeira e um escrivãozinho de guilda viram um forasteiro pobre ser admitido pela guarda antes da explosão parcial."
      - "A ida de Ren ao posto depois do segundo sino reforçou a linha pública fina de que o forasteiro pobre do mercado tem entrada com a guarda; a ligação com Kage ainda é fraca, mas uma memória na borda do circo pode crescer."
      - "Se Luath mover guardas demais para a Escada das Sete Águas, pode queimar a entrada, alertar o outro lado e transformar a pista de Ren em perímetro público."
      - "Se Ren não voltar da Ponte Baixa até o fim da manhã, Luath pode mover busca e investigação, mas isso provavelmente queimará a entrada."
      - "O selo de Maerra comprou privacidade, não confiança."
      - "Luath agora sabe que Ren está caçando Masao por uma morte familiar; isso o torna mais cauteloso com Ren."
      - "A franqueza de Ren sobre Masao não merecer cela tornou Luath mais propenso a vigiar Ren se corpos aparecerem."
      - "A oferta de Ren de realizar serviços secretos para obter provas fez Luath enxergá-lo como risco maior de conluio e justiça privada."
    acordos_ou_acoes:
      - "Luath ficou com a cópia parcial selada de Maerra."
      - "Luath acionou patrulheiros para enquadrar buscas não autorizadas da Red Sail como perturbação da paz, intimidação e usurpação de autoridade."
      - "Luath recebeu de Ren a informação de que Dain Mord é Brass e o protocolo da ficha de cobre com vela vermelha e cordão azul."
      - "Luath não mandará busca aberta ao circo de Jack Mooney sem ordem, flagrante ou razão melhor, mas pressionará Red Sail nas ruas e acessos."
      - "A pressão de patrulheiros acionados por Luath ajudou a dispersar a Red Sail do perímetro do circo após a busca controlada de Jack."
      - "Luath recusou apoio formal da Night Watch ao Benefício da Lona Aberta."
      - "Luath recebeu o aviso escrito limpo de Jack/Silva antes do pôr do sol."
      - "Luath aceitou orientar ronda normal perto do Benefício da Lona Aberta, sem apoio formal público."
      - "A Night Watch não pode ser usada em cartaz, anúncio ou como selo público do evento."
      - "Luath recusou qualquer serviço off-record de Ren em nome da guarda."
      - "Luath examinou o caderno de Bram, copiou marcas úteis e devolveu o caderno a Ren por não aceitar prova irregular sem cadeia de custódia."
      - "Dois guardas pressionaram Bram Vask em sua loja após o relato de Ren, sem prender Bram."
      - "Luath mandou chamar Ren ao mercado de peixe quando quatro barris mal marcados foram encontrados e dois estavam desaparecidos."
      - "Luath sabe por um peixeiro que um homem de manga cinza e dois anéis mandou descarregar os barris por intermediário."
      - "Luath ouviu de Ren que o pó dos barris explode se estiver seco e encontrar chama."
      - "Luath recusou acesso direto de Ren aos prisioneiros, mas aceitou levar uma pergunta curta ao interrogatório."
      - "Ren entregou a Luath a linha de interrogatório sobre a explosão ter sido feita para ser ouvida e sobre descobrir qual área da cidade ficaria em risco."
      - "Luath reformulou a pergunta para os prisioneiros como: 'Para onde a luz ia voltar depois que o mercado ouvisse?'"
      - "Luath enviou guardas para cercar a oficina dos tintureiros com cautela, sem entrar chutando porta se houver cheiro do pó."
      - "Luath recebeu de Ren a linha de raciocínio sobre alvos capazes de quebrar o ânimo da cidade e mandou avisos discretos para mercado, água, ponte, templo e guarda."
      - "Luath informou a Ren que a carroça dos dois barris faltantes tinha eixo baixo, roda traseira esquerda ruim, tábua traseira manchada de vermelho e foi vista rumo à balança velha pelo Beco da Salmoura."
      - "Após a falha de Ren em manter a trilha no mercado, uma explosão parcial atingiu a balança velha; Luath passou a conter pânico, chama e curiosos."
      - "Luath respondeu a Ren sobre os subterrâneos de Ravens Bluff, nomeando Sarbreen como a antiga cidade anã sob a cidade atual."
      - "Luath informou que entradas conhecidas perto dali passam por drenagens do cais e porões registrados de armazéns, mas que a abertura imediata é a própria passagem aberta pela explosão."
      - "Luath aceitou que Ren descesse pela abertura da balança velha, prometendo segurar a boca da passagem, contar os barris na superfície e impedir descida desordenada da guarda."
      - "Luath recebeu de Ren o relato da Escada das Sete Águas: depósito sem tabuleta com janela de observação, fio de controle na entrada, marca de sol apagado raspada, galeria baixa, vigia e fio de acionamento antes de câmara estreita."
      - "Luath examinou o mapa público da Escada das Sete Águas e a cópia discreta dos porões secos de Brunna Torkel, sem reter os originais."
      - "Luath não mandará batida formal pela Escada agora; em vez disso, pode colocar vigilância discreta na superfície da Escada, no depósito sem tabuleta e em possíveis saídas baixas."
      - "Luath recebeu de Ren a pista de Dalm sobre Masao, Ponte Baixa, segunda maré, porões secos, papéis antes de lâminas, gravadora e menino."
      - "Luath aceitou não mandar homens para dentro da Ponte Baixa antes da madrugada, para não queimar a entrada."
      - "Se Ren não voltar até o fim da manhã, Luath tratará o caso como crime, prova e responsável."
      - "Na madrugada de 7 Eleasis, Ren entregou a Luath três evidências da Ponte Baixa: tira de controle com retenção anulada/volume 13/V. Rook/M. Harrow/data recente, tira encerada com Kage/gravadora/menino/antes de maré e cilindro/matriz com marca de sol apagado."
      - "Luath não conseguiu montar resposta discreta imediata nem lacre de Tyr de madrugada; pode selar o material sob custódia provisória da Night Watch como recebido de informante em risco."
  sirrus_melandor:
    nome: "Sirrus Melandor"
    tipo: "Chief Prelate / alto sacerdote de Tyr"
    local: "Casa de Tyr, Temple District"
    status: "em cena"
    atitude_para_ren: "rígida, institucional e cautelosa"
    confianca: "baixa"
    respeito: "inicial pela gravidade do material, não por confiança pessoal"
    motivo: >
      Maerra e Nera apontaram Sirrus Melandor como o caminho forte para
      proteção formal, testemunho e peso institucional contra gente poderosa.
      Ren chegou à Casa de Tyr com a pasta de Velis lacrada por Maerra, mas
      não recebeu acesso direto a Sirrus no primeiro pedido. O guardião aceitou
      classificar o caso como testemunho reservado urgente, e uma guardiã jovem
      foi buscar autoridade intermediária para ouvir sem abrir o lacre. Depois
      da abertura da pasta em câmara reservada, Irmão Caldrin Vos mandou chamar
      Sirrus imediatamente. Sirrus leu o bilhete e as correções centrais,
      reconheceu a gravidade, mas exigiu linha de custódia antes de conceder
      proteção nominal a Nera Vell e Tavin Vell. Ren nomeou Silva Elkwood em
      registro selado como guardiã atual informada por ele. Sirrus aceitou
      emitir ordem de preservação de registros e convocar Velis Rook, mas negou
      que Ren acompanhe ocultamente a primeira oitiva de Velis. Ao se retirar,
      Ren reafirmou que não pretende agir contra Velis e que só quer as
      testemunhas seguras. Sirrus aceitou a declaração sem suavizar a postura.
      Na manhã seguinte ao Benefício, Tyr informou por mensageira que a primeira
      convocação de Velis Rook foi entregue e que a Casa espera resposta antes
      do meio-dia.
    acoes_possiveis:
      - "Emitir ordem de preservação sobre registros ligados ao volume 13, Narwhal Manor e Dain Mord."
      - "Enviar dois juramentados discretos para acompanhar transferência voluntária dos Vell a uma porta de Tyr."
      - "Convocar Velis Rook para responder por anulação retroativa sob pena de obstrução."
      - "A primeira convocação de Velis Rook foi entregue; Tyr espera resposta antes do meio-dia."
    riscos:
      - "Tyr pode proteger prova e testemunha, mas também torna o caso visível e registrado."
      - "Se Ren apresentar o caso como licença para vingança, pode perder a porta antes de chegar a Sirrus."
      - "A cadeia de custódia da pasta continua vulnerável, embora o lacre de Maerra ajude."
      - "Sirrus não concederá proteção nominal sem saber quem responde pela custódia atual dos Vell ou sem confirmação de Maerra/Luath."
      - "Sirrus considera que Ren agir contra Velis antes da oitiva enfraqueceria Nera e Tavin."
  halessa_vorn:
    nome: "Irmã Halessa Vorn"
    tipo: "ouvidora juramentada de Tyr"
    local: "Casa de Tyr, Temple District"
    status: "em cena"
    atitude_para_ren: "formal, cautelosa e operacionalmente disposta a escalar"
    confianca: "baixa institucional"
    respeito: "inicial, pelo foco em testemunhas vivas"
    motivo: >
      Halessa foi chamada pela guardiã jovem depois que Ren apresentou o selo
      de Maerra e enquadrou o caso como testemunho reservado urgente envolvendo
      duas vidas em risco. Ela chegou para ouvir o bastante para decidir se o
      caso sobe para Sirrus, permanece no filtro da casa ou exige guarda.
      Ren apresentou o caso com foco em N.V., T.V., Red Sail, falsificação do
      selo do clã, tentativa de queima de arquivo, cópia parcial sob custódia
      de Luath e pasta lacrada por Maerra. Halessa percebeu a lacuna de cadeia
      de custódia da pasta, mas decidiu escalar o assunto dentro de Tyr por
      envolver ameaça viva a testemunhas e possível tentativa de impedir que
      elas cheguem à justiça. Quando Ren afirmou que as testemunhas estão
      seguras hoje e pediu prioridade para confirmação com Luath/Maerra e
      abertura do lacre, Halessa aceitou não movê-las sem necessidade e
      organizou câmara reservada para poucos minutos depois. Depois que Ren
      aceitou a paz juramentada, Halessa abriu a pasta em câmara reservada com
      Irmão Caldrin Vos e um escriba. O conteúdo foi forte o bastante para
      chamar Sirrus Melandor imediatamente. Quando Ren registrou Nera Vell e
      Tavin Vell por nome completo, Halessa percebeu cuidado genuíno no tom
      dele e manteve os nomes em ata reservada e selada. Quando Sirrus negou
      a presença oculta de Ren na oitiva de Velis, Halessa abriu alternativa:
      Ren pode escrever até três perguntas para possível uso na oitiva. Ren
      entregou três perguntas sobre selos de clãs de Kara-Tur, o hóspede e o
      volume 13; Halessa recebeu como anexo reservado do portador.
      Na manhã seguinte ao Benefício da Lona Aberta, uma ficha reservada de Tyr
      chegou a Silva Elkwood no circo: Luath confirmou a cópia parcial e a ação
      contra buscas ilegais, Maerra confirmou o lacre e a abertura presenciada,
      e Tyr agora busca a confirmação da guardiã atual informada.
      Silva confirmou guarda imediata, pediu manutenção temporária no abrigo
      atual e solicitou resguardo em espera sem deslocamento até o próximo sino
      maior.
    ofertas:
      - "Resguardo provisório de 24 horas para N.V. e T.V., se puderem ser movidos com segurança para uma porta indicada por Tyr."
      - "Ficha selada para Maerra ou Luath confirmando que o testemunho entrou em triagem reservada."
      - "Audiência de lacre em câmara reservada, com Halessa, outro juramentado e possível informação a Sirrus antes do próximo sino maior se o conteúdo justificar."
      - "Duas fichas reservadas enviadas a Luath e Maerra para confirmar custódia, lacre, abertura presenciada e situação das testemunhas."
      - "Audiência de lacre por volta de 11:21 se Ren aceitar paz juramentada."
      - "Pasta aberta e mantida sob custódia formal de Tyr."
      - "Sirrus Melandor chamado imediatamente após leitura do bilhete e das correções."
      - "Aceitou receber até três perguntas de Ren para possível uso na oitiva de Velis."
      - "Recebeu três perguntas de Ren como anexo reservado do portador."
      - "Tyr recebeu confirmações de Luath e Maerra e enviou ficha reservada a Silva Elkwood para confirmar a guarda atual informada."
      - "Tyr recebeu de Silva a confirmação da guarda imediata dos Vell, manutenção temporária no abrigo atual e pedido de resguardo em espera sem deslocamento."
    riscos:
      - "Se Ren focar em vingança, Halessa pode rebaixar o caso para risco de violência privada."
      - "Se Ren esconder demais, Halessa pode suspeitar que a Casa de Tyr está sendo usada."
      - "Se Ren entregar nomes completos em voz alta, pode criar registro ou exposição antes de proteção formal."
      - "Halessa notou que 'sorte' não explica cadeia de custódia; a pasta pode ajudar Ren ou criar risco legal contra ele."
      - "Tyr ainda não concedeu abrigo irrestrito nem acesso direto a Sirrus."
      - "Halessa ainda decide quais perguntas de Ren cabem sem comprometer a ata."
      - "A crise no Harbor District pode reduzir a velocidade prática de respostas e extratos, mesmo com o caso preservado."
  silva_elkwood:
    nome: "Silva Elkwood"
    tipo: "clériga de Chauntea / contato potencial de abrigo"
    local: "Jack Mooney & Sons Circus"
    status: "conhecida em jogo"
    atitude_para_ren: "favoravel e cautelosa, ainda preocupada com o risco ao circo"
    confianca: "moderada e vigilante"
    respeito: "alto"
    motivo: >
      Silva reconheceu a senha e o selo de Maerra imediatamente, fez cobertura
      pública sobre casca de salgueiro e deixou Ren, Nera e Tavin entrarem na
      carroça verde. Ao ouvir Ren priorizar os irmãos Vell e o livro acima da
      própria segurança, julgou o pedido sincero. Aceitou esconder Nera, Tavin
      e o livro imediatamente, e ofereceu abrigo provisório de poucas horas para
      Ren num compartimento de pano atrás da carroça de remendos. Pela manhã,
      falhou em convencer Jack Mooney a aceitar abrigo estável sem mais verdade
      ou solução. Ainda quer proteger os Vell, mas o prazo prático agora é o
      meio-dia. Quando Ren retornou vestido como marinheiro, Silva o reconheceu
      e permaneceu presente na conversa privada com Jack. Depois da crise de
      Merrit, Silva entrou na carroça verde com tato, confirmou abrigo real por
      hoje e amanhã e mandou Ren comer e dormir.
      Após Ren resolver o fio de Harl sem sangue e sem julgamento público,
      Silva passou a tratar Ren com mais confiança prática. Ainda não é
      confiança irrestrita: Silva segue medindo riscos ao circo, aos Vell e ao
      livro.
      Silva ouviu Ren prometer a Tavin que voltaria, explicar que pretende
      apenas investigar a conexão entre Red Sail e Masao, e propor Kagefusha
      como nome de palco.
      Ren voltou ao circo pela rota combinada depois da trilha noturna, sem
      trazer perseguição imediata para a carroça verde. Silva notou que ele
      estava fisicamente inteiro, mas mentalmente aéreo, e ofereceu banho
      simples atrás da lona azul antes de decidir se ele falaria com Nera.
      Depois do banho, Silva autorizou Ren e Nera a caminhar apenas pela rota
      interna das lonas e indicou Dessa Wren como solução para roupas comuns de
      disfarce.
      Ren levou Nera de volta dentro do limite combinado e depois completou
      descanso longo no depósito de figurino velho. Antes do amanhecer, Silva e
      Jack tiveram de lidar com sondagem externa ligada ao porto ou à Red Sail;
      eles impediram acesso direto, mas Silva chamou Ren assim que o descanso
      foi suficiente.
      Ren propôs evacuar Nera e Tavin antes de uma busca controlada; Silva
      julgou possível e levou a proposta a Jack, com a ressalva de que ninguém
      da Red Sail deve circular livremente pelo circo.
      Depois, Silva não conseguiu garantir uma saída limpa, mas indicou a rota
      menos ruim pela borda oposta se Jack puxasse a atenção para as cozinhas.
      Quando Ren retornou com Nera e Tavin, Silva viu que a busca controlada já
      havia funcionado por ora e recolheu os irmãos para a carroça verde antes
      de perguntar detalhes. Ela reconheceu a pasta lacrada como novo risco.
      Ren pediu que Silva cuidasse dos Vell novamente enquanto ele procura Tyr.
      Silva aceitou, mas advertiu Ren a não colecionar dívida que só morto
      consegue pagar. Na Casa de Tyr, Ren nomeou Silva em registro selado como
      guardiã atual informada por ele para Nera e Tavin, ainda pendente de
      confirmação externa. A confirmação ainda não chegou a Silva em cena.
      Depois do incêndio no Harbor District, Ren voltou ao circo pela rota da
      carroça de remendos sem trazer cauda. Silva o interceptou discretamente
      perto da entrada interna, demonstrando que continua vigiando os acessos
      sensíveis do circo. Ren contou a Silva sobre Tyr, Sirrus, Halessa, Velis,
      a nomeação selada e a leitura do incêndio como possível manobra política
      da Red Sail. Silva aceitou a nomeação com reprimenda, não como quebra de
      confiança, e aconselhou Ren a não mover os Vell durante a crise: separar
      Ren, Nera/Tavin e o livro, transformar os irmãos em gente da rotina do
      circo, manter Ren visível por algumas horas como Ren Kage e falar com
      Jack junto dela.
      Silva ouviu Ren propor o Benefício da Lona Aberta e apoiou a parte
      comunitária do plano: Chauntea pode ajudar com comida, água, cobertores e
      mãos, desde que o evento não vire palanque de acusação nem exponha Nera e
      Tavin.
      Silva aceitou a possibilidade de Nera participar de O Vento da Noite
      apenas como figura anônima e mascarada, sem nome anunciado, sem aplauso
      próprio e somente se Jack aprovar. Também aceitou Merrit como narradora
      apenas sob supervisão direta.
      Silva assinou a parte comunitária do aviso do Benefício da Lona Aberta,
      atestando comida, água, cobertores e doações reais. Depois manteve Merrit
      sob supervisão durante o ensaio e levou Nera/Lena e Tavin/Timo para
      assistir pela rota interna.
      Silva apoiou a decisão de manter Nera fora do papel de Princesa das
      Sombras. No dia da apresentação, acompanhou Nera e Tavin perto da carroça
      verde e avaliou Ren vestido para o número como visível demais para
      desperdiçar com imprudência.
      Durante O Vento da Noite, Silva viu Ren transformar a cobertura de artista
      em uma máscara pública aceita pelo público. Considera o sucesso útil para
      fortalecer o circo e proteger os Vell pela rotina, mas também percebe que
      Ren Kage ficou mais difícil de esconder.
      Quando Jack trouxe a ficha do camarote oeste, Silva interveio de imediato
      para manter Nera e Tavin fora de qualquer aproximação de patrono, reforçando
      que a oportunidade comercial não deve tocar as testemunhas protegidas.
      No fechamento do Benefício, Silva manteve as doações comunitárias separadas
      do caixa de Jack e aceitou que os Vell durmam no circo esta noite.
      Pela manhã, Silva checou Ren, deixou água e pão e avisou que Jack quer
      falar depois da comida. Também informou, com humor seco, que Nera está
      acordada tentando fingir que não espera Ren.
      No escritório de Jack, Silva reforçou que Nera, Tavin, o livro e a história
      dos Vell não entram em nenhuma negociação sobre Kage.
      Quando uma mensageira de Tyr chegou à borda das carroças por assunto de
      lacre reservado, Silva foi recebê-la com Ren. A ficha informou que Luath
      confirmou a cópia parcial e a ação contra buscas ilegais, Maerra confirmou
      o lacre e a abertura presenciada, e Tyr agora pede confirmação formal da
      guarda atual informada. Após Ren defender que os Vell permaneçam no circo,
      Silva confirmou formalmente a guarda imediata, pediu manutenção temporária
      no abrigo atual e solicitou resguardo em espera sem deslocamento até o
      próximo sino maior. Silva aceitou o agradecimento de Ren por cuidar dos
      Vell, mas reforçou que ele deve voltar vivo em vez de morrer fazendo
      besteira.
      Ren avisou Silva que, depois de assinar com Jack, sairia para resolver
      coisas pessoais. Silva não o impediu, mas registrou que ao menos ele
      avisou antes.
      Ao anoitecer, Ren voltou ao circo pela rota das carroças de remendos por
      deslocamento discreto comum, sem cauda competente no trajeto e sem gerar
      rastro útil até o acampamento. Silva interceptou Ren antes da carroça
      verde, mandou checar a borda do acampamento e só permitiu banho, conversa
      e descanso depois de confirmar que ninguém o seguiu até dentro. Ren contou
      a Silva sobre Kethra, Colm/Dent, Dorra Hest, Velis, M. Harrow e a Casa
      Velha do Primeiro Raio. Silva reforçou que a Casa Velha deve ser tratada
      como lugar que usa crianças como olheiros, não como abrigo vazio.
      Depois da incursão na Casa Velha e na oficina dos tintureiros, Ren voltou
      ao circo por volta de 02:10 de 4 Eleasis, sem cauda competente percebida,
      mas sem ki e visivelmente exausto. Silva o interceptou antes da carroça
      verde para confirmar se ele trouxe alguém atrás. Ren respondeu que não
      foi seguido, chamou-a de Sil pela primeira vez e contou por cima que sete
      crianças foram resgatadas e estão sob cuidado de Maerra. Silva percebeu
      o cansaço extremo de Ren e decidiu mandar ajuda discreta de Chauntea à
      Casa da Aurora Menor antes do amanhecer. Ren agradeceu Silva por ajudar
      Nera e Maerra; Silva respondeu que ele deveria agradecer dormindo. Quando
      Ren retornou ao circo por volta de 09:55 de 4 Eleasis, Silva confirmou
      que a ajuda de Chauntea chegou a Maerra e direcionou Ren a Jack para a
      conversa sobre Kage.
      No começo da noite de 4 Eleasis, Ren voltou novamente ao circo pela borda
      dos remendos depois de observar Brass e visitar Maerra. A volta não trouxe
      perseguição colada para dentro do acampamento, mas ficou imperfeita o
      bastante para Silva interceptá-lo antes da carroça verde e perguntar se
      ele veio sozinho ou apenas chegou primeiro.
      Ren admitiu a Silva e Nera que não tentou capturar Brass porque o risco
      era alto demais. Silva leu a decisão como autocontrole útil, não como falta
      de coragem. Ela checou a borda do circo de modo discreto, mas não conseguiu
      confirmar limpeza plena: apenas não encontrou perseguição colada. Depois
      permitiu jantar e passeio de Ren com Nera apenas pela rota interna.
      Mais tarde, viu Ren treinar sozinho sem tentar voo ou salto perigoso e
      considerou isso bom senso. Na conversa sobre Sarbreen, explicou apenas o
      que sabia por rumor e prática: a antiga cidade anã sob Ravens Bluff é
      fragmentada, perigosa e cheia de histórias falsas. Indicou Lockwood Mooney,
      Gond, Wizards' Guild ou mapas velhos do porto como caminhos possíveis, cada
      um com custo e risco próprios.
      Após a reprise curta de 5 Eleasis, Silva viu Jack e a equipe segurarem a
      borda do pós-show e leu a segunda tira de papel que usava a palavra
      gravadora para pressionar Kage. Ela endureceu a segurança interna dos Vell:
      Tobb fecha a rota curta, uma menina de costura fica mais perto da carroça
      verde e curiosos serão afastados sem explicação.
      Mais tarde, Ren retornou do posto de Luath pela rota longa, sem cauda útil
      percebida, mas sem certeza absoluta de limpeza. Silva interceptou Ren
      antes que ele fosse à carroça verde. Ren escolheu não ver os Vell e pediu
      que Silva entregasse um bilhete a Nera. Silva não abriu o bilhete,
      entregou-o e depois transmitiu a resposta de Nera a Ren.
      Na manhã de 6 Eleasis, Silva tomou café com Ren longe da carroça verde,
      ouviu o relato sobre Sarbreen, Brunna, a Escada das Sete Águas e Luath, e
      tratou a nova técnica de Ren como ferramenta recuperada, não como vaidade.
      Manteve o limite prático: Passo Sombrio deve ser testado longe dos Vell até
      Ren conhecer seus limites. Depois, com Jack, participa do filtro contra a
      resposta da Casa Veyr e calcula como manter Nera e Tavin afastados da
      possível apresentação fechada sem denunciar que são o ponto sensível.
      Após o treino da tenda menor, Silva ainda mantém os Vell fora da superfície
      de Kage e da Casa Veyr; qualquer aproximação entre apresentação fechada e
      carroça verde deve passar por ela.
      Silva aceitou abrir a porta da carroça verde por instantes para um teste
      controlado de Passo Sombrio, com Tavin longe da carroça e Tobb limpando a
      rota interna. A visita não virou rumor no circo, mas Silva viu que a
      técnica ainda assusta dentro da carroça e reforça sua cautela com os Vell.
    documentos:
