      comida, mas Harl permaneceu defensivo e perguntou se Jack mandou Ren
      falar com ele. Ren ofereceu 1 PO por uma hora do tempo de Harl. Harl
      aceitou a moeda, corrigiu Ren ao ser chamado de Hal e acompanhou Ren até
      a cozinha sob a lona amarela, ainda desconfiado. Ren apelou à fome,
      pobreza, admiração e amor para levá-lo a assumir responsabilidade. Harl
      confessou a Ren e depois a Jack que plantou a ideia em Merrit, mas não
      ordenou diretamente o corte.
      Na manhã de 6 Eleasis, Ren ofereceu 1 PO para que Harl ficasse atento a
      qualquer coisa estranha na montagem da tenda menor. Harl recusou a moeda:
      depois da punição de Jack, aceitar dinheiro para vigiar montagem pareceria
      segredo novo. Ele disse que avisará Sorn ou Tobb se vir risco real, mas não
      quer ser olho comprado de Ren.
      Durante a montagem baixa da tenda menor, Harl não viu irregularidade útil:
      não viu mão em corda, marca nova em estaca nem gente mexendo em lamparina
      depois das marcações de Sorn. Ele manteve a ressalva de que não venderá
      certeza absoluta.
