  sorn_kel:
    nome: "Sorn Kel"
    tipo: "responsavel por cordame e montagem"
    local: "Jack Mooney & Sons Circus"
    status: "ativo nos bastidores da apresentação fechada de Kage"
    atitude_para_ren: "cautelosa e profissional"
    confianca: "nenhuma"
    respeito: "profissional inicial"
    motivo: >
      Ren foi apresentado de modo implícito por Silva como alguém autorizado a
      fazer perguntas sobre a sabotagem. Sorn viu a tira de couro e reagiu
      visivelmente, mas Ren não conseguiu determinar se era culpa, medo
      profissional, medo de Jack ou medo de outra pessoa. Ao responder, admitiu
      responsabilidade profissional parcial: assinou a conferência da corda, mas
      o lado leste teria sido conferido por Harl Venn. Disse que encontrou a
      tira cortada antes das sete e avisou Jack. Depois de pressão de Ren,
      revelou uma omissão: viu Harl na carroça de cordame com Lysa Renn depois
      da nona badalada, com Harl usando a cópia da chave para pegar breu.
      Durante a preparação de O Vento da Noite, Sorn assumiu a segurança das
      marcações de pouso e cortou o treino de Lysa antes que ela forçasse o
      joelho. No início da apresentação, vigiou as marcas no chão. Durante o
      número, os pousos de Ren caíram dentro das marcações, confirmando que a
      disciplina de ensaio e os limites de Sorn seguraram o risco físico.
      Nos bastidores, Sorn reconheceu que Ren caiu onde foi mandado. Também
      apontou que o ombro de Ren quase abriu demais no salto da segunda lanterna
      e proibiu novo salto se alguém mexer nas marcas sem avisá-lo.
      Na preparação da reprise curta de 5 Eleasis, Sorn acompanhou o ensaio de
      Ren e manteve a versão segura do número. O ensaio individual passou no
      limite; a coordenação com Merrit e Dessa não melhorou o bastante para
      justificar salto novo ou risco maior. Sorn também apoiou que Lysa
      descansasse o joelho antes da entrada.
      Durante a reprise, Sorn viu Ren pousar na borda externa da marca após
      gastar ki no salto de efeito. Considera que o número funcionou, mas sem
      margem para aumento de risco físico sem novo treino.
      Na manhã de 6 Eleasis, Sorn viu Ren tentar mapear sombras na tenda menor
      para a possível apresentação fechada da Casa Veyr. Ele aceitou marcar
      treino básico às 13:30 com Merrit e Lysa, mas limitou a revisão a entrada,
      saída, posições e duas marcas escuras, sem salto novo ou alteração maior.
      No treino das 13:30, Ren confirmou duas marcas escuras úteis na tenda
      menor. Sorn aceitou marcá-las apenas sob condição de ninguém alterar as
      lamparinas: dobra atrás da entrada lateral e faixa baixa junto aos bancos
      de músicos/panos extras. Na abertura da apresentação fechada, Ren usou
      Passo Sombrio entre essas marcas sem quebrar segurança física, mas Sorn
      agora sabe que a Casa Veyr viu pelo menos a categoria da técnica.
