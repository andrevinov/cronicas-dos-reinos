  peta:
    nome: "Peta"
    tipo: "criança resgatada / testemunha traumatizada"
    local: "Casa da Aurora Menor, sob cuidado de Maerra Thandrel"
    status: "viva, resgatada da oficina dos tintureiros, em recuperação"
    atitude_para_ren: "assustada, mas reconhece Ren como a pessoa que a tirou da oficina"
    confianca: "frágil"
    respeito: "não aplicável"
    motivo: >
      Peta foi levada pela pessoa de vermelho durante a retirada da Casa Velha
      do Primeiro Raio. Ren seguiu o fio de cera, tintura e pano encerado pela
      drenagem até uma oficina dos tintureiros, neutralizou a mulher de vermelho
      de modo não letal e retirou Peta viva, presa e amordaçada. Depois a levou
      de volta à Casa da Aurora Menor, onde Cal a reconheceu e Maerra iniciou
      cuidado imediato.
      Em choque, Peta primeiro só conseguiu dizer fragmentos: frio, embaixo e
      que a mulher de vermelho não falava com ela. Na manhã de 4 Eleasis,
      depois de algum cuidado e descanso, conseguiu lembrar mais: a pessoa de
      vermelho não mandava, apenas fazia; havia um homem de manga cinza com
      dois anéis falando por trás; ele mencionou papel para o peixe e disse que
      a máscara não era para o sol; e Peta ficou em um lugar frio, embaixo de
      onde rodas passavam por cima, com água na parede.
    informacoes_compartilhadas_por_peta:
      - "A pessoa de vermelho não mandava, apenas fazia."
      - "Havia um homem de manga cinza e dois anéis falando por trás."
      - "O homem mencionou que papel ia para o peixe."
      - "O homem disse que a máscara não era para o sol."
      - "Peta ficou em lugar frio, embaixo de onde rodas passavam por cima, com água na parede."
    riscos:
      - "Peta está traumatizada; insistir demais em perguntas pode quebrá-la antes de revelar algo útil."
      - "A memória dela é fragmentada e deve ser tratada como pista, não como mapa completo."
      - "Quem perdeu Peta pode tentar recuperá-la, silenciá-la ou descobrir para onde ela foi levada."
  nera_vell:
    nome: "Nera Vell"
    tipo: "testemunha protegida / gravadora de selos"
    local: "depósito de figurino velho, perto do canto de Ren; normalmente na carroça verde de Silva Elkwood"
    status: "sob proteção temporária de Silva Elkwood"
    atitude_para_ren: "assustada, grata, pragmática e emocionalmente implicada"
    confianca: "moderada em situação de crise"
    respeito: "prático"
    motivo: >
      Ren a resgatou do esquife, contou sua própria história e aceitou salvar
      Tavin antes de buscar o livro de provas. Nera ainda teme que qualquer
      escolha errada mate ela ou o irmão. Na Casa da Aurora Menor, Nera ouviu
      fragmentos sobre Aiko, Masao e a vingança de Ren, incluindo a fala dele
      sobre não querer ver irmãos perdendo irmãos novamente. Nera ajudou
      Maerra a deitar Ren quando ele apagou de cansaço. No circo, Ren a
      tranquilizou sobre Silva, prometeu não sumir e ela aceitou entregar o
      livro para o esconderijo de Silva.
      Após o julgamento interno de Merrit, Ren voltou à carroça verde, sentou
      perto dos Vell e explicou que Jack aceitou mantê-los no circo por agora.
      Nera aceitou o alívio sem despejar perguntas e agradeceu porque Ren
      voltou antes de sumir de novo.
      Mais tarde, Ren voltou novamente para checar os Vell e avisou que seguirá
      uma trilha à noite ligada aos homens que tentaram levar Nera.
      Ren prometeu a Tavin que voltará e explicou que pretende investigar a
      conexão entre Red Sail e Masao.
      Quando Ren voltou ao circo e foi tomar banho atrás da lona azul, Nera não
      conseguiu esperar. Foi até a lona por preocupação, viu mais do que
      pretendia por um instante e ficou claramente envergonhada, mas o alívio
      por vê-lo vivo foi mais forte que a compostura.
      Ren a tranquilizou, disse que não estava ferido fisicamente e prometeu ir
      à carroça verde depois do banho. Nera aceitou esperar e agradeceu por ele
      ter voltado. O vínculo romântico ainda é contido e incerto, mas deixou de
      ser apenas subtexto.
      Depois do banho, Ren foi à carroça verde e não acordou Tavin. As mãos de
      Ren e Nera se tocaram, e Ren não retirou a dele; Nera ajustou os dedos
      aos dele e aceitou a intimidade em silêncio.
      No topo da carroça dos estandartes, Ren abriu para Nera a ferida de Aiko,
      a quebra interna causada pela morte da irmã, a natureza de sua vingança e
      o risco real de morrer perseguindo Masao. Nera admitiu que sua preocupação
      por Ren é verdadeira, mas pediu que ela e Tavin continuem sendo pessoas
      para ele, não ferramentas ou peso dentro da vingança.
      Ren respondeu que esse é exatamente o problema: ela e Tavin já são pessoas
      para ele. Ren admitiu que teme não conseguir dar a eles um futuro vivo e
      seguro, tocou o rosto de Nera e os dois se beijaram. O vínculo romântico
      entre os dois agora é explícito, embora ainda sem promessa de futuro.
      Ren depois reforçou que a missão de Nera é ficar quieta, não fazer
      loucuras e proteger a si mesma e a Tavin. Nera voltou de mãos dadas com
      Ren até a carroça verde antes que ele fosse dormir.
      Na saleta de ervas da Casa da Aurora Menor, Nera viu a pasta roubada de
      Velis ser aberta. Reconheceu tecnicamente a impressão protegida da falsa
      lua velada como uso criminoso posterior do trabalho que foi obrigada a
      fazer. Também ouviu o bilhete chamar a gravadora e o menino de "ruído"
      que não deve chegar a Tyr.
      Depois, acompanhou Ren e Tavin de volta ao circo usando os disfarces de
      Dessa. A busca controlada já havia sido conduzida por Jack, com a Red Sail
      dispersada pela pressão da guarda. Nera voltou para a carroça verde e
      segurou a manga de Ren por um instante antes de entrar, demonstrando
      alívio contido por ele ter trazido os dois vivos de volta.
      Quando Ren explicou que iria a Tyr com a pasta lacrada, Nera aceitou ficar
      na carroça verde, mas se despediu dele com afeto e medo evidentes.
      Ao ouvir o plano do Benefício da Lona Aberta, aceitou integrar a rotina
      do circo sob nome de cobertura e escolheu "Lena". Também aceitou a
      possibilidade de atuar como Princesa das Sombras apenas se estiver com
      máscara inteira, luvas, cabelo coberto, sem nome anunciado e sem aplauso
      próprio.
      No fim da tarde, Silva levou Nera/Lena e Tavin/Timo pela rota interna
      para assistir parte do ensaio de O Vento da Noite. Nera observou Ren como
      artista e risco controlado, não apenas como fugitivo ou combatente.
      Jack decidiu que Lysa, não Nera, será a Princesa das Sombras. Nera não
      protestou, mas Ren percebeu ciúme contido quando Lysa colocou o pano
      preto pela primeira vez. À noite, Ren e Nera caminharam pela rota interna
      das lonas, de mãos dadas e com beijos; Ren fez juras de amor. Nera não
      respondeu com promessa igual, mas pediu que ele viva tempo bastante para
      ela acreditar sem medo.
      Durante O Vento da Noite, Nera viu Ren se tornar público de um modo que
      protege a máscara Ren Kage, mas também o torna mais visível para a cidade.
      Quando ele voltou aos bastidores, o ciúme dela estava coberto por orgulho
      assustado.
      Depois que Ren preservou a aura de mistério e não voltou ao público,
      Nera ouviu Jack falar sobre interesse de camarote por Kage. Ao responder
      a Tavin que "caro" quase sempre é perigoso, demonstrou entender que a
      nova máscara de Ren pode atrair proteção, dinheiro e ameaça ao mesmo
      tempo.
      Ao fechamento do Benefício da Lona Aberta, Nera viu o circo ganhar uma
      noite real de fôlego sem expor ela ou Tavin ao público. O alívio dela é
      concreto, mas ainda cauteloso: a proteção virou rotina por hoje, não
      solução definitiva.
      Depois, ao comer com Ren na carroça verde, Nera percebeu que ele esperava
      alguma ação de Masao ou de seus lacaios durante o evento. Ela não tentou
      escolher a explicação correta; apenas lembrou que, naquela noite, Tavin
      estava inteiro, ninguém arrombou a carroça, Jack ganhou dinheiro, Silva
      sustentou menos mentiras e Ren voltou para trás da lona.
      Na manhã seguinte ao Benefício, antes de Ren falar com Jack, Nera ouviu
      a ideia de Kage como porta recorrente de abrigo e renda. Ela aceitou a
      utilidade disso, mas alertou que não quer ver Ren Kage inteiro comprado
      por Jack, ricos de camarote, ela, Tavin ou Masao.
      Depois da confirmação de Silva a Tyr, Ren passou rapidamente pela carroça
      verde antes de sair do circo para tratar de assuntos pessoais. Nera não
      transformou a despedida em cena longa, mas pediu que ele volte antes de
      virar história de outra pessoa.
      Ao anoitecer, Ren voltou ao circo após resolver a saída temporária de
      Colm/Dent com Dorra Hest. Nera ouviu de Ren sobre Kethra, Colm, Velis,
      M. Harrow e a Casa Velha do Primeiro Raio. Ela reagiu com atenção
      especial ao uso de M. Harrow como possível nome de registro para encaixar
      a mentira preparada sobre o "oriental".
      Após a incursão na Casa Velha e na oficina dos tintureiros, Nera percebeu
      o retorno de Ren por volta de 02:16 de 4 Eleasis, saiu da carroça verde
      contra a instrução de esperar e o abraçou com preocupação explícita ao
      vê-lo vivo e exausto. Ren a abraçou, beijou discretamente e prometeu
      voltar. Nera aceitou deixar Ren dormir e, pela manhã, foi conferir o
      canto dele no depósito de figurino velho, levando água e pão. Depois de
      Ren sair novamente para checar Colm/Dent, Luath, Pell e Maerra, ele
      retornou ao circo por volta de 09:55 de 4 Eleasis. Nera viu Ren chegar
      vivo e conteve o impulso de correr até ele, mantendo-se dentro da rotina
      do circo.
      No começo da noite de 4 Eleasis, Nera viu Ren retornar à borda interna do
      circo sem sangue aparente e sem corpo carregado, mas também viu Silva
      interceptá-lo antes de permitir acesso direto à carroça verde.
      Ren contou a Nera e Silva que viu oportunidade de capturar Brass, mas não
      tentou por não querer arriscar o circo, Kage e seus aliados. Nera ouviu
      isso como alívio e aproximação, não como covardia. Depois jantou e
      caminhou com Ren pela rota interna permitida por Silva, trocando carícias
      discretas e beijos longe das bordas do acampamento.
      Na manhã de 5 Eleasis, Ren tomou café e almoçou com Nera e Tavin e falou
      sobre Kozakura, o Clã Kagehira e o Kagehira Getsuei-ryu. Nera percebeu
      a tristeza que Ren tentou esconder ao falar das cerejeiras e perguntou se
      a lembrança era boa ou dolorosa. Antes da reprise curta de Kage, pediu
      baixo que Ren voltasse para trás da lona depois.
      Na noite de 5 Eleasis, depois de Ren retornar da Escada das Sete Águas e
      do posto de Luath, ele evitou vê-la diretamente para não arrastar medo ou
      possível cauda até a carroça verde. Entregou a Silva um bilhete dizendo
      que ama Nera, que solucionará tudo e que ela pode ficar tranquila. Silva
      entregou o bilhete sem abrir. Nera leu duas vezes e respondeu por Silva
      que promessa grande demais não vale menos, mas pesa mais.
      Na tarde de 6 Eleasis, Ren entrou na carroça verde por Passo Sombrio para
      falar com Nera antes da apresentação fechada da Casa Veyr. A rota externa
      foi limpa por Silva e Tobb, mas a entrada assustou Nera e apagou a
      lamparina. Ren contou que a proposta citou a seladora/gravadora, que Kage
      vai se expor e que ele pretende voltar. Nera não reconheceu Corven Dalm
      nem Casa Veyr e não conseguiu determinar a origem exata do termo. Alertou
      Ren a não olhar para a carroça verde nem para Silva se alguém disser o nome
      dela durante a apresentação, para não transformar contrato em coração.
