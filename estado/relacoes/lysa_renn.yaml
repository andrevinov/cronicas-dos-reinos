relacao:
  nome: Lysa Renn
  tipo: acrobata / possível rival de Mira Dane
  local: Jack Mooney & Sons Circus
  status: reintegrada em papel baixo e mascarado
  atitude_para_ren: defensiva e provocadora
  confianca: nenhuma
  respeito: baixo e ferido
  motivo_atual: O papel ainda fere seu orgulho, mas ela saiu inteira. Na apresentação fechada da Casa Veyr, Lysa
    percebeu Ren meio palmo fora da linha ideal enquanto ele observava Dalm e cobriu o espaço com um recuo encurtado,
    mantendo o número inteiro.
  informacoes_compartilhadas_por_lysa:
  - Lysa acredita que Mira contaria a Jack para impedir que ela subisse machucada.
  - Lysa teme que Jack a tire do alto pelo resto da temporada, do ano ou para sempre.
  - Lysa aceitou ser Princesa das Sombras, embora o papel menor fira seu orgulho.
  - Lysa deve fazer movimentos baixos e simples para poupar o joelho.
  - Não há componente romântico no número entre Ren e Lysa.
  - Lysa executou a Princesa das Sombras com segurança durante O Vento da Noite e recebeu um aceno técnico de Mira.
  - Lysa ouviu de Mira que o segundo giro funcionou por ser menor, não por tentar provar força.
  - No ensaio de 4 Eleasis, Lysa aceitou trabalhar a novidade de Kage como presença baixa e marcada, depois que
    Mira confirmou a limitação técnica de Sorn.
  - Na reprise curta de 5 Eleasis, Lysa cumpriu a sombra baixa sem forçar o joelho.
  - Na apresentação fechada da Casa Veyr, Lysa cobriu uma pequena perda de margem física de Ren sem quebrar o número.
  riscos:
  - A fita vermelha pode ser pista real, coincidência ou tentativa de incriminação.
  - Pode se sentir substituída por Mira.
  - Pode se fechar se a conversa virar acusação direta cedo demais.
  - O sucesso em papel baixo pode estabilizar Lysa por ora, mas também lembrá-la do quanto perdeu no alto.
  - Lysa pode aceitar melhor limites baixos se isso a mantiver em cena, mas ainda odeia parecer substituível.
conteudo_mais_antigo_no_historico:
