relacao:
  nome: Darran Vell
  tipo: escrivão da Mesa de Cargas do porto
  status: Ren revelou a intenção de capturar o homem do casaco cinza e pediu cooperação documental. Darran explicou
    que pode retratar a contramarca, mas não revogar as autorizações antigas; uma declaração assinada daria à Galeria
    ou ao responsável pelas cópias causa para reter a entrega. Ele aceita considerar escrevê-la, mas exige proteção
    e não quer ser abandonado depois.
  atitude_para_ren: não identificou Ren; alarmado e hostil à figura encapuzada que o atacou
