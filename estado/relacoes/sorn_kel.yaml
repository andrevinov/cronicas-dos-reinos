natureza: estado_relacao_atual
id: sorn_kel
historico: historico/relacoes/sorn_kel.yaml
relacao:
  nome: Sorn Kel
  tipo: responsavel por cordame e montagem
  local: Jack Mooney & Sons Circus
  status: ativo nos bastidores da apresentação fechada de Kage
  atitude_para_ren: cautelosa e profissional
  confianca: nenhuma
  respeito: profissional inicial
  motivo_atual: 'Sorn aceitou marcá-las apenas sob condição de ninguém alterar as lamparinas: dobra atrás da entrada
    lateral e faixa baixa junto aos bancos de músicos/panos extras. Na abertura da apresentação fechada, Ren usou
    Passo Sombrio entre essas marcas sem quebrar segurança física, mas Sorn agora sabe que a Casa Veyr viu pelo
    menos a categoria da técnica.'
  informacoes_compartilhadas_por_sorn:
  - Depois da nona badalada, Sorn viu Harl Venn na carroça de cordame com Lysa Renn.
  - Lysa pediu breu para treinar pegada por causa do joelho.
  - Harl estava com a cópia da chave; Sorn mandou devolver no prego, mas não conferiu pessoalmente.
  - Quando Sorn viu depois, a chave estava no prego, mas torta.
  - No ensaio de 4 Eleasis, Sorn vetou a versão fisicamente mais ambiciosa das novidades de Kage e manteve chão
    baixo, sem pouso novo ou salto grande.
  - Na preparação da reprise curta de 5 Eleasis, Sorn manteve Kage na versão segura, sem salto novo de risco.
  - Na reprise curta de 5 Eleasis, Sorn viu Kage pousar na borda externa da marca durante o salto com Passo do Vento.
  - Sorn marcou treino básico de Kage para 13:30 de 6 Eleasis, com Merrit e Lysa, sem número novo.
  - Sorn aceitou duas marcas escuras confiáveis para a tenda menor se as lamparinas ficarem como foram marcadas.
  - Sorn viu Ren usar Passo Sombrio da dobra lateral para os bancos dos músicos na abertura da apresentação fechada.
  riscos:
  - Pode se fechar se sentir que está sendo acusado sem prova.
  - Pode ser testemunha útil se Ren abordar como profissional, não como culpado.
  - A conversa já chamou um pouco de atenção de Mira Dane e dois ajudantes.
  - Sorn está responsável por preservar as marcações e limites de segurança de O Vento da Noite.
  - As marcações de Sorn funcionaram durante O Vento da Noite; Ren pousou limpo diante do público.
  - Sorn percebeu uma falha técnica quase invisível no ombro de Ren durante o salto da segunda lanterna.
  - O ensaio individual de 5 Eleasis passou no limite, mas a coordenação do número não evoluiu além da versão segura
    já definida.
  - 'A reprise curta reforçou a posição de Sorn: Kage funciona, mas não deve aumentar dificuldade sem marcação nova.'
  - A tenda menor ainda não oferece continuidade de sombra confiável por todos os cantos; Sorn exigirá controle
    de lamparinas e marcas se Kage usar esse recurso.
  - Depois da revelação do Passo Sombrio, Sorn tende a proteger ainda mais as lamparinas e limitar novos usos fora
    das duas marcas confiáveis.
conteudo_mais_antigo_no_historico:
  informacoes_compartilhadas_por_sorn: 8
