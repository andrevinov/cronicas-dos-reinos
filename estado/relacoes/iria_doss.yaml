relacao:
  nome: Iria Doss
  tipo: curandeira rural e ajustadora de ossos / contato apenas indicado por Mera
  local: casa baixa depois do salgueiro partido, no ramal do rio a leste da secagem velha
  status: Iria manteve Colm seguro durante a noite, confirmou que ele pode viajar e o entregou a Ren
  atitude_para_ren: profissional e cautelosa, com a palavra de Mera como garantia inicial
  confianca: desconhecida
  respeito: desconhecido
  motivo_atual: >-
    Iria tratou Colm durante a noite, confirmou que ele podia viajar e o entregou a
    Ren para a rota compartimentada. A dívida de 3 PO por ervas, comida, tratamento
