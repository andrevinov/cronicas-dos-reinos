schema_relacao: 2
natureza: estado_relacao_atual
id: halessa_vorn
historico: historico/relacoes/halessa_vorn.yaml
relacao:
  nome: Irmã Halessa Vorn
  tipo: ouvidora juramentada de Tyr
  local: Casa de Tyr, Temple District
  status: 'Halessa atualizou Ren pessoalmente: original e falsificação seguem em custódias separadas e lacradas;
    Luath e Maerra confirmaram elementos independentes da cadeia; Tyr aguarda resposta reservada da guardiã atual
    do registro autêntico antes de atribuir autoria ou validar ordens.'
  atitude_para_ren: firme e sem indulgência diante da ironia, mas capaz de reconhecer que Ren está correto sobre
    a urgência e de preservar sua discrição apesar do desacordo
  confianca: 'condicional: Halessa confia na competência, franqueza posterior e compromisso de Ren contra Masao,
    mas exige objetivo, rota e limites acordados antes de qualquer ação clandestina futura'
  respeito: real pela capacidade de infiltração, contenção não letal e retorno imediato com provas; ainda insuficiente
    para aceitá-lo como agente clandestino coordenado de Tyr
  motivo_atual: 'Na manhã seguinte ao Benefício da Lona Aberta, uma ficha reservada de Tyr chegou a Silva Elkwood
    no circo: Luath confirmou a cópia parcial e a ação contra buscas ilegais, Maerra confirmou o lacre e a abertura
    presenciada, e Tyr agora busca a confirmação da guardiã atual informada. Silva confirmou guarda imediata, pediu
    manutenção temporária no abrigo atual e solicitou resguardo em espera sem deslocamento até o próximo sino maior.'
  ofertas:
  - Ficha selada para Maerra ou Luath confirmando que o testemunho entrou em triagem reservada.
  - Audiência de lacre em câmara reservada, com Halessa, outro juramentado e possível informação a Sirrus antes
    do próximo sino maior se o conteúdo justificar.
  - Duas fichas reservadas enviadas a Luath e Maerra para confirmar custódia, lacre, abertura presenciada e situação
    das testemunhas.
  - Audiência de lacre por volta de 11:21 se Ren aceitar paz juramentada.
  - Pasta aberta e mantida sob custódia formal de Tyr.
  - Sirrus Melandor chamado imediatamente após leitura do bilhete e das correções.
  - Aceitou receber até três perguntas de Ren para possível uso na oitiva de Velis.
  - Recebeu três perguntas de Ren como anexo reservado do portador.
  - Tyr recebeu confirmações de Luath e Maerra e enviou ficha reservada a Silva Elkwood para confirmar a guarda
    atual informada.
  - Tyr recebeu de Silva a confirmação da guarda imediata dos Vell, manutenção temporária no abrigo atual e pedido
    de resguardo em espera sem deslocamento.
  - Mobilizou preservação urgente da Casa de Pesos com Luath e duas testemunhas de Tyr, sem aguardar o amanhecer.
  - Admite discutir futura cooperação clandestina se Ren apresentar antes da ação o objetivo, a rota e os limites
    que aceita observar.
  - Concedeu a Ren saída pela porta reservada dos peticionários, sem registro público de sua partida.
  - Halessa aceitou preparar e coordenar uma convocação suplementar legítima de Velis se Ren concordar com observação
    apenas, janela e ponto de encerramento definidos, nenhuma entrada no destino, contato, furto ou captura solitária,
    e informar disponibilidade e rota de retorno.
  riscos:
  - Se Ren focar em vingança, Halessa pode rebaixar o caso para risco de violência privada.
  - Se Ren esconder demais, Halessa pode suspeitar que a Casa de Tyr está sendo usada.
  - Se Ren entregar nomes completos em voz alta, pode criar registro ou exposição antes de proteção formal.
  - Halessa notou que 'sorte' não explica cadeia de custódia; a pasta pode ajudar Ren ou criar risco legal contra
    ele.
  - Tyr ainda não concedeu abrigo irrestrito nem acesso direto a Sirrus.
  - Halessa ainda decide quais perguntas de Ren cabem sem comprometer a ata.
  - A crise no Harbor District pode reduzir a velocidade prática de respostas e extratos, mesmo com o caso preservado.
  - Halessa não aceitará usar Ren como agente clandestino enquanto ele apresentar operações consumadas em vez de
    negociar objetivo, limites e rota antes da ação.
  informacoes_recebidas_por_halessa:
  - Ren relatou, sem nomear a fonte, que uma mulher Cinza-Azul ganhou autoridade rapidamente em Narwhal Manor e
    que ele a viu instruir Velis antes da primeira oitiva; apresentou a hipótese de que ela seja Kajiwara Shizune.
  acordos:
  - 'Acordo provisório para 12 Eleasis: Halessa buscará autorização de Sirrus para entregar a Velis convocação suplementar
    no primeiro sino após o anoitecer e enviará confirmação reservada a Ren antes do meio-dia. Ren observará separado
    do portador por no máximo duas horas, sem invasão, contato, furto ou captura; romperá diante de contravigilância
    e retornará à Casa de Tyr ou a Luath.'
  - Sirrus autorizou a convocação suplementar de Velis e a vigilância coordenada para o primeiro sino após o anoitecer
    de 12 Eleasis. Halessa enviou a ficha reservada de confirmação a Silva antes do meio-dia, cumprindo o combinado;
    Ren ainda não foi informado.
  momentos_de_vinculo:
  - Ao ouvir a brincadeira de Ren sobre ser um bicho-papão de Kozakura, Halessa conteve um sorriso e sustentou o
    olhar dele por um instante além do estritamente profissional; o sinal permaneceu sutil e ambíguo.
conteudo_mais_antigo_no_historico:
  ofertas: 1
