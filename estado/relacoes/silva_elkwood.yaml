relacao:
  nome: Silva Elkwood
  tipo: clériga de Chauntea / contato potencial de abrigo
  local: Jack Mooney & Sons Circus
  status: Silva sabe da pista da Casa de Pesos e que Ren pretende apenas vigiar. Considera uma casa própria potencialmente
    mais segura que o circo, mas advertiu que um dojo deve tratar alunos como pessoas com escolha, não como defesa
    consumível.
  atitude_para_ren: favorável, protetiva e francamente aconselhadora; reconhece o cansaço e a sinceridade de Ren,
    mas rejeita que ele assuma sozinho o direito de escolher todos os custos
  confianca: moderada e vigilante
  respeito: alto
  motivo_atual: Ao amanhecer, leu a mensagem curta de Luath informando que o pacote reservado passou para Tyr sem
    nome externo. Ela acompanhou a conversa com Jack e reforça, junto dele, que qualquer acesso aos Vell passa por
    ela quando houver risco de olho externo.
  documentos:
  - Silva abriu e leu o bilhete curto e selado de Maerra.
  riscos:
  - Silva sabe que Ren retornou sem cauda útil percebida, mas sem a certeza plena que ele queria.
  - Silva ouviu o relato de Ren sobre Sarbreen, Brunna Torkel, a Escada das Sete Águas e a avaliação de Luath.
  - Silva sabe que Ren despertou o Passo Sombrio e quer que ele teste a técnica longe dos Vell até conhecer seus
    limites.
  - Silva sabe que a resposta da Casa Veyr chegou com 40 PO adiantadas, mas que Jack ainda não aceitou a apresentação
    fechada.
  - Silva sabe que Casa Veyr foi verificada como presença temporária pagante, mas sem raiz local forte.
  - Silva mantém Nera e Tavin longe da superfície da apresentação fechada de Kage.
  - Silva ajudou Ren a fazer uma visita discreta por Passo Sombrio à carroça verde, mas considera a técnica brusca
    demais para uso casual perto dos Vell.
  - Silva manteve a rotina do circo quieta enquanto Ren completava descanso curto antes do amanhecer de 7 Eleasis.
  - Silva leu a mensagem curta de Luath informando que o pacote reservado da Ponte Baixa passou para Tyr sem nome
    no papel externo.
  - Silva continua como filtro obrigatório para conversas com Nera e Tavin quando houver risco de observação no
    acampamento.
  - Ren contou a Silva que Bram Vask tentou matar Colm e o próprio Ren novamente, e declarou que alguns homens são
    irrecuperáveis e que protegerá Nera e Tavin custe o que custar; Silva não sabe que Ren matou o homem de mãos
    limpas, mas questionou se ele já havia feito algo naquele dia.
  - Ren contou a Silva que acredita que Bram Vask tenta corromper Kethra Dunn para facilitar a entrada de Masao
    e aliados em Ravens Bluff; Silva tratou essa ligação como ameaça alegada por Ren e aconselhou obter papel, testemunhas
    e estrutura antes de concluir que a morte de Bram resolveria o problema.
  - 'Silva guarda um recado de Ren para entregar diretamente a Nera: ele pede que não se encontrem por enquanto,
    que ela não se arrisque e assina ''Com amor, R.'''
conteudo_mais_antigo_no_historico:
  riscos: 54
