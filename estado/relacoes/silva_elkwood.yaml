relacao:
  nome: Silva Elkwood
  tipo: clériga de Chauntea / contato potencial de abrigo
  local: Jack Mooney & Sons Circus
  status: Silva recebeu de Ren o relato completo da custódia, das conclusões sobre Kurobane e Masao, da contravigilância
    com Luath e do ferimento na briga do circo; confirmou que Nera e Tavin permanecem seguros até onde o circo pode
    verificar e ofereceu cuidar da costela de Ren.
  atitude_para_ren: favorável, protetiva e severamente vigilante; valoriza a honestidade e o cuidado com a cauda,
    mas rejeita tratar a invasão como simples recado
  confianca: moderada e vigilante
  respeito: alto e reforçado pela decisão de Ren de não atacar Brass, informar Luath e preparar uma rota de fuga
    antes da vigilância
  motivo_atual: Silva ouviu o relato integral da invasão à loja de Bram. Reconhece que Ren verificou um possível
    refém, rompeu a cauda e contou a verdade antes de procurar os Vell, mas considera que a violência apenas extraiu
    uma promessa sob medo e pode deslocar a resposta de Bram.
  documentos:
  - Silva abriu e leu o bilhete curto e selado de Maerra.
  - Antes do meio-dia de 12 Eleasis, Silva recebeu e verificou a ficha reservada de Tyr confirmando a convocação
    suplementar de Velis; às 17:45, entregou a confirmação a Ren e informou que Sirrus autorizou a vigilância coordenada
    nos limites definidos.
  riscos:
  - Silva manteve a rotina do circo quieta enquanto Ren completava descanso curto antes do amanhecer de 7 Eleasis.
  - Silva continua como filtro obrigatório para conversas com Nera e Tavin quando houver risco de observação no
    acampamento.
  - Ren contou a Silva que Bram Vask tentou matar Colm e o próprio Ren novamente, e declarou que alguns homens são
    irrecuperáveis e que protegerá Nera e Tavin custe o que custar; Silva não sabe que Ren matou o homem de mãos
    limpas, mas questionou se ele já havia feito algo naquele dia.
  - Ren contou a Silva que acredita que Bram Vask tenta corromper Kethra Dunn para facilitar a entrada de Masao
    e aliados em Ravens Bluff; Silva tratou essa ligação como ameaça alegada por Ren e aconselhou obter papel, testemunhas
    e estrutura antes de concluir que a morte de Bram resolveria o problema.
  - 'Silva guarda um recado de Ren para entregar diretamente a Nera: ele pede que não se encontrem por enquanto,
    que ela não se arrisque e assina ''Com amor, R.'''
  - Silva sabe que Ren retomou a vigilância após contravigilância clara, violando o limite acordado com Halessa.
    Reconhece que ele permaneceu não identificado, saiu sem atacar, retornou antes do prazo e confessou a quebra,
    mas considera que Narwhal explorou previsivelmente o orgulho dele.
  informacoes_recebidas_por_silva:
  - Ren contou a tentativa fracassada de falar com Kethra em Narwhal sob o Broche, o registro dos nomes falsos Jost
    Anon e Arthur Donovan ligados a uma alegação sobre a Galeria, a cauda rompida com Passos sem Pegadas e o acordo
    de mensagem única com Sella Rove.
  acordos:
  - Silva receberá e verificará pessoalmente a ficha reservada de Tyr sobre a operação de 12 Eleasis, procurará
    Ren sem divulgar o motivo ao circo e, se Shizune for confirmada, reforçará discretamente protocolos de recados,
    selos, deslocamentos e proteção dos Vell.
  - Na noite de 13 Eleasis, Silva permitiu que Ren convidasse Nera a dormir em seu quarto, deixando explícito que
    a escolha pertence somente a Nera, que não deve haver pressão ligada ao medo do futuro e que os cuidados de
    Tavin e a liberdade de Nera sair a qualquer momento precisam permanecer assegurados.
  momentos_de_vinculo:
  - Ren expôs a Silva seu conflito entre o treinamento para neutralizar ameaças e o respeito pela vida aprendido
    com seus aliados. Silva respondeu sem condenação ou indulgência, reconhecendo que a preocupação dele com o efeito
    da vingança é uma razão para continuar confiando nele.
  - 'Após o retorno da operação de Velis, Silva combinou censura direta com cuidado concreto: deixou comida, confirmou
    que Nera e Tavin estavam seguros e recusou discutir nova estratégia antes que Ren removesse o disfarce e dormisse
    uma noite completa.'
  - Ren admitiu com vergonha que desejava aproveitar uma noite de calma com Nera antes que Ravens Bluff piorasse.
    Silva respondeu com humor cuidadoso e limites claros, distinguindo sua permissão logística da autonomia de Nera.
  informacoes_compartilhadas_por_silva:
  - Sirrus autorizou que Velis Rook receba convocação suplementar no primeiro sino após o anoitecer de 12 Eleasis,
    com Ren junto ao oficial de justiça como auxiliar, sujeito aos limites acordados com Halessa.
  relacao:
    status: 'Silva recebeu de Ren o relato integral do encontro com Tomas, do pedido de Maerra e da operação na
      oficina: infiltração, nocautes não letais, interrogatório, preservação das provas e condução da testemunha
      viva até Luath. Ela agora conhece a sequência sem omissões e aguarda saber se Ren deseja alguma ação concreta
      dela.'
    motivo_atual: Silva valoriza a transparência completa de Ren e reconhece o peso de ele ter preservado testemunha
      e provas para custódia institucional. Mantém uma objeção concreta ao risco de transformar interrogatório por
      medo em hábito e considera que Tomas conhecer a cobertura torna Shinta dependente também da discrição dele.
    informacoes_recebidas_por_silva:
    - Em 20 Eleasis, Ren contou a Silva, sem omissões, o encontro com Tomas, o pedido de Maerra, a infiltração na
      oficina, os nocautes não letais, o interrogatório, a preservação da matriz e dos documentos e a condução da
      testemunha viva e das provas até Luath.
