  nome: Tomas Rell
  tipo: intermediário administrativo e empregador de Shinta na Galeria dos Escribas
  local: Ravens Bluff; paradeiro imediato não rastreado por Ren
  status: ativo, fora da cena de Ren; aceitou cooperação cautelosa sob limites explícitos
