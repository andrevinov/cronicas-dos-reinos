  shinta_ryoushi:
    capacidades_declaradas: lê Comum melhor do que fala e escreve na língua de origem
    estado_diante_de_tomas: não desmascarada; aceita na lista regular do pátio de entregas da Galeria dos Escribas.
      Concluiu em 13 Eleasis um dia completo sem erro atribuível, recebeu 4 PP e teve o trabalho declarado confiável
