    - manta de estopa cinza sobre o ombro para quebrar a silhueta
    - roupas proprias de Ren guardadas com Dessa Wren para limpeza e uso como figurino estrangeiro
    - roupas roubadas e roupas de doacao entregues a Dessa Wren para virar retalho
    - disfarces de Nera e Tavin de Dessa Wren em uso
    - pacote de explorador
  objetivos:
    longo_prazo:
    - encontrar Masao Hirasawa
    - recuperar o Selo da Lua Velada
    - descobrir por que Aiko Kagehira foi morta
    - descobrir o que restou da Juppongatana/Dez Espadas
    imediato:
    - decidir a ação de Ren no próprio turno contra o homem de mãos limpas adjacente e armado
    - decidir entre nocautear, agarrar, desarmar, atordoar, ferir ou matar o alvo
    - considerar as três testemunhas comuns antes de escolher violência letal ou magia visível
    - confirmar posteriormente se Mera Fumaça e Colm/Dent chegaram vivos à casa de Iria Doss
    - identificar o homem de mãos limpas que organizou a compra/captura para Bram Vask
    - 'preservar o sigilo da fonte reservada: Luath não nomeou Ren no registro externo, mas o pacote pode sofrer
      pressão institucional futura'
    - manter Nera e Tavin protegidos na carroça verde; Silva endureceu a segurança interna e avisou Ren a não voltar
      direto para eles se trouxer cauda
    - observar se a Ponte Baixa, Narwhal, Red Sail, Dalm ou interessados no camarote oeste reagem à retirada das
      evidências
    - acompanhar os próximos efeitos do pacote reservado da Ponte Baixa em Tyr, agora que a mensagem de Luath indica
      que ele passou sem nome externo
    - evitar voltar sozinho à Ponte Baixa sem nova informação, pois Luath não autorizou essa entrada e os sinais
      deixados podem ter sido percebidos depois
    - proteger Colm/Dent, agora solto e reunido a Mera Fumaça, mas ainda fraco, ferido e precisando de tratamento
      hoje
    - reinstalar futuramente, em conversa discreta, novos pontos mortos com Pell e Kethra se ainda forem necessários
    - aguardar oportunidade futura para saber as consequências da ficha curta de Maerra a Halessa
    - proteger Peta e as outras crianças agora sob cuidado de Maerra
    - manter-se como Ren Kage, artista visível, sem quebrar a máscara pública recém-criada
    - proteger Nera e Tavin, agora de volta à carroça verde e explicitamente nomeados como ruído no bilhete
    - considerar que Tyr recebeu confirmações de Luath e Maerra
    - impedir que Narwhal e Red Sail virem a acusação contra Ren e Nera
    - manter os Vell no circo com resguardo em espera de Tyr até o próximo sino maior
    - decidir se continua puxando o fio de Brass/Narwhal/Ponte Baixa ou se prioriza proteção formal
    - proteger o livro original de Nera escondido com Silva
    - usar com cuidado o Broche do Semblante Humilde, novamente disponível no amanhecer de 7 Eleasis
  vinculos_ativos:
    faccao_prevista:
      nome: Night Watch
      status: contato inicial estabelecido
    contato_previsto:
      nome: Luath
      papel: sargento da City Guard
      status: contato operacional cauteloso; confiança moderada, risco alto
    antagonista_principal:
      nome: Masao Hirasawa
      status: foragido
      conhecimento_de_ren: Ren acredita que Masao pode ter usado Ravens Bluff como esconderijo, ponto de troca ou
        passagem. Ren sabe que Masao construiu poder no submundo de Kozakura, comandou a Juppongatana/Dez Espadas
        e cultiva o sonho de ser rei das sombras.
  conhecimento_atual:
    arquivo: personagens/jogador/conhecimento.md
    rumores_relevantes:
    - A guarda precisa de gente capaz para tarefas que guardas formais não conseguem cobrir.
    - Cargas somem entre o cais, armazéns e alfândega.
    - Uma pessoa discreta pode se esconder bem em Ravens Bluff, se tiver dinheiro ou patrono.
  estado_narrativo:
    situacao_inicial: A sessão 003 começa na Casa da Aurora Menor, depois da lembrança de Peta sobre o homem de
      manga cinza com dois anéis, o papel para o peixe, a máscara e o lugar frio sob rodas.
    primeira_cena_sugerida: Ren está perto da saleta de Maerra enquanto a manhã avança, com várias pistas urgentes
      e sem direção única confirmada.
    cena_atual: Ren alcançou o homem de mãos limpas junto à cerca de salgueiros, às 08:03 de 7 Eleasis. O alvo venceu
      a iniciativa, mas Ren atravessou o carrinho sem atingir trabalhadores, anulou com Aparar Projéteis uma faca
      arremessada e fechou a distância. O homem atacou com uma segunda faca e errou. É o turno de Ren; ambos estão
      adjacentes, Ren está ileso e três trabalhadores observam a cerca de cinquenta pés.
    risco_imediato: 'alto localizado: o alvo continua armado e hostil; o combate é público e pode atrair mais trabalhadores,
      patrulha ou aliados; qualquer violência letal terá testemunhas; Ren ainda controla a própria ação e não sofreu
      dano.'
    foco_inicial:
    - pista da máscara, do peixe e do lugar frio sob rodas
    - respostas de Brass, Narwhal, Bram e Pell aos movimentos da manhã
    - segurança de Colm/Dent, Kethra, Peta e das crianças resgatadas
    - proteção dos Vell no circo e desdobramentos de Tyr
    - Ponte Baixa, porões secos atrás de armazéns velhos e janela antes da segunda maré
  pendencias:
    antes_da_primeira_sessao: []
    podem_ser_definidas_em_jogo:
    - resolver o turno de Ren contra o homem de mãos limpas
    - decidir se Ren pretende capturar o alvo vivo e como lidará com as testemunhas
    - confirmar depois se Mera e Colm/Dent chegaram a Iria Doss
    - identificar o homem de casaco pardo, tinta violeta sob a unha do polegar direito e cicatriz abaixo da orelha
      esquerda descrito por Mera
