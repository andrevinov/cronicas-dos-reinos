estado_narrativo:
  situacao_inicial: "A sessão 003 começa na Casa da Aurora Menor, depois da lembrança de Peta sobre o homem de manga cinza com dois anéis, o papel para o peixe, a máscara e o lugar frio sob rodas."
  primeira_cena_sugerida: "Ren está perto da saleta de Maerra enquanto a manhã avança, com várias pistas urgentes e sem direção única confirmada."
  cena_atual: "Ren está na tenda menor do Jack Mooney & Sons Circus por volta de 18:18 de 6 Eleasis de 1372 DR, já como Kage, atrás da dobra lateral marcada por Sorn. Ren aceitou prosseguir com a apresentação fechada da Casa Veyr apesar da dobra contratual. Os Mooney controlaram o transporte e a entrada: Kage foi levado pela rota interna de panos/remendos, Tobb contou as 40 PO restantes antes da entrada útil dos convidados, Corven Dalm assinou antes de pisar na lona útil e o homem da casa foi colocado em luz clara perto da entrada de artistas, sem controlar a aba real. A Sombra B segura Ren agora; a Sombra A, junto aos bancos dos músicos, está visível e em penumbra suficiente para Passo Sombrio. Ren fez uma leitura excelente do risco: a ameaça mais provável é sondagem/provocação controlada, não ataque aberto, sequestro imediato ou refém dentro da tenda. Recursos atuais: 45/45 PV, Ki 6/6, 25 PO, 9 shuriken. O Broche do Semblante Humilde está gasto até o próximo amanhecer. O total de 80 PO da Casa Veyr está sob controle de Jack/Tobb, mas o pagamento de Ren por esta apresentação ainda está pendente do pós-show."
  risco_imediato: "alto em termos operacionais e sociais: a Casa Veyr provavelmente tenta mapear o Passo Sombrio, as sombras úteis, a saída real de Kage ou a reação emocional de Ren a termos como gravadora, menino ou Vell; qualquer primeiro gesto que entregue sombra, olhar ou prioridade emocional pode virar informação para Dalm e o homem da casa"
  foco_inicial:
    - "pista da máscara, do peixe e do lugar frio sob rodas"
    - "respostas de Brass, Narwhal, Bram e Pell aos movimentos da manhã"
    - "segurança de Colm/Dent, Kethra, Peta e das crianças resgatadas"
    - "proteção dos Vell no circo e desdobramentos de Tyr"
    - "apresentação fechada da Casa Veyr e limitações da tenda menor para Passo Sombrio"

