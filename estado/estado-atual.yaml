      Permanece sem acesso a documentos fechados, rotas de pastas, salas internas ou à Casa do Salgueiro Seco.
    nome: Shinta Ryoushi
    origem_alegada: vila estrangeira de pescadores; nasceu e cresceu pescando
    avaliacao_pratica: aprovado para retornar após o primeiro sino de 13 Eleasis diretamente à entrada de entrega;
      diligência, organização e silêncio reconhecidos, com supervisão reduzida para amostragem, mas acesso a selos
