  condicoes:
  - 'Rolagem para aprimorar falas e drama do número: 5 contra CD 13, falha'
  - 'Rolagem para integrar Lysa, Merrit, Dessa e Sorn ao ajuste: 14 contra CD 12, sucesso'
  - A versão segura de Kage para 5 Eleasis tem duas pequenas novidades cênicas, mas não quatro movimentos físicos
    novos completos
  - O segundo sino da tarde passou sem recado de Luath ao circo até 14:18
  - Ren suspendeu o treino de Kage satisfeito com a versão segura de Sorn/Dessa
  - 'Rolagem para chegar ao posto sem ligar Ren Kage ao visitante pobre: 7 contra CD 13, falha'
  - A saída do circo não gerou cauda competente, mas criou uma memória fraca ligando o sumiço de Kage a um forasteiro
    pobre de porte parecido
  - No posto da Night Watch, um guarda mais velho reconheceu Ren como o homem do sargento, reforçando a linha pública
    fina de que o forasteiro pobre admitido no mercado tem entrada com a guarda
  - 'Rolagem para ler o que Luath evita publicizar: 11 contra CD 13, falha'
  - 'Rolagem para Luath abrir informação útil sem tornar Ren auxiliar oficial: 4 contra CD 12, falha'
  - Luath revelou apenas informação controlada e não abriu acesso aos prisioneiros
  - Luath aceitou levar uma pergunta curta de Ren ao interrogatório
