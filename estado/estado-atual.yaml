personagem:
  nome: "Ren Kagehira"
  arquivo_ficha: "personagens/jogador/ficha.yaml"
  status: "ativo"
  nivel: 6
  classe: "Monge"
  subclasse: "Caminho da Sombra"

localizacao:
  plano: "Material"
  mundo: "Toril"
  continente: "Faerûn"
  regiao: "The Vast"
  cidade: "Ravens Bluff"
  area: "Jack Mooney & Sons Circus"
  ponto_exato: "tenda menor, atrás da dobra lateral marcada por Sorn"
  descricao_operacional: >
    Ren resgatou seis crianças da Casa Velha do Primeiro Raio e as entregou à
    proteção de Maerra na Casa da Aurora Menor. Peta permaneceu desaparecida,
    provavelmente levada pela pessoa de vermelho através de rota baixa ligada à
    porta de ferro. Ren seguiu o rastro de cera, tintura e pano encerado pela
    drenagem até a rua dos tintureiros e encontrou uma oficina ativa pelos
    fundos, com o cesto de roupa suja marcado por tira amarela de dois nós.
    Usando os momentos finais de Passos sem Pegadas, Ren entrou pela porta dos
    fundos, atacou a pessoa de vermelho de modo não letal e a deixou
    inconsciente antes que gritasse ou puxasse o cordão fino ao alcance dela.
    Ren arrancou a máscara e viu que a pessoa de vermelho é uma mulher jovem
    adulta desconhecida, pálida, com cicatriz antiga de queimadura/cera e marca
    de sol apagado no pescoço. Em seguida pegou a criança viva, presa e
    amordaçada, quase certamente Peta, e saiu para o pátio dos fundos antes que
    a cortina se abrisse por completo. Atrás da cortina há pelo menos uma pessoa
    reagindo e uma abertura baixa escura, possivelmente passagem, alçapão ou
    escada descendo. Ren escolheu sair pela rua dos tintureiros, usou os
    instantes finais de Passos sem Pegadas para quebrar a direção da fuga e,
    ao alcançar a rua, ativou o Broche do Semblante Humilde. Com pano de
    tingimento e cesto quebrado, disfarçou Peta como carga de retalhos úmidos e
    chegou à Casa da Aurora Menor sem levantar suspeita útil. Peta foi
    confirmada viva por Cal e entregue a Maerra. Passos sem Pegadas expirou por
    volta de 00:58 de 4 Eleasis; o Broche do Semblante Humilde foi usado e deve
    manter a aparência humilde/comum de Ren até cerca de 01:56, com uso gasto
    até o próximo amanhecer. Maerra não reconheceu a mulher ou a marca com
    segurança, e Peta, em choque, só conseguiu dizer fragmentos: "frio",
    "embaixo" e que a mulher de vermelho não falava com ela. Ren apagou por
    cansaço na Casa da Aurora Menor por pouco tempo, sem completar descanso
    curto de monge e sem recuperar ki. Depois voltou ao circo pela rota da
    carroça de remendos, sem cauda competente percebida; o broche expirou no
    caminho. Silva Elkwood interceptou Ren antes da carroça verde e perguntou se
    ele trouxe alguém atrás. Ren respondeu que não foi seguido, chamou Silva de
    Sil pela primeira vez e contou, em linhas gerais, que sete crianças foram
    resgatadas e estão vivas sob cuidado de Maerra. Silva pretende mandar ajuda
    discreta de Chauntea à Casa da Aurora Menor antes do amanhecer. Nera saiu da
    carroça verde e abraçou Ren, extremamente preocupada. Ren a abraçou, beijou
    discretamente, prometeu voltar e foi dormir no depósito de figurino velho.
    Dormiu algumas horas sem completar descanso longo, mas fez repouso curto de
    monge com centralização suficiente para recuperar ki. A ajuda discreta de Chauntea alcançou Maerra sem chamar
    atenção útil. Ao acordar, Ren encontrou Nera sentada perto da entrada do
    canto, com água e pão. Ren vestiu roupa de cidadão comum, explicou a Nera
    que precisava checar Colm/Dent e Dorra Hest, e saiu para os pátios de saída
    de trabalhadores. Chegou depois da partida das carroças de cal; a carroça de
    Dorra não estava mais no local. Depois pagou 1 PO a um trabalhador dos pátios
    e obteve confirmação parcial: Dorra saiu no cinza, provavelmente com Dent sob
    a lona, mas alguém havia perguntado por um doente vindo do lavadouro antes da
    partida. A saída de Colm/Dent foi comprometida, não confirmada como segura.
    Ren então procurou Luath no posto da City Guard/Night Watch, relatou Bram
    Vask, Kethra e Colm, e ofereceu o caderno de contas sujas de Bram como prova
    sem explicar como tirou Colm da loja. Luath examinou o caderno, copiou marcas
    úteis e o devolveu por não aceitar prova formal limpa sem cadeia de custódia
    ou testemunho, mas a Night Watch pressionou Bram em sua loja. Depois da
    visita da guarda, Ren pagou uma criança para entregar recado ameaçador; a
    mensagem chegou imprecisa, ligando a ameaça à visita da guarda. Bram não
    atacou a criança em público, fechou a loja e começou a se mover nos fundos.
    Ren seguiu até os fundos de Narwhal Manor e montou fisicamente o ponto morto
    de Kethra no vaso rachado junto aos barris de areia e à calha quebrada. A
    chegada foi limpa, mas a montagem ficou imperfeita: a base do vaso deixou
    sinais discretos de manipulação e há uma migalha de cera cinza visível de
    perto. A mensagem informa que Colm/Dent foi com a cal, que Bram recebeu
    visita da guarda e recado para parar, e que o amigo está seguro por algum
    tempo. Depois Ren foi à The Silver Lily e encontrou novo bilhete de Pell no
    ponto morto: Rusk não voltou, Brass usa mensageiro novo e evita o beco dos
    tonéis, alguém perguntou se Kage era o mesmo oriental da Silver Lily, e um
    papel fino foi para Narwhal com a palavra "máscara" associada. Ren deixou 2
    PO e um novo pedido para Pell descobrir dia, hora ou local onde Dain "Brass"
    Mord fique sozinho, mas o depósito falhou em discrição: uma funcionária da
    Silver Lily viu parcialmente Ren junto ao vaso, sem ler o bilhete. Depois
    Ren seguiu para a Casa da Aurora Menor sem cauda competente. Maerra permitiu
    perguntas curtas às crianças, com ela impondo limite. Ren conduziu bem a
    conversa; o grupo de crianças não conseguiu organizar lembranças novas de
    modo coerente, mas Peta lembrou que a pessoa de vermelho não mandava, apenas
    fazia; que um homem de manga cinza e dois anéis falava por trás; que ele
    mencionou papel indo para o peixe e disse que a máscara não era para o sol;
    e que Peta ficou em um lugar frio, embaixo de onde rodas passavam por cima,
    com água na parede. No início da sessão 003, Ren decidiu retornar ao Jack
    Mooney & Sons Circus para ver os Vell e falar com Jack sobre o calendário de
    apresentações de Kage. O deslocamento desde a Casa da Aurora Menor não
    exigiu rolagem e não trouxe cauda competente percebida. No caminho, Ren
    ouviu rumor solto sobre passagem fechada "perto do peixe" por barris mal
    marcados. Ao chegar ao circo, encontrou Nera e Tavin vivos e integrados à
    rotina sob Silva. Ren está agora na carroça-escritório de Jack, ouvindo a
    proposta inicial de calendário: não vender Kage em 4 Eleasis, considerar
    reprise curta em 5 Eleasis ao cair da tarde e só aceitar apresentação fechada
    em tenda controlada pelo circo se o camarote oeste cumprir os filtros já
    exigidos. Ren propôs uma pequena apresentação em 5 Eleasis para ser
    relembrado e, depois disso, uma apresentação particular para quem pagar
    melhor. Jack aceitou a linha comercial: Kage raro, aparição curta, pouca
    fala, e particulares só com filtros formais. Antes de Jack concluir o
    registro, Tobb Marlin trouxe recado de Luath: perto do mercado de peixe, a
    guarda fechou duas passagens e encontrou quatro barris mal marcados com pó
    cinza, cheiro acre/de ovo ruim e cera vermelha no aro; acredita-se que eram
    seis. Luath quer falar com o homem que tratou de Bram Vask, sem plateia e
    sem roupa de palco. Ren deixou o circo em vestes de homem pobre e procurou
    Luath discretamente. A tentativa de aproximação falhou parcialmente: Ren
    passou pelo isolamento da guarda, mas uma peixeira e um escrivãozinho de
    guilda viram um forasteiro pobre ser admitido onde outros ficaram do lado de
    fora. Luath mostrou quatro barris mal rotulados como sal/restos de peixe; um
    deles rachou e deixou vazar pó cinza que virou pasta úmida. Há cera vermelha
    grossa no aro, uma grelha baixa próxima e parede molhada até a altura do
    joelho. Luath disse que a conta da carroça era de seis barris e que um
    peixeiro descreveu o homem de manga cinza e dois anéis mandando descarregar
    os barris por intermédio de outro sujeito. Ren examinou os barris e
    reconheceu o princípio de uma substância explosiva semelhante a pólvora/pó
    de fumaça, embora com impurezas e traços alquímicos locais. A cera vermelha
    bate fortemente com o fio da rua dos tintureiros e da oficina onde a mulher
    de vermelho foi neutralizada. Ren contou a Luath sobre a mulher de vermelho,
    a cicatriz, a marca de sol apagado, a oficina dos tintureiros e o homem de
    manga cinza com dois anéis. Luath enviou guardas para cercar a oficina dos
    tintureiros com cautela, sem entrar chutando porta se houver cheiro do pó.
    Ren escolheu seguir o rastro da carroça e alertou Luath a pensar nos alvos
    que deixariam Ravens Bluff mais frágil e desesperançada: mercado, água,
    ponte, templo e guarda. Luath deu a descrição da carroça dos dois barris
    faltantes: eixo baixo, roda traseira esquerda ruim, tábua de trás manchada
    de vermelho e última vista no Beco da Salmoura rumo à balança velha. Ren
    tentou seguir a trilha, mas perdeu tempo no cruzamento de rastros do
    mercado. Às 10:41, uma explosão parcial atingiu a área da balança velha,
    feriu pessoas próximas, rachou o tablado e abriu uma passagem baixa escura
    com pedra molhada. O efeito parece menor do que dois barris inteiros
    deveriam causar; pode haver carga remanescente, pó úmido que não detonou ou
    outro barril em outro ponto. Ren perguntou a Luath sobre túneis
    subterrâneos ou civilização anterior sob Ravens Bluff. Luath respondeu com
    Sarbreen, antiga cidade anã sob a cidade atual, e explicou que partes dela
    viraram porões, esgotos, drenagens, passagens clandestinas e lugares
    perigosos. A abertura causada pela explosão expôs pedra antiga com marca
    angular sob o tablado, ar puxando para baixo e som de metal contra pedra
    seguido por passos se afastando na água rasa. Ren decidiu descer, pediu que
    Luath continuasse checando a contagem de barris e ativou Passos sem Pegadas,
    gastando 2 ki. A descida pelo tablado quebrado foi bem-sucedida, e Ren
    entrou sem ser percebido. Na primeira câmara baixa de Sarbreen sob o
    mercado, encontrou restos de um barril detonado e sinais de que outro barril
    inteiro foi arrastado para uma galeria em escuridão total. Há ao menos dois
    ritmos de movimento adiante e som de metal contra pedra, como ferramenta,
    cunha ou trava. Ren ativou Visão no Escuro, gastando mais 2 ki, e avançou.
    Percebeu um fio simples de alarme, evitou acioná-lo, quase escorregou numa
    pedra solta, mas manteve a perseguição furtiva. Ele agora vê, a cerca de 30
    pés, dois vultos em uma câmara baixa de serviço de Sarbreen: um vigia leve
    perto de uma saída lateral e o homem de manga cinza com dois anéis usando
    uma barra curta de ferro numa junta/trava antiga. O segundo barril está
    posicionado para explodir contra a parede, ligado a um conjunto improvisado
    de pano encerado, cerâmica, cordão e pó escuro, ainda não aceso. Ren se
    aproximou sob Passos sem Pegadas e atacou de surpresa usando Rajada de
    Golpes. O vulto leve caiu junto à saída lateral, sem alarme útil. Ren
    apagou o homem de manga cinza com golpes não letais antes que ele pudesse
    gritar ou acionar o dispositivo. Ren separou com cuidado o acionamento do
    barril: cordão, cerâmica, tigela rasa, pano encerado, recipiente de brasa
    ou luz fraca e cera vermelha. O barril principal continua em Sarbreen, sem
    ignição imediata, mas ainda perigoso. Ren arrastou o vulto leve e o homem
    de manga cinza até a primeira câmara baixa; Luath e seus homens içaram os
    dois vivos pela corda. O dispositivo foi entregue à guarda. Ren está junto
    à corda, abaixo da balança velha, com Passos sem Pegadas e Visão no Escuro
    ativos, Ki 0/5. Luath recusou interrogar os prisioneiros no mercado por
    risco de rumor, perímetro instável e explosivo ainda presente, mas combinou
    contato depois do segundo sino ou por recado ao circo. Um mensageiro da
    guarda relatou que a oficina dos tintureiros estava vazia, com a mulher de
    vermelho ausente, sinais de limpeza apressada, cesto de tira amarela de
    dois nós e abertura baixa para pedra úmida. Ren saiu do mercado sem levar
    cauda competente ao circo. Ao retornar ao Jack Mooney & Sons Circus por
    volta de 11:27, falou de modo reservado com Silva, Nera e Tavin, sem chamar
    atenção do circo todo. Depois completou descanso curto de uma hora no
    depósito de figurino velho: meia hora de sono e meia hora de meditação,
    recuperando ki para 5/5. Passos sem Pegadas expirou durante esse repouso;
    Visão no Escuro expirou por volta de 18:43 de 4 Eleasis. Em seguida, Ren começou o
    ensaio de Kage. A tentativa de acrescentar duas seções fisicamente novas
    falhou por margem curta e o texto dramático inicial ficou excessivo, mas
    Lysa, Merrit, Dessa e Sorn integraram uma versão segura com duas pequenas
    novidades cênicas. O segundo sino da tarde passou sem recado de Luath. Ren
    suspendeu o treino e saiu vestido como homem pobre para procurar Luath no
    posto da Night Watch. A saída não gerou cauda competente, mas criou uma
    memória fraca ligando o sumiço de Kage a um forasteiro pobre de porte
    parecido. No posto, um guarda mais velho reconheceu Ren como o homem do
    sargento, reforçando a linha pública fina de que o forasteiro pobre admitido
    no mercado tem entrada com a guarda. Luath revelou apenas informação
    controlada: os dois prisioneiros estão vivos, separados e vigiados; o vulto
    leve tenta se apresentar como carregador contratado ignorante; o homem de
    manga cinza falou pouco, não tinha papéis e usava dois anéis simples de
    ferro e latão; Gond estabilizou o barril em Sarbreen, mas ele continua
    abaixo. Luath não abriu acesso aos presos e aceitou levar uma pergunta curta
    de Ren ao interrogatório. Na noite de 5 Eleasis, Ren seguiu o canal da
    proposta privada de Kage até Brunna Torkel, comprou um mapa público da
    Escada das Sete Águas e uma cópia discreta de porões secos atrás de
    armazéns antigos, ativou Passos sem Pegadas e confirmou que alguém pagou
    Brunna para direcioná-lo à Escada. Ren seguiu o cobrador até a Escada das
    Sete Águas, desceu sem acionar o fio de controle da entrada, ativou Visão
    no Escuro e viu uma galeria baixa com vigia em nicho lateral e fio de
    acionamento antes de uma câmara estreita. Com Ki 0/5, Ren decidiu recuar,
    saiu sem perceber cauda e foi ao posto de Luath. Luath avaliou que a Escada
    parece mais olho, boca, controle ou entrada-isca do que coração da operação.
    Os mapas não deram rota segura de invasão; Luath pode pôr vigilância
    discreta na superfície da Escada, no depósito sem tabuleta e em possíveis
    saídas baixas. Ren voltou ao circo pela rota longa, sem cauda útil
    percebida, mas sem conseguir provar a si mesmo que a rota estava
    absolutamente limpa. Ele evitou ver Nera e Tavin, entregou a Silva um
    bilhete para Nera dizendo que a ama e que solucionará tudo, e passou a noite
    no depósito de figurino velho tentando transformar a lembrança do Passo da
    Sombra de Aiko em técnica própria. Ao amanhecer de 6 Eleasis, após descanso
    longo e treino meditativo, Ren despertou o Passo Sombrio e alcançou nível 6
    como monge do Caminho da Sombra.
    Depois de se lavar e se vestir, Ren tomou café com Silva longe da carroça
    verde e contou sobre Sarbreen, Brunna, a Escada das Sete Águas e a avaliação
    de Luath. Silva tratou a técnica nova como ferramenta recuperada, mas pediu
    que Ren a teste longe dos Vell até entender seus limites. Também informou que
    Nera guardou o bilhete e perguntou se Ren havia comido antes de tentar carregar
    a promessa. Em seguida, Ren foi até Jack. Jack pagou 8 PO pela reprise pública
    de Kage em 5 Eleasis e mostrou a resposta à isca privada: Corven Dalm,
    procurador da Casa Veyr, aceitou 80 PO por uma apresentação fechada curta,
    mandou 40 PO adiantadas, aceitou tenda controlada pelo circo e equipe mínima
    dos Mooney, mas tentou retirar "intermediários desnecessários" da conversa
    artística. Jack reteve o adiantamento na própria caixa e ainda não aceitou a
    apresentação. Tobb verifica se Casa Veyr existe para além do papel, Dessa
    avalia a tenda menor e Silva calcula como manter os Vell longe disso sem
    denunciar que eles são o ponto sensível.
    Ren respondeu a Jack que o show não pode parar, tratando a proposta como
    ensaio de aceite sob filtros do circo. Na tenda menor, tentou mapear sombras
    para usar o Passo Sombrio, mas não conseguiu garantir trânsito por todos os
    cantos: há pontos úteis de sombra na entrada lateral, junto aos bancos de
    músicos e atrás dos panos de Dessa, mas o centro fica quebrado por faixas de
    luz e vento na lona. O treino básico de Kage foi marcado para 13:30 com Sorn,
    Merrit e Lysa, sem número novo. Ren tentou pagar 1 PO a Harl para vigiar a
    montagem, mas Harl recusou a moeda por medo de parecer novamente envolvido em
    segredo; prometeu falar com Sorn ou Tobb se vir risco real. Depois Ren deixou
    o circo, ativou o Broche do Semblante Humilde perto de Narwhal Manor e chegou
    à lateral de serviço sem puxar atenção útil. Encontrou Kethra por poucos
    instantes usando a frase "sabão preto para pano azul". Kethra não recebeu
    notícia de Colm/Dent e não ouviu nova informação concreta em Narwhal desde a
    pista da ponte baixa; percebe apenas silêncio excessivo no corredor treze e
    rotina mais vigiada.
    Ren dispensou Kethra antes que a ausência dela chamasse atenção. Kethra
    avisou que, se Ren procurar Dorra, não deve usar o nome dela antes de saber
    quem está ouvindo nem procurar Dent alto demais. Ren saiu de Narwhal e voltou
    ao circo sob o Broche sem reforçar padrão útil. O Broche expirou por volta de
    09:25 e está gasto até o próximo amanhecer. A checagem das carroças de Dorra
    ficou para outro intervalo. Às 13:30, Ren treinou Kage na tenda menor com
    Sorn, Merrit e Lysa; o treino confirmou duas marcas escuras confiáveis se as
    lamparinas não forem alteradas: dobra atrás da entrada lateral e faixa baixa
    junto aos bancos de músicos/panos extras. Tobb verificou que Casa Veyr existe
    como presença temporária de aluguel, com camarote/salão e procurador pagador,
    mas sem raiz nobre local forte. Harl participou apenas da montagem baixa e
    não viu irregularidade útil. Jack está pronto para aceitar a apresentação
    fechada somente com filtros rígidos e aguarda se Ren acrescenta alguma
    condição.
    Ren autorizou Jack a aceitar a apresentação fechada, reconhecendo que é
    armadilha e prometendo proteger o circo. Jack aceitou a direção, mas não
    aceitou a palavra de Ren como substituto dos filtros dos Mooney. Após banho,
    Ren encontrou uma linha válida de sombra e visão para entrar na carroça verde
    com Passo Sombrio. Com Silva abrindo a porta e Tobb limpando a rota interna,
    Ren entrou na carroça sem gastar ki; a entrada não virou rumor no circo, mas
    assustou Nera e apagou a lamparina, mostrando que a técnica ainda não é
    delicada perto dos Vell. Ren contou a Nera que a proposta citou a
    seladora/gravadora, que Kage se exporá e que ele voltará. Nera não reconheceu
    Corven Dalm nem Casa Veyr e não conseguiu determinar a origem precisa do
    termo. Antes da saída, a Casa Veyr respondeu com dobra contratual: quer pagar
    os 40 PO restantes só com os convidados, fazer Corven Dalm assinar apenas ao
    pisar na lona e manter um homem da casa junto da entrada de artistas. Jack
    não conseguiu bloquear essa dobra sem atrasar ou arriscar o show. Ren
    decidiu prosseguir. Os Mooney controlaram o transporte: Kage foi levado pela
    rota interna de panos/remendos até a dobra lateral marcada por Sorn, sem sair
    do circo nem virar pacote do patrono. Tobb contou as 40 PO restantes antes da
    entrada útil dos convidados, Corven Dalm assinou antes de pisar na lona útil
    e o homem da Casa Veyr foi colocado em luz clara perto da entrada dos
    artistas, mas sem controle da aba real. A apresentação está prestes a
    começar; Ren/Kage vê a faixa baixa junto aos bancos dos músicos como destino
    possível para Passo Sombrio.

