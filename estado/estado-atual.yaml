  descricao_operacional: "Após a vigília parcial da loja de Bram Vask, Ren reencontrou Kethra Dunn depois do turno e confirmou que ela não tinha cauda clara, embora um aprendiz na lateral de Narwhal possa lembrar de um mendigo se movendo quando ela saiu. Kethra foi ao Lavadouro dos Três Tanques ver Colm. Sella Rove avisou que um rapaz já farejou a frase 'sabão preto para pano azul', sinal de que o esconderijo começou a ficar perigoso. Kethra agora confia em Ren de modo prático e revelou que não ouviu o nome Masao em Narwhal, mas ouviu referências a 'hóspede', 'homem da lua' e à versão preparada de M. Harrow. Também confirmou que Velis parece instrumento de papel, não mandante, e que a gaveta de areia, cera e panos do corredor treze saiu em cesto de roupa suja com nó de tira amarela rumo à rua dos tintureiros. Colm não está seguro no lavadouro por muito tempo."

