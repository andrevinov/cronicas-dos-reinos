    - mapa público da Escada das Sete Águas, comprado de Brunna Torkel
    - 'cópia discreta de Brunna Torkel sobre porões secos atrás de armazéns antigos: duas entradas possíveis, saída
      baixa para drenagem, parede raspada, ar seco e marca apagada'
    outros:
