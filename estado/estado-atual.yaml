  observacao: "Hora operacional estimada a partir da sequência de cenas; Ren não possui relógio preciso."
  prazo_relevante: "O prazo de meio-dia passou: Velis Rook entrou na Casa de Tyr e os Vell não foram transferidos. Tyr mantém resguardo em espera sem deslocamento até o próximo sino maior; Ren ainda não entrou na Casa Velha do Primeiro Raio. Maerra colocou em curso ficha curta a Halessa sobre a possível preparação de Velis antes da oitiva; Ren ainda não conhece as consequências disso. Colm Dunn precisa ser movido ou protegido melhor antes que a sondagem ligada a Bram alcance o quarto da lenha."

