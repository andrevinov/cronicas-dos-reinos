  descricao_operacional: Com testemunhas pagas em moeda baixa, localizou o alvo numa carroça de carvão vazia. Confirmou
    que o homem corresponde à descrição de Mera e não é Velis Rook. O alvo percebeu Ren, saltou da carroça e entrou
    num ramal estreito. Ren está a cerca de noventa pés, com três trabalhadores e um carrinho carregado entre os
    dois. A perseguição entrou em iniciativa. Ren atravessou o obstáculo sem atingir os trabalhadores, anulou com
    Aparar Projéteis uma faca que teria acertado e alcançou o alvo junto à cerca de salgueiros. O homem atacou com
    uma segunda faca e errou. É o turno de Ren, adjacente e ileso.
