      com desenho de vento, tecido branco oculto para giros, mangas falsas soltas no momento certo, cabelo preso
      e máscara parcial de entrada'
    - 'roupa de cidadão menor limpo guardada no circo: casaco escuro simples, camisa limpa, calça comum, botas escovadas
