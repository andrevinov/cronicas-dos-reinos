marcos_de_tempo:
  captura_red_sail:
    horario_aproximado: "09:04"
    observacao: "Ren capturou um agente operacional da Red Sail num beco após montar isca com falso oriental caído; Passos sem Pegadas expira por volta de 09:06."
  interrogatorio_red_sail:
    horario_aproximado: "09:09"
    observacao: "Ren interrogou o capturado e obteve procedimento para chamar Brass, confirmação da isca da falsa lua velada e informação limitada sobre o estrangeiro com cicatriz."
  agente_duplo_red_sail:
    horario_aproximado: "09:13"
    observacao: "Ren coagiu o capturado a enviar às 19:00 uma mensagem falsa para Brass sobre Ren e a seladora estarem feridos na oficina de velas abandonada; obteve o nome Rusk 'Cinza' como coletor da ficha."
  feira_apos_beco:
    horario_aproximado: "09:43"
    observacao: "Ren saiu do beco sem ser identificado, recuperou suas roupas escuras, comeu fruta e pão simples, bebeu água e decidiu que Jack Mooney é a melhor solução imediata para Nera e Tavin."
  retorno_ao_circo_para_jack:
    horario_aproximado: "10:03"
    observacao: "Ren voltou ao Jack Mooney & Sons Circus vestido como marinheiro/estivador e provocou Jack com a informação de que alguém entrou e saiu do circo sem que ele percebesse. A mensagem chegou, Jack aceitou conversa privada e Silva reconheceu Ren apesar do disfarce."
  proposta_condicional_de_jack:
    horario_aproximado: "10:09"
    observacao: "Ren contou a Jack sobre Masao, Aiko, a Red Sail, Nera e Tavin, oferecendo serviços em troca de abrigo. Jack suspendeu o prazo imediato do meio-dia para os Vell e ofereceu comida, abrigo e cobertura condicional se Ren aceitar investigar a sabotagem da amarra da corda alta antes do crepúsculo."
  aceite_e_inicio_da_investigacao_do_circo:
    horario_aproximado: "10:17"
    observacao: "Ren aceitou o acordo condicional de Jack, recebeu a cobertura de Ren Kage como acrobata oriental contratado e iniciou inspeção da área da corda alta do lado leste. Identificou altura aproximada, acessos plausíveis, serragem varrida, mancha de breu/graxa e fio vermelho preso numa farpa."
  sorn_chamado_para_perguntas:
    horario_aproximado: "10:18"
    observacao: "Ren tentou ler a reação de Sorn Kel à tira de couro. Sorn reagiu visivelmente, mas Ren não conseguiu separar culpa de medo profissional ou outro medo. Silva chamou Sorn de modo seco demais, e Mira Dane mais dois ajudantes notaram a tensão."
  perguntas_iniciais_a_sorn:
    horario_aproximado: "10:22"
    observacao: "Sorn disse que a conferência do lado leste ficou com Harl Venn ontem depois da nona badalada; Sorn encontrou a amarra cortada antes das sete e avisou Jack. Também apontou Lysa Renn como acrobata ligada a Mira e a fitas vermelhas, e explicou o uso de breu pelo cordame."
  omissao_de_sorn_sobre_harl_e_lysa:
    horario_aproximado: "10:24"
    observacao: "Após pressão de Ren, Sorn revelou que viu Harl Venn na carroça de cordame com Lysa Renn depois da nona badalada. Lysa pediu breu para treinar pegada, Harl estava com a cópia da chave, e Sorn não conferiu pessoalmente a devolução."
  abordagem_inicial_a_harl:
    horario_aproximado: "10:27"
    observacao: "Ren abordou Harl Venn atrás da carroça de cordame e perguntou tecnicamente se a corda estava ok quando ele conferiu. Harl respondeu com firmeza que sim. Ren percebeu que a resposta técnica parece sólida, mas Harl está escolhendo não falar além do perguntado."
  pressao_sobre_harl_e_lysa:
    horario_aproximado: "10:29"
    observacao: "Ren perguntou se Lysa pegou algo além de breu. Harl afirmou que não, mas admitiu que virou para pegar pano por um instante e não viu as mãos dela o tempo todo. Também viu Lysa fechar o punho esquerdo depois."
  abordagem_a_lysa:
    horario_aproximado: "10:33"
    observacao: "Ren observou que Harl acompanhou de longe sua ida até Lysa, sem segui-lo. Ren conseguiu isolar Lysa atrás de uma cortina de lona. Lysa usa apenas uma fita vermelha no pulso direito e tocou rapidamente o pulso esquerdo vazio quando percebeu que a conversa era sobre a noite anterior."
  blefe_de_ren_com_lysa:
    horario_aproximado: "10:35"
    observacao: "Ren blefou dizendo que Harl contou tudo. Lysa não comprou totalmente, mas reagiu forte ao comentário. Ren percebeu que ela esconde algo ligado à noite anterior, ao pulso esquerdo e possivelmente à fita perdida, mas a negação dela sobre cortar a amarra para derrubar Mira parece mais sincera."
  lysa_confessa_subida_a_plataforma:
    horario_aproximado: "10:37"
    observacao: "Confrontada sobre o fio vermelho, Lysa confessou que subiu à plataforma leste depois da nona badalada para testar o joelho usando breu. A fita vermelha do pulso esquerdo rasgou numa farpa, e ela ainda guarda o restante manchado de breu."
  lysa_explica_medo_de_mira_e_jack:
    horario_aproximado: "10:39"
    observacao: "Lysa disse que Mira, se descobrisse o treino escondido, faria a coisa certa: tiraria Lysa da plataforma, contaria a Jack e impediria que ela subisse machucada. Ren acreditou que Lysa escondia a própria presença por medo de perder o alto, não por querer derrubar Mira."
  passagem_estreita_e_merrit:
    horario_aproximado: "10:45"
    observacao: "Ren liberou Lysa e investigou a passagem estreita entre contrapesos e mastro lateral. Silva apontou Merrit Tealeaf, halfling contorcionista e antiga parceira de número baixo de Lysa, como alguém capaz de passar ali. Ren encontrou caixa movida, meia pegada pequena, pó claro de mão seca e conta verde com fio amarelo associada por Silva a Merrit."
  abrigo_dos_vell_no_circo:
    horario_limite: "meio-dia suspenso por ora; nova avaliacao apos resposta de Ren e progresso na tarefa de Jack"
    observacao: "Após ouvir Ren, Jack aceitou não expulsar Nera e Tavin ao meio-dia. A proteção segue condicional à conduta de Ren e à utilidade prática dele para o circo."
  julgamento_merrit:
    horario_aproximado: "11:20"
    observacao: "Ren assistiu ao julgamento interno de Merrit Tealeaf. Jack conduziu a cena sem pânico, Merrit assumiu a culpa, Mira conteve a raiva, Lysa saiu abalada e Merrit foi suspensa de apresentações sob controle de Silva/Sorn. Jack manteve aberto o fio de influência externa."
  repouso_ren_no_circo:
    horario_aproximado: "11:55-15:35"
    observacao: "Ren comeu, meditou e dormiu no depósito de figurino velho, atrás da arca dos estandartes. O repouso contou como descanso curto seguro e recuperou o ki para 3/3, mas não foi descanso longo. Durante a tarde, dois homens do porto farejaram o perímetro do circo perguntando por uma moça ferida e um rapaz novo; Jack desviou a conversa antes de confirmação."
  abordagem_tarde_a_harl:
    horario_aproximado: "16:07-16:10"
    observacao: "Ren tentou abordar Harl com camaradagem e papo sobre comida para tirá-lo da defensiva. Harl informou que a melhor comida fica na cozinha sob a lona amarela, antes dos músicos, mas não aceitou acompanhar Ren de graça e perguntou se Jack mandou Ren falar com ele. Ren ofereceu 1 PO por uma hora do tempo de Harl. Harl aceitou, corrigiu o nome para 'Harl, com r', levou Ren até a cozinha e se afastou para uma lateral menos barulhenta."
  confissao_de_harl:
    horario_aproximado: "16:23"
    observacao: "Ren apelou à fome, pobreza, admiração e amor para convencer Harl a assumir sua parte. Harl admitiu a Ren e depois a Jack que plantou em Merrit a ideia de que Sorn ouviria uma amarra cantando errado, embora não tenha dado ordem direta para cortar. Jack puniu Harl discretamente, mantendo-o por um mês longe da corda alta, sem chave e sem conferência de segurança, e confirmou abrigo para Ren, Nera e Tavin por hoje e amanhã."
  visita_tarde_aos_vell:
    horario_aproximado: "16:31-16:34"
    observacao: "Ren visitou Nera e Tavin na carroça verde de Silva. Os irmãos estão alimentados, escondidos e fisicamente bem. Ren explicou que seguirá uma trilha à noite ligada aos homens que tentaram levar Nera. Nera perguntou se a trilha envolve a caixa ou o homem dos botões; Tavin perguntou se Ren vai voltar. Ren prometeu voltar e disse que investigará a conexão entre Red Sail e Masao. Também propôs Kagefusha, Moinho das Sombras, como nome de palco."
  saida_do_circo_para_trilha:
    horario_aproximado: "17:30"
    observacao: "Ren se despediu dos Vell, prometeu a Silva que não traria perseguição para a carroça verde, explicou que sairia pela rota da carroça de remendos e deixou o circo quando a penumbra começou. Saiu sem atrair atenção externa. Ainda falta cerca de uma hora e meia para a armadilha das 19:00."
  busca_por_disfarce_no_varal:
    horario_aproximado: "17:46"
    observacao: "Ren se deslocou discretamente em direção à oficina de velas abandonada, evitando olhos naturais da Red Sail. Encontrou um varal excelente para obter disfarce: casaco cinza grosseiro, camisa, calças largas e gorro escuro. Ao tentar roubar as peças, a roldana estalou; Ren pegou casaco e gorro, mas camisa e calças ainda estão presas. Uma menina comum viu Ren na mureta e chamou pela mãe em voz baixa."
  chegada_ao_ponto_de_observacao_da_oficina:
    horario_aproximado: "18:16"
    observacao: "Ren tentou encobrir o roubo do varal com som ilusório de gato, mas a mãe viu movimento humano e gritou por ladrão de roupa. Ren escapou; isso gerou rumor local comum, não alarme da Red Sail. Ren encontrou um beco seguro, deixou suas peças mais reconhecíveis dobradas numa fresta seca atrás de tábuas e vestiu casaco cinza e gorro escuro como disfarce apressado. O disfarce é fraco de perto, mas quebra a silhueta à distância. Ren chegou a um sótão quebrado de antiga loja de sebo e pavio, bom ponto de observação da oficina de velas abandonada antes da armadilha das 19:00."
  isca_da_oficina_respondida:
    horario_aproximado: "19:11"
    observacao: "Ren estudou rota de fuga pelas fachadas apertadas, manteve-se oculto e percebeu a aproximação da isca. Dois homens vieram pela rua dos tonéis: um provavelmente é Rusk 'Cinza', com cinza nas mangas e aparência de varredor; o outro é um capanga da Red Sail. Nenhum percebeu Ren. Rusk entrou na oficina de velas pela abertura lateral para examinar marcas antigas de ocupação; o capanga ficou no vão lateral vigiando a viela."
  escuridao_na_oficina:
    horario_aproximado: "19:12"
    observacao: "Ren conjurou Escuridão sobre a entrada lateral da oficina de velas e avançou contra o capanga da Red Sail. A aproximação silenciosa falhou, o primeiro golpe errou, mas o golpe bônus acertou e empurrou o capanga ferido para dentro. O capanga errou o contra-ataque no breu e não gritou alarme amplo. Rusk 'Cinza' continua dentro da oficina, sem posição visual confirmada por Ren."
  rajada_contra_rusk:
    horario_aproximado: "19:12"
    observacao: "Ren gastou seu último ponto de ki em Rajada de Golpes. Neutralizou o capanga da Red Sail, localizou Rusk pelo som e acertou dois golpes nele. Rusk ficou ferido e falhou em escapar pelo interior da oficina. Moradores de Fishtown ouviram barulho, mas ainda não abriram alarme."
  interrogatorio_de_rusk:
    horario_aproximado: "19:12"
    observacao: "Ren rendeu Rusk com a wakizashi no pescoço e perguntou sobre o selo falso da lua, a caixa e o estrangeiro ligado a Brass. Rusk afirmou que a caixa e o selo eram montagem para criar rastro oriental e atrair o homem certo; associou o hóspede de Brass à lua, Velis Rook, Narwhal e possível marca na bochecha direita; Ren percebeu que Rusk ainda omite o ponto de entrega ou método de contato entre Brass e Narwhal."
  fuga_da_oficina_de_velas:
    horario_aproximado: "19:14"
    observacao: "Ren concluiu que a caixa da Lua foi isca feita para atraí-lo e que Masao ou agente muito próximo sabe que ele chegou a Ravens Bluff. Apagou Rusk, desceu o corpo sem barulho e tentou criar distração arremessando uma peça na loja de sebo. A distração não causou grande desabamento, mas Ren escapou pela rota das fachadas apertadas. Uma testemunha percebeu a direção geral da fuga, sem identificar Ren."
  passagem_pela_casa_da_aurora_menor:
    horario_aproximado: "20:08"
    observacao: "Ren saiu de Fishtown sem virar rastro claro, recuperou roupas escuras e manto no beco seguro com atraso, confirmou que não havia cauda e chegou à Casa da Aurora Menor usando o casaco/gorro roubados do varal. Avisou Maerra que Nera e Tavin estão vivos e protegidos por Silva e Jack no circo. Maerra emprestou roupas comuns de doação, água e pão, mas não vestes ou símbolo sagrado."
  roubo_no_market_district:
    horario_aproximado: "20:32"
    observacao: "Ren foi ao mercado noturno do Market District para se financiar. Escolheu um mercador rico, usou Ilusão menor como distração parcial e roubou a bolsa durante uma falsa ajuda/oracao. Obteve 27 PO e escapou pelos becos sem perseguição imediata. Possível rumor posterior: peregrino pobre ou forasteiro perto do mercador antes do roubo."
  retorno_ao_circo_apos_mercado:
    horario_aproximado: "21:02"
    observacao: "Ren voltou ao circo pela rota da carroça de remendos. Não conseguiu confirmar com segurança absoluta que ninguém no caminho do mercado notou sua direção geral, mas entrou no acampamento sem ser percebido pela rotina interna. Trocou o disfarce de doação pelas roupas escuras de viagem e encontrou Silva perto das cozinhas laterais. Silva ofereceu banho simples atrás da lona azul; Nera está acordada e Tavin dorme."
  banho_e_nera_na_lona_azul:
    horario_aproximado: "21:10"
    observacao: "Ren começou banho simples atrás da lona azul, com a wakizashi ao alcance. Nera não conseguiu esperar, veio atrás dele por preocupação e levantou a lona por um instante, vendo mais do que pretendia antes de virar o rosto. Silva está por perto e preserva a situação com firmeza prática. O banho ainda não conta como descanso curto e Ren continua com 0/3 ki."
  conversa_na_lona_azul:
    horario_aproximado: "21:12"
    observacao: "Ren tranquilizou Nera, disse que não está ferido fisicamente e prometeu ir à carroça verde depois do banho. Nera aceitou esperar, ainda envergonhada e aliviada. Silva preservou a privacidade com humor seco. A tensão romântica entre Ren e Nera ficou mais explícita, mas segue contida por medo, vergonha e circunstância."
  carroca_verde_apos_banho:
    horario_aproximado: "21:24"
    observacao: "Ren terminou o banho, vestiu suas roupas escuras e foi à carroça verde. Tavin dorme. Ren e Nera tocaram as mãos e mantiveram a intimidade. Silva informou que Dessa Wren pode providenciar roupas comuns de disfarce: duas mudas improvisadas por 3 PO, ou três mudas incluindo corte de pequeno mercador por 5 PO. Silva autorizou passeio curto pela rota interna das lonas, longe das bordas do acampamento."
  carroca_dos_estandartes:
    horario_aproximado: "21:28"
    observacao: "Ren procurou uma estrutura alta não feita de lona para conversar com Nera. Encontrou o teto de uma carroça larga de madeira perto dos estandartes velhos. Como estava sem ki, não pôde usar Passo do Vento; tentou subir com Nera de forma mundana. A subida fez barulho e alguns circenses perceberam o casal, mas Silva não interrompeu. Ren e Nera têm privacidade relativa sob as estrelas."
  conversa_sobre_aiko_e_vinganca:
    horario_aproximado: "21:31"
    observacao: "No topo da carroça dos estandartes, Ren contou a Nera que se sente quebrado desde a morte de Aiko, que veio a Ravens Bluff para matar Masao e que talvez possa morrer qualquer noite. Nera admitiu que se preocupa de verdade com Ren, mas colocou uma condição emocional: ela e Tavin precisam continuar sendo pessoas para ele, não ferramentas, peso ou parte da vingança."
  primeiro_beijo_de_ren_e_nera:
    horario_aproximado: "21:34"
    observacao: "Ren respondeu a Nera que ela e Tavin já são pessoas para ele. Admitiu que quer fazer de tudo para vencer Masao, trazer os culpados à justiça e sair vivo com Nera e Tavin. Ren tocou o rosto de Nera e os dois se beijaram no topo da carroça dos estandartes. O vínculo romântico agora é explícito entre eles, mas sem promessa de futuro."
  retorno_de_nera_a_carroca_verde:
    horario_aproximado: "21:42"
    observacao: "Ren e Nera desceram da carroça dos estandartes e caminharam de mãos dadas pela rota interna autorizada por Silva. Ren deixou Nera novamente na carroça verde; Tavin continuava dormindo. Silva preservou a privacidade, mas manteve a vigilância prática."
  descanso_longo_de_ren:
    horario_aproximado: "21:50-05:50"
    observacao: "Ren dormiu no canto discreto do depósito de figurino velho preparado por Jack Mooney. O descanso contou como descanso longo completo: PV, dados de vida e ki recuperados. O marco de nível 4 foi aplicado ao despertar."
  sondagem_no_perimetro_do_circo:
    horario_aproximado: "05:55-06:05"
    observacao: "Antes de o circo despertar por completo, gente ligada ao porto ou à Red Sail alcançou o perímetro do acampamento com perguntas sobre uma mulher ferida e um rapaz. Jack e Silva impediram acesso direto ao esconderijo, mas a pressão ficou próxima demais para ignorar."
  plano_de_busca_controlada:
    horario_aproximado: "06:06"
    observacao: "Ren propôs evacuar Nera e Tavin discretamente antes de Jack permitir uma busca controlada no circo, com o objetivo de apaziguar a sondagem sem entregar os Vell. Silva julgou a ideia possível, desde que Jack controle quais lonas, carroças e baús serão abertos."
  disfarces_de_dessa_wren:
    horario_aproximado: "06:08"
    observacao: "Ren foi ao guarda-roupa menor e pagou 1 PO a Dessa Wren por roupas rápidas e silêncio. Dessa montou disfarces comuns para Ren, Nera e Tavin: ajudante de carga, viúva pobre/lavadeira e rapaz de recados/cozinha."
  fuga_oposta_do_circo:
    horario_aproximado: "06:13"
    observacao: "Ren pagou mais 2 PO a Dessa Wren: 1 PO para transformar roupas roubadas e roupas de doação em retalho, e 1 PO para guardar suas roupas próprias como figurino estrangeiro. Silva não conseguiu garantir saída limpa, mas Jack puxou a atenção para a entrada das cozinhas. Ren, Nera e Tavin saíram pela rota das bacias de lavagem e barris de água cinza. Ren gastou 1 ki em Passo do Vento para corrigir uma hesitação de Tavin no cruzamento crítico. Os homens do porto/Red Sail não identificaram a fuga."
  travessia_para_aurora_menor:
    horario_aproximado: "06:13-06:47"
    observacao: "Ren conduziu Nera e Tavin por áreas pobres e ruas de serviço, misturando o grupo ao fluxo da manhã. Confirmou com segurança que não havia cauda, comprou comida simples com moedas de cobre e seguiu para a Casa da Aurora Menor. O gasto de cobre não alterou o total de PO registrado."
  consulta_a_maerra_sobre_luath:
    horario_aproximado: "06:47"
    observacao: "Na Casa da Aurora Menor, Ren perguntou a Maerra se Luath, sargento da City Guard ligado à Night Watch, é realmente honrado. Maerra respondeu que Luath não é santo, mas é honrado de modo útil: cumpre dever, não vende pobre por conveniência e entende a sujeira da cidade. Ela recomendou que Ren leve verdade verificável e não entregue Nera e Tavin de imediato."
  ren_vai_ao_posto_da_night_watch:
    horario_aproximado: "06:49-07:04"
    observacao: "Ren pediu que Maerra ficasse com Nera e Tavin enquanto ele conversa com Luath. Maerra aceitou e entregou a cópia parcial selada do livro de provas. Ren caminhou como pobre comum até o posto da City Guard/Night Watch, sem chamar atenção. Luath estava disponível ao amanhecer."
  conversa_privada_com_luath:
    horario_aproximado: "07:06"
    observacao: "Ren entregou a Luath a cópia parcial selada por Maerra, incluindo um bilhete pedindo conversa a sós. Luath não confiou de imediato, mas aceitou privacidade por respeito cauteloso a Maerra e levou Ren para um depósito lateral de patrulha."
  luath_aciona_patrulha_contra_buscas:
    horario_aproximado: "07:13"
    observacao: "Ren contou a Luath sobre Masao, Aiko, a falsificação do selo, a ameaça contra Nera e Tavin e as buscas ostensivas da Red Sail. Luath aceitou agir contra as buscas como perturbação da paz, intimidação e usurpação de autoridade. A cópia parcial selada ficou com Luath. Ele pediu três informações práticas antes de mover mais guardas."
  luath_recebe_informacao_pratica:
    horario_aproximado: "07:16"
    observacao: "Ren informou Luath que a pressão atual da Red Sail recai sobre o circo de Jack Mooney, explicou que Dain Mord é Brass e descreveu o protocolo da ficha de cobre com vela vermelha e cordão azul. Luath reconheceu Dain Mord, aceitou não mandar busca aberta ao circo sem ordem ou flagrante e enviou patrulheiros para coibir buscas ilegais nas ruas, vizinhanças e acessos."
  ponto_morto_de_pell_na_silver_lily:
    horario_aproximado: "07:31"
    observacao: "Antes de voltar à Casa da Aurora Menor, Ren foi aos fundos da The Silver Lily e checou o vaso com flor combinado com Pell. Pell deixou bilhete avisando que Velis Rook vai limpar papel na casa grande do peixe, provavelmente Narwhal Manor, antes do sino de nove; Brass está irritado; Rusk não voltou; e o homem da lua não desce ao cais."
  chegada_a_narwhal_manor:
    horario_aproximado: "07:54"
    observacao: "Ren pagou Pell com 1 PO deixado no vaso, destruiu o bilhete e seguiu para Narwhal Manor. No caminho, evitou dois possíveis olhos da Red Sail e perdeu alguns minutos em rotas laterais. Chegou sem cauda clara e viu Velis Rook prestes a entrar pela porta lateral de funcionários com uma pasta rígida de couro encerado."
  tentativa_de_furto_da_pasta_de_velis:
    horario_aproximado: "07:55"
    observacao: "Ren derrubou a lâmpada acima da porta lateral de Narwhal Manor com um shuriken para criar distração. Velis evitou o impacto direto, segurou a pasta e percebeu a tentativa de furto. Ren não conseguiu tomar a pasta, mas viu carimbo de Narwhal Manor, número 13 e a expressão 'retenção anulada'. Velis chamou guarda."
  roubo_da_pasta_de_velis:
    horario_aproximado: "07:57"
    observacao: "Ren fez uma segunda e única tentativa física, arrancou a pasta de Velis Rook e gastou 1 ki em Passo do Vento para fugir pela direção oposta aos guardas. Escapou pelas ruas de serviço sem perseguição imediata colada nele. Narwhal Manor entrou em alarme local por roubo de papéis."
  retorno_a_aurora_menor_com_pasta:
    horario_aproximado: "08:42"
    observacao: "Ren afastou-se lentamente de Narwhal Manor, encontrou uma manta de estopa cinza abandonada e a usou para quebrar a silhueta. Fez rota indireta, confirmou ausência de cauda e chegou à lateral da Casa da Aurora Menor com a pasta de Velis escondida sob as roupas. A pasta ainda não foi examinada."
  pausa_na_saleta_de_ervas:
    horario_aproximado: "08:42-09:15"
    observacao: "Ren entrou pela lateral da Casa da Aurora Menor e foi levado à saleta de ervas com Maerra, Nera e Tavin. Bebeu água, comeu um pouco e respirou, mas a pausa não contou como descanso curto mecânico. A pasta de Velis permaneceu fechada. Maerra ofereceu um fio lateral futuro: os Meninos do Primeiro Sino e a Casa Velha do Primeiro Raio."
  abertura_da_pasta_de_velis:
    horario_aproximado: "09:24"
    observacao: "Ren abriu a pasta de Velis diante de Maerra, Nera e Tavin. Eles encontraram retenção temporária do volume 13 na Casa da Rede Morta, anulação retroativa assinada por V. Rook, lista de correções removendo 'oriental' e trocando M. H. por M. Harrow, menção a D. Mord, impressão protegida da falsa lua velada reconhecida por Nera e bilhete dizendo que o hóspede não desce ao cais, que a lua fica em Narwhal até sinal de B., e que gravadora e menino são ruído que não deve chegar a Tyr. Maerra avaliou que a prova é forte, mas precisa ser legitimada por Luath ou Tyr por ter sido roubada."
  reconhecimento_cauteloso_de_maerra:
    horario_aproximado: "09:35"
    observacao: "Maerra tentou dar peso à pasta sem prometer mais do que podia. Escreveu declaração cautelosa atestando que os papéis foram abertos diante dela, de Ren, Nera e Tavin; registrou que Nera reconheceu a impressão da lua velada como derivada do trabalho encomendado; e lacrou a pasta com cera da Casa da Aurora Menor. Maerra não atestou cadeia de custódia, autoria final nem inocência de qualquer parte."
  retorno_ao_circo_com_os_vell:
    horario_aproximado: "10:18"
    observacao: "Ren deixou a Casa da Aurora Menor com Nera, Tavin e a pasta lacrada. A travessia discreta funcionou, embora Ren não tenha conseguido confirmar com segurança absoluta que ninguém observou a rota. Perto do circo, patrulheiros acionados por Luath já pressionavam a Red Sail a abandonar buscas sem mandado. Jack conduziu uma busca controlada e os homens do porto saíram contrariados. Ren devolveu Nera e Tavin à carroça verde de Silva."
  ren_se_prepara_para_tyr:
    horario_aproximado: "10:24"
    observacao: "Ren informou Silva que pretende ir a Tyr com a pasta lacrada, por causa do bilhete que demonstra medo de que Tyr se envolva. Despediu-se de Nera e Tavin, deixando-os na carroça verde sob proteção de Silva, e foi ao guarda-roupa menor falar com Dessa Wren. Dessa tem as roupas próprias de Ren e propôs duas apresentações: forasteiro oriental memorável ou cidadão menor limpo e discreto."
  chegada_a_casa_de_tyr:
    horario_aproximado: "10:57"
    observacao: "Ren escolheu a roupa de cidadão menor, pagou 1 PO a Dessa pela roupa e pela limpeza de suas roupas próprias, e descreveu um futuro traje de apresentação com obi espetacular. Saiu pela lateral do circo. A saída foi notada por algumas pessoas, possivelmente incluindo um remanescente do porto, mas Ren percebeu o risco, quebrou linha de visão e escolheu rota eficiente até o Temple District. Chegou sem cauda colada à Casa de Tyr, diante de guardiões e acólito de registro."
  primeiro_filtro_em_tyr:
    horario_aproximado: "10:58"
    observacao: "Ren pediu testemunho diretamente para Sirrus Melandor e disse ter sido instruído a mostrar apenas a ele. O guardião recusou acesso direto imediato, mas reconheceu a seriedade do testemunho lacrado e ofereceu triagem preliminar sem abrir a pasta: Ren deve dizer quem o instruiu, quem corre risco vivo agora e por que não pode esperar a ordem normal das queixas."
  testemunho_reservado_urgente:
    horario_aproximado: "11:00"
    observacao: "Ren mostrou o selo de Maerra e disse que o testemunho vale a vida de duas pessoas honradas. O guardião reconheceu o selo como ligado à Aurora Menor/Lathander, mas não o bastante para pular protocolo. Ainda assim, aceitou classificar o caso como testemunho reservado urgente, com registro mínimo sem nomes completos em voz alta. A guardiã jovem foi chamar uma autoridade intermediária para ouvir sem abrir o lacre."
  preparacao_para_ouvidora_de_tyr:
    horario_aproximado: "11:03"
    observacao: "Enquanto aguardava, Ren observou o vestíbulo, entendeu que há registro reservado para casos sensíveis, organizou os fatos em torno de custódia/testemunho/vidas em risco/obstrução de justiça e reconheceu que vingança pessoal enfraqueceria a abordagem. Irmã Halessa Vorn, ouvidora juramentada da Casa de Tyr, chegou para ouvir sem abrir a pasta lacrada."
  halessa_oferece_resguardo:
    horario_aproximado: "11:07"
    observacao: "Ren apresentou o caso de N.V. e T.V. a Halessa, explicando Red Sail, falsificação do selo do clã, tentativa de queima de arquivo, cópia parcial de Maerra sob custódia de Luath e pasta lacrada por Maerra. Halessa percebeu lacuna na cadeia de custódia, mas decidiu escalar o caso dentro de Tyr. Ofereceu resguardo provisório de 24h para as testemunhas se puderem ser movidas com segurança, ficha selada para Maerra ou Luath e audiência de lacre em câmara reservada."
  audiencia_lacre_agendada:
    horario_aproximado: "11:09"
    observacao: "Ren decidiu não mover Nera e Tavin por enquanto, pois os considera seguros hoje no abrigo atual. Pediu confirmação com Luath e Maerra e abertura do lacre. Halessa aceitou a lógica, mandou fichas reservadas a Luath e Maerra por mensageiros de Tyr e ofereceu iniciar audiência de lacre em cerca de doze minutos, sob paz juramentada e com a pasta ficando sob custódia de Tyr após a abertura."
  pasta_aberta_em_tyr:
    horario_aproximado: "11:29"
    observacao: "Ren aceitou paz juramentada, mantendo a wakizashi embainhada e presa por cordão branco e os shuriken fechados em pacote sobre a mesa. A pasta lacrada por Maerra foi aberta em câmara reservada diante de Halessa Vorn, Irmão Caldrin Vos, escriba e Ren. Halessa identificou o valor jurídico do bilhete e das correções retroativas. Caldrin mandou chamar Sirrus imediatamente. A pasta passou à custódia formal de Tyr. Halessa pediu que Ren decida se registra Nera Vell e Tavin Vell por nomes completos em ata reservada e selada."
  nomes_vell_registrados:
    horario_aproximado: "11:34"
    observacao: "Ren registrou Nera Vell e Tavin Vell por nome completo em ata reservada e selada. Sirrus Melandor entrou na câmara reservada, reconheceu a gravidade dos documentos, mas exigiu linha de custódia antes de conceder proteção nominal: Ren pode nomear o guardião atual em registro selado, aguardar confirmação de Maerra/Luath ou transferir voluntariamente os Vell para uma porta de Tyr."
  silva_nomeada_e_ordens_de_tyr:
    horario_aproximado: "11:38"
    observacao: "Ren nomeou Silva Elkwood em registro selado como guardiã atual informada por ele para Nera e Tavin, ainda pendente de confirmação. Sirrus aceitou emitir ordem de preservação sobre registros ligados ao volume 13, Narwhal Manor, Dain Mord, M. H., M. Harrow, lua velada e carga oriental, e convocará Velis Rook para responder por anulação retroativa e obstrução. Sirrus negou que Ren acompanhe ocultamente a primeira oitiva de Velis, mas Halessa permitiu que Ren escreva até três perguntas para possível uso na oitiva."
  perguntas_entregues_e_incendio_no_harbor:
    horario_aproximado: "11:45"
    observacao: "Ren entregou a Halessa três perguntas para possível uso na oitiva de Velis: interesse em selos de clãs de Kara-Tur, identidade/interesse no 'hóspede' e conteúdo oculto do volume 13. Ren agradeceu e saiu da câmara, recuperando wakizashi e shuriken. Do lado de fora da Casa de Tyr, viu fumaça escura subindo do Harbor District perto dos armazéns de breu e cordame. Rumores dizem que a Red Sail já atua no local como força de contenção. Tyr mantém ordem de preservação e convocação de Velis, mas a crise divide atenção e recursos."
  investigacao_inicial_do_incendio:
    horario_aproximado: "12:08"
    observacao: "Ren desceu ao Harbor District tentando manter baixo perfil, mas chegou mais visível do que queria. Na borda norte do incêndio, leu bem a cena: três focos separados, rota de baldes e guardas bloqueada, fogo grande contido antes de atingir breu em escala catastrófica, chegada rápida demais da Red Sail e rumores sobre um armazém ligado a Narwhal Manor. Ren organizou bons rumores, mas não separou com segurança gratidão real de fala plantada. Um olheiro da Red Sail o fixou como observador suspeito, embora ainda não tenha ocorrido abordagem."
  retorno_ao_circo_apos_incendio:
    horario_aproximado: "12:52"
    observacao: "Ren percebeu que a Red Sail poderia tentar formar uma cauda, mas a organização falhou no caos do incêndio. Ele não gastou Passo do Vento, tomou rota longa, evitou Silver Lily e Aurora Menor, e entrou no circo pela rota da carroça de remendos. A Red Sail não seguiu Ren até o circo. Silva Elkwood o interceptou discretamente perto da entrada interna e perguntou se ele veio sozinho."
  conselho_de_silva_sobre_o_abrigo:
    horario_aproximado: "12:58"
    observacao: "Ren contou a Silva o que ocorreu em Tyr e no incêndio, incluindo que a nomeou em ata selada. Silva aceitou com reprimenda e aconselhou não mover os Vell para fora durante a crise. Para ela, o melhor é separar Ren, os Vell e o livro; mover Nera e Tavin para dentro da rotina do circo; manter Ren visível por algumas horas como Ren Kage; e falar com Jack junto dela."
  conversa_com_os_vell_sobre_tyr_e_trabalho:
    horario_aproximado: "13:10"
    observacao: "Ren tomou banho rápido atrás da lona azul e falou com Nera e Tavin na carroça verde. Contou com cuidado que Tyr registrou os nomes dos dois em ata reservada e selada. Nera entendeu o valor e o risco do registro. Tavin aceitou a cobertura de ajudante de cozinha/recados sob controle de Silva, e Nera pode ser integrada ao guarda-roupa/remendos com Dessa Wren."
  beneficio_da_lona_aberta:
    horario_aproximado: "13:18-13:24"
    observacao: "Ren propôs a Jack e Silva o Benefício da Lona Aberta: espetáculo beneficente para vítimas e trabalhadores afetados pelo incêndio, com ingressos comuns, camarotes caros e doações visíveis. Jack aceitou o esqueleto do plano como viável e quer prepará-lo para amanhã ao cair da tarde, sem acusação pública contra Red Sail, Masao ou Narwhal. Nera e Tavin devem ser integrados à rotina antes dos cartazes, e o livro deve ficar separado do lugar onde eles dormem."
  nomes_de_cobertura_e_vento_da_noite:
    horario_aproximado: "13:24-13:43"
    observacao: "Ren avisou Jack que falará com Luath antes de apresentar o número. Depois contou a Nera e Tavin sobre o Benefício da Lona Aberta e pediu nomes de cobertura como nomes artísticos: Nera escolheu Lena, Tavin escolheu Timo. Ren explicou a Dessa a ideia de O Vento da Noite, uma lenda de Kara-Tur inspirada em Ame-no-Wakahiko. Dessa não tem guia confiável de vestimenta oriental nem shamisen disponível, mas consegue robe negro, máscara inteira, panos de vento/noite, lanternas, fumaça leve se Sorn permitir e música local adaptada. Merrit Tealeaf pode narrar sob supervisão de Silva. Jack autorizou a preparação condicionada a apoio limpo de Luath e prova física posterior."
  pedido_a_luath_para_beneficio:
    horario_aproximado: "14:08"
    observacao: "Ren foi ao posto da City Guard/Night Watch em perfil discreto e apresentou o Benefício da Lona Aberta como questão de ordem pública. A tentativa de obter apoio limpo falhou em termos formais: Luath recusou compromisso oficial da Night Watch e proibiu usar o nome da guarda em cartazes ou anúncios. Ainda assim, ofereceu uma via limitada: se Jack preparar aviso escrito com hora, entrada, saída, estimativa de público e responsável pela lona, e se Silva ou outro nome de templo assinar a parte real de comida/doação, Luath pode mandar ronda normal passar pelo caminho, dispersar problemas e enquadrar intimidação da Red Sail como perturbação da paz."
  atrito_com_luath_sobre_conluio:
    horario_aproximado: "14:11"
    observacao: "Ren tentou pressionar Luath a ir além da resposta formal, argumentando que o evento é para a cidade e que Jack está se fortalecendo contra uma organização que tentou queimar arquivo de mulher e criança. A rolagem de Persuasão falhou gravemente. Luath rejeitou a crítica de burocracia e a oferta de serviços secretos para obter provas sem que ninguém soubesse. Manteve apenas o acordo limitado anterior: aviso escrito limpo antes do pôr do sol pode justificar ronda normal, sem nome da guarda no cartaz."
  demonstracao_do_vento_da_noite:
    horario_aproximado: "14:43"
    observacao: "Ren voltou ao circo, relatou a resposta limitada de Luath e apresentou suas capacidades artísticas diante de Jack, Silva, Dessa, Mira e Sorn. A demonstração foi bem-sucedida: Acrobacia 19 contra CD 15 e precisão com shuriken 24 contra CD 14. Ren gastou 1 ki em Passo do Vento. Jack aceitou vender O Vento da Noite como atração do Benefício da Lona Aberta, desde que Sorn marque pontos de pouso, Silva controle segurança e shuriken sejam usados apenas como efeito artístico seguro."
  aviso_do_beneficio_entregue_a_luath:
    horario_aproximado: "15:32"
    observacao: "Jack e Silva prepararam aviso escrito limpo para o Benefício da Lona Aberta: evento amanhã ao cair da tarde, entrada e saída pelos campos/rota de carroças, estimativa de público maior que uma noite comum, Jack responsável pela lona e Silva responsável pela parte real de comida, água, cobertores e doações. Ren entregou o documento a Luath antes do pôr do sol, com postura humilde e sem nova discussão. Luath aceitou orientar uma ronda normal no caminho do evento, sem apoio formal público e sem nome da guarda no anúncio."
  descanso_curto_apos_entrega_a_luath:
    horario_aproximado: "16:08-17:20"
    observacao: "Ren voltou ao circo, dormiu e meditou no depósito de figurino velho por mais de uma hora. O repouso contou como descanso curto seguro; Ren recuperou o ki para 4/4."
  ensaio_estruturado_do_vento_da_noite:
    horario_aproximado: "17:25-18:12"
    observacao: "Jack e Silva aprovaram Merrit como narradora de O Vento da Noite apenas em papel limitado de chão, sem corda alta, faca, caixa de truque ou acesso solto, e sempre sob supervisão. Merrit aceitou a função e ensaiou entradas cômicas curtas. Nera/Lena e Tavin/Timo assistiram parte do ensaio trazidos por Silva pela rota interna; Tavin reagiu com encanto, Nera observou com cautela e alívio. O número ficou aprovado como estrutura básica para a apresentação de amanhã, desde que as marcações de Sorn e os limites de segurança sejam preservados."
  princesa_das_sombras_definida:
    horario_aproximado: "18:20"
    observacao: "Jack decidiu que Lysa Renn, não Nera/Lena, será a Princesa das Sombras de O Vento da Noite. A decisão foi tomada por segurança dos Vell e por integração interna do circo. Lysa fará movimentos simples e baixos, adequados ao joelho ainda limitado; não haverá beijo, toque romântico, nome anunciado ou aplauso próprio."
  ensaio_noturno_do_vento_da_noite:
    horario_aproximado: "18:30-22:30"
    observacao: "Ren ensaiou à noite com Lysa, Merrit, Sorn e Dessa. Lysa cansou primeiro por causa do joelho e foi cortada por Sorn antes de forçar demais. Merrit perdeu a voz depois de repetir entradas cômicas, e Dessa fechou limites de figurino. Ren continuou repetindo entradas e pousos sem gastar ki."
  passeio_noturno_com_nera:
    horario_aproximado: "22:35-23:10"
    observacao: "Após os ensaios, Silva permitiu que Ren e Nera caminhassem pela rota interna das lonas. Houve mãos dadas, beijos e juras de amor de Ren. Nera não respondeu com promessa igual, mas pediu que Ren viva tempo bastante para ela acreditar sem medo."
  descanso_longo_pre_apresentacao:
    horario_aproximado: "23:30-07:30"
    observacao: "Ren dormiu de verdade no circo após os ensaios e o passeio com Nera. O descanso contou como descanso longo completo; PV, dados de vida e ki permanecem cheios."
  ensaios_do_dia_da_apresentacao:
    horario_aproximado: "08:30-16:30"
    observacao: "No dia do Benefício da Lona Aberta, Ren ensaiou repetidamente. Merrit teve o texto cortado ao essencial, Lysa ajustou movimentos para poupar o joelho, Mira deu uma correção técnica a Lysa, Sorn cobrou pousos e Dessa finalizou o figurino de Ren. Ren almoçou com Nera/Lena e Tavin/Timo e tentou explicar sushi, com reação divertida e desconfiada dos Vell."
  inicio_do_beneficio_da_lona_aberta:
    horario_aproximado: "17:42 do dia seguinte"
    observacao: "O público chegou ao Benefício da Lona Aberta em camadas: trabalhadores do Harbor District, famílias pobres atraídas pela comida, gente de templo, curiosos, mercadores menores e ricos nos camarotes. A ronda normal prometida por Luath passou pela estrada sem teatralidade. Dois homens de faixa vermelha atravessaram a estrada sem parar. Jack iniciou a chamada de O Vento da Noite, com Ren vestido e pronto para entrar."
  apresentacao_do_vento_da_noite:
    horario_aproximado: "17:42-17:58 do dia seguinte"
    observacao: "Ren executou O Vento da Noite diante da lona cheia, gastando 1 ki em Passo do Vento. Rolagens abertas: Acrobacia 22 contra CD 15, sucesso; Atuação 16 contra CD 13, sucesso. O número foi bem recebido: execução física limpa, público impressionado, Lysa cumpriu o papel de Princesa das Sombras sem forçar o joelho, Merrit sustentou a narração curta e a persona pública Ren Kage começou a se fixar em Ravens Bluff. O resultado financeiro e político completo do Benefício da Lona Aberta ainda depende do restante da noite."
  reacao_interna_ao_vento_da_noite:
    horario_aproximado: "17:58-18:07 do dia seguinte"
    observacao: "Ren não voltou ao público após o número, preservando a aura de mistério. Nos bastidores, Sorn aprovou a precisão das marcações com ressalva técnica, Lysa sustentou o papel sem cair, Mira deu crítica técnica útil, Dessa confirmou que o figurino funcionou e Silva alertou que Ren Kage é uma máscara aceita, mas não um esconderijo. Jack aprovou a ausência pública e trouxe uma ficha do camarote oeste: um homem quer saber se Kage recebe patrono privado ou contratação fechada. Jack aguarda decisão de Ren sobre como administrar a resposta."
  fechamento_do_beneficio_da_lona_aberta:
    horario_aproximado: "18:07-21:10 do dia seguinte"
    observacao: "Ren decidiu deixar Kage ligado ao circo por enquanto, recusando contato direto com patrono privado na mesma noite. Jack respondeu ao camarote oeste que Kage não recebe casa privada hoje e que propostas por escrito podem ser enviadas amanhã. Rolagem aberta de resultado financeiro/social: 21 contra CD 14, sucesso. O Benefício fechou sem interrupção aberta. Jack estima cerca de setenta e poucas peças de ouro limpas para o circo depois de custos e promessas públicas, além de doações comunitárias administradas por Silva e promessas comerciais. Nera e Tavin dormem no circo hoje; Jack quer conversar pela manhã sobre preço, patronos e silêncio."
  noite_apos_o_beneficio:
    horario_aproximado: "21:10 do dia seguinte-06:20 da manhã seguinte ao Benefício"
    observacao: "Ren tomou banho atrás da lona azul, devolveu o figurino de O Vento da Noite aos cuidados de Dessa, comeu com Nera e Tavin na carroça verde e percebeu que esperava alguma ação de Masao ou de seus lacaios. Nenhuma ameaça aberta atravessou a lona. Ren dormiu no canto definido para ele e completou descanso longo, recuperando o ki para 4/4. Pela manhã, Silva deixou água e pão e avisou que Jack quer falar depois da comida; Nera está acordada na carroça verde."
  conversa_manha_nera_e_jack:
    horario_aproximado: "06:20-06:45 da manhã seguinte ao Benefício"
    observacao: "Ren comeu, falou com Nera na carroça verde e foi ao escritório-carroça de Jack. Nera aceitou que Kage pode ser uma porta de abrigo e renda, mas alertou que Ren não deve ser comprado inteiro por Kage, Jack, ricos, Vell ou Masao. No escritório, Jack mostrou proposta escrita sem nome claro vinda do camarote oeste, pedindo termos para apresentação privada de Kage com pagamento adiantado e discrição. Jack quer exigir nome de casa, endereço, pagador, metade adiantada e local controlado, sem envolver Nera, Tavin, livro ou história triste. Antes de responder, pediu que Ren defina o que Kage não faz por dinheiro."
  limites_de_kage_e_mensageira_de_tyr:
    horario_aproximado: "06:58 da manhã seguinte ao Benefício"
    observacao: "Ren definiu limites formais para Kage: apresentações apenas em tenda controlada pelo circo, equipe presente, segurança identificada, antecedência, sem reunião social, sem fala obrigatória, sem exposição pessoal, sem intimidação privada e sem envolver os Vell. Jack preparou resposta rígida ao camarote oeste, com preço de 40 PO para primeira apresentação fechada curta, 20 PO adiantadas e custos por fora, mas ainda não selou o papel. Uma mensageira de Tyr chegou à borda das carroças pedindo Silva Elkwood por assunto de lacre reservado."
  ficha_de_tyr_para_silva:
    horario_aproximado: "07:04 da manhã seguinte ao Benefício"
    observacao: "Ren acompanhou Silva até a mensageira de Tyr. A ficha reservada informa que Luath confirmou ter recebido a cópia parcial e ter agido contra buscas ilegais, Maerra confirmou o lacre, a abertura presenciada e a condição em que viu os Vell, e Tyr agora pede que Silva confirme ou negue a guarda atual informada. Silva aceita confirmar que os Vell estão sob seu cuidado imediato por ora, mas precisa decidir se pede resguardo em espera, transferência voluntária discreta para Tyr ou manutenção temporária no abrigo atual."
  resposta_de_silva_a_tyr:
    horario_aproximado: "07:10 da manhã seguinte ao Benefício"
    observacao: "Ren defendeu que Nera e Tavin permaneçam no circo, por parecer mais vida do que prisão e por valorizar a proximidade. Também agradeceu Silva por cuidar dos Vell. Silva confirmou formalmente a guarda imediata, pediu manutenção temporária no abrigo atual, recusou transferência neste momento e solicitou resguardo em espera sem deslocamento até o próximo sino maior. A mensageira de Tyr informou que a primeira convocação de Velis Rook foi entregue e que a Casa de Tyr espera resposta antes do meio-dia."
  contrato_de_kage_e_saida_do_circo:
    horario_aproximado: "07:10-07:35 da manhã seguinte ao Benefício"
    observacao: "Ren voltou a Jack, assinou como Ren Kage o acordo condicional de artista do Jack Mooney & Sons Circus, e Jack selou a resposta rígida ao camarote oeste. Depois Ren falou rapidamente com Nera e Tavin na carroça verde, sem transformar a despedida em cena longa, e saiu do circo discretamente, sem usar ki."
  sondagem_da_casa_velha_do_primeiro_raio:
    horario_aproximado: "08:12 da manhã seguinte ao Benefício"
    observacao: "Ren chegou sem cauda evidente aos arredores da Casa Velha do Primeiro Raio, antiga casa de auxílio de Lathander abaixo do Temple District, perto das ruas que descem para armazéns. Rolagens abertas: Furtividade 19 contra CD 14; Investigação 14 contra CD 13; Percepção 16 contra CD 14. Do lado de fora, Ren identificou marcas de carvão em forma de sol riscado, trânsito recente de pés pequenos e adultos pela viela lateral, provável entrada de serviço nos fundos, ponto de observação improvisado, possíveis observadores na rua e movimento breve atrás de uma janela alta. Ren ainda não entrou nem abordou ninguém."
  observacao_prolongada_da_casa_velha:
    horario_aproximado: "08:12-11:18 da manhã seguinte ao Benefício"
    observacao: "Ren descartou comprar uma luneta por custo e disponibilidade: a referência do Livro do Jogador coloca luneta em 1000 PO, fora do alcance dos 31 PO atuais e de uma compra rápida nas ruas baixas. Ele ocupou discretamente um sótão quebrado de oficina de rodas sem gastar ki. Rolagens abertas: Furtividade para ocupar ponto alto 24 contra CD 14, sucesso; Observação prolongada 11 contra CD 15, falha para detalhes finos; Investigação para organizar padrões 23 contra CD 14, sucesso. Ren observou a Casa Velha por quase três horas sem gerar alarme. Identificou que a frente não é usada, a viela lateral/porta de serviço são o eixo real, crianças parecem funcionar como olhos externos e um adulto de avental manchado usou a rota duas vezes, saindo por volta de 11:18 rumo aos armazéns com embrulho fino e comprido."
  tentativa_de_vigiar_velis:
    horario_aproximado: "11:18-11:49 da manhã seguinte ao Benefício"
    observacao: "Ren abandonou o rastro imediato do adulto de avental manchado da Casa Velha para tentar localizar Velis Rook antes do meio-dia. Rolagens abertas: Localizar rota provável de Velis 7 contra CD 14, falha; Vigiar Velis sem ser notado 13 contra CD 15, falha; Ouvir conversa em movimento 19 contra CD 14, sucesso. Ren errou a primeira rota e perdeu tempo, mas chegou ao perímetro lateral da Casa de Tyr quando Velis chegava com uma mulher ligada a interesses de casa rica. Ren ouviu que Velis foi instruído a negar instrução de patrono, tratar a anulação como correção de escrita, dizer que a marca da lua foi recebida e que o 'oriental' era M. Harrow. Um guardião de Tyr percebeu um homem de capuz interessado demais; Ren se afastou sem ser identificado com certeza. Velis entrou na Casa de Tyr, e a mulher seguiu sozinha rumo às ruas de escribas e comércio."
  conselho_de_maerra_apos_velis:
    horario_aproximado: "11:49-12:07 da manhã seguinte ao Benefício"
    observacao: "Ren foi discretamente da lateral de Tyr até a Casa da Aurora Menor. Rolagem aberta: Furtividade para sair do perímetro de Tyr sem arrastar atenção até Maerra 20 contra CD 13, sucesso. Ren relatou a Maerra a observação da Casa Velha, as instruções dadas a Velis e a situação de Silva. Maerra corrigiu que Silva é guardiã atual confirmada/registrada em trilha reservada, não guardiã legal plena. Maerra ofereceu enviar ficha curta a Halessa alertando para risco de Velis ter sido instruído antes da oitiva, sem nomear Ren como ouvinte. Conselho principal: deixar Tyr trabalhar Velis por ora, preparar a Casa Velha para a noite com foco em crianças vivas e rotas, e avisar Silva que o meio-dia passou sem transferência dos Vell."
  observacao_de_fonte_em_narwhal:
    horario_aproximado: "12:07-13:04 do dia seguinte ao Benefício"
    observacao: "Ren saiu da Casa da Aurora Menor enquanto Maerra colocava em curso uma ficha curta a Halessa, sem nomear Ren como ouvinte, alertando para o risco de Velis ter sido instruído antes da oitiva. Ren então voltou a observar Narwhal Manor. Rolagens abertas: voltar ao entorno de Narwhal sem ativar o alarme 11 contra CD 15, falha; mapear fluxo de serviço e escolher fonte útil 15 contra CD 15, sucesso; ler pressão pessoal em possível fonte 11 contra CD 14, falha; seguir a fonte para longe de Narwhal 17 contra CD 14, sucesso. Um guarda de Narwhal notou um observador deslocado antes de Ren mudar de posição, aumentando a atenção da casa. Ren identificou Kethra Dunn, funcionária de serviço que circula por corredores de lacres, velas e panos borrados, e a seguiu até uma loja de penhores/cobrança. Dois homens exigiram oito peças de ouro ou nomes ligados às chamadas de Tyr, ameaçando alguém chamado Colm. Kethra ainda não viu Ren."
  abordagem_inicial_a_kethra:
    horario_aproximado: "13:04-13:10 do dia seguinte ao Benefício"
    observacao: "Ren tentou confirmar se Kethra estava sendo seguida, mas a rolagem de Percepção falhou: 7 contra CD 13. Ele não viu cauda óbvia, mas não teve certeza limpa. Depois a abordou como estrangeiro perdido e inofensivo; Atuação 12 contra CD 13, falha. Ao revelar que sabia dos problemas dela e oferecer 8 PO, a tentativa de Persuasão falhou: 7 contra CD 14. Kethra não aceitou o ouro, interpretou parte da aproximação como possível nova pressão e avisou que pagar diretamente os cobradores pode aumentar o preço. Ainda assim, não chamou guarda e deixou uma abertura: fonte seca atrás dos azulejos verdes, quando o sino menor tocar antes do segundo sino. Kethra voltou para o fluxo rumo a Narwhal."
  encontro_na_fonte_seca_com_kethra:
    horario_aproximado: "13:10-13:35 do dia seguinte ao Benefício"
    observacao: "Ren esperou discretamente na fonte seca atrás dos azulejos verdes. Rolagens abertas: esperar na fonte sem parecer emboscada 24 contra CD 13, sucesso; checar observadores ao redor da fonte 23 contra CD 14, sucesso; explicar a Kethra a ameaça maior e oferecer proteção 4 contra CD 14, falha. Kethra compareceu, mas não aceitou a explicação ampla sobre ameaça maior como base de confiança. Ela revelou que Colm Dunn é seu irmão e está preso por dívida/trabalho no alto da loja de Bram Vask; Noll é o homem do lábio cortado. Kethra quer Colm vivo, ela fora de suspeita, e Bram/Noll sem aprenderem que ela tem bolsa maior ou protetor. Também deu uma pista de Narwhal: Velis não voltou à mesa depois de Tyr, mas a mulher de manto cinza-azulado mandou retirar do prédio a gaveta de areia, cera e panos do corredor treze."
  resgate_de_colm_na_loja_de_bram:
    horario_aproximado: "13:35-13:48 do dia seguinte ao Benefício"
    observacao: "Ren melhorou o disfarce com barro, poeira e capuz. Rolagens abertas: disfarce apressado 16 contra CD 12, sucesso; entrar como devedor e manter Bram interessado 5 contra CD 13, falha; golpe desarmado crítico contra Noll 26 contra CA 12, 11 de dano contundente; Rajada de Golpes contra Noll 17 contra CA 12, 5 de dano contundente; sangue-frio de Bram Vask 12 contra CD 16, falha; encontrar o livro de contas 19 contra CD 12, sucesso; Colm estar consciente e capaz de andar 10 contra CD 10, sucesso. Bram percebeu que Ren não parecia devedor comum, mas fechou a porta. Ren gastou 1 ki, derrubou Noll de forma não letal, intimidou Bram, tomou o caderno de contas sujas como alavanca e saiu pelos fundos com Colm Dunn vivo, fraco e capaz de andar. Bram não viu o rosto de Ren."
  abrigo_temporario_de_colm:
    horario_aproximado: "13:48-14:05 do dia seguinte ao Benefício"
    observacao: "Ren tentou interceptar Kethra pelo caminho reverso até a loja. Rolagens abertas: escolher ponto de interceptação na rota de Kethra 4 contra CD 11, falha; mover Colm pela rota curta sem chamar atenção 17 contra CD 13, sucesso. A falha custou minutos: Kethra usou uma passagem coberta e quase alcançou a última curva antes da loja. Ainda assim, Ren e Colm não chamaram atenção útil. Kethra viu Colm vivo, reconheceu o valor do caderno de contas de Bram Vask e orientou Ren a levá-lo aos fundos do Lavadouro dos Três Tanques, na Rua da Cal, usando a frase 'sabão preto para pano azul' se houvesse gente por perto. Colm ficou escondido temporariamente no quarto da lenha sob cuidado de Sella Rove. Kethra voltou para Narwhal para não ligar seu sumiço ao resgate. O segundo sino já tocou."
  vigilia_parcial_de_bram:
    horario_aproximado: "14:05-16:55 do dia seguinte ao Benefício"
    observacao: "Ren comprou um manto roto por moeda baixa, montou cobertura de mendigo e vigiou a loja de Bram Vask. Rolagens abertas: preparar cobertura de mendigo 23 contra CD 13, sucesso; encontrar ponto alto discreto 6 contra CD 13, falha; vigilância prolongada 7 contra CD 14, falha; aproximar-se como mendigo quando houve movimento na loja 9 contra CD 15, falha. A cobertura funcionou, mas o ponto de observação era ruim e a leitura da loja ficou parcial. Bram não saiu em pessoa de modo claro, Noll não apareceu em condição de caçar ninguém e Ren não viu perseguição aberta rumo a Kethra, à Rua da Cal ou ao Lavadouro dos Três Tanques. Houve um movimento pequeno e mal confirmado perto dos fundos da loja, mas Ren não conseguiu identificar se era recado, cliente, cúmplice ou ruído."
  encontro_pos_turno_com_kethra:
    horario_aproximado: "16:55-17:38 de 3 Eleasis"
    observacao: "Ren encontrou Kethra Dunn depois do turno. Rolagens abertas: encontrar Kethra sem chamar atenção útil 13 contra CD 14, falha; checar se Kethra vinha com cauda 17 contra CD 14, sucesso; transformar o resgate de Colm em confiança prática 14 contra CD 12, sucesso. Um aprendiz na lateral de Narwhal pode lembrar de um mendigo se movendo quando Kethra saiu, mas Ren confirmou que ela não tinha cauda clara. Kethra foi ao Lavadouro dos Três Tanques ver Colm. Sella Rove avisou que um rapaz já perguntou pela frase 'sabão preto para pano azul'. Kethra revelou que não ouviu o nome Masao em Narwhal, mas ouviu 'hóspede', 'homem da lua' e a versão preparada de M. Harrow. Também disse que Velis Rook parece instrumento de papel, não mandante, e que a gaveta de areia, cera e panos do corredor treze saiu de Narwhal em cesto de roupa suja com nó de tira amarela rumo à rua dos tintureiros. Colm não está seguro no quarto da lenha por muito tempo."
  relato_de_ren_a_kethra:
    horario_aproximado: "17:38-17:46 de 3 Eleasis"
    observacao: "Ren explicou a Kethra que não pode sobrecarregar Maerra, Silva, Jack ou Tyr com Colm, perguntou por parentes no interior e ofereceu escoltar Colm amanhã, 4 Eleasis, até uma carroça que o tire temporariamente de Ravens Bluff. Rolagens abertas: parentes viáveis no interior 4 contra CD 11, falha; honestidade com Kethra sobre Masao, d20 com vantagem [7, 8] -> 8 contra CD 13, falha. Kethra não tem parente viável capaz de receber Colm agora: há sangue distante para o lado do Fire River, mas nenhuma porta segura. Ela acredita na dor de Ren e no perigo real ligado a Masao, Narwhal, Brass, Velis e a lua, mas não foi convencida da escala de uma ameaça à cidade inteira. Sella pode esconder Colm atrás da caldeira velha até antes da primeira luz de 4 Eleasis; depois disso, será preciso uma carroça comum e escolta se Ren quiser tirá-lo da cidade."
  colocacao_de_colm_na_carroca:
    horario_aproximado: "17:46-18:32 de 3 Eleasis"
    observacao: "Ren perguntou se Colm conseguia andar, entregou a ele o manto roto de mendigo e orientou o nome de cobertura Dent. Kethra e Sella prepararam um embrulho simples com pão, queijo seco, água, moedas pequenas e linha. Rolagens abertas: mover Colm até os pátios de saída sem virar rastro útil 10 contra CD 14, falha; identificar carroça pobre adequada 23 contra CD 14, sucesso; convencer chefe da carroça com oferta de 7 PO 16 contra CD 13, sucesso. A falha deixou pista fraca: uma menina viu dois vultos saindo da área do Lavadouro dos Três Tanques rumo aos pátios de carroças, sem rosto claro. Ren encontrou Dorra Hest, chefe de uma carroça dos fornos de cal do Fire River, e pagou 7 PO para que ela leve Colm/Dent para fora de Ravens Bluff antes da primeira luz de 4 Eleasis. Colm está escondido sob a lona da carroça; Dorra prometeu silêncio prático e alguns dias nos fornos, não segurança de longo prazo."
  aviso_a_kethra_e_ponto_morto:
    horario_aproximado: "18:32-18:52 de 3 Eleasis"
    observacao: "Ren voltou até Kethra para avisar que Colm está sob o nome Dent, escondido na carroça de Dorra Hest, rumo aos fornos de cal do Fire River antes da primeira luz de 4 Eleasis. Rolagens abertas: voltar até Kethra sem arrastar atenção dos pátios 12 contra CD 14, falha; ler o limite prático de Kethra para mensagens 11 contra CD 13, falha; definir ponto morto discreto nos fundos de Narwhal 16 contra CD 15, sucesso. A falha da volta deixou outra lembrança fraca: um homem velho nos pátios viu Ren sair da área da carroça de cal e depois tomar direção da Rua da Cal. Kethra recusou mensagens diárias por criarem padrão perigoso, mas aceitou usar um vaso rachado junto dos barris de areia e da calha quebrada nos fundos de Narwhal Manor. Protocolo: mensagem sob o fundo presa com cera cinza; rachadura para a rua indica perigo urgente ligado a Bram; rachadura para a parede indica nada; se o vaso sumir, o caminho morreu. O ponto ainda precisa ser montado fisicamente por Ren."
  retorno_ao_circo_e_descanso_noturno:
    horario_aproximado: "18:52-21:05 de 3 Eleasis"
    observacao: "Ren voltou ao Jack Mooney & Sons Circus para tomar banho, ver os Vell, falar com Silva e Nera e descansar antes de uma possível incursão noturna. O retorno foi tratado como deslocamento discreto comum: sem cauda competente no trajeto e sem busca ativa sobre Ren, não houve rolagem nem rastro útil até o acampamento. Silva interceptou Ren antes da carroça verde, checou a borda do acampamento e só então permitiu banho e conversa. Ren contou a Silva e Nera sobre Kethra, Colm/Dent, Dorra Hest, Velis, M. Harrow e a Casa Velha do Primeiro Raio. Silva alertou que a Casa Velha deve ser tratada como lugar que usa crianças como olheiros, não como abrigo vazio. Ren completou descanso curto com meia hora de meditação e recuperou ki para 4/4."
  incursao_noturna_casa_velha_lateral:
    horario_aproximado: "21:05-23:58 de 3 Eleasis"
    observacao: "Ren descansou mais uma hora e meia no circo, com cerca de uma hora de sono e meia hora de meditação. Por volta de 22:30, preparou pintura preta no rosto com o kit de disfarce para dificultar identificação sob pouca luz, vestiu roupas orientais, preparou armas e saiu para a Casa Velha do Primeiro Raio. A travessia até a região foi tratada como deslocamento discreto comum, sem cauda competente. Rolagens abertas: ocupar ponto de observação da Casa Velha 15 contra CD 14, sucesso; observação noturna da Casa Velha 10 contra CD 15, falha; organizar padrões de entrada na lateral 23 contra CD 14, sucesso; examinar a janela alta 19 contra CD 15, sucesso; abrir discretamente a janela alta com ferramentas de ladrão 19 contra CD 15, sucesso. Ren ocupou o ponto de observação anterior sem alarme e observou por cerca de quarenta e cinco minutos. A noite impediu detalhes finos do interior, mas a leitura de padrão foi excelente: frente inativa, lateral como eixo real, luz fraca sob a porta de serviço e janela alta escura acima. Ren não viu criança em posição ativa do lado de fora naquele momento, mas isso não prova ausência de olheiros ou crianças dentro. Da lateral, examinou a janela alta, confirmou uma sala de serviço vazia com ligação para o restante da casa, abriu a trava discretamente com ferramentas de ladrão e entrou sem gerar alarme. Depois de entrar, ativou Passos sem Pegadas, gastando 2 ki; concentração pode durar até cerca de 00:58 de 4 Eleasis. Imagens salvas: sessoes/002/imagens/001-visao-casa-velha-lateral.png; sessoes/002/imagens/002-mapa-casa-velha-primeiro-raio.png; sessoes/002/imagens/002-mapa-casa-velha-primeiro-raio.svg."
  espiar_patamar_interno_casa_velha:
    horario_aproximado: "23:58-23:59 de 3 Eleasis"
    observacao: "Ren caminhou furtivamente até a porta interna entreaberta da sala alta de serviço. Rolagens abertas: aproximar-se furtivamente com Passos sem Pegadas 18 contra CD 15, sucesso; espiar e entender a sala além da porta 17 contra CD 14, sucesso. Ren não gerou alarme. Pela fresta, entendeu que o espaço seguinte é um patamar/corredor de serviço vazio. Há uma passagem escura à esquerda rumo à parte frontal da casa, uma escada estreita iluminada descendo à direita e uma linha baixa de alarme improvisado presa a talheres ou metal fino. Pelo som, há pelo menos uma voz adulta abaixo ou adiante, mas ninguém no patamar imediato."
  topo_da_escada_interna_casa_velha:
    horario_aproximado: "23:59 de 3 Eleasis-00:01 de 4 Eleasis"
    observacao: "Ren foi discretamente em direção à escada, contornando a linha baixa de alarme que já havia percebido, e parou antes de descer por completo. Rolagens abertas: aproximar-se do topo da escada com Passos sem Pegadas 32 contra CD 16, sucesso; espiar a área abaixo da escada e mapear esconderijos imediatos 19 contra CD 15, sucesso. Ren não acionou o alarme nem foi percebido. Abaixo há uma cozinha/refeitório velho, iluminado por lamparina baixa, com um adulto de avental manchado e pelo menos duas crianças visíveis. Uma cortina grossa ao fundo leva a uma área maior e mais baixa; uma porta lateral barrada parece ligar à entrada de serviço. Esconderijos imediatos: vão da prateleira do patamar, panos da sala alta, sombra sob a escada, lenha e bancos quebrados se Ren descer mais alguns degraus."
  toll_neutralizado_casa_velha:
    horario_aproximado: "00:01-00:03 de 4 Eleasis"
    observacao: "Ren aproximou-se furtivamente do homem de avental, gastou 1 ki em Rajada de Golpes e tentou apagá-lo de forma não letal e silenciosa. Rolagens abertas: aproximar-se do homem sem alertar a cozinha 34 contra CD 17, sucesso; golpe surpresa não letal 16 contra CA 12, acerto, 6 de dano contundente; Rajada de Golpes 1, 20 contra CA 12, acerto, 7 de dano contundente; Rajada de Golpes 2, 8 contra CA 12, erro; controlar o corpo inconsciente antes de bater no chão 16 contra CD 13, sucesso; reação das crianças ao sinal de silêncio 19 contra CD 12, sucesso; encobrir rapidamente o homem inconsciente com ajuda das crianças 24 contra CD 14, sucesso. Toll, o adulto de avental, está inconsciente e escondido de modo apressado sob banco, pano e lenha. As crianças disseram que ele guarda a cozinha/porta, mas não manda no lugar inteiro; há mais crianças abaixo ou atrás da cortina, e os porões são usados como rota de recados, pacotes e esconderijo. A mentira combinada, se alguém aparecer, é que Toll ouviu barulho lá fora e foi resolver."
  mentira_sobre_toll_falha:
    horario_aproximado: "00:03-00:04 de 4 Eleasis"
    observacao: "Ren se escondeu na cozinha/refeitório enquanto alguém chamava por Toll. Rolagens abertas: Ren se esconder na cozinha com Passos sem Pegadas 33 contra CD 16, sucesso; crianças sustentam a mentira sobre Toll 7 contra CD 13, falha. A mulher de lenço escuro que veio da área além da cortina não viu Ren, mas percebeu a falha prática da mentira: a porta lateral continua barrada, então Toll não teria saído por ali. Ela entrou desconfiada e ainda não encontrou o corpo nem gerou alarme aberto."
  mulher_de_lenco_neutralizada:
    horario_aproximado: "00:04-00:05 de 4 Eleasis"
    observacao: "Ren saiu do esconderijo e colocou a wakizashi no pescoço da mulher de lenço escuro antes que ela achasse Toll. Rolagens abertas: colocar a wakizashi no pescoço da mulher sem alarme 26 crítico contra CA 10, sucesso; pressioná-la a responder baixo 9 contra CD 12, falha; golpe no estômago para cortar o grito 18 contra CA 10, acerto, 8 de dano contundente não letal; baixar a mulher sem deixar o corpo bater 16 contra CD 13, sucesso; crianças mantêm silêncio após a segunda queda 7 contra CD 13, falha; esconder a mulher antes de alguém cruzar a cortina 7 contra CD 15, falha. A mulher está inconsciente, mas parcialmente visível na cozinha/refeitório; suas chaves caíram perto da mesa. O soluço da criança e a falha em esconder o corpo atraem reação imediata da área atrás da cortina, ainda antes de alarme aberto pleno."
  rapaz_da_cortina_neutralizado:
    horario_aproximado: "00:05-00:06 de 4 Eleasis"
    observacao: "Ren decidiu que a furtividade estava se encerrando e tentou apagar em silêncio quem cruzasse a cortina. Rolagens abertas: manter ângulo de emboscada quando a cortina abre 28 contra CD 18, sucesso; ataque surpresa não letal contra quem cruza a cortina 26 crítico contra CA 12, 11 de dano contundente, sucesso; baixar o terceiro corpo sem derrubar a cortina 12 contra CD 14, falha; reação imediata além da cortina aos sons acumulados 9 contra CD 14, falha. O alvo era um rapaz magro vindo verificar Vessa. Ele foi neutralizado de forma não letal. A queda prendeu e abriu parcialmente a cortina; ninguém além dela reagiu rápido o bastante para ver Ren de imediato, mas o corredor/porão está exposto e a cena acumula sinais evidentes."
  fundo_do_porao_casa_velha:
    horario_aproximado: "00:06-00:10 de 4 Eleasis"
    observacao: "Ren entrou no corredor baixo além da cortina, apagou velas, conteve Miri em silêncio e a convenceu de que veio salvar as crianças. Miri tentou fingir normalidade, mas sua voz soou errada; Ren a mandou correr para a cozinha e usou a aproximação do adulto do fundo como isca. O adulto entrou no trecho escuro e foi neutralizado de modo não letal. Ao puxá-lo para a cozinha, Ren fez ruído perceptível; as crianças abriram a porta lateral, mas a barra raspou alto. Elas indicaram Narro, Doss, Cal, Nib, Peta, o homem vermelho e o Tanque seco como esconderijo. Ren mandou as três crianças da cozinha irem ao Tanque seco, mas a saída delas não foi limpa. Ren gastou seu último ki em Passo do Vento e avançou pelo corredor baixo, fazendo ruído, mas alcançando a câmara antes que Narro concluísse a retirada."
  narro_neutralizado_e_peta_levada:
    horario_aproximado: "00:10 de 4 Eleasis"
    observacao: "Na câmara baixa, Narro tentava mover Nib, Doss e Cal, com uma caixa velha marcada por sol apagado, chave e lâmina curta. Uma porta de ferro estava sendo fechada por uma figura vermelha. Ren atacou Narro apesar de Cal estar no caminho. Rolagens abertas: iniciativa de Ren 16, iniciativa de Narro 13; achar ângulo contra Narro sem atingir Cal 11 contra CD 14, falha; ataque não letal contra Narro com Cal no caminho 26 crítico contra CA 14, 9 de dano contundente; golpe bônus de Artes Marciais 20 contra CA 14, 6 de dano contundente; Cal cair fora do agarrão 21 contra CD 12, sucesso; figura vermelha fechar a porta 3 contra CD 12, falha. Narro foi neutralizado de modo não letal, Cal se soltou, a caixa/chave/lâmina caíram. Ren tentou abrir a porta antes que a figura vermelha se soltasse. Rolagens abertas: forçar a porta 5 contra CD 13, falha; figura vermelha reagir 16 contra CD 13, sucesso; identificar a figura 15 contra CD 13, sucesso; crianças no gargalo não entrarem em pânico 17 contra CD 11, sucesso. A figura cortou o pano vermelho preso, bateu a porta e trancou ou barrou por dentro. Ren viu que era uma pessoa magra de capuz/avental vermelho-escuro, rosto parcialmente coberto, e viu uma criança pequena atrás dela, provavelmente Peta."
  retirada_para_o_tanque_seco:
    horario_aproximado: "00:10-00:15 de 4 Eleasis"
    observacao: "Ren pegou a caixa velha marcada por sol apagado e o pedaço de pano vermelho rasgado, deixando para trás a chave de Narro e a lâmina curta. Rolagens abertas: retirada pela lateral com as crianças sob Passos sem Pegadas 15 contra CD 12, sucesso; primeiro grupo manter o ponto no Tanque seco 18 contra CD 11, sucesso. Ren saiu da Casa Velha pela lateral com Nib, Doss e Cal e reencontrou Miri e as outras duas crianças da cozinha no Tanque seco atrás da casa dos azulejos verdes. As crianças disseram que Peta provavelmente foi levada porque viu algo que não devia depois da sopa, envolvendo a porta de ferro, a figura vermelha e a caixa do sol. Elas descrevem a figura vermelha como alguém que vem pela porta de ferro, cheira a cera/tintura, fala pouco, leva pacotes ou crianças e faz Narro parar de mandar."
  criancas_levadas_a_maerra:
    horario_aproximado: "00:15-00:35 de 4 Eleasis"
    observacao: "Ren conduziu seis crianças do Tanque seco até a Casa da Aurora Menor sob Passos sem Pegadas. Rolagem aberta: conduzir seis crianças até Maerra sob Passos sem Pegadas 25 contra CD 13, sucesso. Maerra acolheu Miri, duas crianças da cozinha, Nib, Doss e Cal sem alarme aberto. Ren relatou a incursão na Casa Velha, Peta sendo provavelmente levada, a pessoa de vermelho, o pano e a caixa. Com ferramentas de ladrão e paciência, Ren abriu a caixa sem rolagem: a tranca pequena não tinha pressão ou proteção relevante. Dentro havia linho amarelado, papel quebradiço e o Broche do Semblante Humilde. Maerra ficou com a caixa/relicário aberto e cedeu o broche a Ren como empréstimo provisório para proteger vivos. Maerra identificou o pano vermelho como pano de trabalho encerado de tintureiro ou cerieiro; quando Ren mencionou a pista de Kethra sobre areia, cera e panos do corredor treze rumo à rua dos tintureiros, Maerra apontou que os fios encostam no mesmo cheiro. Ela pode mandar palavra a Luath, mas alertou que uma batida formal pode custar tempo e encontrar apenas adultos caídos, não Peta."
  rastro_baixo_de_peta:
    horario_aproximado: "00:35-00:47 de 4 Eleasis"
    observacao: "Ren disse às crianças que elas estão seguras e que irá atrás de Peta. Cal pediu que ele a traga. Maerra respondeu à brincadeira de Ren dizendo que ele continua sendo um estrangeiro armado no templo dela, mas que ela tem uma opinião melhor sobre o que ele faz quando encontra uma criança no caminho da própria vingança. Ren saiu sozinho para os arredores da Casa Velha. Rolagens abertas: ler para onde a porta de ferro pode dar 10 contra CD 14, falha; seguir fio de cera e tintura no entorno da Casa Velha 23 contra CD 15, sucesso. Ren não conseguiu deduzir a geometria exata da porta de ferro pelo lado de fora, mas encontrou duas construções abaixo da lateral conhecida uma grelha baixa de drenagem mal recolocada, com mancha de cera vermelha, fibra de pano encerado semelhante ao pedaço rasgado, cheiro de cera/tintura e marca pequena de joelho ou palma de criança na lama. A galeria parece seguir na direção das ruas dos ofícios sujos e da rua dos tintureiros. Broche do Semblante Humilde ainda não usado."
  oficina_dos_tintureiros:
    horario_aproximado: "00:47-00:55 de 4 Eleasis"
    observacao: "Ren continuou a perseguição pela galeria de drenagem até a rua dos tintureiros. Rolagens abertas: avançar pela galeria sob Passos sem Pegadas 36 contra CD 15, sucesso; manter o fio de cera e tintura até a rua dos tintureiros 20 contra CD 15, sucesso; observar de longe a rua dos tintureiros 19 contra CD 14, sucesso. Ren não foi notado. Ele emergiu em pátio dos fundos de uma oficina apagada pela frente, mas ativa pelos fundos. Viu cesto de roupa suja com tira amarela de dois nós, marca estreita de sola adulta, gota de cera vermelha esmagada e arrasto infantil irregular. Ouviu som abafado curto de dentro e viu, pela fresta baixa, uma sombra magra de vermelho e uma forma pequena baixa demais para adulto, provavelmente Peta. Passos sem Pegadas ainda ativo, mas restam poucos minutos."
  invasao_oficina_tintureiros:
    horario_aproximado: "00:56 de 4 Eleasis"
    observacao: "Ren usou os momentos finais de Passos sem Pegadas para se aproximar da porta dos fundos da oficina e entrar baixo pela porta, já que a fresta não comportava um adulto. Rolagens abertas: aproximação final sob Passos sem Pegadas 28 contra CD 15, sucesso; entrada baixa pela porta dos fundos 19 contra CD 14, sucesso; carrinho surpresa não letal contra a figura vermelha 21 contra CA 13, acerto, 5 de dano contundente; golpe bônus de Artes Marciais 12 contra CA 13, erro; iniciativa Ren 23, figura vermelha 17; golpe não letal para impedir grito ou alarme 9 contra CA 13, erro; golpe bônus de Artes Marciais para cortar a reação 17 contra CA 13, acerto, 8 de dano contundente; pegar Peta e sair da oficina sob pressão 23 contra CD 15, sucesso. A figura vermelha está inconsciente, respirando, e não puxou o cordão. Ren removeu a máscara e viu uma mulher jovem adulta desconhecida, pálida, magra, com cicatriz antiga de queimadura/cera e marca de sol apagado no pescoço. A criança viva e presa, quase certamente Peta, está nos braços de Ren. Ren saiu para o pátio dos fundos antes que a cortina abrisse por completo. Atrás da cortina há pelo menos uma pessoa reagindo e uma abertura baixa escura, possivelmente passagem, alçapão ou escada descendo."
  retorno_a_maerra_com_peta:
    horario_aproximado: "00:56-01:05 de 4 Eleasis"
    observacao: "Ren escolheu a rota pela rua dos tintureiros em vez da grelha baixa. Rolagens abertas: sair do pátio dos tintureiros sem entregar a direção 34 contra CD 16, sucesso; improvisar Peta como carga sob o disfarce do broche 22 contra CD 14, sucesso. Ren pegou pano grosso de tingimento e cesto quebrado para dar aparência de carga de retalhos úmidos à criança. Ao alcançar a rua, ativou o Broche do Semblante Humilde, ficando com aparência humilde/comum até cerca de 01:56; o uso do broche está gasto até o próximo amanhecer. Passos sem Pegadas expirou no trajeto por volta de 00:58. Ren chegou à Casa da Aurora Menor sem levantar suspeita útil; Cal confirmou que a criança é Peta, e Maerra iniciou atendimento imediato."
  conversa_limitada_e_retorno_ao_circo:
    horario_aproximado: "01:05-02:10 de 4 Eleasis"
    observacao: "Ren respondeu a Maerra que ninguém veio atrás e contou sobre a mulher de vermelho, a cicatriz, a marca de sol apagado, a manga cinza, a mão com dois anéis, a barra de ferro e a abertura baixa atrás da cortina. Rolagens abertas: Maerra reconhecer a marca do sol apagado 7 contra CD 14, falha; Peta conseguir dizer algo útil em choque 2 contra CD 12, falha. Maerra não reconheceu a mulher ou a marca com segurança, considerando apenas que o sol apagado parece deboche ou apropriação cruel de símbolo de amanhecer. Peta só conseguiu dizer fragmentos: frio, embaixo, e que a mulher de vermelho não falava com ela. Cal segurou o antebraço de Ren por um instante em agradecimento. Ren dormiu pouco na Casa da Aurora Menor por cansaço, sem completar descanso curto de monge e sem recuperar ki. Depois voltou ao Jack Mooney & Sons Circus pela rota da carroça de remendos, sem cauda competente percebida; o Broche do Semblante Humilde expirou no caminho e está gasto até o próximo amanhecer. Silva Elkwood interceptou Ren antes da carroça verde e perguntou se ele trouxe alguém atrás."
  relato_a_silva_e_abraco_de_nera:
    horario_aproximado: "02:10-02:16 de 4 Eleasis"
    observacao: "Ren disse a Silva que não foi seguido, chamou-a de Sil pela primeira vez e explicou por cima que salvou sete crianças da Casa Velha do Primeiro Raio. Ele contou que as crianças parecem ter ouvido coisas sobre uma operação na cidade, mas ainda sem ligação confirmada com Masao ou Red Sail. Silva percebeu o cansaço extremo de Ren, aceitou que não havia cauda colada e decidiu mandar ajuda discreta de Chauntea à Casa da Aurora Menor antes do amanhecer. Nera ouviu ou percebeu a chegada, saiu da carroça verde e abraçou Ren com preocupação explícita."
  repouso_curto_com_meditacao_no_circo:
    horario_aproximado: "02:16-06:05 de 4 Eleasis"
    observacao: "Ren abraçou e beijou Nera discretamente, prometendo voltar e dizendo que ela poderia visitá-lo de manhã no canto dele. Nera aceitou deixá-lo dormir, e Silva reforçou que o agradecimento útil seria dormir. Ren foi ao depósito de figurino velho e dormiu algumas horas atrás da arca dos estandartes. O repouso não contou como descanso longo, mas contou como descanso curto de monge: em algum ponto antes do amanhecer, Ren manteve meia hora de meditação/centralização suficiente para recuperar o ki para 4/4. Antes do amanhecer, a ajuda discreta enviada por Silva alcançou Maerra na Casa da Aurora Menor sem chamar atenção útil. Ren acordou por volta de 06:05, com Nera sentada perto da entrada do canto, água e pão ao lado dela. Não há notícia confirmada para Ren sobre Colm/Dent ou Dorra Hest."
  ida_aos_patios_por_colm:
    horario_aproximado: "06:05-06:35 de 4 Eleasis"
    observacao: "Ren levantou, abraçou Nera, vestiu roupa de cidadão comum, fez asseio rápido e explicou que precisava conferir se Colm/Dent conseguiu sair com Dorra Hest, que aceitara 7 PO para levá-lo aos fornos de cal. Nera notou que sete moedas compram memória e esperou que também tenham comprado silêncio; avisará Silva para onde Ren foi. Rolagens abertas: ler sinais da carroça de Dorra nos pátios 12 contra CD 14, falha; notar atenção perigosa nos pátios 11 contra CD 13, falha; escolher informante discreto nos pátios 10 contra CD 13, falha; comprar confirmação sem chamar atenção 12 contra CD 12, sucesso. Ren chegou aos pátios depois da partida das carroças de cal. A carroça de Dorra não estava mais lá. Depois pagou 1 PO a um trabalhador dos pátios, que disse que Dorra saiu no cinza, provavelmente com Dent sob a lona, mas depois de um problema: um sujeito de roupa de trabalho limpa demais perguntou por um doente vindo do lavadouro, homem embrulhado, mão ruim e tosse. Ren não confirmou segurança plena de Colm/Dent; apenas que a saída provavelmente aconteceu e foi comprometida."
  pressao_sobre_bram_com_luath:
    horario_aproximado: "06:35-08:10 de 4 Eleasis"
    observacao: "Ren saiu dos pátios como cidadão pobre e procurou Luath no posto da City Guard/Night Watch. Relatou Bram Vask, Kethra Dunn, Colm/Dent e o risco de Bram continuar pressionando a família, oferecendo o caderno de contas sujas como prova, mas sem explicar como tirou Colm da loja. Rolagem aberta: convencer Luath a pressionar Bram com prova irregular 8 contra CD 14, falha. Luath examinou o caderno, copiou algumas marcas úteis, mas o devolveu a Ren por não aceitar a cadeia de custódia irregular como prova formal limpa. Apesar disso, a Night Watch fez pressão própria sobre Bram: rolagem aberta 24 contra CD 13, sucesso. Dois guardas foram à loja, trataram o assunto como cobrança violenta, possível cárcere/trabalho por dívida e risco a Kethra, sem prender Bram. Depois, Ren pagou uma criança com moeda baixa para entregar recado decorado. Rolagens abertas: criança decorar e entregar o recado 2 contra CD 11, falha; Ren observar entrega sem fixar rosto 20 contra CD 13, sucesso. A mensagem chegou torta, ligando a ameaça à visita da guarda, mas Bram entendeu o aviso. Bram não atacou a criança em público, fechou a loja e começou a se mover nos fundos. O caderno de Bram continua com Ren."
  pontos_mortos_kethra_e_pell:
    horario_aproximado: "08:10-08:45 de 4 Eleasis"
    observacao: "Ren montou o ponto morto de Kethra no vaso rachado junto aos barris de areia e à calha quebrada nos fundos de Narwhal Manor. Chegou sem ativar atenção direta, mas a montagem ficou imperfeita: há marcas discretas de manipulação no vaso e migalha de cera cinza visível de perto. A mensagem deixada diz que Colm/Dent foi com a cal, que Bram recebeu visita da guarda e recado para parar, e que o amigo está seguro por algum tempo. Depois Ren checou o ponto morto de Pell nos fundos da The Silver Lily. Pell deixou bilhete novo: Rusk não voltou, Brass usa mensageiro novo e evita o beco dos tonéis, alguém perguntou se Kage era o mesmo oriental da Silver Lily, e um papel fino foi para Narwhal com a palavra 'máscara' associada."
  pagamento_a_pell_e_criancas_com_maerra:
    horario_aproximado: "08:45-09:15 de 4 Eleasis"
    observacao: "Ren deixou 2 PO e novo pedido no ponto morto de Pell, pedindo dia/hora ou local onde Dain 'Brass' Mord fique sozinho. A tentativa de depositar sem chamar atenção falhou: uma funcionária da Silver Lily viu parcialmente Ren junto ao vaso, sem ler o bilhete. Ren seguiu para a Casa da Aurora Menor sem cauda competente no trajeto. Maerra permitiu perguntas curtas às crianças, sob limite dela. Ren conduziu a conversa com cuidado, mas o grupo ainda não conseguiu organizar lembranças novas de modo coerente. Peta, porém, lembrou um detalhe: o homem de manga cinza e dois anéis falava por trás da mulher de vermelho, mencionou papel indo para o peixe, disse que a máscara não era para o sol, e manteve Peta em lugar frio, embaixo de onde rodas passavam por cima."
  marco_de_nivel_5:
    horario_aproximado: "09:15 de 4 Eleasis"
    observacao: "Marco narrativo aplicado após Ren resgatar Colm/Dent, infiltrar-se na Casa Velha do Primeiro Raio, salvar sete crianças, recuperar Peta e abrir pistas concretas ligando a rota baixa, Narwhal, Brass e a máscara. Ren alcançou nível 5 como monge."
  retorno_ao_circo_sessao_003:
    horario_aproximado: "09:55 de 4 Eleasis"
    observacao: "Ren saiu da Casa da Aurora Menor e retornou ao Jack Mooney & Sons Circus para ver Nera e Tavin e conversar com Jack sobre o calendário de apresentações de Kage. O deslocamento não trouxe cauda competente percebida. No caminho, Ren ouviu rumor solto sobre uma passagem fechada perto do peixe por causa de barris mal marcados. No circo, Jack propôs não vender Kage em 4 Eleasis, considerar reprise curta em 5 Eleasis ao cair da tarde e só aceitar apresentação fechada em tenda controlada pelo circo se o camarote oeste cumprir os filtros já exigidos."
  calendario_inicial_de_kage:
    horario_aproximado: "10:03 de 4 Eleasis"
    observacao: "Ren propôs a Jack uma pequena apresentação de Kage em 5 Eleasis para ser relembrado e, depois disso, uma apresentação particular para quem pagar melhor. Jack aceitou a linha comercial: Kage raro, aparição curta, pouca fala, particulares apenas com filtros formais e sem aperto de mão direto de Ren."
  recado_de_luath_sobre_barris:
    horario_aproximado: "10:03 de 4 Eleasis"
    observacao: "Tobb Marlin trouxe à carroça-escritório recado de Luath: perto do mercado de peixe, a guarda fechou duas passagens e encontrou quatro barris mal marcados com pó cinza, cheiro acre/de ovo ruim e cera vermelha no aro. A guarda acredita que havia seis barris. Luath quer falar com o homem que tratou de Bram Vask, sem plateia e sem roupa de palco."
  encontro_com_luath_no_mercado_de_peixe:
    horario_aproximado: "10:27 de 4 Eleasis"
    observacao: "Ren saiu do circo em vestes de homem pobre e procurou Luath no perímetro isolado do mercado de peixe. A aproximação discreta falhou parcialmente: uma peixeira e um escrivãozinho de guilda viram um forasteiro pobre ser admitido pela guarda. Luath mostrou quatro barris mal rotulados, um deles rachado com pó cinza úmido, cheiro acre/de ovo ruim, cera vermelha no aro e uma grelha baixa próxima com parede molhada. Luath disse que a conta da carroça era de seis barris e que um peixeiro descreveu o homem de manga cinza e dois anéis mandando descarregar os barris por intermédio de outro sujeito."
  identificacao_do_po_explosivo:
    horario_aproximado: "10:31 de 4 Eleasis"
    observacao: "Ren examinou o pó dos barris no mercado de peixe. Rolagem de Investigação 24 contra CD 13, sucesso. Ele identificou que o pó é substância explosiva quando seca e exposta a chama, semelhante em princípio a pólvora/pó de fumaça, mas com impurezas e traços alquímicos locais. A cera vermelha bate fortemente com o fio da oficina dos tintureiros. Luath enviou guardas para cercar a oficina dos tintureiros com cautela."
  explosao_parcial_na_balanca_velha:
    horario_aproximado: "10:41 de 4 Eleasis"
    observacao: "Ren escolheu seguir o rastro da carroça dos dois barris faltantes. Luath informou que a carroça tinha eixo baixo, roda traseira esquerda ruim, tábua traseira manchada de vermelho e fora vista rumo à balança velha pelo Beco da Salmoura. Rolagem aberta para seguir a trilha no mercado: Investigação 10 contra CD 15, falha. Ren perdeu minutos no cruzamento de marcas, e uma explosão parcial atingiu a área da balança velha, feriu pessoas próximas, rachou o tablado e abriu uma passagem baixa escura sob o mercado. O efeito parece menor do que dois barris inteiros secos deveriam causar."
  luath_nomeia_sarbreen:
    horario_aproximado: "10:42 de 4 Eleasis"
    observacao: "Ren perguntou a Luath se existem túneis subterrâneos conhecidos ou uma civilização anterior sob Ravens Bluff. Luath respondeu com Sarbreen, antiga cidade anã sob a cidade atual, hoje parcialmente reaproveitada como porões, esgotos, drenagens e passagens perigosas. Luath afirmou que há entradas conhecidas por drenagens do cais e porões de armazéns, mas a entrada mais próxima é a abertura causada pela explosão. Ren viu marca angular antiga em pedra sob o tablado e ouviu som de metal contra pedra seguido por passos se afastando na água rasa."
  ren_desce_para_sarbreen:
    horario_aproximado: "10:43 de 4 Eleasis"
    observacao: "Ren decidiu descer pela abertura da balança velha enquanto Luath segura a superfície e verifica a contagem de barris. Ren ativou Passos sem Pegadas, gastando 2 ki e ficando com 3/5 ki. Rolagens abertas: descer pelo tablado quebrado sem provocar desabamento ou queda ruim 18 contra CD 13, sucesso; Furtividade sob Passos sem Pegadas na entrada de Sarbreen 21 contra CD 17, sucesso. Ren chegou à primeira câmara baixa sem ser percebido, viu restos de um barril detonado e sinais de que outro barril inteiro foi arrastado para uma galeria escura. Há ao menos dois ritmos de movimento e som de metal contra pedra adiante."
  ren_encontra_segundo_barril_em_sarbreen:
    horario_aproximado: "10:44 de 4 Eleasis"
    observacao: "Ren ativou Visão no Escuro, gastando 2 ki e ficando com 1/5 ki; Passos sem Pegadas continua ativo por concentração. Rolagens abertas: Percepção na galeria escura de Sarbreen 16 contra CD 14, sucesso; manter perseguição furtiva sob Passos sem Pegadas 18 contra CD 17, sucesso. Ren evitou um fio simples de alarme, quase escorregou numa pedra solta, mas permaneceu oculto. Viu dois vultos numa câmara baixa de serviço: um vigia leve e o homem de manga cinza com dois anéis usando barra curta de ferro numa junta/trava antiga. O segundo barril está posicionado para explodir contra a parede, com dispositivo improvisado de pano encerado, cerâmica, cordão e pó escuro, ainda não aceso."
  emboscada_na_camara_de_sarbreen:
    horario_aproximado: "10:44 de 4 Eleasis"
    observacao: "Ren aproximou-se sob Passos sem Pegadas e abriu combate de surpresa. Rolagens abertas: aproximação final sob Passos sem Pegadas 18 contra CD 15, sucesso; iniciativa Ren 15, homem de manga cinza 15, vulto leve 5; Ren age antes do homem por maior Destreza. Ren gastou 1 ki em Rajada de Golpes, ficando com 0/5 ki. Quatro golpes desarmados acertaram: 7 e 6 de dano contundente no homem de manga cinza; 8 e 9 de dano contundente no vulto leve. O vulto leve caiu junto à saída lateral, sem alarme útil. O homem de manga cinza ficou ferido, consciente e corpo a corpo com Ren, perto da barra curta, da junta antiga e do barril armado. O barril continua inteiro e ainda não foi aceso."
  prisioneiros_e_dispositivo_entregues_a_luath:
    horario_aproximado: "10:44-10:48 de 4 Eleasis"
    observacao: "Ren atacou novamente o homem de manga cinza. Rolagens abertas: golpe desarmado 22 contra CA 13, 9 de dano contundente; segundo golpe desarmado 24 contra CA 13, 6 de dano contundente. Ren apagou o homem de manga cinza de modo não letal antes que ele gritasse ou acionasse o dispositivo. Depois desarmou o acionamento do barril com ferramentas de ladrão: 27 contra CD 15, sucesso crítico natural. Ren separou cordão, cerâmica, tigela rasa, pano encerado, recipiente fechado de brasa ou luz fraca e cera vermelha, deixando o barril sem ignição imediata, mas ainda perigoso. Rolagens abertas: arrastar corpos pela galeria sob Passos sem Pegadas 24 contra CD 15, sucesso; esforço físico para mover o homem de manga cinza até a corda 4 contra CD 12, falha. Ren conseguiu levar os corpos até a primeira câmara baixa sem alarme útil, mas precisou da corda e da ajuda de Luath para içar o homem de manga cinza. O homem de manga cinza e o vulto leve foram entregues vivos à guarda, junto do dispositivo de acionamento. O barril principal permanece em Sarbreen."
  retorno_ao_circo_apos_sarbreen:
    horario_aproximado: "10:48-11:27 de 4 Eleasis"
    observacao: "Ren esperou no local por possível interrogatório inicial. Luath recusou interrogar os prisioneiros no mercado por haver curiosos, explosivo remanescente, perímetro instável e risco de rumor ruim. Luath pediu que Ren procure o posto da Night Watch depois do segundo sino, sem vir como Kage, ou aguarde recado pelo circo se a rua piorar primeiro. Rolagens abertas: controlar perímetro até Gond chegar 17 contra CD 13, sucesso; relatório útil da oficina dos tintureiros antes de Ren sair 21 contra CD 12, sucesso. A oficina dos tintureiros foi encontrada vazia, com a mulher de vermelho ausente, sinais de limpeza apressada, cesto de roupa suja com tira amarela de dois nós, abertura baixa para pedra úmida e cheiro fraco semelhante ao pó. A conta da carroça de seis barris parece fechada: quatro apreendidos, um detonado parcialmente e um inteiro em Sarbreen; Luath não considera a cidade segura apenas por isso. Rolagem aberta: sair do mercado sem levar cauda competente ao circo 27 contra CD 13, sucesso. Ren retornou ao Jack Mooney & Sons Circus por volta de 11:27, sujo de Sarbreen, Ki 0/5, sem cauda competente percebida, e encontrou Jack, Silva, Nera, Tavin e Sorn em preparação de ensaio para Kage."
  descanso_e_ensaio_kage_apos_sarbreen:
    horario_aproximado: "11:27-14:18 de 4 Eleasis"
    observacao: "Ren falou rapidamente com Silva, Nera e Tavin atrás da carroça verde, sem chamar atenção do circo todo. Silva extraiu as partes práticas: Ren voltou vivo, sem cauda competente, Luath tem dois prisioneiros vivos, há barril perigoso entregue à guarda e o mercado ainda não está resolvido. Ren fez descanso curto de uma hora no depósito de figurino velho: meia hora de sono e meia hora de meditação, recuperando ki para 5/5. Passos sem Pegadas expirou durante o repouso, perto de 11:42; Visão no Escuro continuou apenas até cerca de 18:43 de 4 Eleasis. No ensaio de Kage, Ren tentou acrescentar duas seções inéditas com dois movimentos a mais cada. Rolagens abertas: Marcar duas seções novas sem risco físico 13 contra CD 14, falha; Aprimorar falas e drama do número 5 contra CD 13, falha; Integrar Lysa, Merrit, Dessa e Sorn ao ajuste 14 contra CD 12, sucesso. Resultado: a equipe do circo transformou a ambição original em versão segura, com duas novidades pequenas que sugerem que Kage guarda mais recursos, sem exigir quatro movimentos físicos novos. Se Ren insistir em executar a versão fisicamente mais ambiciosa, precisará de novo ensaio e aceitar risco. O segundo sino da tarde passou; nenhum recado de Luath chegou ao circo até 14:18."
  ida_ao_posto_para_palavra_de_luath:
    horario_aproximado: "14:18-15:03 de 4 Eleasis"
    observacao: "Ren suspendeu o ensaio satisfeito com a versão segura de Sorn/Dessa e saiu vestido discretamente de homem pobre para procurar Luath. Rolagens abertas: Chegar ao posto sem ligar Ren Kage ao visitante pobre 7 contra CD 13, falha; Ler o que Luath evita publicizar 11 contra CD 13, falha; Luath abrir informação útil sem tornar Ren auxiliar oficial 4 contra CD 12, falha. A saída não gerou cauda competente, mas criou uma memória fraca na borda do circo: um vendedor de caldo viu Kage sumir da área da lona e depois viu um forasteiro pobre de porte parecido sair pelo lado dos remendos. No posto, um guarda mais velho reconheceu Ren como o homem do sargento, reforçando a linha pública fina de que o forasteiro pobre admitido no mercado tem entrada com a guarda. Luath recebeu Ren numa sala estreita e revelou apenas informação controlada: os dois prisioneiros estão vivos, separados e vigiados; o vulto leve acordou e tenta se apresentar como carregador contratado ignorante; o homem de manga cinza falou pouco, não tinha papéis, usava dois anéis simples de ferro e latão, parecia trabalhador mas tinha mãos de quem sabe ferramenta e pedra velha; Gond estabilizou o barril em Sarbreen, mas ele continua abaixo, sob contenção. Luath não abriu acesso aos presos e aceitou levar uma pergunta curta de Ren ao interrogatório."
  pergunta_a_luath_e_limpeza_dos_pontos_mortos:
    horario_aproximado: "15:03-16:02 de 4 Eleasis"
    observacao: "Ren entregou a Luath a linha de interrogatório sobre a explosão ter sido feita para ser ouvida e sobre descobrir para qual área da cidade os prisioneiros pretendiam mover a operação. Luath reformulou a pergunta como: 'Para onde a luz ia voltar depois que o mercado ouvisse?', aceitando usar comida como ferramenta de interrogatório, não como prêmio. Depois, Ren foi à The Silver Lily e removeu o ponto morto de Pell. Rolagens abertas: Ir da Night Watch à Silver Lily sem reforçar a memória do forasteiro 26 contra CD 14, sucesso; Ler e limpar o ponto morto da Silver Lily sem perder detalhe 17 contra CD 13, sucesso. Pell deixou bilhete dizendo que Brass não fica sozinho hoje, mas pode passar pelo fundo da Red Sail entre o sino de seis e o de sete, no movimento do barril seco da cozinha, com um homem entrando antes e outro saindo depois. Ren então foi aos fundos de Narwhal Manor. Rolagens abertas: Chegar aos fundos de Narwhal Manor sem cauda clara 19 contra CD 15, sucesso; Ler e desmontar o ponto morto de Narwhal sem deixar padrão 20 contra CD 14, sucesso. Kethra deixou bilhete dizendo que não sabe se Dent chegou, que Narwhal tremeu depois do peixe, que a mulher de manto cinza-azulado mandou o corredor treze não falar de tintureiro, cesto ou barril, e que ouviu nos fundos a frase 'se a boca abriu no mercado, olhem a ponte baixa'. Ren removeu o ponto morto de Narwhal com cuidado."
  ponte_baixa_e_janela_de_brass:
    horario_aproximado: "16:02-18:09 de 4 Eleasis"
    observacao: "Ren foi averiguar a ponte baixa do porto. Rolagens abertas: Chegar à ponte baixa sem cauda clara 21 contra CD 14, sucesso; Ler a ponte baixa antes de se aproximar demais 24 contra CD 14, sucesso; Entender se há sinal de operação na ponte baixa 5 contra CD 15, falha. Ren confirmou que a ponte baixa é uma travessia funcional entre armazéns, cais e faixa de drenagem/maré; há guardas e aprendiz de Gond inspecionando discretamente sem pânico público. Ele percebeu detalhes suspeitos, como tábua lavada, lasca com cera raspada e arranhão baixo no encaixe de pedra, mas não conseguiu transformar isso em prova, direção ou urgência. Como a guarda já olhava o local, Ren seguiu para a janela indicada por Pell nos fundos da Red Sail. Rolagens abertas: Encontrar ponto de observação nos fundos da Red Sail 24 contra CD 15, sucesso; Manter-se oculto na espera 22 contra CD 15, sucesso; Ouvir e separar fala útil 8 contra CD 15, falha; Mapear rota de fuga e risco se tentar tomar Brass 18 contra CD 14, sucesso. Ren está oculto na varanda de carga do galpão de cordame, vendo Dain 'Brass' Mord nos fundos da Red Sail, a cerca de 25 pés da descida mais rápida, com pelo menos dois homens próximos e um menino mensageiro fora da linha imediata. Ren não ouviu a conversa, mas entende que atacar é possível e capturar/fugir com Brass seria muito arriscado."
  recuo_da_red_sail_visita_a_maerra_e_retorno:
    horario_aproximado: "18:09-19:54 de 4 Eleasis"
    observacao: "Ren decidiu não atacar Brass nos fundos da Red Sail, por avaliar que capturá-lo ali colocaria aliados e a cobertura de Kage em risco alto. Rolagens abertas: Entender o esquema de ida e volta de Brass 11 contra CD 14, falha; Sair do ponto da Red Sail sem ser marcado 11 contra CD 15, falha; Chegar à Casa da Aurora Menor sem cauda útil 22 contra CD 13, sucesso; Voltar ao circo pela rota discreta 10 contra CD 14, falha. Ren entendeu que Brass usa o barril seco da cozinha, o menino sem lenço e homens posicionados como cortina operacional, mas não decifrou se a troca envolve papel, objeto, palavra, confirmação visual ou simples presença. Alguém nos fundos da Red Sail provavelmente percebeu movimento no galpão de cordame, sem identificar Ren. Ren chegou à Casa da Aurora Menor sem cauda útil e confirmou com Maerra que as sete crianças seguem vivas, alimentadas e protegidas. A Visão no Escuro expirou por volta de 18:43. Na volta ao circo, dois carregadores perto dos campos de carroças olharam tempo demais para Ren; não há perseguição colada, mas há rastro fraco comprável. Ren chegou à borda interna do circo por volta de 19:54, onde Silva o interceptou e Nera apareceu à vista."
  noite_no_circo_apos_recuo_de_brass:
    horario_aproximado: "19:54-22:24 de 4 Eleasis"
    observacao: "Ren contou a Silva e Nera que não teve coragem de tentar capturar Brass porque o risco era alto demais e ele não queria arriscar o circo, Kage ou seus aliados. Rolagens abertas: Checagem discreta da borda do circo por Silva 10 contra CD 12, falha; Treino solo de Kage sem marcação de equipe 21 contra CD 12, sucesso; Sustentar presença de palco sozinho 10 contra CD 13, falha; Separar rumor útil de fantasia sobre Sarbreen 6 contra CD 12, falha. Silva não encontrou perseguição colada, mas também não confirmou borda limpa. Ren jantou, caminhou com Nera pela rota interna permitida e trocou carícias discretas com ela. Depois treinou sozinho no picadeiro sem gastar ki; consolidou a parte física individual da versão segura de Kage, mas não melhorou a presença dramática sem equipe. Silva explicou que Sarbreen é uma cidade anã quebrada sob Ravens Bluff, cheia de porões, drenos, salas lacradas, túneis e mapas falsos; não conseguiu separar rumores úteis de fantasia. Ela apontou caminhos: Lockwood Mooney para triagem arcana discreta, Gond para pedra/travas/engenharia perigosa, Wizards' Guild para magia com custo político, ou mapas velhos do porto com alto risco de fraude."
  kata_de_kozakura_antes_do_descanso:
    horario_aproximado: "22:24-22:47 de 4 Eleasis"
    observacao: "Antes de dormir no depósito de figurino velho, Ren fez kata de memória de Kozakura. O estilo do Clã Kagehira foi nomeado em cena como Kagehira Getsuei-ryu, a Escola da Sombra da Lua. As formas lembradas foram Tsuki Kakure, Mizu no Kage e Hotaru Otoshi. Ren recordou Aiko, Tadatsune-sensei, o dojo, a comida de sua terra, a diferença entre as escolas de clã e escolas públicas de duelistas ou monges, e a possibilidade futura de procurar mestres de Kara-Tur em Ravens Bluff. Não houve gasto de recursos; se Ren se deitar agora e a noite não for interrompida, começa um descanso longo."
  descanso_longo_no_circo_5_eleasis:
    horario_aproximado: "22:47 de 4 Eleasis-06:47 de 5 Eleasis"
    observacao: "Ren descansou no depósito de figurino velho do Jack Mooney & Sons Circus sem interrupção aberta. O rastro fraco da volta ao circo não virou acesso útil para a Red Sail durante a noite, e o filtro de Silva, Jack e Tobb manteve a borda fechada. Luath não enviou resposta segura antes do amanhecer. Ren completou descanso longo: PV 38/38, Ki 5/5, dados de vida completos. O Broche do Semblante Humilde teve o uso renovado com o amanhecer de 5 Eleasis."
  preparacao_da_reprise_de_kage:
    horario_aproximado: "06:50-17:46 de 5 Eleasis"
    observacao: "Ren passou o dia no Jack Mooney & Sons Circus, tomando café com Nera e Tavin, falando um pouco de Kozakura, do Clã Kagehira e do Kagehira Getsuei-ryu, ensaiando com Sorn, Merrit e Dessa, almoçando com Nera, Silva e Tavin, impedindo Lysa de forçar o joelho e preparando a reprise curta de Kage. Rolagens abertas: Acrobacia de Ren no ensaio 12 contra CD 12, sucesso; ensaio coordenado com Sorn, Merrit e Dessa 11 contra CD 13, falha. A parte física segura se manteve, mas a coordenação geral não melhorou além da versão segura já definida. Luath enviou recado útil: a ponte baixa parece olho ou caminho, não destino final; a luz era brasa protegida e sinal; depois do mercado ouvir, ela voltaria por pedra molhada para mão ligada ao sol apagado. Antes do show, Jack interceptou proposta privada sem nome para Kage, em papel fino, mencionando que a presença da gravadora não seria necessária se Kage respondesse sozinho; Jack filtrou o contato e pretende responder depois da apresentação."
  reprise_curta_de_kage:
    horario_aproximado: "17:46-18:07 de 5 Eleasis"
    observacao: "Ren entrou como Kage concentrado e gastou 1 ki em Passo do Vento no momento de maior efeito, ficando com Ki 4/5. Rolagem aberta: Acrobacia 13 contra CD 13, sucesso. A reprise funcionou no limite técnico: o público comprou o efeito de salto e sombra, mas Sorn percebeu que Ren usou toda a margem das marcações. Jack, Silva, Tobb, Sorn e Dessa seguraram a borda do pós-show e impediram contato direto com Kage. Uma segunda tira de papel chegou filtrada por Jack, dizendo: 'Depois do aplauso, Kage vale mais. A gravadora vale menos se continuar cercada. Mandem preço e condição antes que outra casa compre o silêncio.' Jack considera que isso não prova que sabem onde Nera dorme, mas prova que a palavra gravadora foi escolhida para pressionar Ren ou o circo. Silva endureceu a segurança interna da carroça verde."
  resposta_isca_ao_canal_de_kage:
    horario_aproximado: "18:07-18:39 de 5 Eleasis"
    observacao: "Ren mandou Jack aceitar a proposta como isca e pedir caro. Jack escreveu resposta exigindo 80 PO pela primeira apresentação curta, 40 PO adiantadas, custos por fora, tenda e controle do circo, nome do pagador, casa responsável, endereço e hora por escrito, excluindo a gravadora de qualquer conversa. Silva prometeu manter os Vell seguros, mas avisou que Ren não deve voltar direto à carroça verde se trouxer cauda. Dessa removeu os elementos mais reconhecíveis de Kage. Rolagens abertas: Furtividade de Ren para seguir o canal 10 contra CD 15, falha; Percepção de Ren para identificar o elo certo 8 contra CD 14, falha. Ren viu o papel passar do ajudante de Jack para um recadeiro pago comum e depois para uma mão enluvada dentro de um cabriolé cinza-azulado sem brasão. O cabriolé sumiu no fluxo entre campos de carroças e ruas de serviço rumo ao Market/Harbor District. Ren não foi marcado de forma clara, mas não alcançou o mandante."
  busca_noturna_por_sarbreen:
    horario_aproximado: "18:39-19:18 de 5 Eleasis"
    observacao: "Ren deixou o rastro do cabriolé e procurou uma fonte discreta sobre Sarbreen no eixo Market/Harbor. Visão no Escuro não está ativa; a magia lançada em Sarbreen havia expirado por volta de 18:43 de 4 Eleasis. Rolagens abertas: Circular pelo Market/Harbor sem puxar cauda útil 8 contra CD 13, falha; Encontrar especialista útil em Sarbreen 17 contra CD 15, sucesso. Ren encontrou Brunna Torkel, anã medidora de porões e antiga auxiliar de levantamentos, na oficina Medidas Torkel. Brunna explicou que não existe mapa inteiro confiável de Sarbreen, apenas pedaços. Apontou linhas úteis: Balança Velha, linha fria sob ofícios sujos/tintureiros e porões secos atrás de armazéns antigos, mais adequados a reuniões, papéis, símbolos ou cerimônias. Durante a conversa, uma tira de papel entrou pela veneziana dos fundos: 'O do palco pergunta por baixo. Se pedir porta, entregue a Escada das Sete Águas. Paga-se dobrado.' Ren sabe que sua busca foi associada ao palco e que alguém tentou interferir na informação entregue."
  plano_duplo_com_brunna:
    horario_aproximado: "19:18-19:49 de 5 Eleasis"
    observacao: "Ren escreveu para Brunna jogar o jogo do bilhete, oferecendo em voz alta a Escada das Sete Águas e entregando em silêncio um mapa de local seco com segunda saída. Rolagens abertas: escrever instrução discreta 8 contra CD 13, falha; compra encenada da Escada 1 contra CD 12, falha; sair e vigiar Medidas Torkel sob Passos sem Pegadas 23 contra CD 15, sucesso; ouvir cobrança pela janela 9 contra CD 14, falha. Ren pagou 2 PO pelo mapa público da Escada e 2 PO pela cópia discreta dos porões secos, ficando com 17 PO. Ativou Passos sem Pegadas, gastando 2 ki e ficando com 2/5 ki; duração aproximada até 20:31 se mantiver concentração. Um sujeito baixo de capa escura comum e capuz entrou pelos fundos e pagou Brunna com uma bolsinha pequena. Ren não foi percebido, mas não viu rosto, selo, anel ou sinal identificável; ouviu apenas o fragmento '...errado.'"
  escada_das_sete_aguas:
    horario_aproximado: "19:49-20:08 de 5 Eleasis"
    observacao: "Ren seguiu o cobrador de Brunna sob Passos sem Pegadas até a Escada das Sete Águas. Rolagens abertas: seguir o cobrador 36 contra CD 17, sucesso; manter o alvo à vista 15 contra CD 15, sucesso. O cobrador não desceu; ele falou com alguém por uma veneziana de depósito sem tabuleta e Ren ouviu o fragmento 'Comprou. Errado. Teatro.' Ren explorou a escada, identificou um fio de controle preso por cera vermelha no terceiro filete de água, desceu sem acioná-lo e ativou Visão no Escuro no primeiro patamar baixo, gastando 2 ki e ficando com Ki 0/5. No patamar, viu marca recente de sol apagado raspada sob cera vermelha, porta inchada travada de dentro, galeria baixa usada, vigia em nicho lateral a cerca de 35 pés e fio de acionamento antes de uma câmara estreita."
  recuo_da_escada_e_luath:
    horario_aproximado: "20:08-20:36 de 5 Eleasis"
    observacao: "Ren recuou da Escada das Sete Águas sem cruzar a linha do vigia e foi ao posto de Luath. Rolagens abertas: sair do patamar sob Passos sem Pegadas 25 contra CD 17, sucesso; subir a Escada sem tocar o fio de controle 25 contra CD 13, sucesso; chegar ao posto de Luath sem cauda útil sob Passos sem Pegadas 30 contra CD 15, sucesso; conferir se alguém acompanhou a saída 21 contra CD 14, sucesso; cruzar mapas com Luath 9 contra CD 14, falha. Ren não percebeu cauda. Luath avaliou que a Escada parece mais olho, boca, controle ou entrada-isca do que coração da operação. Os mapas não deram rota segura de invasão; Luath pode pôr olhos discretos na superfície da Escada, no depósito sem tabuleta e em possíveis saídas baixas. Passos sem Pegadas expirou por volta de 20:31; Visão no Escuro continua ativa até cerca de 04:07 de 6 Eleasis."
  retorno_ao_circo_e_passo_sombrio:
    horario_aproximado: "20:36 de 5 Eleasis-06:41 de 6 Eleasis"
    observacao: "Ren voltou do posto de Luath ao Jack Mooney & Sons Circus pela rota longa. Rolagens abertas: voltar ao circo sem cauda útil 23 contra CD 15, sucesso; conferir a rota antes de entrar no circo 13 contra CD 14, falha. Ren não percebeu cauda útil, mas não conseguiu obter certeza absoluta de limpeza. Ao chegar, evitou ver Nera e Tavin e entregou a Silva um bilhete para Nera dizendo que a ama e que solucionará tudo. Silva entregou o bilhete; mais tarde, informou a Ren que Nera leu duas vezes e respondeu que promessa grande demais não vale menos, mas pesa mais. No depósito de figurino velho, Ren passou a noite em treino meditativo tentando lembrar como Aiko fazia o Passo da Sombra. Rolagens abertas: lembrar o princípio do Passo da Sombra de Aiko 7 contra CD 15, falha; transformar memória em forma corporal 19 contra CD 14, sucesso. Ren não copiou a técnica de Aiko; despertou uma versão própria do Passo Sombrio. Com descanso longo completo, alcançou nível 6: PV 45/45, Ki 6/6, 6 dados de vida, deslocamento 55 pés. Visão no Escuro expirou por volta de 04:07, e o Broche do Semblante Humilde voltou a estar disponível no amanhecer de 6 Eleasis."
  cafe_com_silva_e_resposta_casa_veyr:
    horario_aproximado: "06:41-07:18 de 6 Eleasis"
    observacao: "Ren se lavou, vestiu roupa comum e tomou café com Silva longe da carroça verde. Contou a ela sobre Sarbreen, Brunna Torkel, a Escada das Sete Águas e a avaliação de Luath. Silva tratou a nova técnica do Getsuei-ryu como ferramenta recuperada, pediu que Ren a teste longe dos Vell até conhecer seus limites e informou que Nera guardou o bilhete. Depois, na carroça-escritório, Jack pagou 8 PO pela reprise pública de Kage em 5 Eleasis, deixando Ren com 25 PO. Jack mostrou a resposta privada de Corven Dalm, procurador da Casa Veyr: aceita 80 PO por apresentação fechada curta de Kage, mandou 40 PO adiantadas, aceita tenda controlada pelo circo e equipe mínima dos Mooney, mas tenta retirar intermediários da conversa artística. Jack reteve as 40 PO até confirmar a legitimidade da Casa Veyr e decidir se aceita a apresentação."
  preparacao_da_tenda_e_contato_com_kethra:
    horario_aproximado: "07:18-08:37 de 6 Eleasis"
    observacao: "Ren respondeu a Jack que o show não pode parar, e Jack tratou isso como ensaio de aceite sob filtros do circo, não como sim final. Ren inspecionou a tenda menor para mapear sombras com o Passo Sombrio. Rolagem aberta: Mapear sombras da tenda menor para Passo Sombrio 6 contra CD 12, falha. Ren encontrou pontos de sombra úteis na entrada lateral, nos bancos de músicos e atrás dos panos de Dessa, mas não garantiu continuidade por todos os cantos; o centro fica quebrado por faixas de luz e movimento da lona. Sorn marcou treino básico para 13:30 com Merrit e Lysa, sem número novo. Ren ofereceu 1 PO a Harl para vigiar a montagem. Rolagem aberta: Convencer Harl a vigiar a montagem por 1 PO 8 contra CD 12, falha. Harl recusou a moeda por medo de parecer envolvido em segredo, mas prometeu avisar Sorn ou Tobb se vir risco real. Depois Ren saiu rumo a Narwhal Manor e ativou o Broche do Semblante Humilde perto da casa; aparência ativa até cerca de 09:25 e uso gasto até o próximo amanhecer. Rolagens abertas: Chegar a Narwhal sob o Broche sem puxar atenção útil 16 contra CD 15, sucesso; Ler fluxo de serviço de Narwhal para contato com Kethra 18 contra CD 14, sucesso. Ren encontrou Kethra discretamente. Ela não tem notícia de Colm/Dent e não possui nova informação concreta além de silêncio excessivo no corredor treze e rotina mais vigiada."
  retorno_ao_circo_e_treino_casa_veyr:
    horario_aproximado: "08:37-14:18 de 6 Eleasis"
    observacao: "Ren dispensou Kethra antes que a ausência dela chamasse atenção. Kethra avisou que, se Ren procurar Dorra, não deve usar o nome dela antes de saber quem está ouvindo nem procurar Dent alto demais. Rolagem aberta: Sair de Narwhal e voltar ao circo sob o Broche sem reforçar padrão 17 contra CD 14, sucesso. Ren retornou ao Jack Mooney & Sons Circus sem acionar novo alarme em Narwhal; o Broche expirou por volta de 09:25 e segue gasto até o próximo amanhecer. A checagem das carroças de Dorra ficou para outro intervalo. Às 13:30, Ren treinou Kage na tenda menor com Sorn, Merrit e Lysa. Rolagem aberta: Revisão básica de Kage 13 contra CD 12, sucesso. O treino confirmou duas marcas escuras confiáveis, se as lamparinas não forem alteradas: dobra atrás da entrada lateral e faixa baixa junto aos bancos de músicos/panos extras. Tobb verificou Casa Veyr em tempo útil: existe como presença temporária de aluguel, com camarote/salão e procurador pagador, mas sem raiz nobre local forte. Harl participou apenas da montagem baixa e não viu irregularidade útil. Jack está pronto para aceitar a apresentação fechada somente com filtros rígidos e aguarda se Ren acrescenta alguma condição."
  aceite_de_kage_e_dobra_da_casa_veyr:
    horario_aproximado: "14:18-17:26 de 6 Eleasis"
    observacao: "Ren autorizou Jack a aceitar a apresentação fechada da Casa Veyr, reconhecendo que é armadilha e prometendo que nada acontecerá aos protegidos do circo. Jack aceitou a direção, mas tratou a palavra de Ren como intenção, não como substituto dos filtros dos Mooney. Depois do banho, Ren encontrou uma linha válida de sombra e visão para entrar na carroça verde com Passo Sombrio: Percepção 23 contra CD 13, sucesso. Com Silva abrindo a porta por instantes e Tobb limpando a rota interna, Ren entrou por Passo Sombrio sem gastar ki; Furtividade 11 contra CD 12, falha. A entrada não virou rumor no circo, mas assustou Nera e apagou a lamparina dentro da carroça. Ren contou a Nera que a proposta citou a seladora/gravadora, que Kage se exporá para buscar respostas e que voltará. Nera não reconheceu Corven Dalm nem Casa Veyr, e não conseguiu determinar a origem precisa do termo. Antes da saída, a Casa Veyr respondeu com uma dobra contratual: quer pagar os 40 PO restantes só com os convidados, fazer Corven Dalm assinar ao pisar na lona e manter um homem da casa junto da entrada de artistas. Jack não conseguiu bloquear a dobra sem atrasar ou arriscar o show; Ren decidiu prosseguir e discutir o transporte com os Mooney."
  entrada_controlada_da_casa_veyr:
    horario_aproximado: "17:26-18:18 de 6 Eleasis"
    observacao: "Ren decidiu que Kage faria a apresentação fechada apesar da dobra contratual. Rolagem oculta: plano de transporte dos Mooney 15 contra CD 14, sucesso. Jack, Tobb, Sorn e Dessa controlaram a logística: Kage não saiu do circo, foi movido pela rota interna de panos/remendos e posicionado na dobra lateral marcada por Sorn. Tobb contou as 40 PO restantes antes da entrada útil dos convidados; o total de 80 PO está sob controle de Jack/Tobb, mas a parte de Ren ainda será acertada depois da apresentação. Corven Dalm assinou antes de pisar na lona útil. O homem da Casa Veyr foi colocado em luz clara perto da entrada dos artistas, com gente do circo entre ele e a aba real. Ren/Kage está atrás da dobra lateral, com a faixa baixa junto aos bancos dos músicos visível e também em penumbra suficiente para Passo Sombrio. Rolagem aberta: Intuição para ler risco provável da Casa Veyr antes da entrada de Kage 25 contra CD 15, sucesso. Ren concluiu que a ameaça mais provável é sondagem/provocação controlada, não ataque aberto, sequestro imediato ou refém dentro da tenda; o risco principal é mapearem o Passo Sombrio, as sombras úteis, a saída real de Kage ou a reação emocional de Ren a termos como gravadora, menino ou Vell."
  abertura_de_kage_diante_da_casa_veyr:
    horario_aproximado: "18:18-18:20 de 6 Eleasis"
    observacao: "Ren decidiu revelar o Passo Sombrio como primeiro gesto de Kage, aceitando o risco de ser associado a uma técnica rara de sombra. Como Ren estava na Sombra B, usou o Passo Sombrio da dobra lateral para a Sombra A junto aos bancos dos músicos; o uso não gastou ki. Rolagens abertas: Acrobacia 20 contra CD 15, sucesso; Atuação 13 contra CD 13, sucesso. A entrada física foi forte e a presença cênica transformou Kage em ameaça controlada. Rolagem oculta: homem da Casa Veyr mapear limites do Passo Sombrio 14 contra CD 16, falha; ele viu que a sombra é caminho, mas não entendeu os limites completos. Rolagem oculta: Dalm provocar Kage sem romper o contrato 16 contra CD 15, sucesso. Dalm disse: 'Raro. A Casa Veyr foi bem aconselhada. Nem todo nome curto nasce pequeno.' Ren está perto da Sombra A, diante da frase."
  dalm_testa_nome_e_reacao_de_kage:
    horario_aproximado: "18:20-18:21 de 6 Eleasis"
    observacao: "Ren decidiu continuar o show profissionalmente para ver até onde Dalm iria. Rolagens abertas: Atuação para não entregar reação 20 contra CD 14, sucesso; Acrobacia para manter o número físico enquanto observa a Casa Veyr 13 contra CD 14, falha. Ren não olhou para Jack, Silva, a carroça verde ou direção sensível, mas observar Dalm e a tenda tirou margem física do número; Lysa cobriu o meio palmo fora da linha ideal, e o show não quebrou. Rolagem oculta: Dalm escalar provocação sem dar motivo limpo para Jack encerrar 15 contra CD 16, falha. Dalm disse: 'Algumas casas preservam brasões. Outras preservam apenas o pedaço do nome que sobreviveu ao fogo.' Jack interveio: 'Contrato compra espetáculo. Não compra genealogia.' O homem da Casa Veyr perdeu uma respiração de observação ao olhar para Jack."
  final_de_kage_e_convite_ao_camarim:
    horario_aproximado: "18:21-18:30 de 6 Eleasis"
    observacao: "Ren fez sinal para Jack continuar, e Kage finalizou a apresentação sem fiasco. Rolagens abertas: Acrobacia para finalizar sem perder moral 16 contra CD 14, sucesso; Atuação para transformar o convite ao camarim em teatro e isca 8 contra CD 15, falha. O final físico gerou aplauso real, mas cauteloso. Ren chamou Dalm ao camarim com referência direta a Masao e às dez lâminas; a frase soou perigosa e pessoal demais para virar fofoca limpa de espetáculo. Dalm não entregou reação visível à referência, mas aceitou o convite. Jack não conseguiu preservar os filtros de modo limpo depois do convite público e permitiu a conversa com salvaguardas improvisadas: Tobb ficou junto da aba do guarda-roupa menor/camarim de Kage, e o homem da Casa Veyr foi impedido de acompanhar. Ren está no camarim funcional com Dalm; os convidados estão sendo retirados pelos Mooney em clima tenso."
  pressao_de_ren_sobre_dalm_no_camarim:
    horario_aproximado: "18:30-18:31 de 6 Eleasis"
    observacao: "No camarim funcional, Ren abandonou o sotaque de Kage, endureceu a voz e exigiu saber para quem Dalm veio avaliá-lo. Rolagens abertas: Intimidação com vantagem para arrancar resposta útil 9 contra CD 16, falha; Intuição para ler a resposta controlada de Dalm 13 contra CD 15, falha. Rolagem oculta: Dalm controlar resposta sem entregar patrono real 18 contra CD 14, sucesso. Ren não arrancou o nome por trás da Casa Veyr. Dalm percebeu que a voz de Kage é máscara e respondeu apenas com a camada contratual: Casa Veyr, assinatura e dinheiro. Também disse que veio medir se a sombra era truque, se a gravadora era corrente e se Masao era lâmina na mão de Ren ou anzol em sua garganta. Ren não conseguiu determinar se Dalm fala por Masao, contra Masao ou por alguém local usando o nome como ferramenta."
  dalm_entrega_janela_da_ponte_baixa:
    horario_aproximado: "18:31-18:32 de 6 Eleasis"
    observacao: "Ren ajustou a pressão: disse que prefere o 'quem', mas que quando, como, onde, porquê e o que podem manter a conversa interessante e adiar a decisão de ver Dalm como inimigo. Rolagens abertas: Persuasão sob pressão 18 contra CD 14, sucesso; Intuição para separar pista útil de veneno 15 contra CD 14, sucesso. Rolagem oculta: Dalm entregar pista sem comprometer patrono real 24 contra CD 15, sucesso. Dalm não revelou quem pagou ou usa a Casa Veyr como filtro. Entregou uma janela: antes da segunda maré; um lugar: Ponte Baixa como passagem/porta/garganta de pedra, não como ponte vista de cima; uma orientação: seco onde deveria haver água, atrás dos armazéns velhos; um método: papel antes de lâmina, com retenção anulada, troca de nome, livro guardado errado e testemunha tratada como ruído; e um escopo: a rede sabe que existe uma gravadora e um menino como alavanca, e que Kage reage a essa corda, mas ainda não sabe onde Nera e Tavin dormem. Ren percebeu que a parte central soa verdadeira o bastante para guiar decisão, mas Dalm está empurrando uma rota perigosa."
  saida_falsa_de_kage_e_aviso_a_jack:
    horario_aproximado: "18:32-18:58 de 6 Eleasis"
    observacao: "Ren deixou Dalm sair, chamou Jack, pediu desculpas pela quebra pública de filtro e relatou a pista inteira para que Jack repasse a Silva. Depois pediu ajuda de Jack, Dessa e Tobb para montar uma saída falsa: Tobb vestido como Kage retornaria ao controle dos Mooney enquanto Ren sairia em roupas de carreiro/Tobb. Rolagens abertas: Disfarce e troca rápida com ajuda de Dessa 17 contra CD 14, sucesso; rota falsa dos Mooney para fazer Kage voltar ao controle do circo 23 contra CD 14, sucesso; Furtividade de Ren para deslizar do caminho falso 10 contra CD 15, falha; Percepção de Ren para notar suspeita útil 18 contra CD 16, sucesso; Furtividade de Ren para corrigir a rota até Luath 19 contra CD 14, sucesso. Rolagens ocultas: observador da Casa Veyr perceber que Tobb não é Kage 20 contra CD 16, sucesso; transformar a suspeita em cauda útil 7 contra CD 17, falha. Resultado: a maioria compra que Kage voltou ao controle dos Mooney; a Casa Veyr fica com suspeita de truque, mas não com cauda útil."
  aviso_a_luath_e_conselho_de_maerra:
    horario_aproximado: "18:58-20:14 de 6 Eleasis"
    observacao: "Ren chegou ao posto da Night Watch sem cauda útil e encontrou Luath disponível. Contou a pista de Dalm, incluindo Masao, a Ponte Baixa, a segunda maré, os porões secos, papéis antes de lâminas, gravadora e menino. Rolagem aberta: Persuasão para convencer Luath a não mandar homens para dentro antes da madrugada 20 contra CD 12, sucesso. Luath aceitou não queimar a entrada com uma batida formal, mas registrou a informação e disse que, se Ren não voltar até o fim da manhã, procurará crime, prova e responsável. Depois Ren foi à Casa da Aurora Menor, relatou tudo a Maerra e pediu conselho. Rolagem oculta: Maerra dar conselho útil 14 contra CD 13, sucesso. Maerra aconselhou Ren a desconfiar do seco onde deveria haver água, procurando cal, sal, carvão, pano encerado, ar quente, ralo tampado e qualquer coisa capaz de manter papel vivo debaixo da cidade; também insistiu que ele deixe caminho de volta ou marca para Luath."
  chegada_a_ponte_baixa:
    horario_aproximado: "20:14-20:52 de 6 Eleasis"
    observacao: "Ren seguiu aos armazéns velhos em roupas de carreiro/Tobb. Rolagens abertas: Furtividade para chegar sem cauda útil 19 contra CD 15, sucesso; Investigação para encaixar o mapa de Brunna à pista da Ponte Baixa 23 contra CD 14, sucesso; Percepção para achar ponto discreto e sombras úteis 17 contra CD 15, sucesso. Ren identificou a provável Ponte Baixa como uma passagem seca sob parede baixa entre dois armazéns antigos, onde deveria haver umidade ou drenagem. Há pó claro entre pedras, possivelmente cal ou sal moído, e pano encerado velho impedindo entrada de umidade. Ren está no segundo andar quebrado de uma oficina de tonéis abandonada, observando a passagem. Sombras úteis mapeadas: Sombra A sob o beiral quebrado da oficina; Sombra B atrás dos barris vazios; Sombra C dentro da fresta seca da Ponte Baixa, quase no limite de visão útil; Sombra D sob uma carroça quebrada junto ao armazém sul."
  vigilia_e_entrada_na_ponte_baixa:
    horario_aproximado: "20:52 de 6 Eleasis-01:32 de 7 Eleasis"
    observacao: "Ren vigiou a provável Ponte Baixa até faltar cerca de meia hora para a segunda maré. Rolagens abertas: Percepção na vigília 7 contra CD 15, falha; Constituição para resistir ao cansaço e à rigidez 20 contra CD 13, sucesso; Furtividade ao deixar o ponto de observação e cruzar até a entrada 17 contra CD 15, sucesso; Investigação na boca seca antes de passar o corpo 6 contra CD 15, falha. Ren não viu movimento útil, não sofreu penalidade imediata por cansaço, cruzou até a fresta sem chamar atenção comum e entrou cerca de doze pés na boca seca da Ponte Baixa. Ele não identificou mecanismo ou fio claro antes de passar. Ren ainda não ativou Passos sem Pegadas nem Visão no Escuro e não deixou marca explícita para Luath."
  infiltracao_inicial_na_ponte_baixa:
    horario_aproximado: "01:32-01:36 de 7 Eleasis"
    observacao: "Ren ativou Visão no Escuro e Passos sem Pegadas dentro da boca seca da Ponte Baixa, gastando 4 ki e ficando com Ki 2/6. Passos sem Pegadas exige concentração e pode durar até cerca de 02:32; Visão no Escuro pode durar até cerca de 09:32. Rolagens abertas: Furtividade sob Passos sem Pegadas 25 contra CD 17, sucesso; Percepção para ler a primeira galeria 8 contra CD 15, falha; Investigação para interpretar marcas e possíveis controles 10 contra CD 14, falha; Acrobacia para avançar pela passagem baixa sem ruído útil 23 contra CD 13, sucesso. Ren chegou a uma câmara baixa seca, cerca de quarenta a cinquenta pés além da entrada. Vê um canal frio e úmido à esquerda, corredor seco mais usado à direita e fenda de ar com pano encerado acima/adiante. Ouviu som baixo de madeira contra pedra vindo da direita, sem determinar distância."
  corredor_seco_da_direita:
    horario_aproximado: "01:36-01:39 de 7 Eleasis"
    observacao: "Ren escolheu o corredor seco da direita. Rolagens abertas: Furtividade sob Passos sem Pegadas 27 contra CD 18, sucesso; Percepção no corredor 12 contra CD 15, falha; Investigação para entender a função das marcas e do corredor 16 contra CD 15, sucesso; Acrobacia para atravessar o estreitamento final 14 contra CD 14, sucesso. Ren não foi localizado neste trecho. Entendeu que o corredor seco funciona como rota de passa-carga baixo, pasta rígida, gaveta estreita ou caixa rasa, não como passagem principal de patrulha. Chegou diante de um painel baixo quase fechado; a cunha inferior ficou torta e deixou fresta irregular. Pela fresta, vê parte de uma sala baixa seca com prateleiras, mesa estreita, bandejas rasas com areia ou cinza clara, rolos de pano encerado, pequenos cilindros, feixes de papel elevados e brilho fraco parcialmente oculto no fundo."
  marca_e_abertura_do_painel:
    horario_aproximado: "01:39-01:42 de 7 Eleasis"
    observacao: "Ren voltou ao começo do corredor seco e marcou na parede, pequeno e legível, 'K ->', apontando para o painel baixo. Depois retornou ao painel e tentou abri-lo furtivamente. Rolagens abertas: Furtividade ao voltar, marcar e retornar sob Passos sem Pegadas 24 contra CD 15, sucesso; Investigação rápida da cunha/trilho/possíveis controles 13 contra CD 14, falha; ferramentas de ladrão para abrir o painel sem ruído útil 25 contra CD 15, sucesso; Percepção depois da abertura 12 contra CD 15, falha. Ren não identificou com segurança se havia aviso fino no painel, mas abriu sem ruído útil. Está diante do painel aberto, ainda fora da sala baixa seca. A sala mostra rolos de pano encerado e cilindros com cera à esquerda, mesa estreita com bandejas e peso de pedra ao centro, feixes de papel elevados à direita e passagem baixa coberta perto de brilho fraco no fundo. Ren não vê ninguém, mas não confirmou a sala inteira."
  busca_no_arquivo_da_ponte_baixa:
    horario_aproximado: "01:42-01:48 de 7 Eleasis"
    observacao: "Ren entrou na sala baixa seca e examinou documentos, rolos, cilindros, ceras, mesa e feixes elevados. Rolagens abertas: Furtividade ao entrar e vasculhar sob Passos sem Pegadas 23 contra CD 18, sucesso; Investigação com apoio das ferramentas de caligrafia 27 contra CD 16, sucesso crítico natural; Prestidigitação para retirar documentos úteis sem desarrumar o arquivo 13 contra CD 14, falha; Percepção ao observar a sala e o brilho fraco 11 contra CD 15, falha. Ren entende que a sala é arquivo de passagem/preparação de documentos, não arquivo morto: serve para secar, envelhecer, alterar, marcar e preparar papéis para circulação. Datas atuais aparecem: 4 Eleasis, 6 Eleasis e preparação para 7 Eleasis com anotação de maré. V. Rook aparece em registros de correção/anulação, M. Harrow como nome de saída/culpa pronta e D. Mord como marca menor de passagem/recebimento. Ren leva três evidências: tira de controle com retenção anulada/volume 13/V. Rook/M. Harrow/data recente; tira encerada com Kage/gravadora/menino/antes de maré; cilindro curto de matriz/cera com marca de sol apagado. A retirada não ficou limpa e pode ser notada depois. O brilho no fundo parece brasa ou lamparina mínima protegida, junto de passagem baixa coberta por pano escuro ou couro encerado."
  passagem_alem_do_pano_escuro:
    horario_aproximado: "01:48-01:50 de 7 Eleasis"
    observacao: "Ren se aproximou do pano escuro/couro encerado junto da brasa protegida e tentou ver sombra do outro lado para entrar furtivamente. Rolagens abertas: Furtividade sob Passos sem Pegadas 36 contra CD 18, sucesso; Investigação para ler pano/luz/sinais 20 contra CD 14, sucesso; Percepção para enxergar espaço desocupado em sombra além do pano 14 contra CD 15, falha; Acrobacia para atravessar sem tocar pano, luz ou pó solto 13 contra CD 14, falha. Ren percebeu que o pano tem borda pesada, retorno fixo e linha de cinza junto da brasa como controle. Não conseguiu confirmar alvo desocupado para usar Passo Sombrio antes de atravessar, então entrou fisicamente. Roçou a borda pesada e deslocou parte mínima da linha de cinza, sem acionar sinal útil imediato. Agora está numa garganta baixa de serviço além do pano, com marcas paralelas no chão úmido, sombra curta antes de uma dobra para a direita e som seco recente de madeira ou pedra encaixando mais adiante. A segunda maré começou a alterar a rota úmida atrás, aumentando a pressão de tempo."
  trava_do_trilho_e_resposta_adiante:
    horario_aproximado: "01:50-01:52 de 7 Eleasis"
    observacao: "Ren procurou a origem do encaixe seco adiante. Rolagens abertas: Furtividade sob Passos sem Pegadas até a origem do som 37 contra CD 18, sucesso; Percepção para localizar exatamente o encaixe 14 contra CD 15, falha; Investigação para entender o que encaixou e como desencaixar 24 contra CD 15, sucesso crítico natural; ferramentas de ladrão para desencaixar a trava sem ruído útil 25 contra CD 16, sucesso; Acrobacia para passar pela dobra direita sem bater no mecanismo ou trilho 8 contra CD 14, falha crítica natural. Ren entendeu que a peça era uma lingueta/trava de trilho, não comporta principal de água: bloqueia ou sinaliza a rota de passa-carga. Ele a desencaixou sem disparar sinal secundário, mas ao passar pela dobra molhada tocou madeira contra pedra. O toque provavelmente foi percebido adiante; uma segunda portinhola baixa correu quase até fechar cerca de vinte pés à frente, deixando fresta inferior escura. A pressão da segunda maré aumentou na rota úmida atrás."
  recuo_da_ponte_baixa:
    horario_aproximado: "01:52-01:55 de 7 Eleasis"
    observacao: "Ren decidiu recuar, usando todas as sombras possíveis com Passo Sombrio. Rolagens abertas: Percepção para identificar cadeia segura de sombras 26 contra CD 14, sucesso crítico natural; Furtividade ao recuar sob Passos sem Pegadas usando Passo Sombrio quando possível 36 contra CD 18, sucesso; Acrobacia nos trechos baixos que ainda exigem passagem física 15 contra CD 14, sucesso; Investigação para não travar o próprio recuo em controles já vistos 8 contra CD 13, falha; Intuição para escolher entre recompor sinais ou ganhar distância 19 contra CD 14, sucesso. Ren saiu pela fresta seca e se ocultou atrás da pilha de barris vazios sem perceber cauda útil ou olho externo. Não recompôs os sinais deixados: ausências no arquivo, linha de cinza tocada, lingueta do trilho solta e marca 'K ->' continuam. Durante o recuo, a segunda maré alcançou a câmara de retenção, mas não bloqueou o corredor seco usado por Ren."
  entrega_das_evidencias_a_luath:
    horario_aproximado: "01:55-02:18 de 7 Eleasis"
    observacao: "Ren saiu dos armazéns velhos rumo ao posto da Night Watch para entregar a Luath as evidências da Ponte Baixa e relatar o que viu. Rolagens abertas: Furtividade sob Passos sem Pegadas para sair dos armazéns 32 contra CD 16, sucesso; Percepção para notar cauda ou reação nas primeiras ruas 20 contra CD 15, sucesso; Investigação para escolher rota até o posto sem cruzar fluxos previsíveis 8 contra CD 13, falha; Acrobacia para usar sombras, becos e passagens altas sem perder tempo 11 contra CD 13, falha; Persuasão para obter acesso reservado a Luath de madrugada 13 contra CD 12, sucesso. Ren chegou sem cauda útil percebida, mas com atraso. Luath não estava imediatamente disponível e precisou ser chamado. Em sala lateral reservada, Ren relatou a entrada seca, a câmara de retenção, o arquivo vivo, V. Rook, M. Harrow, D. Mord, retenção anulada, volume 13, a tira Kage/gravadora/menino/antes de maré, a matriz com sol apagado, a brasa protegida, o pano com linha de cinza, o trilho, a lingueta, a segunda portinhola e a água entrando. Luath reconheceu utilidade, mas não conseguiu transformar o material em prova limpa ou batida imediata. As três evidências estão sobre a mesa; Luath pode selá-las sob custódia provisória da Night Watch, mas pediu que Ren escolha como a origem será registrada: Ren Kage, homem sem nome ou Ren Kagehira."
  lacre_reservado_da_ponte_baixa:
    horario_aproximado: "02:18-02:24 de 7 Eleasis"
    observacao: "Ren pediu que Luath registrasse as evidências como vindas de testemunha/fonte em risco, sem usar Ren Kage, homem sem nome ou Ren Kagehira. Luath aceitou a formulação como defensável: material recebido de fonte reservada sob risco plausível de represália, identidade retida pelo sargento recebedor até requisição selada de autoridade competente. As três peças foram lacradas com cera da Night Watch e guardadas em gaveta de ferro sob chave de Luath. O registro externo não menciona Kage, Kagehira, gravadora ou menino. Como todo registro reservado dentro da guarda, o pacote ainda pode sofrer pressão institucional futura."
  retorno_ao_circo_apos_ponte_baixa:
    horario_aproximado: "02:24-03:06 de 7 Eleasis"
    observacao: "Antes de se despedir, Ren comparou Luath aos Miburo/Shinsengumi de Kozakura: homens do bakufu odiados por criminosos, não santos, mas honrados e ainda de pé quando a cidade finge não ver a sujeira. Luath recebeu o respeito de modo seco, sem calor explícito, mas sem rejeitar. Ren saiu pela lateral do posto e voltou ao Jack Mooney & Sons Circus pela rota longa, usando Passo Sombrio e sombras. Decisão registrada em regras/decisoes.md: Passo Sombrio não dá bônus fixo de Furtividade, mas altera a rota disponível e pode conceder vantagem, reduzir CD ou impedir que falha vire cauda direta quando houver cadeia real de sombras. Rolagens abertas: Furtividade para voltar ao circo pela rota longa usando Passo Sombrio e sombras 11 contra CD 13, falha; Percepção para conferir cauda 25 contra CD 14, sucesso; Furtividade para entrar no circo pela rota interna sem acordar a rotina 23 contra CD 12, sucesso. A falha custou tempo e rota ruim, não cauda. Passos sem Pegadas expirou por volta de 02:32. Ren chegou ao circo sem perceber cauda útil e encontrou Silva acordada na rota interna de remendos."
  relato_a_silva_apos_ponte_baixa:
    horario_aproximado: "03:06-03:13 de 7 Eleasis"
    observacao: "Ren confirmou a Silva que voltou limpo e contou o essencial sobre a Ponte Baixa, a sala de arquivo vivo, os documentos retirados, a matriz com sol apagado e o lacre reservado feito por Luath. Silva avaliou que as provas estarem fora das roupas de Ren e sob chave de Luath é melhor do que Ren carregar tudo sozinho. Ela não acordou Jack ainda para não criar onda no acampamento. Nera dorme mal na carroça verde; Tavin dorme profundamente. Silva ofereceu três caminhos imediatos: falar baixo com Nera sem acordar Tavin, acordar Jack para uma reunião cansada ou comer e tentar uma hora de meditação antes do primeiro cinza."
  segunda_mare:
    horario_aproximado: "02:00"
    janela_segura_para_chegar_antes: "até cerca de 01:30"
    observacao: "No jargão portuário desta noite, 'antes da segunda maré' indica antes da segunda virada perceptível da maré após o anoitecer. Não é relógio exato, mas Ren entende que ainda há algumas horas, não a noite inteira."
