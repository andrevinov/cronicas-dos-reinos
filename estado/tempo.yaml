ano_dr: 1372
nome_do_ano: "Ano da Magia Selvagem"
data_atual:
  status: "pendente"
  valor: null
periodo_do_dia: "início da tarde seguinte ao Benefício da Lona Aberta"
hora_aproximada: "13:10 do dia seguinte ao Benefício"
local_referencia: "Ravens Bluff"
observacao: "A data exata segue pendente; durante a Sessão 001, cerca de uma hora a uma hora e meia se passou entre a abordagem de Mara, o reconhecimento da Red Sail Tavern e o retorno de Ren ao balcão da The Silver Lily. Ren meditou por 30 minutos, voltou aos arredores da Red Sail Tavern, observou o local do alto do galpão de cordame, seguiu Pell até uma passagem escura perto de Fishtown, retornou à Red Sail, roubou a prancheta de Velis durante um incêndio criado como distração, despistou um perseguidor, abandonou a Silver Lily, examinou a prancheta num abrigo abandonado, descansou por uma hora e chegou à Casa da Rede Morta. Às 01:18 viu o esquife chegar; por volta de 01:19 iniciou confronto ao conjurar Escuridão sobre o barco; por volta de 01:21 escapou do cais por um canal lateral com a caixa e a pessoa amarrada, em esquife danificado; por volta de 01:25 encostou o barco e se escondeu provisoriamente com a caixa e a jovem resgatada; por volta de 01:27 abriu a caixa e descobriu materiais de falsificação ligados à falsa marca da lua velada; por volta de 01:37 abandonou a caixa, levou Nera, o carimbo e o bilhete para a oficina de velas abandonada; por volta de 01:45 improvisou abrigo básico dentro da oficina; por volta de 01:55 começou conversa baixa com Nera e descanso leve; por volta de 02:05 Nera revelou Dain 'Brass' Mord, a ligação provável com Narwhal Manor e a existência de seu livro de provas; por volta de 02:15 Ren revelou sua história e Nera revelou o risco ao irmão Tavin; às 02:55 Ren completou o descanso curto e recuperou ki; por volta de 03:02 chegou com Nera à beira da Rua da Corda usando Passos sem Pegadas; por volta de 03:04 neutralizou silenciosamente um vigia ligado a Brass perto da casa de redes azuis; por volta de 03:07 entrou na casa e confirmou Tavin vivo; por volta de 03:13 saiu com Nera e Tavin e recuperou o livro de provas na banca de Nera antes da chegada de buscadores da Red Sail; por volta de 03:27 chegou à borda do Temple District e ouviu de Nera a recomendação da Casa da Aurora Menor e da Irmã Maerra Thandrel; por volta de 03:29 chegou diante da Casa da Aurora Menor; por volta de 03:31 entrou e encontrou Maerra; por volta de 03:32 tentou deixar Nera e Tavin no abrigo, mas Maerra exigiu informação mínima antes de deixá-lo sair; por volta de 03:33 Ren pediu conversa reservada, e Maerra o levou à saleta de ervas atrás do altar; por volta de 03:35 contou a Maerra sobre a Red Sail, Masao, Aiko e sua vingança, quase colapsando de cansaço; por volta de 03:35 a 04:05 Ren apagou por meia hora, sem recuperar ki; por volta de 04:08 Maerra sugeriu Silva Elkwood/circo dos Mooney como abrigo discreto para Nera e Tavin, além de Tyr e Ways Unknown como alternativas; entre 04:08 e 05:08 Ren completou descanso curto enquanto Maerra copiava trechos essenciais e preparava bilhete para Silva; ao fim, um homem chegou à porta perguntando por uma gravadora de lacres ferida; por volta de 05:12 Ren, Nera e Tavin saíram pela porta lateral sem serem percebidos e seguiram rumo ao circo dos Mooney; por volta de 05:28 chegaram à borda do acampamento do Jack Mooney & Sons Circus; por volta de 05:32 entraram pela lateral da cozinha e receberam indicação da carroça verde de Silva Elkwood; por volta de 05:34 entraram na carroça verde com senha e selo, sem alarme; por volta de 05:36 Silva aceitou esconder Nera, Tavin e o livro, oferecendo abrigo provisório de poucas horas também para Ren; por volta de 05:40 Silva escondeu o livro numa caixa de semente e levou Ren ao compartimento de pano atrás da carroça de remendos; Ren dormiu até cerca de 08:05, acordando com o sinal combinado de Silva; por volta de 08:06, Ren usou Ilusão menor e Passos sem Pegadas para sair da carroça de remendos sem ser visto."
marcos_de_tempo:
  captura_red_sail:
    horario_aproximado: "09:04"
    observacao: "Ren capturou um agente operacional da Red Sail num beco após montar isca com falso oriental caído; Passos sem Pegadas expira por volta de 09:06."
  interrogatorio_red_sail:
    horario_aproximado: "09:09"
    observacao: "Ren interrogou o capturado e obteve procedimento para chamar Brass, confirmação da isca da falsa lua velada e informação limitada sobre o estrangeiro com cicatriz."
  agente_duplo_red_sail:
    horario_aproximado: "09:13"
    observacao: "Ren coagiu o capturado a enviar às 19:00 uma mensagem falsa para Brass sobre Ren e a seladora estarem feridos na oficina de velas abandonada; obteve o nome Rusk 'Cinza' como coletor da ficha."
  feira_apos_beco:
    horario_aproximado: "09:43"
    observacao: "Ren saiu do beco sem ser identificado, recuperou suas roupas escuras, comeu fruta e pão simples, bebeu água e decidiu que Jack Mooney é a melhor solução imediata para Nera e Tavin."
  retorno_ao_circo_para_jack:
    horario_aproximado: "10:03"
    observacao: "Ren voltou ao Jack Mooney & Sons Circus vestido como marinheiro/estivador e provocou Jack com a informação de que alguém entrou e saiu do circo sem que ele percebesse. A mensagem chegou, Jack aceitou conversa privada e Silva reconheceu Ren apesar do disfarce."
  proposta_condicional_de_jack:
    horario_aproximado: "10:09"
    observacao: "Ren contou a Jack sobre Masao, Aiko, a Red Sail, Nera e Tavin, oferecendo serviços em troca de abrigo. Jack suspendeu o prazo imediato do meio-dia para os Vell e ofereceu comida, abrigo e cobertura condicional se Ren aceitar investigar a sabotagem da amarra da corda alta antes do crepúsculo."
  aceite_e_inicio_da_investigacao_do_circo:
    horario_aproximado: "10:17"
    observacao: "Ren aceitou o acordo condicional de Jack, recebeu a cobertura de Ren Kage como acrobata oriental contratado e iniciou inspeção da área da corda alta do lado leste. Identificou altura aproximada, acessos plausíveis, serragem varrida, mancha de breu/graxa e fio vermelho preso numa farpa."
  sorn_chamado_para_perguntas:
    horario_aproximado: "10:18"
    observacao: "Ren tentou ler a reação de Sorn Kel à tira de couro. Sorn reagiu visivelmente, mas Ren não conseguiu separar culpa de medo profissional ou outro medo. Silva chamou Sorn de modo seco demais, e Mira Dane mais dois ajudantes notaram a tensão."
  perguntas_iniciais_a_sorn:
    horario_aproximado: "10:22"
    observacao: "Sorn disse que a conferência do lado leste ficou com Harl Venn ontem depois da nona badalada; Sorn encontrou a amarra cortada antes das sete e avisou Jack. Também apontou Lysa Renn como acrobata ligada a Mira e a fitas vermelhas, e explicou o uso de breu pelo cordame."
  omissao_de_sorn_sobre_harl_e_lysa:
    horario_aproximado: "10:24"
    observacao: "Após pressão de Ren, Sorn revelou que viu Harl Venn na carroça de cordame com Lysa Renn depois da nona badalada. Lysa pediu breu para treinar pegada, Harl estava com a cópia da chave, e Sorn não conferiu pessoalmente a devolução."
  abordagem_inicial_a_harl:
    horario_aproximado: "10:27"
    observacao: "Ren abordou Harl Venn atrás da carroça de cordame e perguntou tecnicamente se a corda estava ok quando ele conferiu. Harl respondeu com firmeza que sim. Ren percebeu que a resposta técnica parece sólida, mas Harl está escolhendo não falar além do perguntado."
  pressao_sobre_harl_e_lysa:
    horario_aproximado: "10:29"
    observacao: "Ren perguntou se Lysa pegou algo além de breu. Harl afirmou que não, mas admitiu que virou para pegar pano por um instante e não viu as mãos dela o tempo todo. Também viu Lysa fechar o punho esquerdo depois."
  abordagem_a_lysa:
    horario_aproximado: "10:33"
    observacao: "Ren observou que Harl acompanhou de longe sua ida até Lysa, sem segui-lo. Ren conseguiu isolar Lysa atrás de uma cortina de lona. Lysa usa apenas uma fita vermelha no pulso direito e tocou rapidamente o pulso esquerdo vazio quando percebeu que a conversa era sobre a noite anterior."
  blefe_de_ren_com_lysa:
    horario_aproximado: "10:35"
    observacao: "Ren blefou dizendo que Harl contou tudo. Lysa não comprou totalmente, mas reagiu forte ao comentário. Ren percebeu que ela esconde algo ligado à noite anterior, ao pulso esquerdo e possivelmente à fita perdida, mas a negação dela sobre cortar a amarra para derrubar Mira parece mais sincera."
  lysa_confessa_subida_a_plataforma:
    horario_aproximado: "10:37"
    observacao: "Confrontada sobre o fio vermelho, Lysa confessou que subiu à plataforma leste depois da nona badalada para testar o joelho usando breu. A fita vermelha do pulso esquerdo rasgou numa farpa, e ela ainda guarda o restante manchado de breu."
  lysa_explica_medo_de_mira_e_jack:
    horario_aproximado: "10:39"
    observacao: "Lysa disse que Mira, se descobrisse o treino escondido, faria a coisa certa: tiraria Lysa da plataforma, contaria a Jack e impediria que ela subisse machucada. Ren acreditou que Lysa escondia a própria presença por medo de perder o alto, não por querer derrubar Mira."
  passagem_estreita_e_merrit:
    horario_aproximado: "10:45"
    observacao: "Ren liberou Lysa e investigou a passagem estreita entre contrapesos e mastro lateral. Silva apontou Merrit Tealeaf, halfling contorcionista e antiga parceira de número baixo de Lysa, como alguém capaz de passar ali. Ren encontrou caixa movida, meia pegada pequena, pó claro de mão seca e conta verde com fio amarelo associada por Silva a Merrit."
  abrigo_dos_vell_no_circo:
    horario_limite: "meio-dia suspenso por ora; nova avaliacao apos resposta de Ren e progresso na tarefa de Jack"
    observacao: "Após ouvir Ren, Jack aceitou não expulsar Nera e Tavin ao meio-dia. A proteção segue condicional à conduta de Ren e à utilidade prática dele para o circo."
  julgamento_merrit:
    horario_aproximado: "11:20"
    observacao: "Ren assistiu ao julgamento interno de Merrit Tealeaf. Jack conduziu a cena sem pânico, Merrit assumiu a culpa, Mira conteve a raiva, Lysa saiu abalada e Merrit foi suspensa de apresentações sob controle de Silva/Sorn. Jack manteve aberto o fio de influência externa."
  repouso_ren_no_circo:
    horario_aproximado: "11:55-15:35"
    observacao: "Ren comeu, meditou e dormiu no depósito de figurino velho, atrás da arca dos estandartes. O repouso contou como descanso curto seguro e recuperou o ki para 3/3, mas não foi descanso longo. Durante a tarde, dois homens do porto farejaram o perímetro do circo perguntando por uma moça ferida e um rapaz novo; Jack desviou a conversa antes de confirmação."
  abordagem_tarde_a_harl:
    horario_aproximado: "16:07-16:10"
    observacao: "Ren tentou abordar Harl com camaradagem e papo sobre comida para tirá-lo da defensiva. Harl informou que a melhor comida fica na cozinha sob a lona amarela, antes dos músicos, mas não aceitou acompanhar Ren de graça e perguntou se Jack mandou Ren falar com ele. Ren ofereceu 1 PO por uma hora do tempo de Harl. Harl aceitou, corrigiu o nome para 'Harl, com r', levou Ren até a cozinha e se afastou para uma lateral menos barulhenta."
  confissao_de_harl:
    horario_aproximado: "16:23"
    observacao: "Ren apelou à fome, pobreza, admiração e amor para convencer Harl a assumir sua parte. Harl admitiu a Ren e depois a Jack que plantou em Merrit a ideia de que Sorn ouviria uma amarra cantando errado, embora não tenha dado ordem direta para cortar. Jack puniu Harl discretamente, mantendo-o por um mês longe da corda alta, sem chave e sem conferência de segurança, e confirmou abrigo para Ren, Nera e Tavin por hoje e amanhã."
  visita_tarde_aos_vell:
    horario_aproximado: "16:31-16:34"
    observacao: "Ren visitou Nera e Tavin na carroça verde de Silva. Os irmãos estão alimentados, escondidos e fisicamente bem. Ren explicou que seguirá uma trilha à noite ligada aos homens que tentaram levar Nera. Nera perguntou se a trilha envolve a caixa ou o homem dos botões; Tavin perguntou se Ren vai voltar. Ren prometeu voltar e disse que investigará a conexão entre Red Sail e Masao. Também propôs Kagefusha, Moinho das Sombras, como nome de palco."
  saida_do_circo_para_trilha:
    horario_aproximado: "17:30"
    observacao: "Ren se despediu dos Vell, prometeu a Silva que não traria perseguição para a carroça verde, explicou que sairia pela rota da carroça de remendos e deixou o circo quando a penumbra começou. Saiu sem atrair atenção externa. Ainda falta cerca de uma hora e meia para a armadilha das 19:00."
  busca_por_disfarce_no_varal:
    horario_aproximado: "17:46"
    observacao: "Ren se deslocou discretamente em direção à oficina de velas abandonada, evitando olhos naturais da Red Sail. Encontrou um varal excelente para obter disfarce: casaco cinza grosseiro, camisa, calças largas e gorro escuro. Ao tentar roubar as peças, a roldana estalou; Ren pegou casaco e gorro, mas camisa e calças ainda estão presas. Uma menina comum viu Ren na mureta e chamou pela mãe em voz baixa."
  chegada_ao_ponto_de_observacao_da_oficina:
    horario_aproximado: "18:16"
    observacao: "Ren tentou encobrir o roubo do varal com som ilusório de gato, mas a mãe viu movimento humano e gritou por ladrão de roupa. Ren escapou; isso gerou rumor local comum, não alarme da Red Sail. Ren encontrou um beco seguro, deixou suas peças mais reconhecíveis dobradas numa fresta seca atrás de tábuas e vestiu casaco cinza e gorro escuro como disfarce apressado. O disfarce é fraco de perto, mas quebra a silhueta à distância. Ren chegou a um sótão quebrado de antiga loja de sebo e pavio, bom ponto de observação da oficina de velas abandonada antes da armadilha das 19:00."
  isca_da_oficina_respondida:
    horario_aproximado: "19:11"
    observacao: "Ren estudou rota de fuga pelas fachadas apertadas, manteve-se oculto e percebeu a aproximação da isca. Dois homens vieram pela rua dos tonéis: um provavelmente é Rusk 'Cinza', com cinza nas mangas e aparência de varredor; o outro é um capanga da Red Sail. Nenhum percebeu Ren. Rusk entrou na oficina de velas pela abertura lateral para examinar marcas antigas de ocupação; o capanga ficou no vão lateral vigiando a viela."
  escuridao_na_oficina:
    horario_aproximado: "19:12"
    observacao: "Ren conjurou Escuridão sobre a entrada lateral da oficina de velas e avançou contra o capanga da Red Sail. A aproximação silenciosa falhou, o primeiro golpe errou, mas o golpe bônus acertou e empurrou o capanga ferido para dentro. O capanga errou o contra-ataque no breu e não gritou alarme amplo. Rusk 'Cinza' continua dentro da oficina, sem posição visual confirmada por Ren."
  rajada_contra_rusk:
    horario_aproximado: "19:12"
    observacao: "Ren gastou seu último ponto de ki em Rajada de Golpes. Neutralizou o capanga da Red Sail, localizou Rusk pelo som e acertou dois golpes nele. Rusk ficou ferido e falhou em escapar pelo interior da oficina. Moradores de Fishtown ouviram barulho, mas ainda não abriram alarme."
  interrogatorio_de_rusk:
    horario_aproximado: "19:12"
    observacao: "Ren rendeu Rusk com a wakizashi no pescoço e perguntou sobre o selo falso da lua, a caixa e o estrangeiro ligado a Brass. Rusk afirmou que a caixa e o selo eram montagem para criar rastro oriental e atrair o homem certo; associou o hóspede de Brass à lua, Velis Rook, Narwhal e possível marca na bochecha direita; Ren percebeu que Rusk ainda omite o ponto de entrega ou método de contato entre Brass e Narwhal."
  fuga_da_oficina_de_velas:
    horario_aproximado: "19:14"
    observacao: "Ren concluiu que a caixa da Lua foi isca feita para atraí-lo e que Masao ou agente muito próximo sabe que ele chegou a Ravens Bluff. Apagou Rusk, desceu o corpo sem barulho e tentou criar distração arremessando uma peça na loja de sebo. A distração não causou grande desabamento, mas Ren escapou pela rota das fachadas apertadas. Uma testemunha percebeu a direção geral da fuga, sem identificar Ren."
  passagem_pela_casa_da_aurora_menor:
    horario_aproximado: "20:08"
    observacao: "Ren saiu de Fishtown sem virar rastro claro, recuperou roupas escuras e manto no beco seguro com atraso, confirmou que não havia cauda e chegou à Casa da Aurora Menor usando o casaco/gorro roubados do varal. Avisou Maerra que Nera e Tavin estão vivos e protegidos por Silva e Jack no circo. Maerra emprestou roupas comuns de doação, água e pão, mas não vestes ou símbolo sagrado."
  roubo_no_market_district:
    horario_aproximado: "20:32"
    observacao: "Ren foi ao mercado noturno do Market District para se financiar. Escolheu um mercador rico, usou Ilusão menor como distração parcial e roubou a bolsa durante uma falsa ajuda/oracao. Obteve 27 PO e escapou pelos becos sem perseguição imediata. Possível rumor posterior: peregrino pobre ou forasteiro perto do mercador antes do roubo."
  retorno_ao_circo_apos_mercado:
    horario_aproximado: "21:02"
    observacao: "Ren voltou ao circo pela rota da carroça de remendos. Não conseguiu confirmar com segurança absoluta que ninguém no caminho do mercado notou sua direção geral, mas entrou no acampamento sem ser percebido pela rotina interna. Trocou o disfarce de doação pelas roupas escuras de viagem e encontrou Silva perto das cozinhas laterais. Silva ofereceu banho simples atrás da lona azul; Nera está acordada e Tavin dorme."
  banho_e_nera_na_lona_azul:
    horario_aproximado: "21:10"
    observacao: "Ren começou banho simples atrás da lona azul, com a wakizashi ao alcance. Nera não conseguiu esperar, veio atrás dele por preocupação e levantou a lona por um instante, vendo mais do que pretendia antes de virar o rosto. Silva está por perto e preserva a situação com firmeza prática. O banho ainda não conta como descanso curto e Ren continua com 0/3 ki."
  conversa_na_lona_azul:
    horario_aproximado: "21:12"
    observacao: "Ren tranquilizou Nera, disse que não está ferido fisicamente e prometeu ir à carroça verde depois do banho. Nera aceitou esperar, ainda envergonhada e aliviada. Silva preservou a privacidade com humor seco. A tensão romântica entre Ren e Nera ficou mais explícita, mas segue contida por medo, vergonha e circunstância."
  carroca_verde_apos_banho:
    horario_aproximado: "21:24"
    observacao: "Ren terminou o banho, vestiu suas roupas escuras e foi à carroça verde. Tavin dorme. Ren e Nera tocaram as mãos e mantiveram a intimidade. Silva informou que Dessa Wren pode providenciar roupas comuns de disfarce: duas mudas improvisadas por 3 PO, ou três mudas incluindo corte de pequeno mercador por 5 PO. Silva autorizou passeio curto pela rota interna das lonas, longe das bordas do acampamento."
  carroca_dos_estandartes:
    horario_aproximado: "21:28"
    observacao: "Ren procurou uma estrutura alta não feita de lona para conversar com Nera. Encontrou o teto de uma carroça larga de madeira perto dos estandartes velhos. Como estava sem ki, não pôde usar Passo do Vento; tentou subir com Nera de forma mundana. A subida fez barulho e alguns circenses perceberam o casal, mas Silva não interrompeu. Ren e Nera têm privacidade relativa sob as estrelas."
  conversa_sobre_aiko_e_vinganca:
    horario_aproximado: "21:31"
    observacao: "No topo da carroça dos estandartes, Ren contou a Nera que se sente quebrado desde a morte de Aiko, que veio a Ravens Bluff para matar Masao e que talvez possa morrer qualquer noite. Nera admitiu que se preocupa de verdade com Ren, mas colocou uma condição emocional: ela e Tavin precisam continuar sendo pessoas para ele, não ferramentas, peso ou parte da vingança."
  primeiro_beijo_de_ren_e_nera:
    horario_aproximado: "21:34"
    observacao: "Ren respondeu a Nera que ela e Tavin já são pessoas para ele. Admitiu que quer fazer de tudo para vencer Masao, trazer os culpados à justiça e sair vivo com Nera e Tavin. Ren tocou o rosto de Nera e os dois se beijaram no topo da carroça dos estandartes. O vínculo romântico agora é explícito entre eles, mas sem promessa de futuro."
  retorno_de_nera_a_carroca_verde:
    horario_aproximado: "21:42"
    observacao: "Ren e Nera desceram da carroça dos estandartes e caminharam de mãos dadas pela rota interna autorizada por Silva. Ren deixou Nera novamente na carroça verde; Tavin continuava dormindo. Silva preservou a privacidade, mas manteve a vigilância prática."
  descanso_longo_de_ren:
    horario_aproximado: "21:50-05:50"
    observacao: "Ren dormiu no canto discreto do depósito de figurino velho preparado por Jack Mooney. O descanso contou como descanso longo completo: PV, dados de vida e ki recuperados. O marco de nível 4 foi aplicado ao despertar."
  sondagem_no_perimetro_do_circo:
    horario_aproximado: "05:55-06:05"
    observacao: "Antes de o circo despertar por completo, gente ligada ao porto ou à Red Sail alcançou o perímetro do acampamento com perguntas sobre uma mulher ferida e um rapaz. Jack e Silva impediram acesso direto ao esconderijo, mas a pressão ficou próxima demais para ignorar."
  plano_de_busca_controlada:
    horario_aproximado: "06:06"
    observacao: "Ren propôs evacuar Nera e Tavin discretamente antes de Jack permitir uma busca controlada no circo, com o objetivo de apaziguar a sondagem sem entregar os Vell. Silva julgou a ideia possível, desde que Jack controle quais lonas, carroças e baús serão abertos."
  disfarces_de_dessa_wren:
    horario_aproximado: "06:08"
    observacao: "Ren foi ao guarda-roupa menor e pagou 1 PO a Dessa Wren por roupas rápidas e silêncio. Dessa montou disfarces comuns para Ren, Nera e Tavin: ajudante de carga, viúva pobre/lavadeira e rapaz de recados/cozinha."
  fuga_oposta_do_circo:
    horario_aproximado: "06:13"
    observacao: "Ren pagou mais 2 PO a Dessa Wren: 1 PO para transformar roupas roubadas e roupas de doação em retalho, e 1 PO para guardar suas roupas próprias como figurino estrangeiro. Silva não conseguiu garantir saída limpa, mas Jack puxou a atenção para a entrada das cozinhas. Ren, Nera e Tavin saíram pela rota das bacias de lavagem e barris de água cinza. Ren gastou 1 ki em Passo do Vento para corrigir uma hesitação de Tavin no cruzamento crítico. Os homens do porto/Red Sail não identificaram a fuga."
  travessia_para_aurora_menor:
    horario_aproximado: "06:13-06:47"
    observacao: "Ren conduziu Nera e Tavin por áreas pobres e ruas de serviço, misturando o grupo ao fluxo da manhã. Confirmou com segurança que não havia cauda, comprou comida simples com moedas de cobre e seguiu para a Casa da Aurora Menor. O gasto de cobre não alterou o total de PO registrado."
  consulta_a_maerra_sobre_luath:
    horario_aproximado: "06:47"
    observacao: "Na Casa da Aurora Menor, Ren perguntou a Maerra se Luath, sargento da City Guard ligado à Night Watch, é realmente honrado. Maerra respondeu que Luath não é santo, mas é honrado de modo útil: cumpre dever, não vende pobre por conveniência e entende a sujeira da cidade. Ela recomendou que Ren leve verdade verificável e não entregue Nera e Tavin de imediato."
  ren_vai_ao_posto_da_night_watch:
    horario_aproximado: "06:49-07:04"
    observacao: "Ren pediu que Maerra ficasse com Nera e Tavin enquanto ele conversa com Luath. Maerra aceitou e entregou a cópia parcial selada do livro de provas. Ren caminhou como pobre comum até o posto da City Guard/Night Watch, sem chamar atenção. Luath estava disponível ao amanhecer."
  conversa_privada_com_luath:
    horario_aproximado: "07:06"
    observacao: "Ren entregou a Luath a cópia parcial selada por Maerra, incluindo um bilhete pedindo conversa a sós. Luath não confiou de imediato, mas aceitou privacidade por respeito cauteloso a Maerra e levou Ren para um depósito lateral de patrulha."
  luath_aciona_patrulha_contra_buscas:
    horario_aproximado: "07:13"
    observacao: "Ren contou a Luath sobre Masao, Aiko, a falsificação do selo, a ameaça contra Nera e Tavin e as buscas ostensivas da Red Sail. Luath aceitou agir contra as buscas como perturbação da paz, intimidação e usurpação de autoridade. A cópia parcial selada ficou com Luath. Ele pediu três informações práticas antes de mover mais guardas."
  luath_recebe_informacao_pratica:
    horario_aproximado: "07:16"
    observacao: "Ren informou Luath que a pressão atual da Red Sail recai sobre o circo de Jack Mooney, explicou que Dain Mord é Brass e descreveu o protocolo da ficha de cobre com vela vermelha e cordão azul. Luath reconheceu Dain Mord, aceitou não mandar busca aberta ao circo sem ordem ou flagrante e enviou patrulheiros para coibir buscas ilegais nas ruas, vizinhanças e acessos."
  ponto_morto_de_pell_na_silver_lily:
    horario_aproximado: "07:31"
    observacao: "Antes de voltar à Casa da Aurora Menor, Ren foi aos fundos da The Silver Lily e checou o vaso com flor combinado com Pell. Pell deixou bilhete avisando que Velis Rook vai limpar papel na casa grande do peixe, provavelmente Narwhal Manor, antes do sino de nove; Brass está irritado; Rusk não voltou; e o homem da lua não desce ao cais."
  chegada_a_narwhal_manor:
    horario_aproximado: "07:54"
    observacao: "Ren pagou Pell com 1 PO deixado no vaso, destruiu o bilhete e seguiu para Narwhal Manor. No caminho, evitou dois possíveis olhos da Red Sail e perdeu alguns minutos em rotas laterais. Chegou sem cauda clara e viu Velis Rook prestes a entrar pela porta lateral de funcionários com uma pasta rígida de couro encerado."
  tentativa_de_furto_da_pasta_de_velis:
    horario_aproximado: "07:55"
    observacao: "Ren derrubou a lâmpada acima da porta lateral de Narwhal Manor com um shuriken para criar distração. Velis evitou o impacto direto, segurou a pasta e percebeu a tentativa de furto. Ren não conseguiu tomar a pasta, mas viu carimbo de Narwhal Manor, número 13 e a expressão 'retenção anulada'. Velis chamou guarda."
  roubo_da_pasta_de_velis:
    horario_aproximado: "07:57"
    observacao: "Ren fez uma segunda e única tentativa física, arrancou a pasta de Velis Rook e gastou 1 ki em Passo do Vento para fugir pela direção oposta aos guardas. Escapou pelas ruas de serviço sem perseguição imediata colada nele. Narwhal Manor entrou em alarme local por roubo de papéis."
  retorno_a_aurora_menor_com_pasta:
    horario_aproximado: "08:42"
    observacao: "Ren afastou-se lentamente de Narwhal Manor, encontrou uma manta de estopa cinza abandonada e a usou para quebrar a silhueta. Fez rota indireta, confirmou ausência de cauda e chegou à lateral da Casa da Aurora Menor com a pasta de Velis escondida sob as roupas. A pasta ainda não foi examinada."
  pausa_na_saleta_de_ervas:
    horario_aproximado: "08:42-09:15"
    observacao: "Ren entrou pela lateral da Casa da Aurora Menor e foi levado à saleta de ervas com Maerra, Nera e Tavin. Bebeu água, comeu um pouco e respirou, mas a pausa não contou como descanso curto mecânico. A pasta de Velis permaneceu fechada. Maerra ofereceu um fio lateral futuro: os Meninos do Primeiro Sino e a Casa Velha do Primeiro Raio."
  abertura_da_pasta_de_velis:
    horario_aproximado: "09:24"
    observacao: "Ren abriu a pasta de Velis diante de Maerra, Nera e Tavin. Eles encontraram retenção temporária do volume 13 na Casa da Rede Morta, anulação retroativa assinada por V. Rook, lista de correções removendo 'oriental' e trocando M. H. por M. Harrow, menção a D. Mord, impressão protegida da falsa lua velada reconhecida por Nera e bilhete dizendo que o hóspede não desce ao cais, que a lua fica em Narwhal até sinal de B., e que gravadora e menino são ruído que não deve chegar a Tyr. Maerra avaliou que a prova é forte, mas precisa ser legitimada por Luath ou Tyr por ter sido roubada."
  reconhecimento_cauteloso_de_maerra:
    horario_aproximado: "09:35"
    observacao: "Maerra tentou dar peso à pasta sem prometer mais do que podia. Escreveu declaração cautelosa atestando que os papéis foram abertos diante dela, de Ren, Nera e Tavin; registrou que Nera reconheceu a impressão da lua velada como derivada do trabalho encomendado; e lacrou a pasta com cera da Casa da Aurora Menor. Maerra não atestou cadeia de custódia, autoria final nem inocência de qualquer parte."
  retorno_ao_circo_com_os_vell:
    horario_aproximado: "10:18"
    observacao: "Ren deixou a Casa da Aurora Menor com Nera, Tavin e a pasta lacrada. A travessia discreta funcionou, embora Ren não tenha conseguido confirmar com segurança absoluta que ninguém observou a rota. Perto do circo, patrulheiros acionados por Luath já pressionavam a Red Sail a abandonar buscas sem mandado. Jack conduziu uma busca controlada e os homens do porto saíram contrariados. Ren devolveu Nera e Tavin à carroça verde de Silva."
  ren_se_prepara_para_tyr:
    horario_aproximado: "10:24"
    observacao: "Ren informou Silva que pretende ir a Tyr com a pasta lacrada, por causa do bilhete que demonstra medo de que Tyr se envolva. Despediu-se de Nera e Tavin, deixando-os na carroça verde sob proteção de Silva, e foi ao guarda-roupa menor falar com Dessa Wren. Dessa tem as roupas próprias de Ren e propôs duas apresentações: forasteiro oriental memorável ou cidadão menor limpo e discreto."
  chegada_a_casa_de_tyr:
    horario_aproximado: "10:57"
    observacao: "Ren escolheu a roupa de cidadão menor, pagou 1 PO a Dessa pela roupa e pela limpeza de suas roupas próprias, e descreveu um futuro traje de apresentação com obi espetacular. Saiu pela lateral do circo. A saída foi notada por algumas pessoas, possivelmente incluindo um remanescente do porto, mas Ren percebeu o risco, quebrou linha de visão e escolheu rota eficiente até o Temple District. Chegou sem cauda colada à Casa de Tyr, diante de guardiões e acólito de registro."
  primeiro_filtro_em_tyr:
    horario_aproximado: "10:58"
    observacao: "Ren pediu testemunho diretamente para Sirrus Melandor e disse ter sido instruído a mostrar apenas a ele. O guardião recusou acesso direto imediato, mas reconheceu a seriedade do testemunho lacrado e ofereceu triagem preliminar sem abrir a pasta: Ren deve dizer quem o instruiu, quem corre risco vivo agora e por que não pode esperar a ordem normal das queixas."
  testemunho_reservado_urgente:
    horario_aproximado: "11:00"
    observacao: "Ren mostrou o selo de Maerra e disse que o testemunho vale a vida de duas pessoas honradas. O guardião reconheceu o selo como ligado à Aurora Menor/Lathander, mas não o bastante para pular protocolo. Ainda assim, aceitou classificar o caso como testemunho reservado urgente, com registro mínimo sem nomes completos em voz alta. A guardiã jovem foi chamar uma autoridade intermediária para ouvir sem abrir o lacre."
  preparacao_para_ouvidora_de_tyr:
    horario_aproximado: "11:03"
    observacao: "Enquanto aguardava, Ren observou o vestíbulo, entendeu que há registro reservado para casos sensíveis, organizou os fatos em torno de custódia/testemunho/vidas em risco/obstrução de justiça e reconheceu que vingança pessoal enfraqueceria a abordagem. Irmã Halessa Vorn, ouvidora juramentada da Casa de Tyr, chegou para ouvir sem abrir a pasta lacrada."
  halessa_oferece_resguardo:
    horario_aproximado: "11:07"
    observacao: "Ren apresentou o caso de N.V. e T.V. a Halessa, explicando Red Sail, falsificação do selo do clã, tentativa de queima de arquivo, cópia parcial de Maerra sob custódia de Luath e pasta lacrada por Maerra. Halessa percebeu lacuna na cadeia de custódia, mas decidiu escalar o caso dentro de Tyr. Ofereceu resguardo provisório de 24h para as testemunhas se puderem ser movidas com segurança, ficha selada para Maerra ou Luath e audiência de lacre em câmara reservada."
  audiencia_lacre_agendada:
    horario_aproximado: "11:09"
    observacao: "Ren decidiu não mover Nera e Tavin por enquanto, pois os considera seguros hoje no abrigo atual. Pediu confirmação com Luath e Maerra e abertura do lacre. Halessa aceitou a lógica, mandou fichas reservadas a Luath e Maerra por mensageiros de Tyr e ofereceu iniciar audiência de lacre em cerca de doze minutos, sob paz juramentada e com a pasta ficando sob custódia de Tyr após a abertura."
  pasta_aberta_em_tyr:
    horario_aproximado: "11:29"
    observacao: "Ren aceitou paz juramentada, mantendo a wakizashi embainhada e presa por cordão branco e os shuriken fechados em pacote sobre a mesa. A pasta lacrada por Maerra foi aberta em câmara reservada diante de Halessa Vorn, Irmão Caldrin Vos, escriba e Ren. Halessa identificou o valor jurídico do bilhete e das correções retroativas. Caldrin mandou chamar Sirrus imediatamente. A pasta passou à custódia formal de Tyr. Halessa pediu que Ren decida se registra Nera Vell e Tavin Vell por nomes completos em ata reservada e selada."
  nomes_vell_registrados:
    horario_aproximado: "11:34"
    observacao: "Ren registrou Nera Vell e Tavin Vell por nome completo em ata reservada e selada. Sirrus Melandor entrou na câmara reservada, reconheceu a gravidade dos documentos, mas exigiu linha de custódia antes de conceder proteção nominal: Ren pode nomear o guardião atual em registro selado, aguardar confirmação de Maerra/Luath ou transferir voluntariamente os Vell para uma porta de Tyr."
  silva_nomeada_e_ordens_de_tyr:
    horario_aproximado: "11:38"
    observacao: "Ren nomeou Silva Elkwood em registro selado como guardiã atual informada por ele para Nera e Tavin, ainda pendente de confirmação. Sirrus aceitou emitir ordem de preservação sobre registros ligados ao volume 13, Narwhal Manor, Dain Mord, M. H., M. Harrow, lua velada e carga oriental, e convocará Velis Rook para responder por anulação retroativa e obstrução. Sirrus negou que Ren acompanhe ocultamente a primeira oitiva de Velis, mas Halessa permitiu que Ren escreva até três perguntas para possível uso na oitiva."
  perguntas_entregues_e_incendio_no_harbor:
    horario_aproximado: "11:45"
    observacao: "Ren entregou a Halessa três perguntas para possível uso na oitiva de Velis: interesse em selos de clãs de Kara-Tur, identidade/interesse no 'hóspede' e conteúdo oculto do volume 13. Ren agradeceu e saiu da câmara, recuperando wakizashi e shuriken. Do lado de fora da Casa de Tyr, viu fumaça escura subindo do Harbor District perto dos armazéns de breu e cordame. Rumores dizem que a Red Sail já atua no local como força de contenção. Tyr mantém ordem de preservação e convocação de Velis, mas a crise divide atenção e recursos."
  investigacao_inicial_do_incendio:
    horario_aproximado: "12:08"
    observacao: "Ren desceu ao Harbor District tentando manter baixo perfil, mas chegou mais visível do que queria. Na borda norte do incêndio, leu bem a cena: três focos separados, rota de baldes e guardas bloqueada, fogo grande contido antes de atingir breu em escala catastrófica, chegada rápida demais da Red Sail e rumores sobre um armazém ligado a Narwhal Manor. Ren organizou bons rumores, mas não separou com segurança gratidão real de fala plantada. Um olheiro da Red Sail o fixou como observador suspeito, embora ainda não tenha ocorrido abordagem."
  retorno_ao_circo_apos_incendio:
    horario_aproximado: "12:52"
    observacao: "Ren percebeu que a Red Sail poderia tentar formar uma cauda, mas a organização falhou no caos do incêndio. Ele não gastou Passo do Vento, tomou rota longa, evitou Silver Lily e Aurora Menor, e entrou no circo pela rota da carroça de remendos. A Red Sail não seguiu Ren até o circo. Silva Elkwood o interceptou discretamente perto da entrada interna e perguntou se ele veio sozinho."
  conselho_de_silva_sobre_o_abrigo:
    horario_aproximado: "12:58"
    observacao: "Ren contou a Silva o que ocorreu em Tyr e no incêndio, incluindo que a nomeou em ata selada. Silva aceitou com reprimenda e aconselhou não mover os Vell para fora durante a crise. Para ela, o melhor é separar Ren, os Vell e o livro; mover Nera e Tavin para dentro da rotina do circo; manter Ren visível por algumas horas como Ren Kage; e falar com Jack junto dela."
  conversa_com_os_vell_sobre_tyr_e_trabalho:
    horario_aproximado: "13:10"
    observacao: "Ren tomou banho rápido atrás da lona azul e falou com Nera e Tavin na carroça verde. Contou com cuidado que Tyr registrou os nomes dos dois em ata reservada e selada. Nera entendeu o valor e o risco do registro. Tavin aceitou a cobertura de ajudante de cozinha/recados sob controle de Silva, e Nera pode ser integrada ao guarda-roupa/remendos com Dessa Wren."
  beneficio_da_lona_aberta:
    horario_aproximado: "13:18-13:24"
    observacao: "Ren propôs a Jack e Silva o Benefício da Lona Aberta: espetáculo beneficente para vítimas e trabalhadores afetados pelo incêndio, com ingressos comuns, camarotes caros e doações visíveis. Jack aceitou o esqueleto do plano como viável e quer prepará-lo para amanhã ao cair da tarde, sem acusação pública contra Red Sail, Masao ou Narwhal. Nera e Tavin devem ser integrados à rotina antes dos cartazes, e o livro deve ficar separado do lugar onde eles dormem."
  nomes_de_cobertura_e_vento_da_noite:
    horario_aproximado: "13:24-13:43"
    observacao: "Ren avisou Jack que falará com Luath antes de apresentar o número. Depois contou a Nera e Tavin sobre o Benefício da Lona Aberta e pediu nomes de cobertura como nomes artísticos: Nera escolheu Lena, Tavin escolheu Timo. Ren explicou a Dessa a ideia de O Vento da Noite, uma lenda de Kara-Tur inspirada em Ame-no-Wakahiko. Dessa não tem guia confiável de vestimenta oriental nem shamisen disponível, mas consegue robe negro, máscara inteira, panos de vento/noite, lanternas, fumaça leve se Sorn permitir e música local adaptada. Merrit Tealeaf pode narrar sob supervisão de Silva. Jack autorizou a preparação condicionada a apoio limpo de Luath e prova física posterior."
  pedido_a_luath_para_beneficio:
    horario_aproximado: "14:08"
    observacao: "Ren foi ao posto da City Guard/Night Watch em perfil discreto e apresentou o Benefício da Lona Aberta como questão de ordem pública. A tentativa de obter apoio limpo falhou em termos formais: Luath recusou compromisso oficial da Night Watch e proibiu usar o nome da guarda em cartazes ou anúncios. Ainda assim, ofereceu uma via limitada: se Jack preparar aviso escrito com hora, entrada, saída, estimativa de público e responsável pela lona, e se Silva ou outro nome de templo assinar a parte real de comida/doação, Luath pode mandar ronda normal passar pelo caminho, dispersar problemas e enquadrar intimidação da Red Sail como perturbação da paz."
  atrito_com_luath_sobre_conluio:
    horario_aproximado: "14:11"
    observacao: "Ren tentou pressionar Luath a ir além da resposta formal, argumentando que o evento é para a cidade e que Jack está se fortalecendo contra uma organização que tentou queimar arquivo de mulher e criança. A rolagem de Persuasão falhou gravemente. Luath rejeitou a crítica de burocracia e a oferta de serviços secretos para obter provas sem que ninguém soubesse. Manteve apenas o acordo limitado anterior: aviso escrito limpo antes do pôr do sol pode justificar ronda normal, sem nome da guarda no cartaz."
  demonstracao_do_vento_da_noite:
    horario_aproximado: "14:43"
    observacao: "Ren voltou ao circo, relatou a resposta limitada de Luath e apresentou suas capacidades artísticas diante de Jack, Silva, Dessa, Mira e Sorn. A demonstração foi bem-sucedida: Acrobacia 19 contra CD 15 e precisão com shuriken 24 contra CD 14. Ren gastou 1 ki em Passo do Vento. Jack aceitou vender O Vento da Noite como atração do Benefício da Lona Aberta, desde que Sorn marque pontos de pouso, Silva controle segurança e shuriken sejam usados apenas como efeito artístico seguro."
  aviso_do_beneficio_entregue_a_luath:
    horario_aproximado: "15:32"
    observacao: "Jack e Silva prepararam aviso escrito limpo para o Benefício da Lona Aberta: evento amanhã ao cair da tarde, entrada e saída pelos campos/rota de carroças, estimativa de público maior que uma noite comum, Jack responsável pela lona e Silva responsável pela parte real de comida, água, cobertores e doações. Ren entregou o documento a Luath antes do pôr do sol, com postura humilde e sem nova discussão. Luath aceitou orientar uma ronda normal no caminho do evento, sem apoio formal público e sem nome da guarda no anúncio."
  descanso_curto_apos_entrega_a_luath:
    horario_aproximado: "16:08-17:20"
    observacao: "Ren voltou ao circo, dormiu e meditou no depósito de figurino velho por mais de uma hora. O repouso contou como descanso curto seguro; Ren recuperou o ki para 4/4."
  ensaio_estruturado_do_vento_da_noite:
    horario_aproximado: "17:25-18:12"
    observacao: "Jack e Silva aprovaram Merrit como narradora de O Vento da Noite apenas em papel limitado de chão, sem corda alta, faca, caixa de truque ou acesso solto, e sempre sob supervisão. Merrit aceitou a função e ensaiou entradas cômicas curtas. Nera/Lena e Tavin/Timo assistiram parte do ensaio trazidos por Silva pela rota interna; Tavin reagiu com encanto, Nera observou com cautela e alívio. O número ficou aprovado como estrutura básica para a apresentação de amanhã, desde que as marcações de Sorn e os limites de segurança sejam preservados."
  princesa_das_sombras_definida:
    horario_aproximado: "18:20"
    observacao: "Jack decidiu que Lysa Renn, não Nera/Lena, será a Princesa das Sombras de O Vento da Noite. A decisão foi tomada por segurança dos Vell e por integração interna do circo. Lysa fará movimentos simples e baixos, adequados ao joelho ainda limitado; não haverá beijo, toque romântico, nome anunciado ou aplauso próprio."
  ensaio_noturno_do_vento_da_noite:
    horario_aproximado: "18:30-22:30"
    observacao: "Ren ensaiou à noite com Lysa, Merrit, Sorn e Dessa. Lysa cansou primeiro por causa do joelho e foi cortada por Sorn antes de forçar demais. Merrit perdeu a voz depois de repetir entradas cômicas, e Dessa fechou limites de figurino. Ren continuou repetindo entradas e pousos sem gastar ki."
  passeio_noturno_com_nera:
    horario_aproximado: "22:35-23:10"
    observacao: "Após os ensaios, Silva permitiu que Ren e Nera caminhassem pela rota interna das lonas. Houve mãos dadas, beijos e juras de amor de Ren. Nera não respondeu com promessa igual, mas pediu que Ren viva tempo bastante para ela acreditar sem medo."
  descanso_longo_pre_apresentacao:
    horario_aproximado: "23:30-07:30"
    observacao: "Ren dormiu de verdade no circo após os ensaios e o passeio com Nera. O descanso contou como descanso longo completo; PV, dados de vida e ki permanecem cheios."
  ensaios_do_dia_da_apresentacao:
    horario_aproximado: "08:30-16:30"
    observacao: "No dia do Benefício da Lona Aberta, Ren ensaiou repetidamente. Merrit teve o texto cortado ao essencial, Lysa ajustou movimentos para poupar o joelho, Mira deu uma correção técnica a Lysa, Sorn cobrou pousos e Dessa finalizou o figurino de Ren. Ren almoçou com Nera/Lena e Tavin/Timo e tentou explicar sushi, com reação divertida e desconfiada dos Vell."
  inicio_do_beneficio_da_lona_aberta:
    horario_aproximado: "17:42 do dia seguinte"
    observacao: "O público chegou ao Benefício da Lona Aberta em camadas: trabalhadores do Harbor District, famílias pobres atraídas pela comida, gente de templo, curiosos, mercadores menores e ricos nos camarotes. A ronda normal prometida por Luath passou pela estrada sem teatralidade. Dois homens de faixa vermelha atravessaram a estrada sem parar. Jack iniciou a chamada de O Vento da Noite, com Ren vestido e pronto para entrar."
  apresentacao_do_vento_da_noite:
    horario_aproximado: "17:42-17:58 do dia seguinte"
    observacao: "Ren executou O Vento da Noite diante da lona cheia, gastando 1 ki em Passo do Vento. Rolagens abertas: Acrobacia 22 contra CD 15, sucesso; Atuação 16 contra CD 13, sucesso. O número foi bem recebido: execução física limpa, público impressionado, Lysa cumpriu o papel de Princesa das Sombras sem forçar o joelho, Merrit sustentou a narração curta e a persona pública Ren Kage começou a se fixar em Ravens Bluff. O resultado financeiro e político completo do Benefício da Lona Aberta ainda depende do restante da noite."
  reacao_interna_ao_vento_da_noite:
    horario_aproximado: "17:58-18:07 do dia seguinte"
    observacao: "Ren não voltou ao público após o número, preservando a aura de mistério. Nos bastidores, Sorn aprovou a precisão das marcações com ressalva técnica, Lysa sustentou o papel sem cair, Mira deu crítica técnica útil, Dessa confirmou que o figurino funcionou e Silva alertou que Ren Kage é uma máscara aceita, mas não um esconderijo. Jack aprovou a ausência pública e trouxe uma ficha do camarote oeste: um homem quer saber se Kage recebe patrono privado ou contratação fechada. Jack aguarda decisão de Ren sobre como administrar a resposta."
  fechamento_do_beneficio_da_lona_aberta:
    horario_aproximado: "18:07-21:10 do dia seguinte"
    observacao: "Ren decidiu deixar Kage ligado ao circo por enquanto, recusando contato direto com patrono privado na mesma noite. Jack respondeu ao camarote oeste que Kage não recebe casa privada hoje e que propostas por escrito podem ser enviadas amanhã. Rolagem aberta de resultado financeiro/social: 21 contra CD 14, sucesso. O Benefício fechou sem interrupção aberta. Jack estima cerca de setenta e poucas peças de ouro limpas para o circo depois de custos e promessas públicas, além de doações comunitárias administradas por Silva e promessas comerciais. Nera e Tavin dormem no circo hoje; Jack quer conversar pela manhã sobre preço, patronos e silêncio."
  noite_apos_o_beneficio:
    horario_aproximado: "21:10 do dia seguinte-06:20 da manhã seguinte ao Benefício"
    observacao: "Ren tomou banho atrás da lona azul, devolveu o figurino de O Vento da Noite aos cuidados de Dessa, comeu com Nera e Tavin na carroça verde e percebeu que esperava alguma ação de Masao ou de seus lacaios. Nenhuma ameaça aberta atravessou a lona. Ren dormiu no canto definido para ele e completou descanso longo, recuperando o ki para 4/4. Pela manhã, Silva deixou água e pão e avisou que Jack quer falar depois da comida; Nera está acordada na carroça verde."
  conversa_manha_nera_e_jack:
    horario_aproximado: "06:20-06:45 da manhã seguinte ao Benefício"
    observacao: "Ren comeu, falou com Nera na carroça verde e foi ao escritório-carroça de Jack. Nera aceitou que Kage pode ser uma porta de abrigo e renda, mas alertou que Ren não deve ser comprado inteiro por Kage, Jack, ricos, Vell ou Masao. No escritório, Jack mostrou proposta escrita sem nome claro vinda do camarote oeste, pedindo termos para apresentação privada de Kage com pagamento adiantado e discrição. Jack quer exigir nome de casa, endereço, pagador, metade adiantada e local controlado, sem envolver Nera, Tavin, livro ou história triste. Antes de responder, pediu que Ren defina o que Kage não faz por dinheiro."
  limites_de_kage_e_mensageira_de_tyr:
    horario_aproximado: "06:58 da manhã seguinte ao Benefício"
    observacao: "Ren definiu limites formais para Kage: apresentações apenas em tenda controlada pelo circo, equipe presente, segurança identificada, antecedência, sem reunião social, sem fala obrigatória, sem exposição pessoal, sem intimidação privada e sem envolver os Vell. Jack preparou resposta rígida ao camarote oeste, com preço de 40 PO para primeira apresentação fechada curta, 20 PO adiantadas e custos por fora, mas ainda não selou o papel. Uma mensageira de Tyr chegou à borda das carroças pedindo Silva Elkwood por assunto de lacre reservado."
  ficha_de_tyr_para_silva:
    horario_aproximado: "07:04 da manhã seguinte ao Benefício"
    observacao: "Ren acompanhou Silva até a mensageira de Tyr. A ficha reservada informa que Luath confirmou ter recebido a cópia parcial e ter agido contra buscas ilegais, Maerra confirmou o lacre, a abertura presenciada e a condição em que viu os Vell, e Tyr agora pede que Silva confirme ou negue a guarda atual informada. Silva aceita confirmar que os Vell estão sob seu cuidado imediato por ora, mas precisa decidir se pede resguardo em espera, transferência voluntária discreta para Tyr ou manutenção temporária no abrigo atual."
  resposta_de_silva_a_tyr:
    horario_aproximado: "07:10 da manhã seguinte ao Benefício"
    observacao: "Ren defendeu que Nera e Tavin permaneçam no circo, por parecer mais vida do que prisão e por valorizar a proximidade. Também agradeceu Silva por cuidar dos Vell. Silva confirmou formalmente a guarda imediata, pediu manutenção temporária no abrigo atual, recusou transferência neste momento e solicitou resguardo em espera sem deslocamento até o próximo sino maior. A mensageira de Tyr informou que a primeira convocação de Velis Rook foi entregue e que a Casa de Tyr espera resposta antes do meio-dia."
  contrato_de_kage_e_saida_do_circo:
    horario_aproximado: "07:10-07:35 da manhã seguinte ao Benefício"
    observacao: "Ren voltou a Jack, assinou como Ren Kage o acordo condicional de artista do Jack Mooney & Sons Circus, e Jack selou a resposta rígida ao camarote oeste. Depois Ren falou rapidamente com Nera e Tavin na carroça verde, sem transformar a despedida em cena longa, e saiu do circo discretamente, sem usar ki."
  sondagem_da_casa_velha_do_primeiro_raio:
    horario_aproximado: "08:12 da manhã seguinte ao Benefício"
    observacao: "Ren chegou sem cauda evidente aos arredores da Casa Velha do Primeiro Raio, antiga casa de auxílio de Lathander abaixo do Temple District, perto das ruas que descem para armazéns. Rolagens abertas: Furtividade 19 contra CD 14; Investigação 14 contra CD 13; Percepção 16 contra CD 14. Do lado de fora, Ren identificou marcas de carvão em forma de sol riscado, trânsito recente de pés pequenos e adultos pela viela lateral, provável entrada de serviço nos fundos, ponto de observação improvisado, possíveis observadores na rua e movimento breve atrás de uma janela alta. Ren ainda não entrou nem abordou ninguém."
  observacao_prolongada_da_casa_velha:
    horario_aproximado: "08:12-11:18 da manhã seguinte ao Benefício"
    observacao: "Ren descartou comprar uma luneta por custo e disponibilidade: a referência do Livro do Jogador coloca luneta em 1000 PO, fora do alcance dos 31 PO atuais e de uma compra rápida nas ruas baixas. Ele ocupou discretamente um sótão quebrado de oficina de rodas sem gastar ki. Rolagens abertas: Furtividade para ocupar ponto alto 24 contra CD 14, sucesso; Observação prolongada 11 contra CD 15, falha para detalhes finos; Investigação para organizar padrões 23 contra CD 14, sucesso. Ren observou a Casa Velha por quase três horas sem gerar alarme. Identificou que a frente não é usada, a viela lateral/porta de serviço são o eixo real, crianças parecem funcionar como olhos externos e um adulto de avental manchado usou a rota duas vezes, saindo por volta de 11:18 rumo aos armazéns com embrulho fino e comprido."
  tentativa_de_vigiar_velis:
    horario_aproximado: "11:18-11:49 da manhã seguinte ao Benefício"
    observacao: "Ren abandonou o rastro imediato do adulto de avental manchado da Casa Velha para tentar localizar Velis Rook antes do meio-dia. Rolagens abertas: Localizar rota provável de Velis 7 contra CD 14, falha; Vigiar Velis sem ser notado 13 contra CD 15, falha; Ouvir conversa em movimento 19 contra CD 14, sucesso. Ren errou a primeira rota e perdeu tempo, mas chegou ao perímetro lateral da Casa de Tyr quando Velis chegava com uma mulher ligada a interesses de casa rica. Ren ouviu que Velis foi instruído a negar instrução de patrono, tratar a anulação como correção de escrita, dizer que a marca da lua foi recebida e que o 'oriental' era M. Harrow. Um guardião de Tyr percebeu um homem de capuz interessado demais; Ren se afastou sem ser identificado com certeza. Velis entrou na Casa de Tyr, e a mulher seguiu sozinha rumo às ruas de escribas e comércio."
  conselho_de_maerra_apos_velis:
    horario_aproximado: "11:49-12:07 da manhã seguinte ao Benefício"
    observacao: "Ren foi discretamente da lateral de Tyr até a Casa da Aurora Menor. Rolagem aberta: Furtividade para sair do perímetro de Tyr sem arrastar atenção até Maerra 20 contra CD 13, sucesso. Ren relatou a Maerra a observação da Casa Velha, as instruções dadas a Velis e a situação de Silva. Maerra corrigiu que Silva é guardiã atual confirmada/registrada em trilha reservada, não guardiã legal plena. Maerra ofereceu enviar ficha curta a Halessa alertando para risco de Velis ter sido instruído antes da oitiva, sem nomear Ren como ouvinte. Conselho principal: deixar Tyr trabalhar Velis por ora, preparar a Casa Velha para a noite com foco em crianças vivas e rotas, e avisar Silva que o meio-dia passou sem transferência dos Vell."
  observacao_de_fonte_em_narwhal:
    horario_aproximado: "12:07-13:04 do dia seguinte ao Benefício"
    observacao: "Ren saiu da Casa da Aurora Menor enquanto Maerra colocava em curso uma ficha curta a Halessa, sem nomear Ren como ouvinte, alertando para o risco de Velis ter sido instruído antes da oitiva. Ren então voltou a observar Narwhal Manor. Rolagens abertas: voltar ao entorno de Narwhal sem ativar o alarme 11 contra CD 15, falha; mapear fluxo de serviço e escolher fonte útil 15 contra CD 15, sucesso; ler pressão pessoal em possível fonte 11 contra CD 14, falha; seguir a fonte para longe de Narwhal 17 contra CD 14, sucesso. Um guarda de Narwhal notou um observador deslocado antes de Ren mudar de posição, aumentando a atenção da casa. Ren identificou Kethra Dunn, funcionária de serviço que circula por corredores de lacres, velas e panos borrados, e a seguiu até uma loja de penhores/cobrança. Dois homens exigiram oito peças de ouro ou nomes ligados às chamadas de Tyr, ameaçando alguém chamado Colm. Kethra ainda não viu Ren."
  abordagem_inicial_a_kethra:
    horario_aproximado: "13:04-13:10 do dia seguinte ao Benefício"
    observacao: "Ren tentou confirmar se Kethra estava sendo seguida, mas a rolagem de Percepção falhou: 7 contra CD 13. Ele não viu cauda óbvia, mas não teve certeza limpa. Depois a abordou como estrangeiro perdido e inofensivo; Atuação 12 contra CD 13, falha. Ao revelar que sabia dos problemas dela e oferecer 8 PO, a tentativa de Persuasão falhou: 7 contra CD 14. Kethra não aceitou o ouro, interpretou parte da aproximação como possível nova pressão e avisou que pagar diretamente os cobradores pode aumentar o preço. Ainda assim, não chamou guarda e deixou uma abertura: fonte seca atrás dos azulejos verdes, quando o sino menor tocar antes do segundo sino. Kethra voltou para o fluxo rumo a Narwhal."
  segunda_mare:
    horario_aproximado: "02:00"
    janela_segura_para_chegar_antes: "até cerca de 01:30"
    observacao: "No jargão portuário desta noite, 'antes da segunda maré' indica antes da segunda virada perceptível da maré após o anoitecer. Não é relógio exato, mas Ren entende que ainda há algumas horas, não a noite inteira."
