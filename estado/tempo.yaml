observacao: "A data exata segue pendente; durante a Sessão 001, cerca de uma hora a uma hora e meia se passou entre a abordagem de Mara, o reconhecimento da Red Sail Tavern e o retorno de Ren ao balcão da The Silver Lily. Ren meditou por 30 minutos, voltou aos arredores da Red Sail Tavern, observou o local do alto do galpão de cordame, seguiu Pell até uma passagem escura perto de Fishtown, retornou à Red Sail, roubou a prancheta de Velis durante um incêndio criado como distração, despistou um perseguidor, abandonou a Silver Lily, examinou a prancheta num abrigo abandonado, descansou por uma hora e chegou à Casa da Rede Morta. Às 01:18 viu o esquife chegar; por volta de 01:19 iniciou confronto ao conjurar Escuridão sobre o barco; por volta de 01:21 escapou do cais por um canal lateral com a caixa e a pessoa amarrada, em esquife danificado; por volta de 01:25 encostou o barco e se escondeu provisoriamente com a caixa e a jovem resgatada; por volta de 01:27 abriu a caixa e descobriu materiais de falsificação ligados à falsa marca da lua velada; por volta de 01:37 abandonou a caixa, levou Nera, o carimbo e o bilhete para a oficina de velas abandonada; por volta de 01:45 improvisou abrigo básico dentro da oficina; por volta de 01:55 começou conversa baixa com Nera e descanso leve; por volta de 02:05 Nera revelou Dain 'Brass' Mord, a ligação provável com Narwhal Manor e a existência de seu livro de provas; por volta de 02:15 Ren revelou sua história e Nera revelou o risco ao irmão Tavin; às 02:55 Ren completou o descanso curto e recuperou ki; por volta de 03:02 chegou com Nera à beira da Rua da Corda usando Passos sem Pegadas; por volta de 03:04 neutralizou silenciosamente um vigia ligado a Brass perto da casa de redes azuis; por volta de 03:07 entrou na casa e confirmou Tavin vivo; por volta de 03:13 saiu com Nera e Tavin e recuperou o livro de provas na banca de Nera antes da chegada de buscadores da Red Sail; por volta de 03:27 chegou à borda do Temple District e ouviu de Nera a recomendação da Casa da Aurora Menor e da Irmã Maerra Thandrel; por volta de 03:29 chegou diante da Casa da Aurora Menor; por volta de 03:31 entrou e encontrou Maerra; por volta de 03:32 tentou deixar Nera e Tavin no abrigo, mas Maerra exigiu informação mínima antes de deixá-lo sair; por volta de 03:33 Ren pediu conversa reservada, e Maerra o levou à saleta de ervas atrás do altar; por volta de 03:35 contou a Maerra sobre a Red Sail, Masao, Aiko e sua vingança, quase colapsando de cansaço; por volta de 03:35 a 04:05 Ren apagou por meia hora, sem recuperar ki; por volta de 04:08 Maerra sugeriu Silva Elkwood/circo dos Mooney como abrigo discreto para Nera e Tavin, além de Tyr e Ways Unknown como alternativas; entre 04:08 e 05:08 Ren completou descanso curto enquanto Maerra copiava trechos essenciais e preparava bilhete para Silva; ao fim, um homem chegou à porta perguntando por uma gravadora de lacres ferida; por volta de 05:12 Ren, Nera e Tavin saíram pela porta lateral sem serem percebidos e seguiram rumo ao circo dos Mooney; por volta de 05:28 chegaram à borda do acampamento do Jack Mooney & Sons Circus."
