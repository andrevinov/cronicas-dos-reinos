schema_ecologia_local: 1
natureza: roteador_operacional_nao_canonico
estatuto: restricao_de_plausibilidade
observacao: >-
  Estes perfis descrevem a ecologia cotidiana plausível de cada local canônico.
  São filtros operacionais derivados, não fatos novos: não estabelecem presença,
  evento, segredo, horário real nem comportamento de NPC nomeado. Estado canônico,
  cena atual, arco e eventos pendentes sempre prevalecem.
escala_ritmo:
  0: quase_inativo
  1: baixo
  2: medio
  3: alto
periodos:
- amanhecer
- dia
- anoitecer
- noite
regras:
  exige_local_canonico: true
  cobertura_total_do_registro: true
  atores_sao_papeis_nao_npcs: true
  perfil_nao_estabelece_presenca: true
  perfil_nao_cria_evento: true
  perfil_nao_cria_conhecimento: true
  microevento_futuro_deve_respeitar_tags_e_canais: true
  estado_canonico_prevalece: true
