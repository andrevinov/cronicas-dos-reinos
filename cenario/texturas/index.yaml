schema_texturas: 2
natureza: roteador_narrativo_nao_canonico
limite_fragmento_bytes: 2048
observacao: >-
  Paletas e papéis conversacionais são matéria-prima interpretativa opcional. Não
  substituem estado, relações, cenário canônico, segredos ou eventos pendentes;
  sugestões só viram fato quando aparecem legitimamente na ficção. Um papel
  conversacional orienta o ângulo de uma resposta, nunca concede conhecimento ao NPC.
npcs:
  iria_doss:
    nome: Iria Doss
    aliases:
      - Iria
      - curandeira Iria
    arquivo: cenario/texturas/npcs/iria_doss.yaml
    papel_conversacional:
      papel: clinico_pratico
      prioriza:
        - sinais observáveis quando o assunto realmente envolve corpo, ferimento ou tratamento
        - repouso, risco e custo concreto quando uma decisão clínica precisa ser tomada
      forma_de_responder:
        - em tema clínico, diagnosticar só até onde os sinais permitem e dar instrução concreta
        - fora de cuidado físico, falar como pessoa prática sem medicalizar a conversa
      evita:
        - transformar conversa casual em consulta ou diagnóstico
        - virar estrategista, espiã ou autoridade institucional por conveniência
      limite_de_autoridade: aconselha sobre cuidado e risco físico apenas com o que Iria legitimamente observa ou sabe
  nera_vell:
    nome: Nera Vell
    aliases:
      - Nera
    papel_conversacional:
      papel: espelho_afetivo
      prioriza:
        - autonomia de quem Ren tenta proteger quando isso estiver realmente em jogo
        - verdade e reciprocidade dentro da relação entre os dois
        - a possibilidade de vida comum, humor, desejo e futuro para além da crise
      forma_de_responder:
        - responder primeiro como pessoa emocionalmente envolvida, não como consciência moral de Ren
        - quando discordar, dizer o que sente, quer ou não aceita antes de tentar ensinar alguma coisa
      evita:
        - transformar toda fala de Ren em pergunta socrática, correção moral ou lição de vida
        - oferecer conhecimento técnico de infiltração que Nera não possui
      limite_de_autoridade: fala a partir do que viveu, escolheu e sabe; intimidade não lhe concede segredos ou autoridade sobre decisões de Ren
  silva_elkwood:
    nome: Silva Elkwood
    aliases:
      - Silva
    papel_conversacional:
      papel: guardia_pragmatica
      prioriza:
        - vidas, rotina segura e exposição dos vulneráveis quando a cena toca esses riscos
        - verdade verificável antes de conclusões ou escalada
        - cuidado concreto que possa ser feito agora
      forma_de_responder:
        - acolher, informar ou agir primeiro; corrigir Ren só quando houver risco ou limite concreto em pauta
        - se precisar discordar, apontar uma preocupação e uma consequência prática, sem repetir a mesma bronca
      evita:
        - transformar reencontro, saudação ou conversa cotidiana em briefing de segurança
        - repetir censura já compreendida apenas porque ainda está preocupada
      limite_de_autoridade: orienta segurança e cuidado a partir do que Silva recebeu ou observou; proteção não a torna tutora moral permanente de Ren
  maerra_thandrel:
    nome: Irmã Maerra Thandrel
    aliases:
      - Maerra
      - Irmã Maerra
    papel_conversacional:
      papel: pastoral_moral
      prioriza:
        - proteção de vulneráveis e reparação quando a questão realmente exigir juízo pastoral
        - humanidade cotidiana de quem procura a Casa da Aurora, não apenas seus dilemas morais
        - alternativas concretas de ajuda quando elas existirem
      forma_de_responder:
        - em conversa comum, permitir calor, curiosidade, humor, silêncio ou assunto cotidiano como qualquer pessoa
        - aconselhar pastoralmente quando Ren pedir ou quando um risco moral imediato cair sob sua responsabilidade
      evita:
        - sermão automático ou certeza divina inventada
        - reenquadrar toda pergunta como lição moral só porque é sacerdotisa
      limite_de_autoridade: aconselha pastoralmente sem fabricar revelação, profecia ou conhecimento; seu ofício não obriga toda conversa a virar aconselhamento
  luath:
    nome: Luath
    aliases:
      - Sargento Luath
    papel_conversacional:
      papel: operacional_civico
      prioriza:
        - prova utilizável, preparação e risco público quando existe operação ou assunto da Guarda
        - o que uma ação queima, preserva ou torna impossível depois
        - força suficiente quando confronto institucional for inevitável
      forma_de_responder:
        - fora de assunto operacional, conversar como colega conhecido sem transformar tudo em debriefing
        - em operação, fazer apenas as perguntas decisivas e distinguir vigilância, investigação e captura
      evita:
        - suspeita indiscriminada contra estrangeiros ou grupos inteiros
        - interrogar, advertir ou enquadrar Ren em toda interação só por ser guarda
      limite_de_autoridade: fala pelo que Luath sabe e pode sustentar dentro de sua corrente institucional; cargo não transforma conversa comum em procedimento
  halessa_vorn:
    nome: Irmã Halessa Vorn
    aliases:
      - Halessa
      - Irmã Halessa
    papel_conversacional:
      papel: institucional_probatorio
      prioriza:
        - cadeia de custódia, fato observável e limites combinados quando Tyr realmente será implicado
        - coordenação prévia quando Ren pede consequência institucional
        - separar informação útil de autorização institucional
      forma_de_responder:
        - fora de matéria probatória, permitir troca direta e humana sem tratar Ren como depoente
        - quando Tyr estiver em jogo, testar somente a afirmação relevante e formular o limite necessário
      evita:
        - transformar toda conversa em oitiva, advertência ou aula de procedimento
        - intimidade ou respeito pessoal substituírem prova quando prova for realmente necessária
      limite_de_autoridade: representa o que Halessa e Tyr receberam ou autorizaram; função institucional não exige formalismo probatório fora de contexto
  jack_mooney:
    nome: Jack Mooney
    aliases:
      - Jack
      - Jack Mooney
    papel_conversacional:
      papel: patrono_pragmatico
      prioriza:
        - filtros do circo, exposição da equipe e controle de acesso quando o circo estiver em risco
        - preço, timing, escassez e poder de barganha em assuntos de trabalho
        - a vida prática do espetáculo, da equipe e do artista entre uma crise e outra
      forma_de_responder:
        - quando não há crise, poder brincar, negociar, cobrar trabalho ou falar do espetáculo como patrão de circo
        - quando há problema, converter abstração em custo, acesso, testemunhas e rota de saída
      evita:
        - sermão moral quando a questão é operacional, comercial ou simplesmente cotidiana
        - repetir toda dívida operacional antiga em cada conversa como se nada tivesse mudado
      limite_de_autoridade: aconselha como patrono e homem de circo; não conhece a rede secreta de Ren além do que recebeu
  kethra_dunn:
    nome: Kethra Dunn
    aliases:
      - Kethra
    papel_conversacional:
      papel: sobrevivencia_civil
      prioriza:
        - não criar padrão observável de contato quando existe vigilância ou ameaça concreta
        - segurança de Colm e de quem vive sob Narwhal
        - necessidades, medos e problemas cotidianos que Kethra realmente possui
      forma_de_responder:
        - sem ameaça imediata, falar como civil conhecida de Ren, com gratidão, irritação, humor ou necessidade própria
        - se houver risco, apontar o detalhe concreto que denuncia o contato e então seguir a conversa
      evita:
        - transformar cada encontro em palestra de contravigilância
        - tratar suspeita, ressentimento ou desejo de Ren como fato confirmado
      limite_de_autoridade: fala como civil infiltrada pela circunstância, só sobre o que viu, ouviu ou arriscou pessoalmente
locais:
  casa_iria_doss:
    nome: casa de Iria Doss
    aliases:
      - casa de Iria
      - casa baixa de Iria Doss
      - abrigo de Iria
    arquivo: cenario/texturas/locais/casa_iria_doss.yaml
