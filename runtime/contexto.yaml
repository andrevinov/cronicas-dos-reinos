efeitos_temporarios:
  ren_desarmado:
    descricao: Ren partiu para a operação sem espadas, shurikens ou qualquer arma; leva sob o disfarce apenas suas
      ferramentas de ladrão e objetos coerentes com o velho erudito.
    duracao: até Ren recuperar ou voltar a portar suas armas
    inicio: 05:15 de 12 Eleasis
  descanso_longo_incompleto:
    descricao: Ren dormiu cerca de quatro horas depois de várias noites de sono insuficiente; não completou descanso
      longo e não recebeu recuperação mecânica.
    duracao: até completar um descanso longo
    inicio: 00:45 de 12 Eleasis
  disfarce_velho_erudito:
    descricao: Nera ajudou a remover a maior parte do disfarce de velho erudito; ainda restam maquiagem e fixadores
      que Ren precisa limpar nos próprios aposentos. A aparência já não serve para infiltração convincente.
    duracao: até Ren concluir a remoção
    inicio: 22:35 de 12 Eleasis
  narwhal_alerta_para_observador_idoso:
    descricao: A segurança de Narwhal Manor não reconheceu Ren, mas suspeita que um velho erudito vigiava a entrada.
      Ao menos dois homens receberam ou compartilharam essa descrição; a mansão está mais alerta a observadores.
    duracao: até a segurança encerrar o alerta ou a situação mudar
    inicio: 19:50 de 12 Eleasis
  lacuna_dez_minutos_vigilancia_velis:
    descricao: Ren perdeu visão das saídas de Narwhal Manor durante aproximadamente dez minutos enquanto despistava
      o guarda e se reposicionava; não sabe se Velis ou um mensageiro saiu nesse intervalo.
    duracao: até obter informação que confirme ou descarte uma saída nesse intervalo
    inicio: 19:55 de 12 Eleasis
  pista_endereco_portador_velis:
    descricao: Ren confirmou por escuta que a antiga casa de cópias de portadas azul-escuras é uma isca de contravigilância.
      O portador sabia do velho observado em Narwhal e foi enviado para atrair qualquer perseguidor; uma voz afirmou
      que a mensagem importante não passou pela mão dele. A rota real permanece desconhecida.
    duracao: conhecimento persistente
    inicio: 20:51 de 12 Eleasis
