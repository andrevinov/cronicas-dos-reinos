resumo_imediato: Ren se despediu de Nera, tomou banho e deixou o circo vestido com seu traje oriental de infiltração,
  rosto pintado de negro e coberto até o nariz, wakizashi e shuriken equipados. Segue para assumir posição na escada
  junto à ferraria antes do movimento de Brass. Nera conhece o plano geral e, se Ren se atrasar, avisará Silva para
  acionar Luath sem expor o circo.
prazos_e_alertas: Antes do poente, Luath colocará dois observadores sem uniforme nas cabeceiras da ponte baixa e
  um terceiro homem distante como mensageiro. Se o plano não mudar, Brass cruzará a ponte depois do segundo sino
  após o poente com dois homens para encontrar Rook. Ren prometeu trabalho na Casa do Salgueiro Seco antes do amanhecer
  de 10 Eleasis.
