- transacao: s015-8e25b321eaac007d
  sessao: 15
  resumo: Ren confirmou que seu círculo próximo sabia do trabalho de Shinta na Galeria e atribuiu a Luath parte
    de sua decisão de permanecer dentro da lei. Luath tratou a segurança dos protegidos como esperança plausível,
    não certeza, e considerou outras fontes possíveis do vazamento. A afinidade institucional entre ambos aumentou;
    confiando na palavra de Ren, Luath removeu as algemas, mas manteve a cela trancada e a custódia formal enquanto
    prossegue nas verificações.
  deltas:
  - alvo: npc:luath
    caminho: medidores.vinculo
    fato_canonico: Ren disse a Luath que permanece voluntariamente sob custódia também porque o sargento o convenceu
      a não se tornar um fora da lei como seus inimigos, e sustentou essa escolha quando ela lhe custou liberdade
      e a cobertura de Shinta.
