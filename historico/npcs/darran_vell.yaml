- transacao: s022-nv04-c39dd2fd035845f1a9c4141f4dc0dc3f
  sessao: 22
  resumo: 'A correção da regra de nocaute foi aplicada: Darran estava com 1/4 PV e Inconsciente. Ren obteve 11 contra
