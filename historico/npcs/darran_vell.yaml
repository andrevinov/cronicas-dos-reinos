- transacao: s022-nv04-bad831e330ff477902e7ff27ed38f4bf
  sessao: 22
  resumo: Ren disse a Darran que talvez esteja salvando sua vida, afirmou não ser inimigo e pediu apenas respostas.
    Darran rejeitou a culpa pelo sequestro e ofereceu responder se Ren o libertar depois. Intuição 9 contra CD 10
    falhou; Ren não sabe se a proposta é sincera ou apenas uma forma de ganhar tempo enquanto a busca se aproxima.
  deltas:
  - alvo: npc:darran_vell
    caminho: status
    op: set
    valor: consciente, ferido e sob controle de Ren no sótão; assustado e ressentido, ofereceu responder às perguntas
      se fosse libertado depois
- transacao: s022-nv04-852170048d4ec46e6b983d02ecf76eec
  sessao: 22
  resumo: 'Persuasão 20 contra CD 12 levou Darran a confessar que recebeu duas peças de ouro, sem registro, para
    aplicar a contramarca. Ele explicou que as cópias não precisam ser falsificadas: autorizações antigas e autênticas
    podem ser apresentadas fora do contexto para legitimar uma carga diferente. Darran agora demonstra medo concreto
    das pessoas por trás do pedido e pediu para não ser devolvido à Mesa de Cargas. A cadeia já pode ser levada
    a Tomas, mas ainda não foi entregue.'
  deltas:
  - alvo: npc:darran_vell
    caminho: status
    op: set
    valor: consciente, ferido e agora cooperando por medo das pessoas por trás do pedido; confessou pagamento indevido
      e pediu para não retornar à Mesa de Cargas
- transacao: s022-3943ed9f60f6aa3a
  sessao: 22
  resumo: Darran aceitou acompanhar Ren em silêncio. Furtividade 16 contra CD 15 permitiu que saíssem por terra
    do setor imediato da busca sem contato com a ronda. Às 20h50, Ren deu sua capa a Darran e usou o Broche do Semblante
    Humilde, assumindo aparência comum até 21h50; o uso ficou indisponível até o próximo amanhecer. Às 21h00, ambos
    alcançaram um reservado isolado numa casa de sopas longe do porto e podem continuar a conversa.
  deltas:
  - alvo: npc:darran_vell
    caminho: local
    op: set
    valor: com Ren, no último reservado de uma casa de sopas longe do porto
  - alvo: npc:darran_vell
    caminho: status
    op: set
    valor: consciente, ferido e cooperando; deixou o setor de busca por vontade própria com Ren, está coberto pela
      capa dele e disposto a continuar respondendo
- transacao: s022-nv04-5b14a75a7afc0335b699b1b9f2410db2
  sessao: 22
  resumo: Ren contou a Darran que persegue um criminoso poderoso de Kozakura cuja rede estaria usando o porto para
    cargas ilícitas, falsificações e mortes. Darran não confirmou uma chegada numerosa de kozakuranos, mas relatou
    três homens de fala oriental que, em noites diferentes, perguntaram por cargas sem reclamante, armazéns e trocas
    de turno sem apresentar despacho; um deles era o homem do casaco cinza. Intuição 17 contra CD 12 mostrou que
    Darran ainda não aceita toda a explicação como fato, porém ac…
  deltas:
  - alvo: npc:darran_vell
    caminho: status
    op: set
    valor: consciente, ferido e cooperando; teme uma operação organizada ligada ao porto e procura demonstrar utilidade
      para obter proteção de Ren
- transacao: s022-nv04-c91f123a4cca516706a0661bac18d700
  sessao: 22
  resumo: Ren informou a Darran que pretende capturar o homem do casaco cinza e pediu um documento para impedir
    a retirada das cópias. A janela conhecida de retirada já está em curso, das 20h às 22h. Darran explicou que
    não pode revogar as autorizações antigas, mas pode assinar uma retratação da contramarca, com o código da ronda,
    os três despachos e a confissão do pagamento; isso daria a Tomas fundamento para reter as cópias se o documento
    chegar antes da entrega. Darran pode escrever sem voltar à Mesa,…
  deltas:
  - alvo: npc:darran_vell
    caminho: status
    op: set
    valor: consciente, ferido e cooperando; pode redigir fora da Mesa uma retratação assinada da contramarca, mas
      condiciona a confissão a não ser abandonado sem proteção
