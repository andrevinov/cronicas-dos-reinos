- transacao: s022-3952ecb9ff86b0d4
  sessao: 22
  resumo: Ren gastou 1 Focus e cruzou com Darran um vão largo entre telhados, rompendo o caminho imediato dos perseguidores.
    Uma interrupção na rua comprou alguns segundos, mas Ren falhou em ocultar seu rumo; às 20h30 ele alcançou um
    sótão temporário fora do porto, enquanto a busca se organiza na direção correta. Darran permanece inconsciente,
    estável e com 0 PV; primeiros socorros confirmaram sua estabilidade, mas não o despertaram.
  deltas:
  - alvo: npc:darran_vell
    caminho: npc.local
    op: set
    valor: com Ren, inconsciente, no sótão vazio de uma antiga oficina além do porto
  - alvo: npc:darran_vell
    caminho: npc.status
    op: set
