schema_historico_relacao: 1
id: luath
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Luath
  tipo: sargento da City Guard / supervisor possível da Night Watch
  local: posto da City Guard / Night Watch
  status: contato operacional cauteloso
  atitude_para_ren: cautelosa, direta e avaliadora
  confianca: moderada operacional
  respeito: prático crescente, contido por cautela
  motivo: 'Maerra Thandrel descreveu Luath como honrado de modo prático: um homem que cumpre dever, não vende gente
    pobre por conveniência e entende que a cidade tem sujeira sob as aparências. Ele é útil como ponte para a Night
    Watch e para rua, não como instrumento direto da vingança de Ren. Ren chegou ao posto da City Guard/Night Watch
    ao amanhecer carregando a cópia parcial selada por Maerra. Luath estava disponível, observou mãos, cintura,
    trouxas e saídas antes de perguntar o nome de Ren e se ele veio trazer, fugir ou vender problema. Ren entregou
    o documento e disse que vinha deixar recado a pedido de amigo de fé. Luath reconheceu o peso prático de Maerra
    o bastante para criar privacidade, mas não confiou automaticamente em Ren. Levou Ren a um depósito lateral e
    pediu fatos sobre gente viva em risco nas próximas horas, sem poesia, juramento ou nomes grandes antes dos pequenos.
    Ren então revelou o próprio nome, origem, Masao Hirasawa, o assassinato de Aiko e a ameaça contra a seladora
    e o irmão dela. Luath aceitou que há risco civil imediato e acionou patrulheiros contra as buscas ostensivas
    da Red Sail como perturbação da paz, intimidação e usurpação de autoridade. Ao mesmo tempo, deixou claro que
    ajudará nos vivos, não na caça pessoal de Ren. Ren respondeu com informações práticas: a pressão atual acontece
    no circo de Jack Mooney; Dain Mord é conhecido como Brass; e o protocolo de contato envolve ficha de cobre,
    vela vermelha e cordão azul. Luath reconheceu Dain Mord como nome útil, aceitou não mandar guarda abrir baús
    e carroças no circo sem ordem ou flagrante e enviou patrulheiros para pressionar buscas ilegais da Red Sail
    nas ruas e acessos. Ele segue cauteloso com a vendeta de Ren e avisou que ajudará com provas e testemunhas,
    não com corpos. Ao sair, Ren afirmou que Masao Hirasawa não merece cela. Luath não retirou a ajuda contra a
    Red Sail, mas registrou Ren com mais força como risco de justiça privada. Mais tarde, Ren retornou ao posto
    em perfil discreto, usando a cobertura pública de artista, para pedir apoio ao Benefício da Lona Aberta como
    questão de ordem pública. Luath recusou compromisso formal da Night Watch e proibiu uso do nome da guarda em
    anúncio, mas ofereceu uma via limitada: com aviso escrito de Jack e assinatura comunitária/temporal de Silva
    ou outro nome de templo, pode fazer ronda normal passar pelo caminho, dispersar problemas e tratar intimidação
    da Red Sail como perturbação da paz. Quando Ren pressionou Luath a ir além disso, criticando burocracia e oferecendo
    serviços secretos para obter provas sem que ninguém soubesse, Luath rejeitou duramente a proposta. Manteve o
    acordo limitado anterior, mas passou a vigiar ainda mais a tendência de Ren a justificar meios ilegais por um
    bem maior. Depois, Ren entregou o aviso escrito do Benefício da Lona Aberta sem nova discussão e com postura
    humilde. Luath aceitou o documento como limpo e manteve a via limitada de ronda normal, sem restaurar confiança
    ampla. Na manhã de 4 Eleasis, Ren procurou Luath como cidadão pobre, relatou Bram Vask, Kethra Dunn, Colm/Dent
    e o risco de Bram pressionar a família, oferecendo o caderno de contas sujas de Bram como prova, mas sem explicar
    como tirou Colm da loja. Luath examinou o caderno, copiou marcas úteis e o devolveu, recusando tratá-lo como
    prova formal limpa sem cadeia de custódia ou testemunho. Ainda assim, a Night Watch pressionou Bram por cobrança
    violenta, possível cárcere/trabalho por dívida e risco a Kethra, nos termos da guarda, não nos termos de Ren.
    Mais tarde naquela manhã, Luath mandou chamar Ren ao mercado de peixe após a guarda encontrar quatro barris
    mal marcados, com suspeita de que a conta original era de seis. Luath envolveu Ren porque as pistas tocavam
    peixe, cera vermelha, barris e o padrão de fios que Ren vinha seguindo, mas deixou claro que não estava chamando
    Ren por causa da vingança dele. Ren identificou o pó como explosivo quando seco e exposto a chama, ligou a cera
    vermelha à oficina dos tintureiros e contou a Luath sobre a mulher de vermelho, a cicatriz, a marca de sol apagado
    e o homem de manga cinza com dois anéis. Luath aceitou a parte concreta e enviou guardas para cercar a oficina
    dos tintureiros com cautela. Quando Ren alertou que ataques contra mercado, água, ponte, templo ou guarda deixariam
    a cidade mais frágil e desesperançada, Luath tratou a linha como ameaça civil concreta e mandou avisos discretos,
    sem anunciar pólvora ao público. Depois deu a Ren as informações sobre a carroça dos dois barris faltantes.
    A trilha se perdeu no mercado, e uma explosão parcial atingiu a balança velha antes que Ren chegasse ao ponto
    certo. Ren desceu para Sarbreen, neutralizou de modo não letal o homem de manga cinza e o vulto leve, removeu
    o acionamento imediato do barril e entregou os dois vivos a Luath pela corda, junto do dispositivo. Luath recusou
    interrogar os prisioneiros na boca do mercado por risco de rumor, testemunha ruim e explosivo remanescente,
    mas deixou uma via clara para Ren buscar informação depois do segundo sino ou receber recado no circo. A utilidade
    prática de Ren aumentou aos olhos de Luath, especialmente por entregar vivos e prova material, mas a cautela
    institucional permanece. Depois do segundo sino, Ren procurou Luath no posto da Night Watch em roupa pobre.
    A chegada reforçou uma linha pública fina de que o forasteiro pobre admitido no mercado tem entrada com a guarda.
    Luath revelou apenas informação controlada, recusou acesso direto aos prisioneiros e aceitou levar uma pergunta
    curta de Ren ao interrogatório, sem torná-lo auxiliar oficial. Na noite de 5 Eleasis, Ren retornou ao posto
    após recuar da Escada das Sete Águas. Ele mostrou o mapa público da Escada, a cópia discreta dos porões secos
    de Brunna Torkel e relatou a galeria baixa, o vigia, o fio de acionamento, a marca de sol apagado e o depósito
    sem tabuleta com janela de observação. Luath cruzou os mapas com Ren, mas eles não deram rota segura de invasão.
    Luath avaliou a Escada como possível olho, boca, controle ou entrada-isca, mais do que coração confirmado da
    operação, e preferiu colocar vigilância discreta de superfície em vez de mandar uma batida formal pela escada.
    Na noite de 6 Eleasis, Ren chegou sem cauda útil após a apresentação fechada da Casa Veyr e relatou a pista
    de Dalm: Masao, Ponte Baixa, segunda maré, porões secos, papéis antes de lâminas, gravadora e menino. Luath
    aceitou não mandar homens para dentro da Ponte Baixa antes da madrugada para não queimar a entrada. Se Ren não
    voltar até o fim da manhã, Luath tratará a ausência como crime, prova e responsável, não como simples corpo
    de estrangeiro descartável. Na madrugada de 7 Eleasis, Ren voltou vivo ao posto e entregou três evidências retiradas
    da sala seca da Ponte Baixa, relatando a rota, o arquivo vivo, a brasa protegida, o pano com linha de cinza,
    a lingueta do trilho, a segunda portinhola e a maré entrando na câmara de retenção. Luath reconheceu utilidade,
    mas não conseguiu transformar o material em prova limpa, batida imediata ou lacre de Tyr durante a madrugada;
    ofereceu selar o pacote como material recebido de informante em risco sob custódia provisória da Night Watch,
    dependendo de como Ren quer aparecer no registro. Ren escolheu não usar Ren Kage, homem sem nome ou Ren Kagehira,
    pedindo registro como testemunha/fonte em risco. Luath aceitou a formulação como defensável, selou o material
    como fonte reservada sob risco plausível de represália, reteve a identidade consigo até requisição selada de
    autoridade competente e guardou o pacote em gaveta de ferro. Antes de se despedir, Ren comparou Luath aos Miburo/Shinsengumi
    de Kozakura: homens do bakufu odiados por criminosos, não santos, mas honrados e ainda de pé quando a cidade
    fingia não ver a sujeira. Luath recebeu o respeito de modo seco, sem transformar isso em intimidade, mas a fala
    reforçou camaradagem institucional.

    '
  informacoes_indiretas:
  - Luath não é santo, mas isso o torna mais útil do que ingênuo.
  - Luath pode ouvir sobre sequestro, falsificação, intimidação, Red Sail, Narwhal e testemunhas em risco.
  - Luath trabalha dentro de uma corrente institucional; mesmo homens honestos podem ser puxados por superiores.
  riscos:
  - Se Ren abrir a conversa como vendeta para matar Masao, Luath tenderá a reagir como guarda.
  - Entregar Nera e Tavin a Luath de imediato pode colocá-los dentro de uma cadeia institucional que Ren ainda não
    controla.
  - Luath pode estar sob pressão para resolver problemas do porto sem atingir nomes influentes.
  - Luath agora possui dois prisioneiros ligados aos barris e ao acesso de Sarbreen; se eles sumirem, morrerem ou
    forem tomados por autoridade superior, a confiança prática de Ren na guarda pode ser testada.
  - A ligação pública entre Ren e a entrada no perímetro do mercado ainda é fraca, mas uma peixeira e um escrivãozinho
    de guilda viram um forasteiro pobre ser admitido pela guarda antes da explosão parcial.
  - A ida de Ren ao posto depois do segundo sino reforçou a linha pública fina de que o forasteiro pobre do mercado
    tem entrada com a guarda; a ligação com Kage ainda é fraca, mas uma memória na borda do circo pode crescer.
  - Se Luath mover guardas demais para a Escada das Sete Águas, pode queimar a entrada, alertar o outro lado e transformar
    a pista de Ren em perímetro público.
  - Se Ren não voltar da Ponte Baixa até o fim da manhã, Luath pode mover busca e investigação, mas isso provavelmente
    queimará a entrada.
  - O pacote reservado da Ponte Baixa não nomeia Ren, mas ainda pode sofrer pressão institucional futura dentro
    da guarda ou de Tyr.
  - O selo de Maerra comprou privacidade, não confiança.
  - Luath agora sabe que Ren está caçando Masao por uma morte familiar; isso o torna mais cauteloso com Ren.
  - A franqueza de Ren sobre Masao não merecer cela tornou Luath mais propenso a vigiar Ren se corpos aparecerem.
  - A oferta de Ren de realizar serviços secretos para obter provas fez Luath enxergá-lo como risco maior de conluio
    e justiça privada.
  acordos_ou_acoes:
  - Luath ficou com a cópia parcial selada de Maerra.
  - Luath acionou patrulheiros para enquadrar buscas não autorizadas da Red Sail como perturbação da paz, intimidação
    e usurpação de autoridade.
  - Luath recebeu de Ren a informação de que Dain Mord é Brass e o protocolo da ficha de cobre com vela vermelha
    e cordão azul.
  - Luath não mandará busca aberta ao circo de Jack Mooney sem ordem, flagrante ou razão melhor, mas pressionará
    Red Sail nas ruas e acessos.
  - A pressão de patrulheiros acionados por Luath ajudou a dispersar a Red Sail do perímetro do circo após a busca
    controlada de Jack.
  - Luath recusou apoio formal da Night Watch ao Benefício da Lona Aberta.
  - Luath recebeu o aviso escrito limpo de Jack/Silva antes do pôr do sol.
  - Luath aceitou orientar ronda normal perto do Benefício da Lona Aberta, sem apoio formal público.
  - A Night Watch não pode ser usada em cartaz, anúncio ou como selo público do evento.
  - Luath recusou qualquer serviço off-record de Ren em nome da guarda.
  - Luath examinou o caderno de Bram, copiou marcas úteis e devolveu o caderno a Ren por não aceitar prova irregular
    sem cadeia de custódia.
  - Dois guardas pressionaram Bram Vask em sua loja após o relato de Ren, sem prender Bram.
  - Luath mandou chamar Ren ao mercado de peixe quando quatro barris mal marcados foram encontrados e dois estavam
    desaparecidos.
  - Luath sabe por um peixeiro que um homem de manga cinza e dois anéis mandou descarregar os barris por intermediário.
  - Luath ouviu de Ren que o pó dos barris explode se estiver seco e encontrar chama.
  - Luath recusou acesso direto de Ren aos prisioneiros, mas aceitou levar uma pergunta curta ao interrogatório.
  - Ren entregou a Luath a linha de interrogatório sobre a explosão ter sido feita para ser ouvida e sobre descobrir
    qual área da cidade ficaria em risco.
  - 'Luath reformulou a pergunta para os prisioneiros como: ''Para onde a luz ia voltar depois que o mercado ouvisse?'''
  - Luath enviou guardas para cercar a oficina dos tintureiros com cautela, sem entrar chutando porta se houver
    cheiro do pó.
  - Luath recebeu de Ren a linha de raciocínio sobre alvos capazes de quebrar o ânimo da cidade e mandou avisos
    discretos para mercado, água, ponte, templo e guarda.
  - Luath informou a Ren que a carroça dos dois barris faltantes tinha eixo baixo, roda traseira esquerda ruim,
    tábua traseira manchada de vermelho e foi vista rumo à balança velha pelo Beco da Salmoura.
  - Após a falha de Ren em manter a trilha no mercado, uma explosão parcial atingiu a balança velha; Luath passou
    a conter pânico, chama e curiosos.
  - Luath respondeu a Ren sobre os subterrâneos de Ravens Bluff, nomeando Sarbreen como a antiga cidade anã sob
    a cidade atual.
  - Luath informou que entradas conhecidas perto dali passam por drenagens do cais e porões registrados de armazéns,
    mas que a abertura imediata é a própria passagem aberta pela explosão.
  - Luath aceitou que Ren descesse pela abertura da balança velha, prometendo segurar a boca da passagem, contar
    os barris na superfície e impedir descida desordenada da guarda.
  - 'Luath recebeu de Ren o relato da Escada das Sete Águas: depósito sem tabuleta com janela de observação, fio
    de controle na entrada, marca de sol apagado raspada, galeria baixa, vigia e fio de acionamento antes de câmara
    estreita.'
  - Luath examinou o mapa público da Escada das Sete Águas e a cópia discreta dos porões secos de Brunna Torkel,
    sem reter os originais.
  - Luath não mandará batida formal pela Escada agora; em vez disso, pode colocar vigilância discreta na superfície
    da Escada, no depósito sem tabuleta e em possíveis saídas baixas.
  - Luath recebeu de Ren a pista de Dalm sobre Masao, Ponte Baixa, segunda maré, porões secos, papéis antes de lâminas,
    gravadora e menino.
  - Luath aceitou não mandar homens para dentro da Ponte Baixa antes da madrugada, para não queimar a entrada.
  - Se Ren não voltar até o fim da manhã, Luath tratará o caso como crime, prova e responsável.
  - 'Na madrugada de 7 Eleasis, Ren entregou a Luath três evidências da Ponte Baixa: tira de controle com retenção
    anulada/volume 13/V. Rook/M. Harrow/data recente, tira encerada com Kage/gravadora/menino/antes de maré e cilindro/matriz
    com marca de sol apagado.'
  - Luath não conseguiu montar resposta discreta imediata nem lacre de Tyr de madrugada; pode selar o material sob
    custódia provisória da Night Watch como recebido de informante em risco.
  - Luath selou as evidências da Ponte Baixa como material recebido de fonte reservada sob risco plausível de represália;
    o registro externo não usa Ren Kage, Ren Kagehira, gravadora, menino ou Kage, e a identidade fica retida com
    Luath até requisição selada de autoridade competente.
  - Luath pretende tentar encaminhar o pacote reservado a Tyr no primeiro cinza, antes que superiores curiosos transformem
    a prova em disputa política.
  - Ren comparou Luath aos Miburo/Shinsengumi de Kozakura, oferecendo respeito pessoal por sua honra prática dentro
    de uma cidade suja.
eventos_pos_migracao:
- transacao: s006-9576cbb4e5a3441b
  sessao: 6
  resumo: Ren reconhece que o capanga de Brass pronunciou Masao com familiaridade, não como estrangeiro repetindo
    um nome recém-ouvido, e mantém o disfarce sem denunciar a reação. Vai ao posto e relata tudo a Luath por volta
    de 16:14. Luath considera a pronúncia sinal de circulação habitual do nome, aprova a decisão de não atacar na
    Red Sail e decide colocar dois observadores sem uniforme nas cabeceiras da ponte baixa, com um terceiro homem
    como mensageiro. Eles observarão a troca e seguirão o papel e Ro…
  deltas:
  - alvo: relacao:luath
    caminho: status
    op: set
    valor: Luath recebeu de Ren a rota e o horário declarados por Brass, valorizou sua contenção na Red Sail e preparará
      vigilância discreta na ponte baixa; exige saber o plano de Ren e não autoriza sequestro ou interrogatório
      clandestino
  - alvo: relacao:luath
    caminho: respeito
    op: set
    valor: prático crescente; Luath reconhece que Ren conteve a vingança diante de Brass e trouxe a informação antes
      de agir
- transacao: s006-bc4cb0427970a035
  sessao: 6
  resumo: 'Ren propõe seguir Brass de perto, ocultar-se e fugir se descoberto, priorizando informação e a segurança
    de terceiros. Luath aceita: seus homens manterão vigilância distante e seguirão Brass, Rook ou o papel, enquanto
    Ren poderá aproximar-se para escutar. Luath exige retirada imediata se Ren for percebido e pede que ele escolha
    entre iniciar a perseguição perto da Red Sail ou esperar na Ponte Baixa.'
  deltas:
  - alvo: relacao:luath
    caminho: status
    op: set
    valor: Luath aceitou a proposta de vigilância próxima de Ren, mantendo seus próprios homens à distância; exige
      retirada imediata se Ren for descoberto e aguarda a escolha entre acompanhar Brass desde a Red Sail ou esperar
      na Ponte Baixa
- transacao: s006-68ded1450eea78c3
  sessao: 6
  resumo: Ren escolhe iniciar a perseguição na escada próxima à ferraria, usar o corredor de bancas e divisões da
    rua para ouvir Brass e continuar seguindo-o ao entrar na Ponte Baixa, fugindo se detectado ou atacado e lutando
    apenas em risco de morte. Luath aceita o trajeto, ajusta seus observadores para deixá-lo livre e avisa que nenhum
    guarda o seguirá para dentro da Ponte Baixa.
  deltas:
  - alvo: relacao:luath
    caminho: status
    op: set
    valor: Luath aceitou o trajeto de perseguição escolhido por Ren e ajustará seus observadores para deixá-lo livre;
      deixou claro que nenhum guarda seguirá Ren para dentro da Ponte Baixa
- transacao: s007-d8fcf7042ade170d
  sessao: 7
  resumo: Ren prestou a Luath um relato completo da operação, identificou Kurobane Jinzaburō como uma das Dez Espadas
    de Masao e alertou para a intenção de alterar um documento em pasta selada de Tyr. Luath elevou a ameaça, enviou
    um mensageiro discreto para abrir audiência reservada com Halessa e perguntou qual será a custódia do documento
    falsificado.
  deltas:
  - alvo: relacao:luath
    caminho: status
    op: set
    valor: Luath recebeu o relato completo de Ren sobre Kurobane, os Red Sail, o clã do leste e a tentativa planejada
      de alterar um documento na pasta selada de Tyr; enviou mensageiro discreto para solicitar audiência reservada
      com Halessa Vorn.
- transacao: s007-5b916178927cb36d
  sessao: 7
  resumo: Ren mostrou a Luath o documento falsificado e declarou que o entregará diretamente a Halessa, que possui
    o original. Luath aceitou orientar seus homens a não abordar membros identificados das Dez Espadas, recusou
    suspeita indiscriminada contra estrangeiros e preparará descrições por método e conduta. Ren chegou sem incidente
    à Casa de Tyr; Halessa restringiu o acesso à pasta original e pediu o relato exato antes de receber o documento.
  deltas:
  - alvo: relacao:luath
    caminho: status
    op: set
    valor: Luath orientará a Night Watch a não abordar membros identificados das Dez Espadas sem força preparada;
      recusou suspeita indiscriminada contra estrangeiros e usará descrições, métodos e conduta.
