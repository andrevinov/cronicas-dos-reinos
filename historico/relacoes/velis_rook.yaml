schema_historico_relacao: 1
id: velis_rook
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Velis Rook
  tipo: escrivão menor ligado à alfândega / registros de carga
  local: Narwhal Manor
  status: em cena; alertado; convocação de Tyr entregue
  atitude_para_ren: assustada e hostil
  confianca: nenhuma
  respeito: nenhum
  motivo: 'Ren já havia roubado a prancheta de Velis durante o incêndio da Red Sail Tavern. Em Narwhal Manor, Ren
    derrubou uma lâmpada com shuriken para criar distração e tentou tomar a pasta de documentos de Velis. Velis
    evitou o impacto direto, segurou a pasta e chamou guarda. Em seguida, Ren arrancou a pasta à força e fugiu rápido
    demais para os guardas cercarem a lateral.

    '
  informacoes_observadas_por_ren:
  - Velis chegou à porta lateral de funcionários de Narwhal Manor com pasta rígida de couro encerado.
  - Velis estava com dedos marcados por tinta nova.
  - 'Ren viu na pasta: carimbo de Narwhal Manor, número 13 e a expressão ''retenção anulada''.'
  - Ren tomou a pasta de Velis, ainda não examinada.
  - A pasta continha documentos que apontam Velis como responsável por anulação retroativa ligada ao volume 13.
  - Tyr convocará Velis Rook para responder por anulação retroativa e possível obstrução.
  - A primeira convocação de Tyr a Velis Rook foi entregue; Tyr espera resposta antes do meio-dia.
  - Halessa recebeu três perguntas de Ren para possível uso na oitiva de Velis.
  - Ren ouviu, perto da lateral da Casa de Tyr, uma mulher ligada a interesses de casa rica preparar Velis para
    negar instrução de patrono, chamar a anulação de correção de escrita, tratar a marca da lua como recebida e
    dizer que o 'oriental' era M. Harrow.
  - Velis entrou na Casa de Tyr pouco antes do meio-dia; a mulher que o instruiu não entrou.
  - Papel encontrado na balança velha tem marca d'água parcial compatível com o circuito de Narwhal Manor, mas não
    identifica Velis Rook como o homem de mãos limpas.
  - Ren confirmou visualmente durante a perseguição que o homem de mãos limpas não é Velis Rook.
  riscos:
  - Velis sabe que alguém tentou tomar seus papéis na porta lateral.
  - Velis ainda não identificou Ren com certeza como o oriental que procura Masao, mas viu um rosto e uma mão perto
    demais da pasta.
  - Velis pode avisar Narwhal Manor, Brass ou superiores de que a pasta foi roubada por alguém rápido e treinado.
  - A convocação de Tyr pode fazê-lo cooperar, mentir sob pressão ou avisar superiores antes de chegar, dependendo
    de como a ordem o alcança.
  - Se Tyr associar o homem de capuz visto no perímetro a Ren, Sirrus pode ler isso como tentativa de contornar
    a negativa de acompanhar a oitiva.
eventos_pos_migracao:
- transacao: s004-e3ff1e80256cc261
  sessao: 4
  resumo: Ren fala em particular com Irmã Halessa Vorn na Casa de Tyr. Ela confirma que Nera e Tavin seguem protegidos,
    o material permanece selado e Velis compareceu à oitiva, apresentando contradições e nomeando M. Harrow antes
    da pergunta. Três registros corrigidos convergem na Casa de Pesos da Ponte Baixa; Velis deve permanecer disponível,
    mas não está preso. Ren apela à consciência de Halessa e obtém 15 contra CD 15 em Persuasão com vantagem. Ela
    revela que o porteiro noturno Edran Kells desapareceu antes de depor e que a porta de serviço sob o arco oeste
    foi usada, nas noites suspeitas, entre o segundo sino após o pôr do sol e meia hora depois. Autoriza apenas
    observação e proteção imediata de inocentes, não invasão ou confronto.
  deltas:
  - alvo: relacao:velis_rook
    caminho: status
    op: set
    valor: compareceu à primeira oitiva de Tyr, apresentou contradições preservadas e nomeou M. Harrow antes da
      pergunta correspondente; deve permanecer disponível à Casa de Tyr, mas não está preso
- transacao: s010-c969aa0a454deb11
  sessao: 10
  resumo: Ren brincou com Halessa mantendo a voz do velho; ela respondeu com divertimento contido. Seguiu dois passos
    atrás de Garran até Narwhal Manor. Velis não reconheceu Ren sob o disfarce e recebeu a convocação pessoalmente.
    Ao ler o anexo, mostrou tensão, perguntou se poderia consultar alguém e assinou a ciência. Garran retirou-se;
    Velis voltou para dentro. Às 19:35 começa a janela de duas horas de vigilância, sem mensageiro ou contato ainda
    exposto.
  deltas:
  - alvo: relacao:velis_rook
    caminho: informacoes_observadas_por_ren
    op: append
    valor: Em 12 Eleasis, Velis recebeu pessoalmente a convocação suplementar de Tyr em Narwhal Manor. Ao ler o
      anexo, tensionou-se, perguntou se poderia consultar alguém, assinou a ciência e voltou para dentro da mansão;
      não reconheceu Ren sob o disfarce de velho erudito.
  - alvo: relacao:velis_rook
    caminho: riscos
    op: append
    valor: A convocação suplementar agora impõe prazo e preservação de registros; Velis sabe que pode buscar aconselhamento,
      mas qualquer contato que faça ainda não foi identificado por Ren.
- transacao: s010-66014a31daa0bd64
  sessao: 10
  resumo: Ren manteve a vigilância e obteve Percepção 17 contra CD 15. Viu Velis entregar discretamente um papel
    a um rapaz sem libré, pouco depois da convocação. Sob Passos sem Pegadas, obteve Furtividade 22 contra CD 16
    e seguiu o portador por rota cautelosa até uma antiga casa de cópias de três andares, com portadas azul-escuras
    e placa de pena sobre ondas. O mensageiro entrou após batida codificada. O endereço está ligado a Velis, mas
    o destinatário não foi identificado.
  deltas:
  - alvo: relacao:velis_rook
    caminho: informacoes_observadas_por_ren
    op: append
    valor: Às 20:20 de 12 Eleasis, Ren viu Velis entregar discretamente um pequeno papel a um portador sem libré.
      Seguiu o rapaz sem ser detectado até uma antiga casa de cópias de portadas azul-escuras, onde ele entrou mediante
      batida codificada; o destinatário não foi visto.
- transacao: s010-9cf8817277ffcb0f
  sessao: 10
  resumo: 'Ren falhou em Investigação 10 contra CD 14 e escolheu a veneziana mais óbvia, mas Passos sem Pegadas
    permitiu Furtividade 33 contra CD 18. Com Percepção 19 contra CD 14, ouviu três homens: o portador relatou que
    o velho sumiu; eles esperavam que um perseguidor procurasse janela ou saída e revelaram que a mensagem importante
    não passou pela mão do rapaz. Ren descobriu que a casa é uma isca de contravigilância e que outra comunicação
    seguiu caminho desconhecido.'
  deltas:
  - alvo: relacao:velis_rook
    caminho: informacoes_observadas_por_ren
    op: append
    valor: Ao escutar a casa alcançada pelo portador, Ren descobriu que o rapaz fazia parte de uma isca preparada
      após a detecção do velho em Narwhal. Três homens aguardavam que um perseguidor procurasse janela ou saída;
      um deles afirmou que a mensagem importante não passou pela mão do portador. A rota real continua desconhecida.
- transacao: s010-e49df4e854184f27
  sessao: 10
  resumo: Ren relatou integralmente a operação, exceto a identidade de sua carta na manga. Halessa reconheceu o
    valor da isca confirmada, mas recusou tratar Shizune como certeza e censurou Ren por voltar à vigilância após
    contravigilância. A honestidade preservou a coordenação, porém nova quebra encerrará operações clandestinas
    conjuntas. Halessa aceitou proteger a fonte não revelada, mas Tyr não agirá sobre ela sem fato verificável.
    O flerte permaneceu sutil ao falar da porta deixada aberta.
  deltas:
  - alvo: relacao:velis_rook
    caminho: riscos
    op: append
    valor: Tyr agora sabe, pelo relato de Ren, que a resposta de Velis à convocação acionou uma isca de contravigilância
      e que uma segunda comunicação importante seguiu rota ainda desconhecida; isso fortalece a hipótese de orientação
      treinada, mas não prova Shizune.
