schema_historico_relacao: 1
id: halessa_vorn
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Irmã Halessa Vorn
  tipo: ouvidora juramentada de Tyr
  local: Casa de Tyr, Temple District
  status: em cena
  atitude_para_ren: formal, cautelosa e operacionalmente disposta a escalar
  confianca: baixa institucional
  respeito: inicial, pelo foco em testemunhas vivas
  motivo: 'Halessa foi chamada pela guardiã jovem depois que Ren apresentou o selo de Maerra e enquadrou o caso
    como testemunho reservado urgente envolvendo duas vidas em risco. Ela chegou para ouvir o bastante para decidir
    se o caso sobe para Sirrus, permanece no filtro da casa ou exige guarda. Ren apresentou o caso com foco em N.V.,
    T.V., Red Sail, falsificação do selo do clã, tentativa de queima de arquivo, cópia parcial sob custódia de Luath
    e pasta lacrada por Maerra. Halessa percebeu a lacuna de cadeia de custódia da pasta, mas decidiu escalar o
    assunto dentro de Tyr por envolver ameaça viva a testemunhas e possível tentativa de impedir que elas cheguem
    à justiça. Quando Ren afirmou que as testemunhas estão seguras hoje e pediu prioridade para confirmação com
    Luath/Maerra e abertura do lacre, Halessa aceitou não movê-las sem necessidade e organizou câmara reservada
    para poucos minutos depois. Depois que Ren aceitou a paz juramentada, Halessa abriu a pasta em câmara reservada
    com Irmão Caldrin Vos e um escriba. O conteúdo foi forte o bastante para chamar Sirrus Melandor imediatamente.
    Quando Ren registrou Nera Vell e Tavin Vell por nome completo, Halessa percebeu cuidado genuíno no tom dele
    e manteve os nomes em ata reservada e selada. Quando Sirrus negou a presença oculta de Ren na oitiva de Velis,
    Halessa abriu alternativa: Ren pode escrever até três perguntas para possível uso na oitiva. Ren entregou três
    perguntas sobre selos de clãs de Kara-Tur, o hóspede e o volume 13; Halessa recebeu como anexo reservado do
    portador. Na manhã seguinte ao Benefício da Lona Aberta, uma ficha reservada de Tyr chegou a Silva Elkwood no
    circo: Luath confirmou a cópia parcial e a ação contra buscas ilegais, Maerra confirmou o lacre e a abertura
    presenciada, e Tyr agora busca a confirmação da guardiã atual informada. Silva confirmou guarda imediata, pediu
    manutenção temporária no abrigo atual e solicitou resguardo em espera sem deslocamento até o próximo sino maior.

    '
  ofertas:
  - Resguardo provisório de 24 horas para N.V. e T.V., se puderem ser movidos com segurança para uma porta indicada
    por Tyr.
  - Ficha selada para Maerra ou Luath confirmando que o testemunho entrou em triagem reservada.
  - Audiência de lacre em câmara reservada, com Halessa, outro juramentado e possível informação a Sirrus antes
    do próximo sino maior se o conteúdo justificar.
  - Duas fichas reservadas enviadas a Luath e Maerra para confirmar custódia, lacre, abertura presenciada e situação
    das testemunhas.
  - Audiência de lacre por volta de 11:21 se Ren aceitar paz juramentada.
  - Pasta aberta e mantida sob custódia formal de Tyr.
  - Sirrus Melandor chamado imediatamente após leitura do bilhete e das correções.
  - Aceitou receber até três perguntas de Ren para possível uso na oitiva de Velis.
  - Recebeu três perguntas de Ren como anexo reservado do portador.
  - Tyr recebeu confirmações de Luath e Maerra e enviou ficha reservada a Silva Elkwood para confirmar a guarda
    atual informada.
  - Tyr recebeu de Silva a confirmação da guarda imediata dos Vell, manutenção temporária no abrigo atual e pedido
    de resguardo em espera sem deslocamento.
  riscos:
  - Se Ren focar em vingança, Halessa pode rebaixar o caso para risco de violência privada.
  - Se Ren esconder demais, Halessa pode suspeitar que a Casa de Tyr está sendo usada.
  - Se Ren entregar nomes completos em voz alta, pode criar registro ou exposição antes de proteção formal.
  - Halessa notou que 'sorte' não explica cadeia de custódia; a pasta pode ajudar Ren ou criar risco legal contra
    ele.
  - Tyr ainda não concedeu abrigo irrestrito nem acesso direto a Sirrus.
  - Halessa ainda decide quais perguntas de Ren cabem sem comprometer a ata.
  - A crise no Harbor District pode reduzir a velocidade prática de respostas e extratos, mesmo com o caso preservado.
eventos_pos_migracao:
- transacao: s004-e3ff1e80256cc261
  sessao: 4
  resumo: Ren fala em particular com Irmã Halessa Vorn na Casa de Tyr. Ela confirma que Nera e Tavin seguem protegidos,
    o material permanece selado e Velis compareceu à oitiva, apresentando contradições e nomeando M. Harrow antes
    da pergunta. Três registros corrigidos convergem na Casa de Pesos da Ponte Baixa; Velis deve permanecer disponível,
    mas não está preso. Ren apela à consciência de Halessa e obtém 15 contra CD 15 em Persuasão com vantagem. Ela
    revela que o porteiro noturno Edran Kells desapareceu antes de depor e que a porta de serviço sob o arco oeste
    foi usada, nas noites suspeitas, entre o segundo sino após o pôr do sol e meia hora depois. Autoriza apenas
    observação e proteção imediata de inocentes, não invasão ou confronto.
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa confirmou que o caso Vell avançou, preservou contradições da oitiva de Velis e, após o apelo
      de Ren, revelou uma janela legítima de observação na Casa de Pesos da Ponte Baixa sem autorizar invasão ou
      confronto
  - alvo: relacao:halessa_vorn
    caminho: atitude_para_ren
    op: set
    valor: formal e cautelosa, mas mais disposta a cooperação operacional limitada quando Ren prioriza inocentes
      e aceita fronteiras legais
  - alvo: relacao:halessa_vorn
    caminho: confianca
    op: set
    valor: cautelosa e crescente, ainda condicionada a Ren não contaminar provas nem transformar observação em guerra
      privada
- transacao: s005-cc42d3bf1c2f50ee
  sessao: 5
  resumo: 'Ren entra formalmente pela Casa de Tyr sem ser observado por inimigos externos e pede Halessa em caráter
    urgente e reservado. Entrega o livro, as duas folhas e quatro amostras das armas, relata a infiltração, a caixa,
    os dois homens inconscientes e os vestígios de Edran. Halessa corrige que tortura ou violência são fortemente
    indicadas, mas assassinato ainda não é fato, e alerta que os suspeitos podem descrever Ren. Ela sela o material
    com a procedência real, envia mensageiro a Luath e ordena preservação urgente da Casa de Pesos com duas testemunhas
    de Tyr. Ren obtém 14 contra CD 15 em Persuasão com vantagem: Halessa reconhece sua capacidade e age sobre a
    prova, mas ainda se recusa a tratá-lo como agente clandestino coordenado sem plano e limites prévios. Às 23:06,
    Ren permanece numa câmara reservada; as provas estão sob custódia provisória de Tyr e a operação foi iniciada.'
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa recebeu de Ren provas documentais e amostras de armas obtidas numa entrada não autorizada na
      Casa de Pesos, selou o material com procedência real e iniciou operação urgente com Luath e testemunhas de
      Tyr
  - alvo: relacao:halessa_vorn
    caminho: atitude_para_ren
    op: set
    valor: reconhece a extraordinária capacidade operacional e a escolha de força não letal de Ren, mas reage com
      firmeza à violação deliberada dos limites que estabeleceu
  - alvo: relacao:halessa_vorn
    caminho: confianca
    op: set
    valor: 'mista: confia mais na competência, urgência e franqueza posterior de Ren, mas menos em sua disposição
      de respeitar autorização, cadeia de custódia e planejamento conjunto'
  - alvo: relacao:halessa_vorn
    caminho: respeito
    op: set
    valor: real pela capacidade de infiltração, contenção não letal e retorno imediato com provas; ainda insuficiente
      para aceitá-lo como agente clandestino coordenado de Tyr
  - alvo: relacao:halessa_vorn
    caminho: ofertas
    op: append
    valor: Mobilizou preservação urgente da Casa de Pesos com Luath e duas testemunhas de Tyr, sem aguardar o amanhecer.
  - alvo: relacao:halessa_vorn
    caminho: riscos
    op: append
    valor: Halessa não aceitará usar Ren como agente clandestino enquanto ele apresentar operações consumadas em
      vez de negociar objetivo, limites e rota antes da ação.
- transacao: s005-e1d863a303af2d27
  sessao: 5
  resumo: 'Ren pede desculpas por ultrapassar as instruções, mas responde a Halessa com ironia sobre a cautela institucional
    e reafirma que estará disponível contra Masao. Halessa reconhece que Ren está certo sobre a urgência, defende
    que a operação já iniciada não é mera nota de repúdio e recusa a falsa escolha entre impotência e ação sem limites.
    Repreende o uso retórico da mulher levada de barco e pede que fatos assim sejam entregues como evidência. Não
    fecha a possibilidade de cooperação: exige objetivo, rota e limites acordados antes da próxima infiltração.
    Para preservar a discrição de Ren, manda que saia pela porta dos peticionários sem registro público. Às 23:13,
    Ren está num beco lateral da Casa de Tyr com 2/6 Ki; a operação da Casa de Pesos continua.'
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Após um desacordo franco sobre urgência e limites, Halessa manteve a operação da Casa de Pesos, protegeu
      a saída discreta de Ren e deixou aberta cooperação futura condicionada a planejamento prévio
  - alvo: relacao:halessa_vorn
    caminho: atitude_para_ren
    op: set
    valor: firme e sem indulgência diante da ironia, mas capaz de reconhecer que Ren está correto sobre a urgência
      e de preservar sua discrição apesar do desacordo
  - alvo: relacao:halessa_vorn
    caminho: confianca
    op: set
    valor: 'condicional: Halessa confia na competência, franqueza posterior e compromisso de Ren contra Masao, mas
      exige objetivo, rota e limites acordados antes de qualquer ação clandestina futura'
  - alvo: relacao:halessa_vorn
    caminho: ofertas
    op: append
    valor: Admite discutir futura cooperação clandestina se Ren apresentar antes da ação o objetivo, a rota e os
      limites que aceita observar.
  - alvo: relacao:halessa_vorn
    caminho: ofertas
    op: append
    valor: Concedeu a Ren saída pela porta reservada dos peticionários, sem registro público de sua partida.
- transacao: s007-5b916178927cb36d
  sessao: 7
  resumo: Ren mostrou a Luath o documento falsificado e declarou que o entregará diretamente a Halessa, que possui
    o original. Luath aceitou orientar seus homens a não abordar membros identificados das Dez Espadas, recusou
    suspeita indiscriminada contra estrangeiros e preparará descrições por método e conduta. Ren chegou sem incidente
    à Casa de Tyr; Halessa restringiu o acesso à pasta original e pediu o relato exato antes de receber o documento.
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Alertada pela ficha urgente de Luath, Halessa restringiu qualquer acesso à pasta original e recebeu Ren
      em câmara reservada com uma juramentada como testemunha.
- transacao: s007-1fc5008c5e3ea696
  sessao: 7
  resumo: Ren relatou a Halessa a alteração feita por Velis, a afirmação de que o clã do leste cuidaria de Tyr,
    o confronto com Kurobane e a possível atuação de Kajiwara Shizune. Halessa distinguiu fatos, identificação e
    inferência, iniciou uma auditoria segregada da cadeia de custódia e pediu que Ren deposite o documento e declare
    sua procedência e manuseio para recebimento formal.
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa foi informada sobre a alteração feita por Velis, a frase de que o clã do leste cuidaria de Tyr,
      Kurobane Jinzaburō e a possível atuação de Kajiwara Shizune; iniciou auditoria segregada da cadeia de custódia
      antes de receber formalmente a cópia falsificada.
- transacao: s007-ed361e25388a6c3d
  sessao: 7
  resumo: 'Ren declarou a cadeia conhecida do documento: Velis o falsificou diante de Brass e um homem não identificado
    da Red Sail, deixou-o num aro junto ao muro externo da antiga Casa de Pesos, Kurobane o recolheu com kuroito
    e Ren o tomou dele. Halessa confirmou que o nome de Ren ficará fora do relatório circulante e retido em anexo
    selado, reuniu dois custódios e pediu o último elo antes do recebimento formal.'
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa registrou a cadeia declarada do documento falsificado, manterá Ren como testemunha reservada
      no relatório circulante e sua identidade em anexo selado; dois custódios foram reunidos para o recebimento
      e auditoria.
- transacao: s007-c19422149078ef8d
  sessao: 7
  resumo: Ren transferiu formalmente o documento falsificado à Casa de Tyr. A auditoria encontrou a cadeia anterior
    sem ruptura visível e confirmou que o original preservado por Tyr mantém a retenção anulada do volume 13, enquanto
    a peça recuperada diz que a carga nunca foi retida. Ambos foram selados separadamente; Ren permanece testemunha
    reservada e Shizune foi classificada como risco operacional não confirmado.
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa recebeu formalmente o documento falsificado de Ren, preservou sua identidade em anexo reservado
      e confirmou por auditoria que o original de Tyr não corresponde à falsificação; as duas peças estão sob cadeias
      e selos separados.
- transacao: s007-8b4bf4d8aaab2e4b
  sessao: 7
  resumo: Ren tentou confortar Halessa, despediu-se e deixou a investigação e os documentos com Tyr. Halessa afirmou
    que futuras mensagens passarão primeiro por Luath para preservar a discrição. Ren atravessou a cidade sem incidente
    e chegou ao circo pouco depois da meia-noite de 10 Eleasis; ainda precisa cumprir o compromisso na Casa do Salgueiro
    Seco antes do amanhecer.
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: Halessa mantém o original e a falsificação sob custódias separadas, preservará Ren como testemunha reservada
      e fará qualquer contato futuro passar primeiro por Luath para não expor o circo.
- transacao: s009-d555024ef2ea4d16
  sessao: 9
  resumo: Ren sustentou a cobertura ao sair de Kethra com Enganação 19 contra CD 14; o assistente interpretou o
    contato como Kethra lidando com um carregador obtuso, sem identificar Ren ou gerar alarme imediato. Ren chegou
    à Casa de Tyr por volta das 15:25 e falou reservadamente com Halessa. Ela confirmou que original e falsificação
    estão separados e com lacres íntegros; Luath confirmou a cópia parcial e Maerra confirmou lacre, abertura e
    cadeia de custódia. Tyr enviou consulta reservada à guardiã atual…
  deltas:
  - alvo: relacao:halessa_vorn
    caminho: status
    op: set
    valor: 'Halessa atualizou Ren pessoalmente: original e falsificação seguem em custódias separadas e lacradas;
      Luath e Maerra confirmaram elementos independentes da cadeia; Tyr aguarda resposta reservada da guardiã atual
      do registro autêntico antes de atribuir autoria ou validar ordens.'
