    o plano envolvendo a Casa do Salgueiro Seco, a convocação de Velis, a dificuldade de contato com Kethra, a escassez
    de respostas, sua sensação de solidão e a decisão de permanecer atento enquanto segue vivendo. Maerra distinguiu
    solidão de ausência de apoio, aconselhou respeito ao sinal de Kethra e ao trabalho institucional de Tyr, e apoiou
    a vida prática sem confundir vigilância com abandono…
  deltas:
