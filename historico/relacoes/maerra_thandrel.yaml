    valor: Em 15 Eleasis, Ren contou a Maerra sobre o trabalho como Shinta na Galeria dos Escribas, sua intenção
      de avaliar a Casa do Salgueiro Seco como possível abrigo para Nera e Tavin, a convocação de Velis e a falta
