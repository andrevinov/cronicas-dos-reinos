schema_historico_relacao: 1
id: nera_vell
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Nera Vell
  tipo: testemunha protegida / gravadora de selos
  local: depósito de figurino velho, perto do canto de Ren; normalmente na carroça verde de Silva Elkwood
  status: sob proteção temporária de Silva Elkwood
  atitude_para_ren: assustada, grata, pragmática e emocionalmente implicada
  confianca: moderada em situação de crise
  respeito: prático
  motivo: 'Ren a resgatou do esquife, contou sua própria história e aceitou salvar Tavin antes de buscar o livro
    de provas. Nera ainda teme que qualquer escolha errada mate ela ou o irmão. Na Casa da Aurora Menor, Nera ouviu
    fragmentos sobre Aiko, Masao e a vingança de Ren, incluindo a fala dele sobre não querer ver irmãos perdendo
    irmãos novamente. Nera ajudou Maerra a deitar Ren quando ele apagou de cansaço. No circo, Ren a tranquilizou
    sobre Silva, prometeu não sumir e ela aceitou entregar o livro para o esconderijo de Silva. Após o julgamento
    interno de Merrit, Ren voltou à carroça verde, sentou perto dos Vell e explicou que Jack aceitou mantê-los no
    circo por agora. Nera aceitou o alívio sem despejar perguntas e agradeceu porque Ren voltou antes de sumir de
    novo. Mais tarde, Ren voltou novamente para checar os Vell e avisou que seguirá uma trilha à noite ligada aos
    homens que tentaram levar Nera. Ren prometeu a Tavin que voltará e explicou que pretende investigar a conexão
    entre Red Sail e Masao. Quando Ren voltou ao circo e foi tomar banho atrás da lona azul, Nera não conseguiu
    esperar. Foi até a lona por preocupação, viu mais do que pretendia por um instante e ficou claramente envergonhada,
    mas o alívio por vê-lo vivo foi mais forte que a compostura. Ren a tranquilizou, disse que não estava ferido
    fisicamente e prometeu ir à carroça verde depois do banho. Nera aceitou esperar e agradeceu por ele ter voltado.
    O vínculo romântico ainda é contido e incerto, mas deixou de ser apenas subtexto. Depois do banho, Ren foi à
    carroça verde e não acordou Tavin. As mãos de Ren e Nera se tocaram, e Ren não retirou a dele; Nera ajustou
    os dedos aos dele e aceitou a intimidade em silêncio. No topo da carroça dos estandartes, Ren abriu para Nera
    a ferida de Aiko, a quebra interna causada pela morte da irmã, a natureza de sua vingança e o risco real de
    morrer perseguindo Masao. Nera admitiu que sua preocupação por Ren é verdadeira, mas pediu que ela e Tavin continuem
    sendo pessoas para ele, não ferramentas ou peso dentro da vingança. Ren respondeu que esse é exatamente o problema:
    ela e Tavin já são pessoas para ele. Ren admitiu que teme não conseguir dar a eles um futuro vivo e seguro,
    tocou o rosto de Nera e os dois se beijaram. O vínculo romântico entre os dois agora é explícito, embora ainda
    sem promessa de futuro. Ren depois reforçou que a missão de Nera é ficar quieta, não fazer loucuras e proteger
    a si mesma e a Tavin. Nera voltou de mãos dadas com Ren até a carroça verde antes que ele fosse dormir. Na saleta
    de ervas da Casa da Aurora Menor, Nera viu a pasta roubada de Velis ser aberta. Reconheceu tecnicamente a impressão
    protegida da falsa lua velada como uso criminoso posterior do trabalho que foi obrigada a fazer. Também ouviu
    o bilhete chamar a gravadora e o menino de "ruído" que não deve chegar a Tyr. Depois, acompanhou Ren e Tavin
    de volta ao circo usando os disfarces de Dessa. A busca controlada já havia sido conduzida por Jack, com a Red
    Sail dispersada pela pressão da guarda. Nera voltou para a carroça verde e segurou a manga de Ren por um instante
    antes de entrar, demonstrando alívio contido por ele ter trazido os dois vivos de volta. Quando Ren explicou
    que iria a Tyr com a pasta lacrada, Nera aceitou ficar na carroça verde, mas se despediu dele com afeto e medo
    evidentes. Ao ouvir o plano do Benefício da Lona Aberta, aceitou integrar a rotina do circo sob nome de cobertura
    e escolheu "Lena". Também aceitou a possibilidade de atuar como Princesa das Sombras apenas se estiver com máscara
    inteira, luvas, cabelo coberto, sem nome anunciado e sem aplauso próprio. No fim da tarde, Silva levou Nera/Lena
    e Tavin/Timo pela rota interna para assistir parte do ensaio de O Vento da Noite. Nera observou Ren como artista
    e risco controlado, não apenas como fugitivo ou combatente. Jack decidiu que Lysa, não Nera, será a Princesa
    das Sombras. Nera não protestou, mas Ren percebeu ciúme contido quando Lysa colocou o pano preto pela primeira
    vez. À noite, Ren e Nera caminharam pela rota interna das lonas, de mãos dadas e com beijos; Ren fez juras de
    amor. Nera não respondeu com promessa igual, mas pediu que ele viva tempo bastante para ela acreditar sem medo.
    Durante O Vento da Noite, Nera viu Ren se tornar público de um modo que protege a máscara Ren Kage, mas também
    o torna mais visível para a cidade. Quando ele voltou aos bastidores, o ciúme dela estava coberto por orgulho
    assustado. Depois que Ren preservou a aura de mistério e não voltou ao público, Nera ouviu Jack falar sobre
    interesse de camarote por Kage. Ao responder a Tavin que "caro" quase sempre é perigoso, demonstrou entender
    que a nova máscara de Ren pode atrair proteção, dinheiro e ameaça ao mesmo tempo. Ao fechamento do Benefício
    da Lona Aberta, Nera viu o circo ganhar uma noite real de fôlego sem expor ela ou Tavin ao público. O alívio
    dela é concreto, mas ainda cauteloso: a proteção virou rotina por hoje, não solução definitiva. Depois, ao comer
    com Ren na carroça verde, Nera percebeu que ele esperava alguma ação de Masao ou de seus lacaios durante o evento.
    Ela não tentou escolher a explicação correta; apenas lembrou que, naquela noite, Tavin estava inteiro, ninguém
    arrombou a carroça, Jack ganhou dinheiro, Silva sustentou menos mentiras e Ren voltou para trás da lona. Na
    manhã seguinte ao Benefício, antes de Ren falar com Jack, Nera ouviu a ideia de Kage como porta recorrente de
    abrigo e renda. Ela aceitou a utilidade disso, mas alertou que não quer ver Ren Kage inteiro comprado por Jack,
    ricos de camarote, ela, Tavin ou Masao. Depois da confirmação de Silva a Tyr, Ren passou rapidamente pela carroça
    verde antes de sair do circo para tratar de assuntos pessoais. Nera não transformou a despedida em cena longa,
    mas pediu que ele volte antes de virar história de outra pessoa. Ao anoitecer, Ren voltou ao circo após resolver
    a saída temporária de Colm/Dent com Dorra Hest. Nera ouviu de Ren sobre Kethra, Colm, Velis, M. Harrow e a Casa
    Velha do Primeiro Raio. Ela reagiu com atenção especial ao uso de M. Harrow como possível nome de registro para
    encaixar a mentira preparada sobre o "oriental". Após a incursão na Casa Velha e na oficina dos tintureiros,
    Nera percebeu o retorno de Ren por volta de 02:16 de 4 Eleasis, saiu da carroça verde contra a instrução de
    esperar e o abraçou com preocupação explícita ao vê-lo vivo e exausto. Ren a abraçou, beijou discretamente e
    prometeu voltar. Nera aceitou deixar Ren dormir e, pela manhã, foi conferir o canto dele no depósito de figurino
    velho, levando água e pão. Depois de Ren sair novamente para checar Colm/Dent, Luath, Pell e Maerra, ele retornou
    ao circo por volta de 09:55 de 4 Eleasis. Nera viu Ren chegar vivo e conteve o impulso de correr até ele, mantendo-se
    dentro da rotina do circo. No começo da noite de 4 Eleasis, Nera viu Ren retornar à borda interna do circo sem
    sangue aparente e sem corpo carregado, mas também viu Silva interceptá-lo antes de permitir acesso direto à
    carroça verde. Ren contou a Nera e Silva que viu oportunidade de capturar Brass, mas não tentou por não querer
    arriscar o circo, Kage e seus aliados. Nera ouviu isso como alívio e aproximação, não como covardia. Depois
    jantou e caminhou com Ren pela rota interna permitida por Silva, trocando carícias discretas e beijos longe
    das bordas do acampamento. Na manhã de 5 Eleasis, Ren tomou café e almoçou com Nera e Tavin e falou sobre Kozakura,
    o Clã Kagehira e o Kagehira Getsuei-ryu. Nera percebeu a tristeza que Ren tentou esconder ao falar das cerejeiras
    e perguntou se a lembrança era boa ou dolorosa. Antes da reprise curta de Kage, pediu baixo que Ren voltasse
    para trás da lona depois. Na noite de 5 Eleasis, depois de Ren retornar da Escada das Sete Águas e do posto
    de Luath, ele evitou vê-la diretamente para não arrastar medo ou possível cauda até a carroça verde. Entregou
    a Silva um bilhete dizendo que ama Nera, que solucionará tudo e que ela pode ficar tranquila. Silva entregou
    o bilhete sem abrir. Nera leu duas vezes e respondeu por Silva que promessa grande demais não vale menos, mas
    pesa mais. Na tarde de 6 Eleasis, Ren entrou na carroça verde por Passo Sombrio para falar com Nera antes da
    apresentação fechada da Casa Veyr. A rota externa foi limpa por Silva e Tobb, mas a entrada assustou Nera e
    apagou a lamparina. Ren contou que a proposta citou a seladora/gravadora, que Kage vai se expor e que ele pretende
    voltar. Nera não reconheceu Corven Dalm nem Casa Veyr e não conseguiu determinar a origem exata do termo. Alertou
    Ren a não olhar para a carroça verde nem para Silva se alguém disser o nome dela durante a apresentação, para
    não transformar contrato em coração. Na madrugada de 7 Eleasis, depois da Ponte Baixa e do lacre reservado de
    Luath, Ren foi discretamente à carroça verde e falou baixo com Nera sem acordar Tavin. Ele contou apenas o necessário:
    a prova saiu das mãos dele, Luath a lacrou como fonte protegida e o registro externo não nomeia Ren, Nera ou
    Tavin. Nera ficou parcialmente aliviada por entender que os inimigos ainda têm uma palavra de pressão, mas não
    uma porta confirmada até ela. Ela reforçou que o circo não deve ensinar onde ela dorme.

    '
  informacoes_compartilhadas_por_nera:
  - Dain 'Brass' Mord encomendou a cópia deliberadamente errada da lua velada.
  - Um segundo homem, com perfil de escrivão e materiais melhores, esteve envolvido.
  - O segundo homem usava papel e tinta associáveis a Narwhal Manor.
  - Nera mantinha um livro de provas escondido na própria banca.
  - Tavin ouviu as palavras 'Narwhal', 'segunda maré' e 'se vier sozinho'.
  - Nera reconheceu a impressão protegida da falsa lua velada na pasta de Velis como derivada do trabalho que foi
    obrigada a fazer, mas prensada com cera de arquivo.
  acordos:
  - Ren decidiu tirar Tavin de perigo e recuperar o livro de provas.
  - Ren prometeu dar um jeito de checar a situação de Nera e Tavin e entrar em contato.
  riscos:
  - Nera pode priorizar Tavin se achar que Ren está usando os dois como isca.
  - O livro também incrimina Nera profissionalmente, mas agora está escondido por Silva.
  - Nera pode reagir mal se Ren desaparecer por tempo demais sem notícia.
  - Nera falhou em manter a compostura ao reencontrar Ren depois do julgamento interno no circo.
  - Nera sabe que o abrigo no circo é real por hoje e amanhã, mas será reavaliado depois.
  - Nera perguntou se a trilha da noite envolve a caixa ou o homem dos botões.
  - Nera entende que Masao é o motivo maior por trás do envolvimento de Ren com a Red Sail.
  - Nera está mais emocionalmente implicada do que consegue disfarçar, mas ainda tenta preservar decoro.
  - Nera aceitou esperar Ren na carroça verde depois do banho, mas sua preocupação por ele já atravessa prudência.
  - Nera e Ren deram o primeiro passo físico claro de intimidade ao ficarem de mãos dadas na carroça verde.
  - Nera não pediu que Ren abandone a vingança, mas quer saber se ainda será pessoa para ele quando a vingança apertar.
  - Nera e Ren se beijaram; o vínculo romântico é explícito, mas ainda sem promessa de futuro.
  - Nera entende com mais clareza que Masao usou ela e Tavin para atingir Ren, o que despertou medo e raiva.
  - Nera recebeu de Ren uma instrução direta para não se expor nem tentar ajudá-lo de modo imprudente.
  - Nera agora sabe que um bilhete na pasta de Velis trata ela e Tavin como ruído a ser impedido de chegar a Tyr.
  - Nera voltou ao circo, mas entende que a pasta lacrada pode atrair nova pressão.
  - Nera sabe que Ren pretende procurar Tyr para transformar a pasta em vantagem formal.
  - Nera usará Lena como nome de cobertura na rotina do circo.
  - Antes da decisão final de Jack, Nera aceitava aparecer em O Vento da Noite apenas como figura mascarada e anônima,
    se Silva e Jack aprovassem.
  - Nera assistiu parte do ensaio de O Vento da Noite e viu que o número tem marcações e supervisão, não apenas
    improviso perigoso.
  - Nera não será a Princesa das Sombras; Jack escolheu Lysa Renn por segurança.
  - Nera demonstrou ciúme contido da participação de Lysa, mas não contestou a decisão.
  - Nera pediu que Ren volte inteiro para trás da lona depois da apresentação.
  - Nera viu O Vento da Noite ter sucesso diante do público e entende que Ren Kage agora é uma máscara pública real.
  - Nera sabe que há interesse de camarote por Kage como possível artista privado ou protegido, mas não sabe se
    é oportunidade limpa.
  - Nera sabe que Jack manteve Kage ligado ao circo e empurrou qualquer proposta privada para amanhã.
  - Nera e Tavin dormem no circo esta noite após o Benefício fechar sem interrupção aberta.
  - Nera percebeu que Ren esperava uma ação de Masao durante o Benefício.
  - Nera está acordada na manhã seguinte ao Benefício, tentando fingir que não espera Ren.
  - Nera entende Kage como possível porta de proteção, mas teme que vire corrente para Ren.
  - Nera sabe que Ren saiu novamente do circo na manhã seguinte ao Benefício, depois de assinar o acordo de Kage.
  - Nera pediu que Ren volte antes de virar história de outra pessoa.
  - Nera sabe que Ren voltou ao circo ao anoitecer sem cauda competente e sem rastro útil até o acampamento.
  - Nera ouviu de Ren sobre Kethra, Colm/Dent, Dorra Hest, Velis, M. Harrow e a Casa Velha do Primeiro Raio.
  - Nera interpretou M. Harrow como possível nome de registro usado para dar corpo escrito à mentira sobre o 'oriental'.
  - Nera viu Ren voltar da Casa Velha/rua dos tintureiros vivo, sem ki e exausto, depois do resgate das crianças.
  - Nera abraçou Ren perto da carroça verde antes que ele fosse dormir.
  - Nera ouviu Ren prometer voltar e o deixou dormir.
  - Nera foi conferir Ren no depósito de figurino velho ao amanhecer, com água e pão.
  - Nera viu Ren retornar ao circo por volta de 09:55 de 4 Eleasis, depois da ida aos pátios, Luath, Silver Lily
    e Casa da Aurora Menor.
  - Nera viu Ren retornar ao circo no começo da noite de 4 Eleasis, sem sangue aparente, mas retido por Silva antes
    da carroça verde.
  - Nera ouviu Ren admitir que não tentou capturar Brass por medo do risco aos aliados, ao circo e a Kage.
  - Nera caminhou com Ren pela rota interna do circo e trocou carícias discretas com ele antes do treino solo.
  - Nera ouviu Ren falar sobre Kozakura, o Clã Kagehira e o Kagehira Getsuei-ryu.
  - Nera percebeu que a lembrança das cerejeiras toca saudade e dor, embora Ren não tenha transformado isso em explicação
    completa diante de Tavin.
  - Nera percebeu que um recado externo tocou a segurança ao redor de Kage antes da reprise de 5 Eleasis, mas não
    viu o papel.
  - Nera recebeu de Ren, por Silva, um bilhete dizendo que ele a ama e que solucionará tudo.
  - Nera respondeu indiretamente que promessa grande demais não vale menos, mas pesa mais.
  - Nera sabe que a Casa Veyr ou o canal ligado a ela citou a seladora/gravadora para pressionar Kage.
  - Nera não reconheceu Corven Dalm nem Casa Veyr.
  - Nera alertou Ren a não entregar reação emocional se alguém citar o nome dela durante a apresentação fechada.
  - Nera sabe, em linhas gerais, que Ren encontrou documentos na Ponte Baixa e que Luath os lacrou como fonte protegida
    sem nome externo de Ren, Nera ou Tavin.
  - Nera entende que os inimigos ainda parecem possuir palavras de pressão sobre ela e Tavin, mas não demonstraram
    saber a porta exata onde os Vell dormem.
eventos_pos_migracao:
- transacao: s004-277f800e52271ff7
  sessao: 4
  resumo: Ren retorna ao circo, toma banho, come e informa Silva sobre a pista de Halessa e sua intenção de vigiar
    a Casa de Pesos. Silva relata que Nera e Tavin estão fisicamente bem; Nera dorme mal, está assustada e zangada
    com a separação, mas segue o protocolo, enquanto Tavin está mais estável, ajuda sob o nome Timo e continua esperando
    Ren voltar. Silva considera uma casa própria mais adequada que o circo, mas adverte que alunos devem ser pessoas
    com escolha, não muralhas. Ela transmite aos Vell que Ren está vivo, bem e com saudades. Às 20:10, Ren veste
    seu traje oriental original de infiltração, distinto do figurino de Kage, cobre-o com a capa e parte para a
    Ponte Baixa. Pell falha nas duas buscas realizadas durante a tarde, resultado ainda desconhecido de Ren.
  deltas:
  - alvo: relacao:nera_vell
    caminho: status
    op: set
    valor: fisicamente bem e sob proteção de Silva; dorme mal, está assustada e zangada com a separação, mas não
      tentou sair e continua seguindo o protocolo. Recebeu o bilhete de Ren e soube por Silva que ele está vivo,
      bem e com saudades.
- transacao: s006-0e4e5f891ba71027
  sessao: 6
  resumo: 'Ren promete a Nera que voltará depois de uma ação noturna. A promessa desencadeia a raiva, o medo e a
    saudade acumulados dela: Nera o confronta pelas ausências e promessas absolutas, beija-o com intensidade e declara
    que o ama. Ren corresponde no nível emocional que ela inicia. Nera pede informação suficiente para distinguir
    o plano de uma possível despedida.'
  deltas:
  - alvo: relacao:nera_vell
    caminho: status
    op: set
    valor: Nera reencontrou Ren antes de uma operação noturna. Reagiu intensamente à promessa de retorno, confrontou
      suas ausências e promessas absolutas, beijou-o e declarou que o ama; quer informação suficiente para saber
      o que é plano e o que pode ser despedida
  - alvo: relacao:nera_vell
    caminho: atitude_para_ren
    op: set
    valor: amorosa, assustada, zangada com as promessas absolutas e determinada a não ser protegida pela ignorância
  - alvo: relacao:nera_vell
    caminho: confianca
    op: set
    valor: afetiva e real, mas pressionada pela tendência de Ren a desaparecer e prometer resultados que não controla
- transacao: s006-9c43e3ef3a278db5
  sessao: 6
  resumo: Ren conta a Nera que seguirá Brass e Velis até a Ponte Baixa, fugirá se descoberto e contará com a proteção
    distante dos homens de Luath. Nera reconhece que os guardas não estarão com ele lá embaixo, aceita esperar e
    promete avisar Silva e Luath sem expor o circo caso Ren se atrase. Após a despedida, Ren toma banho, veste seu
    traje oriental de infiltração, pinta e cobre o rosto, equipa wakizashi e shuriken e deixa o circo rumo à escada
    da ferraria.
  deltas:
  - alvo: relacao:nera_vell
    caminho: status
    op: set
    valor: Nera sabe que Ren seguirá Brass por uma viela, tentará ouvir uma conversa com Velis e pretende acompanhá-los
      para dentro da Ponte Baixa, fugindo se descoberto. Ela percebe que os homens de Luath estarão apenas na superfície,
      aceitou esperar e avisará Silva para acionar Luath se Ren não voltar no tempo combinado
  - alvo: relacao:nera_vell
    caminho: acordos
    op: append
    valor: Se Ren não voltar no tempo que indicar, Nera avisará Silva, que acionará Luath; ninguém deixará o esconderijo
      para procurá-lo nem exporá o circo.
- transacao: s007-04ecbb3c5786e103
  sessao: 7
  resumo: Ren agradeceu a Silva, conteve um gesto de toque e entrou silenciosamente para ver Nera sem acordar Tavin.
    Nera estava desperta, abraçou Ren e ouviu que Brass suspendeu a busca sem localizar os Vell, mas que Kurobane
    e possivelmente Shizune representam ameaças maiores. Ren explicou seu alívio por Luath e Halessa agora reconhecerem
    Masao e seus agentes como ameaças reais; Nera lembrou que já acreditava nele e perguntou quanto tempo ele pode
    ficar.
  deltas:
  - alvo: relacao:nera_vell
    caminho: status
    op: set
    valor: Nera estava acordada quando Ren voltou, abraçou-o e ouviu seu relato. Sabe que Brass suspendeu a busca
      sem localizar os Vell, que Ren enfrentou Kurobane e que Shizune pode estar ativa; perguntou quanto tempo Ren
      pode permanecer com ela.
- transacao: s007-b5add2887bc7320f
  sessao: 7
  resumo: Ren contou a Nera que trabalharia antes do amanhecer como Shinta numa propriedade murada que talvez pudesse
    se tornar uma casa segura. Nera apoiou a esperança, mas exigiu que proteção não se torne prisão e aceitou apenas
    a promessa de Ren voltar quando puder e avisar quando não puder. Ren dormiu poucas horas, sem completar descanso
    longo, vestiu a persona de Shinta e chegou à Casa do Salgueiro Seco ao primeiro clarear, aguardando o jardineiro
    abrir o portão.
  deltas:
  - alvo: relacao:nera_vell
    caminho: status
    op: set
    valor: Nera sabe que Ren trabalhará sob o nome Shinta numa propriedade murada que ele considera possível casa
      futura. Ela apoiou a esperança, exigiu que proteção não vire prisão e aceitou a promessa limitada de Ren voltar
      quando puder e avisar quando não puder.
- transacao: s010-1ea0f49c7e9b9acc
  sessao: 10
  resumo: Ren terminou a refeição, agradeceu a Silva e pediu para ver Nera e Tavin. Silva permitiu a visita, advertindo-o
    a não colocar sobre Tavin o peso da ameaça de Shizune. Na carroça verde, Tavin recebeu Ren com um abraço e Nera
    demonstrou alívio por ele ter voltado, percebendo em seguida sua preocupação e perguntando o que aconteceu.
  deltas:
  - alvo: relacao:nera_vell
    caminho: momentos_de_vinculo
    op: append
    valor: Ren voltou ao circo sem trazer cauda e pediu a Silva para ver Nera e Tavin; Nera recebeu sua presença
      com alívio e reconheceu novamente que ele cumpriu a promessa limitada de voltar.
- transacao: s010-8554d393e6abfdea
  sessao: 10
  resumo: Ren abraçou Tavin e Nera, confirmou que ambos estavam bem e conversou com eles sobre as tarefas leves
    e discretas no circo. Tavin descreveu orgulhosamente seu trabalho separando fivelas, enquanto Nera explicou
    que Silva limita o esforço e a exposição dos dois. Nera percebeu o sinal de que Ren guardava algo diante de
    Tavin e indicou discretamente que poderiam conversar depois, sem pressioná-lo ou alertar o menino.
  deltas:
  - alvo: relacao:nera_vell
    caminho: momentos_de_vinculo
    op: append
    valor: Durante uma conversa leve com Tavin, Nera percebeu pelo olhar de Ren que ele guardava algo que não queria
