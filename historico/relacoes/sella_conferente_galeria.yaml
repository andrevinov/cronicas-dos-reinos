    parte da fila. Ao meio-dia, ela concluiu que Shinta é confiável para respeitar protocolo e admitir dúvida, porém
    ainda não para classificar devoluções sem supervisão; dete…
  deltas:
  - alvo: relacao:sella_conferente_galeria
    caminho: atitude_para_ren
