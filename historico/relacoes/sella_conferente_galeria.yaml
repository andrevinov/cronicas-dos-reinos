      do pátio após a pausa, permitindo nova tentativa futura.
- transacao: s014-21a856bd310023f8
  sessao: 14
  resumo: Shinta contou a Sella a história construída de que veio de Kozakura, perdeu toda a família numa guerra,
    busca vida pacífica e é grato a Tomas por ter sido uma das poucas pessoas a tratá-lo como ser humano. Ren obteve
    Enganação 17 contra CD 14, com vantagem de Ator e +2 pela abordagem forte. Sella acreditou na história e passou
    a interpretar a curiosidade de Shinta como gratidão e preocupação genuínas. Ela o aconselhou a não transformar
    Tomas em pai ou a gratidão em dívida, mas agradecê-lo por m…
  deltas:
  - alvo: relacao:sella_conferente_galeria
    caminho: confianca
    op: set
    valor: profissional moderada em Shinta
  - alvo: relacao:sella_conferente_galeria
    caminho: atitude_para_ren
    op: set
    valor: Sella acredita que Shinta é um sobrevivente solitário de uma guerra em Kozakura e interpreta sua preocupação
      com Tomas como gratidão pela primeira chance honesta recebida; mantém limites profissionais, mas demonstra
      compaixão e familiaridade crescente.
  - alvo: relacao:sella_conferente_galeria
    caminho: motivo_atual
    op: set
    valor: Shinta aceitou a falha sem ocultá-la e contou uma história pessoal convincente sobre ter perdido a família
      em Kozakura e buscado paz. Sella acreditou, aconselhou-o sobre Tomas e respondeu ao termo senpai chamando-o
      de Shinta-kouhai.
  - alvo: relacao:sella_conferente_galeria
    caminho: crencas_de_sella_sobre_shinta
    op: set
    valor:
    - Shinta veio de Kozakura.
    - A família de Shinta morreu numa guerra e ele se considera o único sobrevivente.
    - Shinta veio a Ravens Bluff tentando construir uma vida pacífica.
    - Shinta encontrou hostilidade e portas fechadas por ser estrangeiro.
    - A gratidão e preocupação de Shinta por Tomas vêm da chance de trabalho e do tratamento humano que recebeu.
