  sessao: 22
  resumo: Darran declarou ter aplicado pessoalmente a contramarca de urgência, perto da quarta badalada, a pedido
    de um homem bem-apessoado de casaco cinza e caixa preta de contas — descrição que coincide com a fornecida por
    Tomas para o entregador do pedido. Darran verificou apenas que os três números de despacho existiam; segundo
    ele, o homem não deu nome, carga ou finalidade. A convergência liga a mesma pessoa ao selo no porto e à entrega
    na Galeria, estabelecendo o controlador operacional do pedido,…
