  sessao: 22
  resumo: 'Persuasão 20 contra CD 12 levou Darran a confessar que recebeu duas peças de ouro, sem registro, para
    aplicar a contramarca. Ele explicou que as cópias não precisam ser falsificadas: autorizações antigas e autênticas
    podem ser apresentadas fora do contexto para legitimar uma carga diferente. Darran agora demonstra medo concreto
    das pessoas por trás do pedido e pediu para não ser devolvido à Mesa de Cargas. A cadeia já pode ser levada
    a Tomas, mas ainda não foi entregue.'
