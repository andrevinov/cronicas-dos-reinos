  nome: Iria Doss
  tipo: curandeira rural e ajustadora de ossos / contato apenas indicado por Mera
  local: casa baixa depois do salgueiro partido, no ramal do rio a leste da secagem velha
  status: não encontrada por Ren; segundo Mera, ativa e capaz de tratar Colm/Dent
