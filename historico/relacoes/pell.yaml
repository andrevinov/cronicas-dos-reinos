schema_historico_relacao: 1
id: pell
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Pell
  tipo: mensageiro local
  local: circuito Silver Lily / Rua da Corda / Fishtown
  status: ativo
  atitude_para_ren: assustado, oportunista e cooperativo por pagamento
  confianca: muito baixa
  respeito: baixo, mas crescente por medo e utilidade
  motivo: 'Ren seguiu Pell discretamente e tentou contê-lo numa passagem escura. Pell escapou do primeiro agarre,
    mas Ren conseguiu falar antes que ele gritasse e apresentou a abordagem como tentativa de manter o contato secreto.
    Depois, Pell usou o ponto morto do vaso com flor nos fundos da Silver Lily para deixar uma mensagem útil sobre
    Velis Rook, Brass, Rusk e o "homem da lua". Na manhã de 4 Eleasis, Pell deixou novo bilhete no mesmo ponto,
    indicando que a ausência de Rusk já afetou o circuito de Brass e que alguém está tentando ligar Kage ao oriental
    da Silver Lily. No meio da tarde de 4 Eleasis, Pell deixou novo bilhete em troca das 2 PO: Brass não fica sozinho
    hoje, mas pode passar pelos fundos da Red Sail entre o sino de seis e o de sete, no movimento do barril seco
    da cozinha, com um homem entrando antes e outro saindo depois. Ren removeu o ponto morto da Silver Lily depois
    de ler o bilhete.

    '
  informacoes_compartilhadas_por_pell:
  - Pell ouviu na Silver Lily menções a homem do leste, rosto marcado, Velis Rook e Mara.
  - Pell levou a notícia para Brass na Red Sail porque Brass paga rápido por esse tipo de informação.
  - Brass perguntou se Ren tinha arma, estava sozinho, tinha sotaque forte ou mostrou selo, papel ou símbolo.
  - Brass mandou Pell levar mensagem fechada para Velis Rook perto de Narwhal Manor.
  - Velis disse 'então é hoje', entregou resposta para Brass e foi à Red Sail com a prancheta.
  - Pell não viu o homem marcado e não sabe se ele está na cidade.
  - Pell ouviu Velis murmurar a palavra 'Lua'.
  - Pell deixou bilhete dizendo que Velis vai limpar papel na casa grande do peixe antes do sino de nove.
  - Pell deixou bilhete dizendo que Brass está irritado, Rusk não voltou e o homem da lua não desce ao cais.
  - Pell deixou novo bilhete dizendo que Rusk não voltou, Brass usa menino novo e evita o beco dos tonéis.
  - Pell deixou novo bilhete dizendo que, depois da lona, alguém perguntou se Kage era o mesmo oriental da Silver
    Lily.
  - Pell escreveu que um papel fino foi para Narwhal por mão sem faixa vermelha, com a palavra 'máscara' ouvida.
  - Pell deixou bilhete no meio da tarde de 4 Eleasis dizendo que Brass não fica sozinho hoje.
  - Pell apontou uma janela entre o sino de seis e o de sete nos fundos da Red Sail, no movimento do barril seco
    da cozinha, com um homem entrando antes e outro saindo depois.
  limites:
  - Pell pediu pagamento para continuar 'não lembrando'.
  - Pell aceitou 1 PO de Ren pela informação.
  - 'Ren estabeleceu um ponto morto de contato nos fundos da Silver Lily: quando houver um pequeno vaso com flor
    na parte alta da escada, Pell pode deixar mensagem ali e receber pagamento depois.'
  - Ren pagou 1 PO pelo bilhete de Pell deixando a moeda no vaso.
  - No novo bilhete de 4 Eleasis, Pell pediu pagamento melhor.
  - Ren deixou 2 PO no ponto morto de Pell e pediu dia/hora ou local onde Dain 'Brass' Mord fique sozinho.
  - Ren removeu o ponto morto da Silver Lily após receber a resposta de Pell no meio da tarde de 4 Eleasis.
  riscos:
  - Se for ameaçado, Pell deve tentar fugir ou vender a informação sobre Ren para quem pagar primeiro.
  - Pell não tem lealdade estabelecida; funciona por pagamento, medo e oportunidade.
  - O aviso de Ren sobre risco de morte pode fazer Pell cooperar por medo ou desaparecer se a cidade parecer perigosa
    demais.
  - Pell agora é ponto sensível porque foi perguntado sobre a possível ligação entre Kage e o oriental da Silver
    Lily.
  - O depósito de 2 PO foi visto parcialmente por uma funcionária da Silver Lily, sem leitura do bilhete; o ponto
    de Pell está menos limpo.
  - O ponto morto da Silver Lily morreu; novo contato com Pell exigirá reinstalação discreta.
eventos_pos_migracao:
- transacao: s004-f568de46dc948fdf
  sessao: 4
  resumo: Ren procura Pell, mas obtém 9 contra CD 13 em Investigação; um copeiro da Silver Lily nota um homem oriental
    procurando um mensageiro jovem e Pell, avisado, aborda Ren numa viela. Ren paga 4 PO adiantadas, ficando com
    35 PO. Encomenda investigação dos proprietários, dívidas e riscos das três propriedades, priorizando a Casa
    do Salgueiro Seco, e oferece bônus de 1 PO por informação imobiliária relevante e 2 PO por paradeiro ou rotas
    de Brass. Pell aceita deixar o resultado à noite numa garrafa profundamente escondida sob a escada dos fundos
    da Silver Lily; Ren verificará pela manhã e pagará os bônus ali.
  deltas:
  - alvo: relacao:pell
    caminho: status
    op: set
    valor: Pell recebeu 4 PO adiantadas para investigar proprietários, dívidas, riscos e necessidades ligados à
      Estalagem da Lança Torta, ao Pátio dos Três Martelos e à Casa do Salgueiro Seco, com prioridade para esta
      última; também tentará escutar rotas de Brass. Entrega prevista à noite em nova garrafa sob a escada dos fundos
      da Silver Lily.
  - alvo: relacao:pell
    caminho: motivo_atual
    op: set
    valor: 'Ganhar os bônus prometidos sem ser visto perguntando diretamente: 1 PO por informação imobiliária realmente
      interessante e 2 PO por paradeiro ou caminhos de Brass.'
  - alvo: relacao:pell
    caminho: limites
    op: append
    valor: 'Novo ponto morto acordado em 8 Eleasis: garrafa suja profundamente enfiada no vão junto à parede sob
      a escada dos fundos da Silver Lily. Papel dentro significa entrega; Ren retira a mensagem, deixa a garrafa
      e deposita depois os bônus devidos. Se a garrafa sumir, o caminho morreu.'
- transacao: s006-bb8843b70523b7f1
  sessao: 6
  resumo: 'Ren assume a aparência de um bêbado junto à escada da Silver Lily, retira discretamente a garrafa e lê
    a nota de Pell. Pell não conseguiu identificar proprietários confiáveis, dívida urgente ou risco explorável
    nos três imóveis: a Lança Torta passa por cobradores contraditórios, os Três Martelos têm escrituras fragmentadas
    e o Salgueiro Seco é administrado por intermediário sem vulnerabilidade aparente. Os três rumores sobre Brass
    são incompatíveis e não confirmados. Pell declara honestamente que não obteve informação que mereça os bônus
    e pede que Ren não deixe moedas extras. Às 08:52, Ren permanece junto à escada com o bilhete; propriedades e
    rota de Brass seguem sem solução.'
  deltas:
  - alvo: relacao:pell
    caminho: status
    op: set
    valor: Pell entregou no novo ponto morto um relatório honesto, porém inconclusivo, sobre os três imóveis e Brass;
      não reivindicou os bônus prometidos
  - alvo: relacao:pell
    caminho: confianca
    op: set
    valor: Pell demonstrou discrição e honestidade ao separar rumores de informação confirmada e recusar pagamento
      extra por resultados insuficientes
- transacao: s006-4b4c90070cae69ba
  sessao: 6
  resumo: 'Ren deixa 1 PO como novo adiantamento para Pell, ficando com 34 PO, e mantém os mesmos objetivos e bônus.
    Depois vigia a Casa do Salgueiro Seco da manhã ao começo da tarde. Com 13 contra CD 14 em Investigação, não
    obtém o ponto alto ideal e usa um sótão com o pátio traseiro parcialmente oculto. Com 25 contra CD 14 em Furtividade,
    permanece indetectado. Percepção 7 contra CD 14 e Investigação 14 contra CD 15 produzem quadro incompleto: a
    casa principal parece vazia ou raramente usada; o jardineiro provavelmente mora numa dependência junto ao muro;
    um escriturário com fólio preto visita por vinte minutos e deixa um envelope, mas Ren não identifica seu nome
    nem o proprietário. Às 13:36, Ren segue oculto diante da propriedade.'
  deltas:
  - alvo: relacao:pell
    caminho: status
    op: set
    valor: Pell recebeu 1 PO de novo adiantamento pelo ponto morto para continuar investigando os mesmos três imóveis
      e Brass, mantendo os bônus de 1 PO por informação imobiliária relevante e 2 PO por rota confirmada de Brass
