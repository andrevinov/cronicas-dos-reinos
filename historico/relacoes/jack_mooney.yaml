id: jack_mooney
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Jack Mooney
  tipo: dono do circo / autoridade local do acampamento / patrono condicional
  local: Jack Mooney & Sons Circus
  status: patrono condicional ativo
  atitude_para_ren: pragmatica, desconfiada e interessada
  confianca: moderada e condicional
  respeito: inicial, baseado em competencia, audacia e honestidade parcial
  motivo: 'Jack percebeu inconsistências na cobertura de Silva, cobrou explicações e recusou transformar o circo
    em refúgio estável sem saber a verdade. Não pretende entregar Nera e Tavin à Red Sail, mas quer o estrangeiro
    armado fora do acampamento antes de aprender seu nome. Ren retornou ao circo vestido como marinheiro e provocou
    Jack com a mensagem de que um homem entrou e saiu de seu circo sem ser percebido. Jack mordeu a isca por orgulho
    e curiosidade, chamando Ren para uma conversa privada. Ao ouvir a oferta de Ren, aceitou não expulsar Nera e
    Tavin ao meio-dia, mas colocou termos rígidos: Ren deve respeitar as regras internas do circo e provar utilidade
    investigando discretamente a sabotagem da amarra da corda alta do lado leste antes do crepúsculo. Ren aceitou
    os termos. Ren resolveu a sabotagem antes do meio-dia, com prova física e sem sangue. Jack aceitou manter os
    Vell por hoje e amanhã e manter Ren como acrobata estrangeiro em teste, mas não prometeu apostar o circo inteiro
    contra a Red Sail sem entender melhor o risco. Depois que Ren revelou a influência de Harl sobre Merrit, Jack
    deu a Ren até o pôr do sol para resolver o fio. Ren convenceu Harl a confessar. Jack aplicou punição discreta
    e confirmou abrigo para Ren, Nera e Tavin por hoje e amanhã. Na madrugada seguinte, Jack e Silva impediram que
    uma sondagem ligada ao porto ou à Red Sail acessasse o interior sensível do acampamento, mas o problema chegou
    perto demais para ser ignorado. Ren propôs que Jack transformasse a pressão em busca controlada, enquanto os
    Vell seriam removidos discretamente. Jack aceitou a lógica porque pode enquadrar a busca como concessão comercial,
    não submissão. Jack puxou a atenção externa para a área das cozinhas, dando a Ren uma janela para sair com os
    Vell pela borda oposta. Depois, conduziu a busca controlada como concessão teatral: abriu o que quis, quando
    quis, e manteve os homens do porto longe do que importava até a presença da guarda encerrar a pressão imediata.
    Ren propôs o Benefício da Lona Aberta como forma de o circo comprar respeitabilidade, dinheiro e proteção social
    depois do incêndio, sem acusar publicamente Red Sail, Masao ou Narwhal. Jack aceitou o esqueleto do plano como
    viável e comercialmente útil, desde que fique sob controle dele: evento beneficente amanhã ao cair da tarde,
    ingressos comuns, camarotes caros, doações visíveis, Vell integrados como trabalhadores comuns antes dos cartazes,
    livro separado do lugar onde eles dormem, apoio de templo/guarda sem parecer medo e Ren testado antes de ser
    vendido como atração. Depois da resposta limitada de Luath, Ren demonstrou O Vento da Noite diante de Jack,
    Silva, Dessa, Mira e Sorn. A demonstração convenceu Jack de que há atração vendável: acrobacia forte, Passo
    do Vento como efeito visual impressionante e shuriken como possível "estrela" ou vento cortado, desde que tratado
    como efeito seguro, não arma diante do público. Jack e Silva prepararam o aviso escrito limpo para Luath, e
    Ren o entregou antes do pôr do sol. Depois do descanso curto de Ren, Jack autorizou Merrit a narrar o número
    apenas em chão, sem corda, faca, caixa de truque ou acesso solto. Jack decidiu que Lysa Renn será a Princesa
    das Sombras no lugar de Nera/Lena, para manter a testemunha protegida e reintegrar uma acrobata do circo em
    papel seguro. No dia seguinte, abriu o Benefício da Lona Aberta com público misto e iniciou a chamada de O Vento
    da Noite. O número funcionou diante da lona cheia: Ren executou acrobacia limpa, usou Passo do Vento como efeito
    visual impressionante e firmou Ren Kage como atração vendável. Jack percebeu aplauso, interesse dos camarotes
    e valor comercial imediato, embora ainda precise fechar o resultado financeiro e político do Benefício. Após
    o número, Jack aprovou a decisão de Ren de não voltar ao público: para ele, a ausência preserva preço e mistério.
    Um homem do camarote oeste perguntou se Kage recebe patrono privado ou contratação fechada. Jack pretende administrar
    a resposta para aumentar valor e controlar risco, mas quer saber qual limite Ren estabelece. Ren decidiu deixar
    Kage ligado ao circo por enquanto e não aceitar patrono privado na mesma noite. Jack respondeu ao camarote oeste
    que Kage não recebe casa privada hoje e que propostas por escrito podem vir amanhã. O Benefício fechou bem:
    cerca de setenta e poucas peças de ouro limpas para o circo depois de custos e promessas públicas, além de novas
    promessas comerciais e doações comunitárias sob Silva. Jack deixou recado pela manhã, via Silva: quer falar
    com Ren depois da comida sobre preço, patronos e silêncio. No escritório-carroça, Jack mostrou uma proposta
    escrita sem nome claro vinda do camarote oeste. A mensagem pede termos para apresentação privada de Kage em
    ambiente fechado, com convidados selecionados, pagamento adiantado possível e discrição. Jack considera isso
    proposta e insulto: querem comprar, mas ainda não querem assinar que querem comprar. Antes de responder, Jack
    pediu que Ren defina o que Kage não faz por dinheiro. Ren definiu que Kage só se apresenta em tenda controlada
    pelo circo, com equipe presente, segurança identificada, antecedência e sem reunião social, fala obrigatória,
    exposição pessoal, intimidação privada ou envolvimento dos Vell. Jack aceitou esses limites como política comercial
    útil e preparou resposta rígida ao camarote oeste: 40 PO pela primeira apresentação fechada curta, 20 PO adiantadas
    e custos de tenda, segurança e transporte por fora. A resposta ainda não foi selada porque chegou uma mensageira
    de Tyr pedindo Silva Elkwood por assunto de lacre reservado. Após a resposta de Silva a Tyr, Ren assinou como
    Ren Kage o acordo condicional de artista do circo, e Jack selou a resposta rígida ao camarote oeste. Em 4 Eleasis,
    por volta de 09:55, Ren retornou ao circo e procurou Jack para definir calendário de apresentações. Jack propôs
    não vender Kage naquele dia, considerar uma reprise curta de O Vento da Noite em 5 Eleasis ao cair da tarde,
    e só aceitar apresentação fechada em tenda controlada pelo circo se o camarote oeste cumprir os filtros já exigidos.
    Ren propôs confirmar uma pequena apresentação em 5 Eleasis e, depois disso, deixar a próxima particular para
    quem pagar melhor. Jack aceitou a linha comercial e a traduziu como escassez controlada: Kage raro, pouca fala,
    particulares filtrados, sem contato social direto. Antes da reprise curta de 5 Eleasis, Jack interceptou uma
    proposta privada sem nome claro tentando chegar diretamente a Kage e mencionando que a presença da gravadora
    não seria necessária se ele respondesse sozinho. Jack interpretou isso como tentativa de comprar erro, não apresentação,
    e decidiu filtrar a resposta para depois do número. Depois da reprise curta, Jack, Tobb, Silva, Sorn e Dessa
    impediram que o interessado privado furasse os filtros do pós-show. Uma segunda tira de papel chegou às mãos
    de Jack, dizendo que Kage vale mais depois do aplauso e que a gravadora vale menos se continuar cercada. Jack
    leu isso como veneno de negociação: não prova localização dos Vell, mas prova que alguém sabe qual palavra usar
    para pressionar Ren e o circo. Ren mandou Jack aceitar a proposta como isca e pedir caro. Jack escreveu resposta
    exigindo 80 PO pela primeira apresentação curta, 40 PO adiantadas, custos por fora, tenda e controle do circo,
    nome do pagador, casa responsável, endereço e hora por escrito, excluindo a gravadora de qualquer conversa.
    O envio funcionou apenas como trilha parcial: Ren viu a resposta passar por recadeiro pago e por cabriolé cinza-azulado
    sem brasão, mas não alcançou o mandante. Na manhã de 6 Eleasis, Jack pagou 8 PO a Ren pela reprise pública de
    Kage em 5 Eleasis. Também recebeu uma resposta escrita assinada por Corven Dalm, procurador da Casa Veyr, com
    40 PO adiantadas e aceite parcial dos filtros rígidos. Jack reteve o adiantamento na própria caixa e não aceitou
    ainda a apresentação fechada: Tobb verifica a Casa Veyr, Dessa avalia a tenda menor e Silva pensa na proteção
    dos Vell. Jack aceitou o relato de Ren sobre a perseguição perdida do cabriolé como relatório limpo, por não
    transformar método observado em certeza inventada. Quando Ren respondeu que o show não pode parar, Jack tratou
    a frase como ensaio de aceite, não como autorização plena: se a apresentação ocorrer, será em lona dos Mooney,
    por entrada dos Mooney e com a equipe dos Mooney controlando convidados, lamparinas e conversa. Tobb verificou
    Casa Veyr em tempo útil: a casa existe como presença temporária pagante, com camarote/salão alugado e Corven
    Dalm como procurador que assina e paga, mas sem raiz nobre local forte. Jack está pronto para aceitar somente
    com filtros rígidos: pagamento final antes da primeira lamparina, assinatura de Dalm, convidados contados por
    Tobb, guardas posicionados pelos Mooney, veto a mexer em corda, pano, lamparina ou entrada de artista, nenhuma
    conversa privada com Kage fora da lona e cancelamento imediato se aparecerem gravadora, menino, Vell ou assunto
    alheio. Ren autorizou Jack a aceitar, prometendo proteger o circo. Jack aceitou a direção, mas não tomou a palavra
    de Ren como substituto dos filtros. A Casa Veyr respondeu com uma dobra contratual: pagamento final só com os
    convidados, assinatura de Corven Dalm apenas ao pisar na lona e um homem da casa junto da entrada de artistas.
    Jack tentou bloquear sem atrasar o show, mas não conseguiu; levou a decisão de volta a Ren. Ren decidiu prosseguir,
    e Jack transformou a exigência em procedimento controlado: Kage foi movido pela rota interna de panos/remendos,
    Dalm assinou antes de pisar na lona útil, Tobb contou as 40 PO restantes antes da entrada útil dos convidados
    e o homem da casa ficou em luz clara, perto da entrada dos artistas, mas sem controle da aba real. Durante a
    apresentação, Dalm testou o eixo nome/família/fogo; Jack cortou a provocação sem encerrar o show. Depois, Ren
    chamou Dalm publicamente ao camarim com referência a Masao e às dez lâminas. Jack permitiu a conversa por não
    conseguir bloquear a cena sem fazer Kage parecer controlado ou assustado, mas ficou descontente e improvisou
    salvaguardas com Tobb na aba. Após Dalm entregar a pista da Ponte Baixa, Ren pediu desculpas a Jack e relatou
    tudo para que a informação chegasse a Silva. Jack aceitou montar uma saída falsa de Kage com Dessa e Tobb para
    proteger o circo e a máscara pública, mas registrou que Ren lhe deve a quebra pública de filtro. Ao amanhecer
    de 7 Eleasis, depois do retorno de Ren e da mensagem curta de Luath indicando que o pacote reservado passou
    para Tyr sem nome externo, Jack ouviu que os inimigos ainda não demonstraram saber exatamente onde Nera dorme.
    Ele pagou 20 PO como cachê de Kage pela apresentação fechada da Casa Veyr, tratando o pagamento do número como
    conta separada da bronca pela quebra pública de filtro. Jack quer decidir se Kage aparecerá hoje como artista
    visível e controlado ou se sua ausência será comprada com desculpa deliberada. Ren escolheu ausência cara: Kage
    só volta na semana seguinte, no circo, salvo outra apresentação particular filtrada por 80 PO. Jack aceitou
    bem a estratégia e passou a vender a ausência como escassez e descanso do joelho da Princesa das Sombras, não
    como medo.

    '
  acordos_oferecidos:
  - Nera e Tavin não serão expulsos ao meio-dia.
  - O livro fica sob guarda definida por Silva Elkwood.
  - Se Ren aceitar os termos e investigar a sabotagem da corda alta, Jack oferece comida, abrigo discreto e cobertura
    como acrobata oriental por alguns dias.
  - Ren não deve matar debaixo da lona, salvo necessidade extrema reconhecível.
  - Ren não deve usar o circo para iniciar guerra aberta com a Red Sail.
  - Nera e Tavin ficam no circo por hoje e amanhã.
  - Ren fica como Ren Kage, acrobata estrangeiro em teste, com comida e abrigo discreto definido por Jack.
  - Após a confissão de Harl, Jack confirmou o abrigo por hoje e amanhã sem novo julgamento no meio da tarde.
  - Jack aceitou preparar o Benefício da Lona Aberta como plano inicial condicionado.
  - Nera será integrada ao trabalho com Dessa Wren e Tavin à cozinha/recados antes de qualquer cartaz público.
  - O livro de provas não deve dormir onde Nera e Tavin dormem.
  - Ren deve provar um número vendável ou obter apoio institucional limpo para o evento.
  - 'Jack autorizou preparar O Vento da Noite como número condicionado: apoio limpo de Luath primeiro, prova física
    de Ren depois.'
  - A participação de Nera/Lena só é aceitável como figura mascarada e sem nome próprio no cartaz ou nos aplausos.
  - Jack aceitou vender O Vento da Noite como atração real do Benefício da Lona Aberta.
  - Jack preparou aviso escrito limpo para Luath, entregue por Ren antes do pôr do sol.
  - Jack autorizou Merrit como narradora de O Vento da Noite apenas em papel limitado de chão.
  - Jack escolheu Lysa Renn como Princesa das Sombras; Nera/Lena fica fora do número por segurança.
  - Jack iniciou a chamada pública de O Vento da Noite durante o Benefício da Lona Aberta.
  - O Vento da Noite foi bem recebido pelo público, e Jack passou a ver Ren Kage como atração real do circo.
  - Jack recebeu ficha do camarote oeste perguntando se Kage aceita patrono privado ou contratação fechada.
  - Jack pode negar por Ren, dizer que Kage só fala por Jack, marcar resposta controlada para amanhã ou permitir
    contato imediato.
  - Jack respondeu ao camarote oeste que Kage não recebe casa privada nesta noite; propostas por escrito podem vir
    amanhã.
  - O Benefício da Lona Aberta gerou cerca de setenta e poucas PO limpas para o circo depois de custos e promessas
    públicas.
  - Jack quer conversar pela manhã sobre quanto Kage custa, para quem custa e quanto desse preço compra silêncio.
  - Jack não exigiu Ren em jejum; quer a conversa depois da comida.
  - Jack recebeu proposta escrita sem nome claro do camarote oeste para apresentação privada de Kage.
  - Jack quer exigir nome de casa, endereço, pagador, metade adiantada e local controlado antes de responder de
    verdade.
  - Jack pediu que Ren defina limites absolutos de Kage antes de negociar.
  - 'Ren definiu limites absolutos de Kage: tenda controlada pelo circo, equipe presente, segurança identificada,
    antecedência, sem reunião social, sem fala obrigatória, sem exposição pessoal, sem intimidação privada e sem
    envolver os Vell.'
  - Jack preparou resposta rígida ao camarote oeste, com 40 PO pela primeira apresentação fechada curta, 20 PO adiantadas
    e custos de tenda, segurança e transporte por fora.
  - Ren assinou como Ren Kage o acordo condicional de artista do Jack Mooney & Sons Circus.
  - Jack selou a resposta rígida ao camarote oeste.
  - 'Jack propôs calendário inicial: Kage não se apresenta em 4 Eleasis; pode fazer reprise curta de O Vento da
    Noite em 5 Eleasis ao cair da tarde; apresentações fechadas só em tenda controlada pelo circo e após filtros
    formais do contratante.'
  - Ren aceitou uma pequena apresentação em 5 Eleasis ao cair da tarde e particulares posteriores para quem cumprir
    filtros e pagar melhor.
  - O acordo condicional não fixou um cachê público permanente; a reprise de Kage em 5 Eleasis foi acertada posteriormente
    por 8 PO.
  - Jack filtrou uma proposta privada sem nome claro que tentou alcançar Kage diretamente antes da reprise de 5
    Eleasis.
  - Jack segurou a borda do pós-show de 5 Eleasis e impediu contato direto com Kage.
  - Jack pediu que Ren escolha se ele responde como dono de circo, se Ren segue a mão do recado ou se Kage desaparece
    por ora.
  - Jack escreveu resposta-isca exigindo 80 PO, 40 PO adiantadas, custos por fora, tenda/controlos do circo, nome
    do pagador, casa responsável, endereço e hora por escrito.
  - Jack pagou 8 PO a Ren pela reprise pública de Kage em 5 Eleasis.
  - Jack recebeu 40 PO adiantadas de Corven Dalm, procurador da Casa Veyr, mas reteve o dinheiro até confirmar legitimidade
    e aceitar ou recusar a apresentação fechada.
  - Jack tratou a resposta de Ren sobre o show não parar como ensaio de aceite sob filtros do circo, não como sim
    final.
  - Jack propôs aceitar a apresentação fechada da Casa Veyr apenas com filtros rígidos e aguarda se Ren acrescenta
    condição final.
  - 'A Casa Veyr tentou alterar os filtros finais: pagamento restante com convidados, assinatura de Dalm só na lona
    e homem da casa junto da entrada de artistas.'
  - Após Ren decidir prosseguir, Jack estruturou transporte e entrada de modo que Kage permanecesse sob controle
    dos Mooney, não da Casa Veyr.
  - Tobb contou as 40 PO restantes da Casa Veyr antes da entrada útil; o total de 80 PO ficou com Jack/Tobb até
    o acerto posterior.
  - Ren abriu a apresentação fechada com Passo Sombrio, escolhendo impacto e ameaça controlada em vez de ocultar
    totalmente a técnica.
  - 'Durante a apresentação fechada, Jack cortou a provocação de Dalm sobre nome/família/fogo sem encerrar o show:
    ''Contrato compra espetáculo. Não compra genealogia.'''
  - Após o final da apresentação, Jack permitiu que Dalm entrasse no guarda-roupa menor/camarim funcional de Kage,
    com Tobb vigiando a aba e o homem da Casa Veyr impedido de acompanhar.
  - Jack pagou 20 PO a Ren como cachê de Kage pela apresentação fechada da Casa Veyr, deixando o restante para lona,
    equipe, risco e caixa do circo.
  - Jack separou o pagamento do número da bronca pela quebra pública de filtro, que permanece como dívida operacional.
  - Jack pediu que Ren escolha se Kage aparece hoje como homem visível, calmo e controlado, ou se Jack compra a
    ausência dele com desculpa deliberada.
  - 'Ren escolheu que Kage fique ausente para parecer caro: salvo particular filtrada por 80 PO, Kage só volta na
    próxima semana, no circo.'
  - Jack aceitou vender a ausência de Kage como escassez e descanso da Princesa das Sombras.
  informacoes_recebidas_por_jack:
  - Merrit Tealeaf confessou ter cortado a tira da amarra da corda alta.
  - A faca curva recuperada por Ren combina com o padrão do corte e tem resíduo de couro.
  - Ren suspeita que há omissão na certeza de Merrit sobre Sorn detectar o problema.
  - Harl Venn admitiu ter plantado em Merrit a ideia de que Sorn ouviria uma amarra cantando errado.
  - Antes da reprise curta de 5 Eleasis, Jack recebeu proposta privada sem nome claro que mencionava dispensar a
    gravadora se Kage respondesse sozinho.
  - 'Depois da reprise curta de 5 Eleasis, Jack recebeu segunda tira de papel: ''Depois do aplauso, Kage vale mais.
    A gravadora vale menos se continuar cercada. Mandem preço e condição antes que outra casa compre o silêncio.'''
  - Ren autorizou Jack a aceitar a proposta como isca e pedir o dobro; Ren tentou seguir o canal após o envio.
  - Ren informou Jack que viu método, recadeiro pago e cabriolé cinza-azulado sem brasão, mas não identificou o
    mandante.
  - A resposta escrita veio de Corven Dalm, procurador da Casa Veyr, aceitando 80 PO por apresentação fechada curta
    e tentando excluir intermediários da conversa artística.
  - Ren aceitou preparar a tenda menor e revisar o número, mas ainda sob controle de Jack e sem remover os filtros
    do circo.
  - Tobb verificou que Casa Veyr existe operacionalmente como presença temporária de aluguel e pagamento, mas sem
    raiz local profunda.
  - Ren prometeu a Jack que nada aconteceria às pessoas do circo; Jack ouviu a promessa, mas continua dependendo
    dos filtros práticos.
  - Ren decidiu prosseguir com a apresentação fechada da Casa Veyr apesar da dobra contratual e discutiu o transporte
    de Kage com Jack.
  - Jack viu Dalm encaixar a frase ambígua 'Nem todo nome curto nasce pequeno' durante a apresentação, sem romper
    claramente o contrato.
  - Jack viu Ren não entregar reação à provocação de Dalm; a segunda provocação deu a Jack margem para intervir.
  - Jack viu Ren chamar Dalm ao camarim com referência pública a Masao e às dez lâminas, o que piorou a saída social
    dos convidados e forçou salvaguarda improvisada.
  - Ren relatou a Jack a pista de Dalm sobre segunda maré, Ponte Baixa, porões secos atrás de armazéns velhos, papéis
    antes de lâminas, gravadora, menino e Masao.
  - Ren pediu que Jack repasse a informação a Silva.
  - Ren informou Jack ao amanhecer de 7 Eleasis que Luath lacrou as provas da Ponte Baixa, que uma mensagem indica
    encaminhamento a Tyr sem nome externo e que os inimigos ainda não demonstraram saber a localização exata dos
    Vell.
  riscos:
  - Pode expulsar Ren se ele quebrar as regras internas do circo.
  - Pode mover Nera e Tavin para outro abrigo se Ren falhar ou atrair pressão direta.
  - Pode virar aliado se Ren ou Silva apresentarem verdade suficiente e risco controlável.
  - Ainda pode rever a punição de Merrit se a influência externa for comprovada.
  - Não pretende virar muralha contra a Red Sail sem saber o tamanho do risco.
  - Conduziu julgamento interno controlado e suspendeu Merrit de apresentações.
  - 'Puniu Harl discretamente: um mês longe da corda alta, sem chave, sem conferência de segurança e sem ficar sozinho
    com Merrit ou Lysa por ora.'
  - A sondagem ao amanhecer aumenta a pressão para Ren oferecer explicações ou solução antes que o abrigo dos Vell
    fique caro demais para o circo.
  - Jack aceita busca controlada como manobra de apaziguamento, mas não permitirá vasculha livre nem exposição da
    rotina interna do circo.
  - A busca controlada aliviou a pressão imediata, mas pode fazer a Red Sail voltar por meios menos públicos.
  - O Benefício da Lona Aberta pode fortalecer o circo, mas também pode atrair pressão se a Red Sail enxergar perda
    de narrativa pública.
  - O uso de shuriken no número só é aceitável se for controlado como efeito artístico sem risco ao público.
  - O sucesso de O Vento da Noite aumenta o valor de Ren para Jack, mas também torna o artista novo mais reconhecível
    em Ravens Bluff.
  - Patronato privado pode ser dinheiro limpo, vaidade de rico, ponte social ou tentativa de pescar identidade;
    Jack ainda não sabe qual.
  - Manter Kage caro e inacessível aumenta valor comercial, mas pode fazer patronos insistirem por vias indiretas.
  - A tentativa de contatar Kage diretamente antes da reprise sugere que pelo menos um interessado quer separar
    Ren de Jack e dos filtros do circo.
  - A nova tira de papel aumenta o risco de Kage virar alavanca contra Nera, mesmo sem prova de que o abrigo dos
    Vell foi localizado.
  - A frase sobre intermediários desnecessários na resposta da Casa Veyr sugere nova tentativa de separar Kage dos
    filtros de Jack e Silva.
  - Se a Casa Veyr resistir a entrada, equipe, lamparinas ou testemunhas dos Mooney, Jack tende a cancelar ou endurecer
    a contraproposta.
  - Mesmo com a entrada controlada, o homem da Casa Veyr está perto o bastante da aba dos artistas para observar
    lamparinas, pregas e sombras.
  - A revelação do Passo Sombrio aumenta o valor comercial de Kage, mas também torna a máscara mais interessante
    para observadores especializados.
  - Dalm já testou o eixo nome/família/fogo diante de Kage, o que aumenta risco de provocação pessoal sem ainda
    romper a tenda em violência.
  - O convite público de Ren a Dalm para o camarim, usando referência a Masao, irritou Jack por contornar os filtros
    que ele vinha tentando preservar.
