      mãos limpas, mas questionou se ele já havia feito algo naquele dia.
- transacao: s004-9aff1a8cf9c2a85f
  sessao: 4
  resumo: Ren explica a Silva por que considera Bram Vask uma ameaça recorrente e pergunta como proteger Colm e
    outras vítimas sem conseguir estar em todos os lugares. Silva separa o problema imediato de Colm da capacidade
    estrutural de Bram de produzir novas vítimas. Ela aconselha uma cadeia compartimentada de abrigo e transporte,
    ação contra dinheiro, cobradores, documentos e sucessores de Bram, e alerta que matar Bram pode apenas promover
    outro agente. Silva oferece procurar, antes do anoitecer, uma rota rural de Chauntea para Colm, desde que o
    circo e os Vell permaneçam fora e Ren aceite não controlar toda a cadeia.
