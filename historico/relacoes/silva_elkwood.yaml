relacao:
  nome: Silva Elkwood
  tipo: clériga de Chauntea / contato potencial de abrigo
  local: Jack Mooney & Sons Circus
  status: conhecida em jogo
  atitude_para_ren: favoravel e cautelosa, ainda preocupada com o risco ao circo
  confianca: moderada e vigilante
  respeito: alto
  motivo: 'Silva reconheceu a senha e o selo de Maerra imediatamente, fez cobertura pública sobre casca de salgueiro
    e deixou Ren, Nera e Tavin entrarem na carroça verde. Ao ouvir Ren priorizar os irmãos Vell e o livro acima
    da própria segurança, julgou o pedido sincero. Aceitou esconder Nera, Tavin e o livro imediatamente, e ofereceu
    abrigo provisório de poucas horas para Ren num compartimento de pano atrás da carroça de remendos. Pela manhã,
    falhou em convencer Jack Mooney a aceitar abrigo estável sem mais verdade ou solução. Ainda quer proteger os
    Vell, mas o prazo prático agora é o meio-dia. Quando Ren retornou vestido como marinheiro, Silva o reconheceu
    e permaneceu presente na conversa privada com Jack. Depois da crise de Merrit, Silva entrou na carroça verde
    com tato, confirmou abrigo real por hoje e amanhã e mandou Ren comer e dormir. Após Ren resolver o fio de Harl
    sem sangue e sem julgamento público, Silva passou a tratar Ren com mais confiança prática. Ainda não é confiança
    irrestrita: Silva segue medindo riscos ao circo, aos Vell e ao livro. Silva ouviu Ren prometer a Tavin que voltaria,
    explicar que pretende apenas investigar a conexão entre Red Sail e Masao, e propor Kagefusha como nome de palco.
    Ren voltou ao circo pela rota combinada depois da trilha noturna, sem trazer perseguição imediata para a carroça
    verde. Silva notou que ele estava fisicamente inteiro, mas mentalmente aéreo, e ofereceu banho simples atrás
    da lona azul antes de decidir se ele falaria com Nera. Depois do banho, Silva autorizou Ren e Nera a caminhar
    apenas pela rota interna das lonas e indicou Dessa Wren como solução para roupas comuns de disfarce. Ren levou
    Nera de volta dentro do limite combinado e depois completou descanso longo no depósito de figurino velho. Antes
    do amanhecer, Silva e Jack tiveram de lidar com sondagem externa ligada ao porto ou à Red Sail; eles impediram
    acesso direto, mas Silva chamou Ren assim que o descanso foi suficiente. Ren propôs evacuar Nera e Tavin antes
    de uma busca controlada; Silva julgou possível e levou a proposta a Jack, com a ressalva de que ninguém da Red
    Sail deve circular livremente pelo circo. Depois, Silva não conseguiu garantir uma saída limpa, mas indicou
    a rota menos ruim pela borda oposta se Jack puxasse a atenção para as cozinhas. Quando Ren retornou com Nera
    e Tavin, Silva viu que a busca controlada já havia funcionado por ora e recolheu os irmãos para a carroça verde
    antes de perguntar detalhes. Ela reconheceu a pasta lacrada como novo risco. Ren pediu que Silva cuidasse dos
    Vell novamente enquanto ele procura Tyr. Silva aceitou, mas advertiu Ren a não colecionar dívida que só morto
    consegue pagar. Na Casa de Tyr, Ren nomeou Silva em registro selado como guardiã atual informada por ele para
    Nera e Tavin, ainda pendente de confirmação externa. A confirmação ainda não chegou a Silva em cena. Depois
    do incêndio no Harbor District, Ren voltou ao circo pela rota da carroça de remendos sem trazer cauda. Silva
    o interceptou discretamente perto da entrada interna, demonstrando que continua vigiando os acessos sensíveis
    do circo. Ren contou a Silva sobre Tyr, Sirrus, Halessa, Velis, a nomeação selada e a leitura do incêndio como
    possível manobra política da Red Sail. Silva aceitou a nomeação com reprimenda, não como quebra de confiança,
    e aconselhou Ren a não mover os Vell durante a crise: separar Ren, Nera/Tavin e o livro, transformar os irmãos
    em gente da rotina do circo, manter Ren visível por algumas horas como Ren Kage e falar com Jack junto dela.
    Silva ouviu Ren propor o Benefício da Lona Aberta e apoiou a parte comunitária do plano: Chauntea pode ajudar
    com comida, água, cobertores e mãos, desde que o evento não vire palanque de acusação nem exponha Nera e Tavin.
    Silva aceitou a possibilidade de Nera participar de O Vento da Noite apenas como figura anônima e mascarada,
    sem nome anunciado, sem aplauso próprio e somente se Jack aprovar. Também aceitou Merrit como narradora apenas
    sob supervisão direta. Silva assinou a parte comunitária do aviso do Benefício da Lona Aberta, atestando comida,
    água, cobertores e doações reais. Depois manteve Merrit sob supervisão durante o ensaio e levou Nera/Lena e
    Tavin/Timo para assistir pela rota interna. Silva apoiou a decisão de manter Nera fora do papel de Princesa
    das Sombras. No dia da apresentação, acompanhou Nera e Tavin perto da carroça verde e avaliou Ren vestido para
    o número como visível demais para desperdiçar com imprudência. Durante O Vento da Noite, Silva viu Ren transformar
    a cobertura de artista em uma máscara pública aceita pelo público. Considera o sucesso útil para fortalecer
    o circo e proteger os Vell pela rotina, mas também percebe que Ren Kage ficou mais difícil de esconder. Quando
    Jack trouxe a ficha do camarote oeste, Silva interveio de imediato para manter Nera e Tavin fora de qualquer
    aproximação de patrono, reforçando que a oportunidade comercial não deve tocar as testemunhas protegidas. No
    fechamento do Benefício, Silva manteve as doações comunitárias separadas do caixa de Jack e aceitou que os Vell
    durmam no circo esta noite. Pela manhã, Silva checou Ren, deixou água e pão e avisou que Jack quer falar depois
    da comida. Também informou, com humor seco, que Nera está acordada tentando fingir que não espera Ren. No escritório
    de Jack, Silva reforçou que Nera, Tavin, o livro e a história dos Vell não entram em nenhuma negociação sobre
    Kage. Quando uma mensageira de Tyr chegou à borda das carroças por assunto de lacre reservado, Silva foi recebê-la
    com Ren. A ficha informou que Luath confirmou a cópia parcial e a ação contra buscas ilegais, Maerra confirmou
    o lacre e a abertura presenciada, e Tyr agora pede confirmação formal da guarda atual informada. Após Ren defender
    que os Vell permaneçam no circo, Silva confirmou formalmente a guarda imediata, pediu manutenção temporária
    no abrigo atual e solicitou resguardo em espera sem deslocamento até o próximo sino maior. Silva aceitou o agradecimento
    de Ren por cuidar dos Vell, mas reforçou que ele deve voltar vivo em vez de morrer fazendo besteira. Ren avisou
    Silva que, depois de assinar com Jack, sairia para resolver coisas pessoais. Silva não o impediu, mas registrou
    que ao menos ele avisou antes. Ao anoitecer, Ren voltou ao circo pela rota das carroças de remendos por deslocamento
    discreto comum, sem cauda competente no trajeto e sem gerar rastro útil até o acampamento. Silva interceptou
    Ren antes da carroça verde, mandou checar a borda do acampamento e só permitiu banho, conversa e descanso depois
    de confirmar que ninguém o seguiu até dentro. Ren contou a Silva sobre Kethra, Colm/Dent, Dorra Hest, Velis,
    M. Harrow e a Casa Velha do Primeiro Raio. Silva reforçou que a Casa Velha deve ser tratada como lugar que usa
    crianças como olheiros, não como abrigo vazio. Depois da incursão na Casa Velha e na oficina dos tintureiros,
    Ren voltou ao circo por volta de 02:10 de 4 Eleasis, sem cauda competente percebida, mas sem ki e visivelmente
    exausto. Silva o interceptou antes da carroça verde para confirmar se ele trouxe alguém atrás. Ren respondeu
    que não foi seguido, chamou-a de Sil pela primeira vez e contou por cima que sete crianças foram resgatadas
    e estão sob cuidado de Maerra. Silva percebeu o cansaço extremo de Ren e decidiu mandar ajuda discreta de Chauntea
    à Casa da Aurora Menor antes do amanhecer. Ren agradeceu Silva por ajudar Nera e Maerra; Silva respondeu que
    ele deveria agradecer dormindo. Quando Ren retornou ao circo por volta de 09:55 de 4 Eleasis, Silva confirmou
    que a ajuda de Chauntea chegou a Maerra e direcionou Ren a Jack para a conversa sobre Kage. No começo da noite
    de 4 Eleasis, Ren voltou novamente ao circo pela borda dos remendos depois de observar Brass e visitar Maerra.
    A volta não trouxe perseguição colada para dentro do acampamento, mas ficou imperfeita o bastante para Silva
    interceptá-lo antes da carroça verde e perguntar se ele veio sozinho ou apenas chegou primeiro. Ren admitiu
    a Silva e Nera que não tentou capturar Brass porque o risco era alto demais. Silva leu a decisão como autocontrole
    útil, não como falta de coragem. Ela checou a borda do circo de modo discreto, mas não conseguiu confirmar limpeza
    plena: apenas não encontrou perseguição colada. Depois permitiu jantar e passeio de Ren com Nera apenas pela
    rota interna. Mais tarde, viu Ren treinar sozinho sem tentar voo ou salto perigoso e considerou isso bom senso.
    Na conversa sobre Sarbreen, explicou apenas o que sabia por rumor e prática: a antiga cidade anã sob Ravens
    Bluff é fragmentada, perigosa e cheia de histórias falsas. Indicou Lockwood Mooney, Gond, Wizards'' Guild ou
    mapas velhos do porto como caminhos possíveis, cada um com custo e risco próprios. Após a reprise curta de 5
    Eleasis, Silva viu Jack e a equipe segurarem a borda do pós-show e leu a segunda tira de papel que usava a palavra
    gravadora para pressionar Kage. Ela endureceu a segurança interna dos Vell: Tobb fecha a rota curta, uma menina
    de costura fica mais perto da carroça verde e curiosos serão afastados sem explicação. Mais tarde, Ren retornou
    do posto de Luath pela rota longa, sem cauda útil percebida, mas sem certeza absoluta de limpeza. Silva interceptou
    Ren antes que ele fosse à carroça verde. Ren escolheu não ver os Vell e pediu que Silva entregasse um bilhete
    a Nera. Silva não abriu o bilhete, entregou-o e depois transmitiu a resposta de Nera a Ren. Na manhã de 6 Eleasis,
    Silva tomou café com Ren longe da carroça verde, ouviu o relato sobre Sarbreen, Brunna, a Escada das Sete Águas
    e Luath, e tratou a nova técnica de Ren como ferramenta recuperada, não como vaidade. Manteve o limite prático:
    Passo Sombrio deve ser testado longe dos Vell até Ren conhecer seus limites. Depois, com Jack, participa do
    filtro contra a resposta da Casa Veyr e calcula como manter Nera e Tavin afastados da possível apresentação
    fechada sem denunciar que são o ponto sensível. Após o treino da tenda menor, Silva ainda mantém os Vell fora
    da superfície de Kage e da Casa Veyr; qualquer aproximação entre apresentação fechada e carroça verde deve passar
    por ela. Silva aceitou abrir a porta da carroça verde por instantes para um teste controlado de Passo Sombrio,
    com Tavin longe da carroça e Tobb limpando a rota interna. A visita não virou rumor no circo, mas Silva viu
    que a técnica ainda assusta dentro da carroça e reforça sua cautela com os Vell. Na madrugada de 7 Eleasis,
    Silva interceptou Ren na rota interna de remendos depois que ele voltou da Ponte Baixa e do posto de Luath.
    Ren confirmou que veio limpo e contou o essencial sobre a passagem, o arquivo vivo, os documentos retirados,
    o sol apagado e o lacre reservado feito por Luath. Silva avaliou que as provas estarem sob chave de Luath é
    melhor do que circularem nas roupas de Ren. Ela manteve o acampamento dormindo, não acordou Jack de imediato
    e ofereceu caminhos práticos: falar baixo com Nera, acordar Jack ou comer e meditar antes do primeiro cinza.
    Silva conduziu Ren à carroça verde para uma conversa baixa com Nera sem acordar Tavin, depois fez Ren comer
    e manteve a rotina do circo quieta enquanto ele dormia e meditava. Ao amanhecer, leu a mensagem curta de Luath
    informando que o pacote reservado passou para Tyr sem nome externo. Ela acompanhou a conversa com Jack e reforça,
    junto dele, que qualquer acesso aos Vell passa por ela quando houver risco de olho externo.

    '
  documentos:
  - Silva abriu e leu o bilhete curto e selado de Maerra.
  riscos:
  - O circo reduz o alcance natural da Red Sail, mas não é fortaleza.
  - Se Dain conectar os Vell ao circo, Silva e os Mooney podem ser pressionados.
  - Abrigo mais longo para Ren exigirá envolver Jack Mooney ou sustentar uma cobertura maior.
  - Jack só tolera manter Nera e Tavin no circo até o meio-dia sem uma solução melhor.
  - Silva confia mais em Ren depois da confissão de Harl, mas seguirá intervindo se achar que ele está prometendo
    mais segurança do que pode entregar.
  - Silva instruiu Ren a avisar por onde sairá, voltar pela carroça de remendos se ferido e não retornar direto
    à carroça verde se trouxer perseguição.
  - Silva sabe que Ren voltou abalado da trilha e pode pressionar por explicações se ele tentar agir de novo sem
    descanso.
  - 'Silva autorizou passeio curto pela rota interna das lonas: sem borda do acampamento, sem carroça de arreios
    e sem estrada.'
  - Silva sabe que a pressão externa alcançou o perímetro do circo ao amanhecer.
  - Silva aceita a busca controlada apenas se Jack mantiver controle sobre onde os homens olham e quem acompanha.
  - Silva manteve o livro de provas escondido com ela enquanto Ren retirava Nera e Tavin.
  - Silva recebeu Nera e Tavin de volta depois que a pressão imediata da Red Sail foi dispersada.
  - Silva aceitou guardar Nera e Tavin novamente enquanto Ren leva a pasta lacrada a Tyr.
  - Silva consta em registro selado de Tyr como guardiã atual informada por Ren; a ficha reservada de confirmação
    chegou à borda das carroças.
  - Silva confirmou formalmente a guarda imediata dos Vell perante a mensageira de Tyr.
  - Silva pediu manutenção temporária no abrigo atual e recusou transferência para Tyr neste momento.
  - Silva solicitou resguardo em espera sem deslocamento até o próximo sino maior.
  - Silva sabe que Ren saiu do circo na manhã seguinte ao Benefício para tratar de assuntos pessoais.
  - Silva sabe que Ren voltou ao circo ao anoitecer sem cauda competente e sem rastro útil até o acampamento.
  - Silva impediu Ren de ir direto à carroça verde até checar a borda do acampamento.
  - Silva sabe que Ren comprou tempo para Colm/Dent com Dorra Hest, não segurança duradoura.
  - Silva sabe que Kethra aceitou um ponto morto em Narwhal, mas recusou mensagens diárias.
  - Silva sabe que Ren pretende ou considera preparar a Casa Velha do Primeiro Raio para uma incursão noturna.
  - Silva viu Ren voltar do Harbor District sem cauda aparente e quer confirmação direta de que ele veio sozinho.
  - Silva aceitou a nomeação em Tyr com reprimenda e quer falar com Jack antes que a notícia chegue por outra boca.
  - Silva aconselhou separar Ren, Nera/Tavin e o livro para que a Red Sail não possa apagar os três alvos de uma
    vez.
  - Silva quer que Ren fique visível por algumas horas como Ren Kage, acrobata estrangeiro, em vez de parecer uma
    sombra sempre ligada a crises.
  - Silva apoia o Benefício da Lona Aberta apenas como ação comunitária discreta, não como declaração pública de
    guerra.
  - Silva sabe que Ren voltou limpo da Ponte Baixa/Luath na madrugada de 7 Eleasis e que as evidências foram lacradas
    sob custódia reservada da Night Watch.
  - Silva não permitirá que Nera vire atração reconhecível nem que Merrit tenha acesso solto a cordas, facas ou
    caixas de truque.
  - Silva assinou a parte comunitária do aviso entregue a Luath.
  - Silva levou Nera/Lena e Tavin/Timo para assistir ao ensaio sem expô-los fora da rotina do circo.
  - Silva apoiou que Lysa, não Nera, seja a Princesa das Sombras.
  - Silva estava com Nera/Lena e Tavin/Timo nos bastidores durante O Vento da Noite.
  - Silva viu O Vento da Noite ser bem recebido e entende que Ren Kage agora é ativo público útil, mas visível.
  - Silva não quer que Nera/Lena nem Tavin/Timo sejam levados para perto de possíveis patronos ou camarotes interessados
    em Kage.
  - Silva administra separadamente a lista de doações comunitárias do Benefício da Lona Aberta.
  - Silva aceita que Nera e Tavin permaneçam no circo nesta noite após o fechamento sem incidente aberto.
  - Silva checou Ren na manhã seguinte ao Benefício e garantiu que ele coma antes de falar com Jack.
  - Silva não permitirá que a negociação sobre Kage use Nera, Tavin, o livro ou a tragédia dos Vell como tempero
    comercial.
  - Silva ouviu Ren chamá-la de Sil pela primeira vez e não corrigiu o apelido.
  - Silva sabe que sete crianças foram resgatadas da Casa Velha do Primeiro Raio e estão sob cuidado de Maerra.
  - Silva pretende mandar ajuda discreta de Chauntea à Casa da Aurora Menor antes do amanhecer.
  - Silva sabe que a ajuda discreta de Chauntea chegou a Maerra sem chamar atenção útil antes do amanhecer.
  - Silva mandou Ren dormir depois da incursão e não quer que ele aja sem recuperar o centro.
  - Silva viu Ren retornar ao circo por volta de 09:55 de 4 Eleasis sem cauda competente percebida e o encaminhou
    à conversa com Jack sobre o calendário de Kage.
  - Silva interceptou Ren no começo da noite de 4 Eleasis após uma volta discreta imperfeita e quer confirmar se
    há cauda antes de liberá-lo para a carroça verde.
  - Silva checou a borda do circo após o retorno de Ren e não encontrou perseguição colada, mas não conseguiu confirmar
    que a borda está limpa.
  - Silva ouviu Ren admitir que não tentou capturar Brass por risco aos aliados e tratou isso como autocontrole
    útil.
  - Silva permitiu jantar e passeio de Ren com Nera apenas pela rota interna do circo.
  - Silva viu Ren treinar Kage sozinho sem gastar ki nem tentar salto perigoso.
  - Silva apontou Lockwood Mooney, Gond, Wizards' Guild e mapas velhos do porto como caminhos possíveis para investigar
    Sarbreen e rumores de itens, mas não conseguiu separar rumor confiável de fantasia.
  - Silva viu a reprise curta de Kage funcionar e endureceu a segurança dos Vell depois que nova tira de papel pressionou
    Kage usando a palavra gravadora.
  - Silva interceptou Ren na volta do posto de Luath e aceitou entregar um bilhete fechado a Nera sem expô-lo diretamente
    aos Vell.
  - Silva sabe que Ren retornou sem cauda útil percebida, mas sem a certeza plena que ele queria.
  - Silva ouviu o relato de Ren sobre Sarbreen, Brunna Torkel, a Escada das Sete Águas e a avaliação de Luath.
  - Silva sabe que Ren despertou o Passo Sombrio e quer que ele teste a técnica longe dos Vell até conhecer seus
    limites.
  - Silva sabe que a resposta da Casa Veyr chegou com 40 PO adiantadas, mas que Jack ainda não aceitou a apresentação
    fechada.
  - Silva sabe que Casa Veyr foi verificada como presença temporária pagante, mas sem raiz local forte.
  - Silva mantém Nera e Tavin longe da superfície da apresentação fechada de Kage.
  - Silva ajudou Ren a fazer uma visita discreta por Passo Sombrio à carroça verde, mas considera a técnica brusca
    demais para uso casual perto dos Vell.
  - Silva manteve a rotina do circo quieta enquanto Ren completava descanso curto antes do amanhecer de 7 Eleasis.
  - Silva leu a mensagem curta de Luath informando que o pacote reservado da Ponte Baixa passou para Tyr sem nome
    no papel externo.
  - Silva continua como filtro obrigatório para conversas com Nera e Tavin quando houver risco de observação no
    acampamento.
