  sessao: 21
  resumo: Ren informou Tomas de que a operação atribuída a Masao seria compartimentalizada, que os agressores atacaram
    Shinta chamando-o de Ren e que a investigação alcança a Galeria. Tomas reconheceu o risco, sem presumir a origem
    do vazamento, e pediu que Ren definisse o que pretende fazer, preservando Sella e os funcionários.
