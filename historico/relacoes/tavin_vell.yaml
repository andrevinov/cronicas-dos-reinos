  resumo: Ren declarou aos dois que não sabe se o homem de cinza conhece o paradeiro de Darran, quer capturá-lo
    depressa por suas respostas e por considerá-lo uma ameaça. Ficou mais alguns minutos brincando com Tavin e conversando
    com Nera; Tavin imitou o escriba da história, sem ensinar técnicas ou impor novas falas a Ren. Ren levantou-se
    e anunciou sua intenção de atualizar Maerra, verificar seu bem-estar e procurar o homem de cinza. Nera agradeceu
    o relato e pediu que mandasse um abraço a Maerra; Tavi…
