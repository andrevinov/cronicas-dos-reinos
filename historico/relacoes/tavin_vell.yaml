schema_historico_relacao: 1
id: tavin_vell
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Tavin Vell
  tipo: testemunha jovem
  local: carroça verde de Silva Elkwood, Jack Mooney & Sons Circus
  status: sob proteção temporária de Silva Elkwood
  atitude_para_ren: assustado, grato e tentando obedecer
  confianca: baixa, mas crescendo
  respeito: medo respeitoso com simpatia
  motivo: 'Tavin viu Ren chegar junto de Nera e sabe que havia homens procurando por ele, mas ainda não entende
    se Ren é salvação, ameaça ou ambos. No circo, respondeu ao cumprimento improvisado de Ren e repetiu "beleza"
    como se fosse promessa de obediência. Depois que Ren confirmou o abrigo provisório no circo, Tavin relaxou o
    bastante para brincar perguntando se Ren sabe cair engraçado. Mais tarde, quando Ren voltou para avisar que
    seguiria uma trilha à noite, Tavin perguntou se Ren voltaria. Ren prometeu que voltará, e Tavin aceitou a promessa
    como algo que precisa escolher acreditar. Na saleta de ervas da Casa da Aurora Menor, Tavin ouviu o bilhete
    da pasta de Velis tratar "gravadora e menino" como ruído que não deve chegar a Tyr. Depois voltou ao circo com
    Ren e Nera, sob disfarce, após a pressão da Red Sail ser dispersada pela busca controlada de Jack e pela patrulha
    de Luath. Ao se despedir, Ren pousou a mão na cabeça de Tavin e pediu que ele ficasse quietinho. Tavin repetiu
    "beleza", tratando a palavra como promessa. Ao ouvir o plano do Benefício da Lona Aberta, aceitou usar "Timo"
    como nome de cobertura na rotina do circo e repetiu que Timo carrega água e não pega faca, archote ou segredo.
    No fim da tarde, assistiu parte do ensaio de O Vento da Noite como Timo, segurando uma jarra vazia para parecer
    ocupado, e reagiu com encanto às acrobacias de Ren. No almoço do dia da apresentação, ouviu Ren tentar explicar
    sushi e desconfiou se peixe cru é comida, castigo ou remédio. Pouco antes do número, viu Ren vestido como O
    Vento da Noite e disse que ele parece "caro". Durante a apresentação, Tavin viu parte suficiente do efeito público
    para associar Ren Kage a alguém que realmente parece voar. Nos bastidores, ao ouvir Jack falar de possível patrono
    privado, Tavin perguntou se "caro" é perigoso; Nera respondeu que quase sempre. No fechamento do Benefício,
    Tavin estava cansado e sonolento, mas entendeu a conclusão simples: Kage ficou caro e, por esta noite, os Vell
    ainda dormem no circo. Depois da refeição tardia na carroça verde, Tavin adormeceu antes de conseguir sustentar
    curiosidade sobre o medo de Ren. Na manhã seguinte, depois de Ren assinar o acordo de Kage, Tavin ouviu que
    Ren sairia por um tempo e fez uma saudação torta, dizendo para ele olhar onde cai se for voar. Quando Ren retornou
    ao circo por volta de 09:55 de 4 Eleasis, Tavin o viu da rotina de água e fez uma nova saudação torta, quase
    derrubando a jarra vazia. Na manhã de 5 Eleasis, Tavin ouviu Ren falar de Kozakura, clã e treino, tentou pronunciar
    Getsuei-ryu e perguntou se Ren apanhou muito quando era pequeno. Antes da reprise curta, viu uma apresentação
    pequena de Kage para os Vell e tentou aplaudir sem chamar atenção demais.

    '
  informacoes_compartilhadas_por_tavin:
  - Ainda não interrogado diretamente.
  riscos:
  - Pode travar, fugir ou falar demais se for pressionado em local inseguro.
  - Tavin parece associar o cumprimento improvisado de Ren a uma senha amigável de segurança.
  - Tavin está alimentado e fisicamente bem dentro do possível.
  - Tavin quer confirmação simples de que Ren vai voltar.
  - Tavin tentou repetir o nome de palco Kagefusha como 'Kagefucha'.
  - Tavin viu parte do ensaio de O Vento da Noite e perguntou se Kagefucha voa.
  - Tavin ouviu Ren explicar sushi e não se convenceu sobre peixe cru.
  - Tavin achou que Ren vestido para O Vento da Noite parece caro.
  - Tavin viu O Vento da Noite impressionar o público e reforçou a ideia de que Kagefucha voa.
  - Tavin ouviu que um camarote pode querer contratar Kage e associou valor alto a perigo.
  - Tavin sabe que ele e Nera dormem no circo esta noite.
  - Tavin dormiu no circo após o Benefício sem interrupção aberta.
  - Tavin pode estar assustado por entender que o bilhete da pasta de Velis se refere a ele.
  - Tavin voltou ao abrigo do circo sem ser identificado na travessia.
  - Tavin sabe que Ren saiu novamente, agora para procurar Tyr.
  - Tavin usará Timo como nome de cobertura na rotina do circo.
  - Tavin sabe que Ren saiu novamente do circo na manhã seguinte ao Benefício, depois de assinar papel como Kage.
  - Tavin viu Ren retornar ao circo por volta de 09:55 de 4 Eleasis e continua tratando sua presença como promessa
    concreta de volta.
  - Tavin sabe que Ren aprendeu a lutar dentro de um clã de Kozakura e associa isso a treino duro.
  - Tavin viu a pequena prévia de Kage para os Vell antes da reprise de 5 Eleasis.
eventos_pos_migracao:
- transacao: s004-277f800e52271ff7
  sessao: 4
  resumo: Ren retorna ao circo, toma banho, come e informa Silva sobre a pista de Halessa e sua intenção de vigiar
    a Casa de Pesos. Silva relata que Nera e Tavin estão fisicamente bem; Nera dorme mal, está assustada e zangada
    com a separação, mas segue o protocolo, enquanto Tavin está mais estável, ajuda sob o nome Timo e continua esperando
    Ren voltar. Silva considera uma casa própria mais adequada que o circo, mas adverte que alunos devem ser pessoas
    com escolha, não muralhas. Ela transmite aos Vell que Ren está vivo, bem e com saudades. Às 20:10, Ren veste
    seu traje oriental original de infiltração, distinto do figurino de Kage, cobre-o com a capa e parte para a
    Ponte Baixa. Pell falha nas duas buscas realizadas durante a tarde, resultado ainda desconhecido de Ren.
  deltas:
  - alvo: relacao:tavin_vell
    caminho: status
    op: set
    valor: fisicamente bem e mais estável sob o nome de cobertura Timo; ajuda em tarefas pequenas, ainda espera
      Ren voltar e soube por Silva que ele está vivo, bem e com saudades.
- transacao: s010-1ea0f49c7e9b9acc
  sessao: 10
  resumo: Ren terminou a refeição, agradeceu a Silva e pediu para ver Nera e Tavin. Silva permitiu a visita, advertindo-o
    a não colocar sobre Tavin o peso da ameaça de Shizune. Na carroça verde, Tavin recebeu Ren com um abraço e Nera
    demonstrou alívio por ele ter voltado, percebendo em seguida sua preocupação e perguntando o que aconteceu.
  deltas:
  - alvo: relacao:tavin_vell
    caminho: momentos_de_vinculo
    op: append
    valor: Ao ver Ren retornar à carroça verde, Tavin abandonou a tarefa que fazia e o abraçou imediatamente, reforçando
      a associação de Ren com retorno e segurança.
- transacao: s015-627e7732b8799369
  sessao: 15
  resumo: Ren foi à carroça verde e reencontrou Nera e Tavin após a noite inteira em que ambos permaneceram sem
    informação confirmada sobre seu paradeiro ou segurança. Nera o abraçou com alívio, expressou de forma direta
    o medo causado pelo desaparecimento e perguntou sobre a faixa nas costelas. Tavin abraçou Ren e perguntou se
    ele ficaria algum tempo. Ren ainda não contou a eles o que aconteceu.
  deltas:
  - alvo: relacao:tavin_vell
    caminho: status
    op: set
    valor: Tavin reencontrou Ren depois de uma noite sem saber onde ele estava ou se estava seguro; abraçou-o e
      perguntou se ele ficaria algum tempo.
- transacao: s015-dc248816f02604bc
  sessao: 15
  resumo: Ren contou a Nera e Tavin o básico sobre a prisão de Shinta, a falsificação documental, sua hipótese de
    envolvimento dos homens de Masao, a custódia de Luath e o ferimento na briga do circo. Nera distinguiu hipótese
    de prova e recusou a promessa absoluta de que Ren sempre voltaria, pedindo que ele mantenha o acordo de voltar
    quando puder, avisar quando não puder e contar a verdade ao retornar. Tavin perguntou se Ren ficaria até a refeição;
    Nera perguntou destino, duração e quem saberia da saída…
  deltas:
  - alvo: relacao:tavin_vell
    caminho: status
    op: set
    valor: Tavin soube que Ren permaneceu sob custódia de Luath e que sairá novamente à noite; perguntou se Ren
      ficará com eles até a refeição.
- transacao: s015-1a1bf3bcaf7923d2
  sessao: 15
  resumo: Ren decidiu procurar Tomas como Ren e explicar honestamente a necessidade da identidade de Shinta. Nera
    aceitou o plano, lembrando que honestidade com Tomas não exige revelar o abrigo dos Vell ou o circo. Ren permaneceu
    algum tempo entretendo Tavin com um jogo simples e depois chamou Nera, pelo olhar, para uma conversa privada
    do lado de fora da carroça. Nera aceitou e aguardou que Ren conduzisse a despedida.
  deltas:
  - alvo: relacao:tavin_vell
    caminho: status
    op: set
    valor: Ren cumpriu a promessa imediata de permanecer algum tempo e entreteve Tavin com um jogo simples antes
      de conversar em particular com Nera.
- transacao: s015-468d35262c6b5157
  sessao: 15
  resumo: Ren e Nera tiveram uma despedida íntima e afetuosa atrás da carroça. Ren reafirmou seu amor e sua promessa
    absoluta de sempre voltar; Nera correspondeu ao amor, respondeu à provocação com humor e pediu apenas que ele
    voltasse, aceitando que descansasse antes de procurar Tomas. Ren abraçou Tavin e prometeu retornar à noite;
    Tavin perguntou se seria antes de dormir.
  deltas:
  - alvo: relacao:tavin_vell
    caminho: status
    op: set
    valor: Ren abraçou Tavin em despedida e prometeu voltar à noite; Tavin perguntou se o retorno seria antes de
      ele dormir.
