id: dain_brass_mord
origem: historico/legado/relacoes-acumuladas-pre-etapa-6.yaml
relacao:
  nome: Dain 'Brass' Mord
  tipo: intermediário/figura operacional da Red Sail
  local: The Red Sail Tavern; visto nos fundos por Ren em 4 Eleasis
  status: observado por Ren; acompanhado; possível alerta baixo sobre observador no galpão de cordame
  atitude_para_ren: hostil ou interessada, ainda não confrontada diretamente
  confianca: nenhuma
  respeito: desconhecido
  motivo: 'Ren confirmou por várias fontes que Dain Mord é chamado de Brass, que paga por informação sobre o estrangeiro
    oriental, que usa mensageiros e que se conecta a Velis Rook, Narwhal Manor, Red Sail e ao circuito da falsa
    lua velada. Pell informou que Brass não fica sozinho hoje, mas teria uma janela entre o sino de seis e o de
    sete nos fundos da Red Sail, no movimento do barril seco da cozinha. Ren seguiu a janela e viu Brass nos fundos
    da taverna por volta de 18:09 de 4 Eleasis. Ren escolheu não atacar Brass, observou por mais alguns minutos
    e recuou. A observação confirmou que Brass usa rotina comum como cortina operacional, mas não revelou todo o
    mecanismo da troca. A saída de Ren do ponto de observação não foi perfeita: alguém nos fundos da Red Sail provavelmente
    percebeu movimento no galpão de cordame, sem identificar Ren.

    '
  informacoes_observadas_por_ren:
  - Brass foi associado ao homem de casaco com botões de latão.
  - Brass perguntou a Pell se Ren tinha arma, estava sozinho, tinha sotaque forte e se mostrou selo, papel ou símbolo.
  - Brass mandou Pell levar mensagem fechada para Velis Rook perto de Narwhal Manor.
  - Brass está ligado ao protocolo da ficha de cobre com vela vermelha e cordão azul.
  - Pell disse que Brass não fica sozinho hoje.
  - Ren viu Brass nos fundos da Red Sail, a cerca de 25 pés da descida mais rápida do ponto de observação.
  - Brass estava com pelo menos dois homens próximos e um menino mensageiro fora da linha imediata.
  - Ren não conseguiu ouvir a conversa de Brass no beco.
  - Brass usa o barril seco da cozinha, o menino sem lenço e homens posicionados como cortina operacional.
  - Ren não sabe se a passagem de Brass envolve papel, objeto pequeno, palavra, confirmação visual ou apenas presença.
  - Alguém nos fundos da Red Sail provavelmente percebeu movimento no galpão de cordame, sem identificar Ren.
  riscos:
  - Atacar Brass pode chamar a taverna inteira e reforços da Red Sail.
  - Fugir sozinho após um golpe parece plausível; fugir carregando Brass seria muito mais arriscado.
  - Se Brass sobreviver ou escapar, pode conectar Ren mais diretamente à pressão contra a Red Sail.
  - O ponto de observação do galpão de cordame pode estar comprometido para uso futuro.
eventos_pos_migracao:
- transacao: s004-6a70662f45da5d09
  sessao: 4
  resumo: 'Silva aceita procurar uma rota para Colm. Ren dorme duas horas e medita meia hora, completando descanso
    curto e recuperando 6/6 Ki; evita procurar Nera. Silva deixa recado de que uma cama e duas transferências foram
    aceitas, faltando definir o primeiro ponto de entrega. À noite, Ren veste as camadas escuras de O Vento da Noite
    e alcança novo ponto alto sobre a Red Sail com 21 contra CD 16 em Furtividade. Vigia por cerca de três horas:
    a segurança está reforçada, Brass não aparece e Ren obtém 12 contra CD 15 em Investigação, não conseguindo traçar
    uma rota que permita capturá-lo vivo e removê-lo por dez minutos sem intervenção.'
  deltas:
  - alvo: relacao:dain_brass_mord
    caminho: informacoes_observadas_por_ren
    op: append
    valor: Brass não apareceu na Red Sail durante a vigilância de Ren entre aproximadamente 20:20 e 23:20 de 7 Eleasis;
      os fundos operaram com pares, iluminação de controle e vigilância reforçada, impedindo mapear uma rota limpa
      de abdução.
